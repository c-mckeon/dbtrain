<p>Your backend's access to Firebase uses a service account <b>key</b>: a long-lived credential with full admin rights over the database. Google's own guidance is to avoid keys where possible. Options, from simplest: keep the key but store it in Key Vault and rotate it on a schedule; or set up workload identity federation from Azure to Google Cloud so the backend proves its identity with an Azure-issued token instead. That's more setup, and it removes the most powerful secret in your system.</p>`)) },

   { t: "mcq", q: `Your deploy workflow logs into Azure using GitHub's OIDC token instead of a stored service-principal password. What's the main security gain?`, opts: [
     [`The connection to Azure becomes encrypted end to end, which a stored password would not provide`, false, `Both approaches use HTTPS. The difference is whether a long-lived secret exists at all.`],
     [`There's no long-lived credential to leak, and each token works briefly, for this repo and branch only`, true, `Right. A stolen OIDC token expires in minutes and only matches the claims Azure was told to trust. There's no password to rotate, because none exists.`],
     [`Azure gives OIDC logins wider permissions, so the workflow needs fewer separate steps`, false, `Permissions come from the role assigned to the identity, whichever way it logs in. OIDC changes how it proves identity, not what it may do.`],
     [`GitHub hides the workflow's logs from the public whenever OIDC authentication is used`, false, `OIDC has no effect on log visibility. (Your source repo is private anyway.)`]] },

   { t: "read", html: LEC("Blast radius, least privilege and rotation", `
<p>For each secret, ask: <i>if this leaked tonight, what could someone do with it?</i> That's its ${TT("blast radius", `How much damage a single compromised credential or component can do. Shrinking it, through narrower permissions, shorter lifetimes and separate credentials per job, is a core goal of security design.`)}. Then shrink it with ${TT("least privilege", `Give each person and program only the permissions it needs, for only as long as it needs them. A workflow that only deploys one app shouldn't be able to delete a subscription.`)}: each credential should allow only what its job needs.</p>` +
     TABLE(["Secret", "Blast radius if leaked", "How to shrink it"], [
       ["Session secret", "Forge a login token for <i>any</i> user", "Keep it only in the backend's secrets; rotate it if exposed (this logs everyone out)"],
       ["Cognito client secret", "Impersonate your backend to Cognito when exchanging codes", "Rotate in Cognito; PKCE adds a second layer of protection"],
       ["Firebase service account key", "Read, change or delete every user's data", "Narrower roles, Key Vault, scheduled rotation, or federation instead"],
       ["LeanLog PAT", "Push to repositories as you (scope depends on the token type)", "A fine-grained token or deploy key limited to LeanLog, or the Pages deploy action"]], "Your secrets by blast radius") + `
<p>Plan for ${TT("rotation", `Replacing a secret with a new one. Done routinely, so that when an emergency comes, it's a practised, five-minute job rather than a panic. Systems that accept two keys during a changeover (old and new) can rotate with no downtime.`)} before you need it. A system that can only check one session secret has no smooth changeover: rotating it logs everyone out at once. Systems built to accept the old <i>and</i> new key for a while can rotate without anyone noticing.</p>`) },

   { t: "mcq", q: `You realise last week's commit to a public repo included a real API key. What should you do first?`, opts: [
     [`Revoke and replace the key, then clean git history and check the provider's logs for misuse`, true, `Revoke first: once a secret has been public, assume it's been copied. Cleaning history matters, but it can't recall copies that already exist.`],
     [`Rewrite the git history to remove the key, then force-push so the leaked commit no longer exists`, false, `Worth doing later, but forks, clones and scrapers may already have it. Until the key is revoked, it still works.`],
     [`Make the repository private straight away, so nobody new can see the commit containing the key`, false, `That stops new viewers, but bots that scan public repos may have collected it within minutes. The key still works until it's revoked.`],
     [`Add the key's file to .gitignore, so future commits can't include it again by accident`, false, `.gitignore only prevents future additions. It does nothing about the copy already in history.`]] },

   { t: "mcq", q: `You rotate your backend's SESSION_SECRET after a scare. What do users notice?`, opts: [
     [`Nothing: tokens are re-signed with the new secret the next time each user calls the API`, false, `The server can't re-sign a token it no longer accepts. Verification fails before anything else happens.`],
     [`Only desktop users are logged out, because bearer tokens are verified by Cognito rather than by your secret`, false, `Your bearer tokens are signed and verified with SESSION_SECRET too. Cognito doesn't see them.`],
     [`Everyone is logged out, because every token and session cookie was signed with the old secret`, true, `Right. With a single key there's no grace period, so rotation is all-or-nothing. Accepting both old and new keys for a while would make it seamless.`],
     [`Users have to reset their passwords, because Cognito hashes them using the session secret`, false, `Cognito never sees your session secret, and your backend never sees passwords.`]] },

   { t: "read", html: TERMS([
       ["Twelve-factor config", "Configuration in the environment; same build everywhere."],
       ["Secret vs identifier", "Grants power vs merely names something."],
       ["Secret manager", "Central, audited, versioned storage: Key Vault, Secrets Manager, Vault."],
       ["Workload identity federation", "Short-lived signed tokens instead of stored keys."],
       ["Blast radius", "What one leaked credential could do."],
       ["Least privilege", "Only the permissions needed, only for as long as needed."],
       ["Rotation", "Replacing secrets routinely, ideally with an overlap period."]]) +
     FURTHER([`The Twelve-Factor App (12factor.net), factor III "Config".`, `GitHub Docs: "About security hardening with OpenID Connect".`, `Google Cloud: "Best practices for managing service account keys".`, `OWASP Cheat Sheet: "Secrets Management".`]) }
 ]},

 { sec: "Unit 5 · Data and interfaces" },

 /* ===================== 11. Databases ===================== */
 { id: "u-data", title: "11. Databases and data modelling",
   intro: `Choosing a database is one of the hardest decisions to undo, because your data's shape spreads into every layer above it. We'll survey the main families, the guarantees they do and don't give, and then judge your Firebase tree as a data model, honestly, including when you'd outgrow it.`,
   steps: [
   { t: "read", html: OBJ([
       `name the main database families and what each is best at`,
       `explain transactions, ACID and why consistency guarantees matter`,
       `compare relational modelling with query-driven, denormalised modelling`,
       `evaluate Firebase's Realtime Database as a fit for your app`]) +
     LEC("A short history of databases", `
<p>In 1970, Edgar Codd at IBM proposed storing data in <b>relations</b> (tables) and asking questions in a declarative language, so the database would work out <i>how</i> to answer. That became SQL, and relational databases (Oracle, PostgreSQL, MySQL, SQL Server) ran almost everything for 40 years. You've been using one in the SQL tab.</p>
<p>Around 2009, companies operating at web scale (Google, Amazon, Facebook) hit limits of single-server relational databases and built alternatives that traded some guarantees for scale or flexibility. They got grouped under the label ${TT("NoSQL", `"Not only SQL": a loose umbrella for non-relational databases (document, key-value, wide-column, graph). The term took off around 2009. Many have since added SQL-like features, and relational databases added JSON support, so the line has blurred.`)}. Since then the two worlds have converged: PostgreSQL stores JSON documents well, and many NoSQL databases now offer transactions and SQL-like queries.</p>` +
     TABLE(["Family", "Data looks like", "Great at", "Examples"], [
       ["Relational", "Tables with rows and columns, linked by keys", "Consistency, flexible queries (JOIN, GROUP BY), reporting", "PostgreSQL, MySQL, SQL Server, SQLite"],
       ["Document", "JSON-like documents grouped in collections", "Varied, nested records read as a whole", "MongoDB, Firestore, Cosmos DB"],
       ["Key-value", "A key and an opaque value", "Extremely fast lookups by key: caches, sessions", "Redis, DynamoDB (also document-ish)"],
       ["Wide-column", "Rows with huge numbers of flexible columns", "Massive write volumes across many machines", "Cassandra, Bigtable"],
       ["Graph", "Nodes and relationships", "Following connections: friends of friends, fraud rings", "Neo4j, Neptune"],
       ["JSON tree <b>(yours)</b>", "One big nested JSON object", "Real-time sync of small trees to many clients", "Firebase Realtime Database"]], "Database families") + `
<p>Specialised types also exist for time series (metrics), search (Elasticsearch) and, newly, vectors (similarity search for AI). Big systems often use several, each for what it's good at. This is called ${TT("polyglot persistence", `Using several kinds of database in one system, each for what it does best: Postgres for orders, Redis for sessions, Elasticsearch for search.`)}.</p>`) },

   { t: "read", html: LEC("Guarantees: transactions and ACID", `
<p>A ${TT("transaction", `A group of reads and writes that the database treats as one unit: either all of it happens or none of it does, and other users never see it half-done.`)} groups several operations so they succeed or fail together. The classic example: moving £50 between accounts must debit one and credit the other, never just one. Relational databases promise ${TT("ACID", `Atomicity (all or nothing), Consistency (rules such as foreign keys always hold), Isolation (concurrent transactions don't see each other's half-finished work), Durability (once committed, it survives crashes).`)} transactions: <b>A</b>tomic, <b>C</b>onsistent, <b>I</b>solated, <b>D</b>urable.</p>
<p>Many NoSQL systems offer weaker or narrower guarantees in exchange for scale, such as transactions only within a single document, or ${TT("eventual consistency", `After a write, different readers may briefly see old or new values, but given time without new writes, everyone converges on the same value. Common in systems spread across many machines or regions.`)}, where different readers may briefly see different values. Your app touches this in one place:</p>` +
     CASE("the saveId transaction", `<p>When a workout is saved, the backend uses a Firebase <b>transaction</b> on <code>_workoutSaves/&lt;saveId&gt;</code>: "if no workout id is recorded for this saveId, record this new one; otherwise give me the existing one". Firebase runs that check-and-set atomically for a single location. So if a double-tap sends two saves at the same instant, only one wins, and both end up writing to the same workout instead of creating two. Without the transaction, both requests could read "nothing recorded" at the same moment and each create a workout. That's a ${TT("race condition", `A bug where the outcome depends on the timing of two operations running at once. Classic shape: two processes both check a condition, both see it's safe, both act.`)}, a bug that depends on timing.</p>`) +
     LEC("Two ways to model data", `
<p>Relational design starts from the <b>data</b>: model each thing once (${TT("normalisation", `Organising data so each fact is stored in exactly one place, with relationships expressed by keys. Updates touch one row; the database enforces consistency; queries JOIN tables back together.`)}), link with keys, and let SQL answer any question later with JOINs. NoSQL design usually starts from the <b>queries</b>: shape the data so each screen's question is answered by one read, even if that means storing some facts in several places (${TT("denormalisation", `Deliberately duplicating data so reads are fast and simple. The cost: every update must change every copy, or they drift apart.`)}).</p>` +
     TABLE(["", "Normalised (relational)", "Denormalised (query-driven)"], [
       ["Each fact stored", "Once", "Possibly in several places"],
       ["Reads", "May need JOINs", "One read per screen"],
       ["Writes", "Simple: change one row", "Must update every copy"],
       ["New, unplanned questions", "Easy: write new SQL", "Hard: may need to reshape or duplicate data"],
       ["Your app", "—", "focusAreas stores exercise ids that also live in each exercise: a hand-built index your code must keep in sync"]], "Modelling approaches"))) },

   { t: "mcq", q: `Two save requests for the same workout arrive at the same instant. Without a transaction, both read "no record for this saveId" before either writes. What's the result?`, opts: [
     [`Firebase notices the conflict and rejects the second write with an error the app can retry`, false, `Plain writes don't check what was there before; the last one simply wins. Detecting conflicts is exactly what a transaction adds.`],
     [`Both requests create a workout, so the user ends up with a duplicate: a race condition`, true, `Right. Each request decided based on a check that went stale before it acted. An atomic check-and-set closes that gap.`],
     [`The second request waits automatically until the first one has finished, so they run one after the other`, false, `Requests run concurrently unless something makes them wait. That something would be a transaction or a lock.`],
     [`Express handles requests one at a time, so two requests can never be processed at the same moment`, false, `Node handles one piece of JavaScript at a time, but requests interleave while each one waits for the database. Races happen between those waits.`]] },

   { t: "read", html: LEC("Your data model", `
<p>Everything lives in one JSON tree. Each user's data sits under their Cognito sub, so per-user isolation is built into the paths (Lecture 3). Hover the boxes.</p>` + DG_DATATREE + `
<h4>What Firebase's Realtime Database is designed for</h4>
<p>Firebase RTDB launched in 2012 (Google acquired Firebase in 2014) with one headline feature: clients open a live connection, and any change to the data is <b>pushed to every listening device within milliseconds</b>, with offline support built in. It's superb for chat apps, live dashboards and collaborative tools. Google's newer Firestore (2017) keeps the real-time sync but adds proper documents, collections and richer queries.</p>
<p>Its limits matter for analytics. Queries can sort or filter on only one field at a time, there are no JOINs or GROUP BY, and reading a location downloads <b>everything beneath it</b>. Billing is partly by data downloaded.</p>` +
     CASE("an honest assessment", `<ul>
<li><b>Real-time is unused.</b> Your backend reads with one-off <code>once()</code> calls and passes plain JSON on, so devices no longer get live updates. You pay the limits of RTDB's model without using its signature strength.</li>
<li><b>Analytics happen in the browser.</b> Volume per muscle group, trends over time: the frontend downloads whole folders and loops over them. Fine for one person's data now; slower and costlier with every year of history.</li>
<li><b>Consistency is your code's job.</b> No foreign keys: nothing stops a workout referring to an exercise that was deleted, or the focusAreas index drifting from the exercises.</li>
<li><b>Flexibility is real.</b> New kinds of data need no migration, which is exactly what made the generic /api/data migration easy.</li></ul>
<p>For a workout tracker, data that's naturally <i>relational</i> (users → workouts → sets → exercises → muscle groups) with <i>aggregate</i> questions (totals per week per muscle), a relational database such as PostgreSQL is arguably the better long-term fit. The SQL you practised in this site's first tab is exactly what those charts would become: one <code>GROUP BY</code> query run by the database, returning a few rows instead of years of raw data.</p>`)) },

   { t: "sort", q: `Which kind of database fits each need best?`, buckets: ["Relational", "Key-value", "Document", "Graph"], items: [
     [`Storing login sessions that must be read in under a millisecond by any replica`, 1],
     [`A bank ledger where transfers must never be half-applied`, 0],
     [`A product catalogue where each product type has very different attributes`, 2],
     [`"People you may know": friends of friends who share an employer`, 3],
     [`Monthly report of total sets per muscle group per user`, 0, `Aggregation across related records is SQL's home ground.`],
     [`A cache of rendered pages keyed by URL`, 1]] },

   { t: "mcq", q: `You want a new chart: total weekly volume per muscle group across two years. With your current Firebase setup, what has to happen?`, opts: [
     [`Firebase computes the totals server-side using an index, as long as one is declared on the date field`, false, `Indexes in RTDB speed up sorting and filtering on a single field. They don't add aggregation: there's no SUM or GROUP BY.`],
     [`The app downloads every workout from those two years and adds up the volumes in JavaScript`, true, `Right. RTDB has no aggregation, so the raw data travels and your code does the maths. A relational database would run one GROUP BY and return only the totals.`],
     [`The backend asks Firebase for a summary view, which Firebase builds automatically and keeps up to date`, false, `RTDB has no views. You could maintain pre-computed totals yourself (denormalisation), updating them on every save.`],
     [`Firebase rejects the query, because a single read can't span more than one year of child records`, false, `It will happily return everything. The problem is the size and cost of doing so, not a hard limit.`]] },

   { t: "mcq", q: `A friend suggests keeping a pre-computed "weekly totals" record that's updated whenever a workout is saved. What's the main trade-off?`, opts: [
     [`Charts load instantly, but every save, edit and delete must update the totals correctly or they drift`, true, `That's denormalisation's bargain: fast reads, more complicated writes. Miss one path (an edit, a delete, an import) and the totals quietly disagree with the raw data.`],
     [`Charts load faster, but Firebase only lets one record be written per save, so the workout save gets slower`, false, `A Firebase multi-location update can write several paths in one atomic operation. Write speed isn't the trade-off.`],
     [`It doubles the storage used, which matters more than anything else on Firebase's free tier`, false, `A few small totals records are tiny next to the workouts themselves. Storage isn't the issue; keeping copies consistent is.`],
     [`It removes the need for the raw workouts, so history can no longer be re-analysed in new ways`, false, `You'd keep the raw workouts. The totals are an extra copy, not a replacement.`]] },

   { t: "read", html: TERMS([
       ["Relational / SQL", "Tables, keys, JOINs, ACID transactions."],
       ["NoSQL", "Document, key-value, wide-column, graph: trades guarantees or flexibility for scale and fit."],
       ["Transaction / ACID", "All-or-nothing, consistent, isolated, durable."],
       ["Race condition", "Outcome depends on timing; fixed with atomic operations."],
       ["Normalised / denormalised", "Each fact once vs duplicated for fast reads."],
       ["Eventual consistency", "Readers may briefly disagree, then converge."]]) +
     FURTHER([`<i>Designing Data-Intensive Applications</i>, Martin Kleppmann: the most recommended book in backend engineering. Chapters 2, 3 and 7 cover this lecture.`, `Firebase docs: "Structure your database" and "Choose a database: Cloud Firestore or Realtime Database".`, `Use The Index, Luke (use-the-index-luke.com): how SQL indexes really work.`]) }
 ]},

 /* ===================== 12. APIs ===================== */
 { id: "u-api", title: "12. Designing APIs",
   intro: `An API is a contract between programs. Good ones are predictable, hard to misuse and easy to evolve. We'll cover REST properly (it's more than "JSON over HTTP"), its alternatives, the design concerns every API has to address, and then the two very different styles living side by side in your backend.`,
   steps: [
   { t: "read", html: OBJ([
       `explain REST's core ideas and judge how "RESTful" an endpoint is`,
       `compare REST with RPC, GraphQL, gRPC and real-time options`,
       `address validation, errors, pagination, versioning, rate limiting and idempotency`,
       `evaluate the trade-offs of your generic data endpoint against purpose-built ones`]) +
     LEC("What REST actually means", `
<p>${TT("REST", `Representational State Transfer: an architectural style described by Roy Fielding in his 2000 PhD dissertation. Its constraints include client–server separation, statelessness, cacheability and a uniform interface built around resources.`)} comes from Roy Fielding's 2000 PhD dissertation (Fielding also co-wrote the HTTP specification). It describes the web's own architecture, and its core ideas for APIs are:</p>
<ul>
<li><b>Resources, named by URLs.</b> Nouns, not verbs: <code>/api/workouts/42</code>, not <code>/api/getWorkout?id=42</code>.</li>
<li><b>A uniform interface.</b> The HTTP methods carry the verb, with their agreed meanings (Lecture 1): GET reads, PUT replaces, DELETE removes.</li>
<li><b>Statelessness.</b> Each request carries everything needed to understand it.</li>
<li><b>Cacheability.</b> Responses say whether they can be cached, using standard headers.</li></ul>
<p>Most "REST APIs" in practice follow the first two and ignore the rest, which is fine. A common way to grade an API is the ${TT("Richardson Maturity Model", `Level 0: one URL, everything POSTed (RPC tunnelled over HTTP). Level 1: separate URLs for resources. Level 2: HTTP methods and status codes used properly. Level 3: responses include links to related actions (hypermedia). Most good APIs are level 2.`)}: level 0 sends everything to one URL, level 1 adds resource URLs, level 2 uses methods and status codes properly. Most well-regarded APIs are level 2.</p>` +
     LEC("The alternatives", `` +
     TABLE(["Style", "Idea", "Best for", "Costs"], [
       ["REST", "Resources + HTTP methods, usually JSON", "Public and general-purpose APIs; works with every tool and cache", "Over- or under-fetching: one screen may need many calls"],
       [`${TT("RPC", `Remote Procedure Call: the API is a set of named functions, like <code>POST /startClock</code> or JSON-RPC's <code>{"method": "startClock"}</code>. Direct and simple, but HTTP's caching and method meanings no longer help.`)} (JSON-RPC, "action" endpoints)`, "Call named functions over HTTP", "Actions that aren't naturally resources", "Loses HTTP semantics (caching, idempotency hints)"],
       [`${TT("GraphQL", `A query language for APIs, created at Facebook in 2012 and open-sourced in 2015. The client sends one query describing exactly the fields it wants, and gets exactly that shape back.`)}`, "Client asks for exactly the fields it wants, in one request", "Many different clients with different data needs", "Caching, rate limiting and authorisation get harder"],
       [`${TT("gRPC", `Google's high-performance RPC framework (2015): strongly typed contracts in Protocol Buffers, compact binary messages over HTTP/2. Popular between internal services; awkward directly from browsers.`)}`, "Typed contracts, compact binary messages over HTTP/2", "Fast service-to-service calls inside a company", "Not browser-friendly without a proxy"],
       ["WebSockets / server-sent events", "A long-lived connection the server can push over", "Live updates: chat, dashboards, Firebase's sync", "Connections to manage; harder to scale"],
       ["Webhooks", "Your server calls <i>their</i> URL when something happens", "Notifying other systems (payments completed)", "Delivery retries, verifying the sender"]], "API styles compared"))) },

   { t: "sort", q: `For each request, is it safe to repeat by HTTP's rules? (Idempotent or not.)`, buckets: ["Idempotent", "Not idempotent"], items: [
     [`<code>DELETE /api/data?path=bio/notes</code>`, 0, `Deleting something already deleted leaves the same result.`],
     [`<code>POST /api/data/push</code> adding a weight entry`, 1],
     [`<code>PUT /api/workouts/abc</code> with the full workout`, 0],
     [`<code>POST /api/clock/start</code> recording a start time of "now"`, 1, `Each call records a different "now".`],
     [`<code>GET /api/workouts</code>`, 0],
     [`<code>POST /api/workouts</code> with a saveId`, 0, `Not by HTTP's rules, but your saveId makes it idempotent in practice.`]] },

   { t: "read", html: LEC("What every API has to decide", `
<p>Whatever the style, the same concerns come up. These are the topics an API design review walks through:</p>` +
     TABLE(["Concern", "Good practice", "Your backend"], [
       ["Validation at the boundary", "Check every field's type, range and size before using it, ideally with a schema library (Zod, Joi)", "Purpose-built endpoints check shapes; generic writes accept any value under allowed paths"],
       ["Errors", "Consistent format (RFC 9457 \"problem details\"), correct status codes, no internal details leaked", "Consistent <code>{error}</code> JSON and good status codes; some messages come straight from internal errors"],
       ["Pagination", "Return results in pages (limit + cursor), never unbounded lists", "Whole folders are returned at once"],
       ["Versioning", "A plan for changing the contract without breaking old clients (/v2/, or additive-only changes)", "None needed yet: one client, deployed together"],
       [`${TT("Rate limiting", `Capping how many requests a client may make per period, answering 429 Too Many Requests beyond it. Protects against abuse, brute force and runaway clients, and controls cost.`)}`, "Cap requests per user or IP; answer 429 beyond it", "None"],
       [`${TT("Idempotency keys", `A unique id the client sends with a non-idempotent request (usually a POST). The server remembers the result per key, so a retry returns the original result instead of repeating the action. Popularised by Stripe's payments API.`)}`, "Client sends a unique key with POSTs, so retries are harmless", "✓ saveId on workout saves"],
       ["Documentation", "A machine-readable contract (OpenAPI) that tools and people can read", "The code is the documentation"]], "API design checklist") +
     CASE("Stripe's pattern, in your app", `<p>Payment APIs can't ever charge a card twice because a phone retried on a bad connection. Stripe popularised the ${TT("Idempotency-Key", `A header Stripe's API accepts on POST requests. Send the same key twice and the second request returns the first one's result rather than charging again. Now being standardised by the IETF.`)} header: the client generates a unique key per intended action and sends it with the request; the server stores the outcome against that key, and any retry gets the stored outcome. Your <code>saveId</code> is the same idea, independently arrived at: generated once per workout being built, kept in the draft, and resolved through a transaction on the server. That's a professional pattern, and worth mentioning by name in interviews.</p>`)) },

   { t: "read", html: LEC("Your backend's two API styles", `
<p>Your backend exposes two very different kinds of endpoint side by side:</p>` +
     ARCH({ w: 760, h: 260, title: "Two API styles in one backend", legend: [["browser", "Purpose-built"], ["danger", "Generic data tunnel"], ["aws", "Auth flow"]], nodes: [
       { id: "fe", x: 20, y: 100, w: 150, h: 60, label: "Frontend", sub: "LeanLog", color: "browser" },
       { id: "pb", x: 300, y: 20, w: 200, h: 60, label: "Purpose-built", sub: "/api/workouts, /api/exercises…", color: "browser", tip: `Each endpoint knows exactly what it accepts: a workout needs a date and an exercises array; an exercise is validated field by field. These have clear contracts.` },
       { id: "gen", x: 300, y: 110, w: 200, h: 60, label: "Generic data", sub: "/api/data?path=…", color: "danger", tip: `Reads and writes <i>any</i> value at any path under the allow-listed roots, imitating Firebase's API so the old frontend code keeps working (the adapter from Lecture 2).` },
       { id: "au", x: 300, y: 190, w: 200, h: 56, label: "Auth", sub: "/login, /callback, /api/token", color: "aws", tip: `The login flow from Lectures 4–5.` },
       { id: "db", x: 590, y: 100, w: 150, h: 60, label: "User's subtree", sub: "workoutApp/users/<sub>", color: "google" }],
     edges: [{ from: "fe", to: "pb", label: "typed requests", color: "browser" }, { from: "fe", to: "gen", label: "path + value", color: "danger" }, { from: "fe", to: "au", dash: true }, { from: "pb", to: "db", label: "validated" }, { from: "gen", to: "db", label: "allow-listed" }] }) +
     TABLE(["", "Purpose-built endpoints", "Generic data endpoint"], [
       ["Contract", "Explicit: this endpoint takes a workout", "Implicit: whatever the frontend happens to write"],
       ["Validation", "Shape and fields checked", "Only the path is checked, and the overall size limit"],
       ["Changing storage later", "Possible without the client noticing", "The client knows the database's layout, so storage changes break it"],
       ["Code to write", "More: one handler per operation", "Very little: one handler for everything"],
       ["Attack surface", "Small and specific", "Broad: anything under the allowed roots can be overwritten with any shape"]], "Comparing your two styles") + `
<p>The generic endpoint's defences are worth recognising. Paths must start with an allow-listed root, every segment is checked against characters with special meaning (<code>. # $ [ ] /</code>), the user root itself can't be overwritten, and bookkeeping like <code>_meta</code> isn't reachable. Those checks block the family of attacks called ${TT("path traversal", `Tricking a server into accessing a location outside the intended area by smuggling special characters or sequences (like <code>../</code>) into a path. Prevented by validating each segment and restricting the starting point.`)}. What they can't provide is <i>meaning</i>: nothing stops a client writing a string where a number belongs, or a 30 KB blob into a settings field. Every purpose-built endpoint you add, followed by trimming the allow-list, shrinks that gap. That's the strangler fig from Lecture 2, finishing its job.</p>`) },

   { t: "mcq", q: `A bug in the frontend writes <code>"ninety"</code> into a calendar setting that should hold a number, via the generic endpoint. What does your backend do, and why?`, opts: [
     [`Rejects it with a 400, because the allow-list includes the expected type for each setting`, false, `The allow-list names permitted <i>roots</i> (settings, workouts…), not the types inside them.`],
     [`Saves it, because the generic endpoint only validates the path, not what the value means`, true, `Right. The path is valid, so the value is stored as-is, and the next screen that does arithmetic on it misbehaves. A purpose-built settings endpoint with a schema would reject it at the door.`],
     [`Converts it to the number 90 automatically, as Express's JSON parser coerces numeric words`, false, `JSON parsers don't interpret words as numbers. "ninety" stays a string.`],
     [`Firebase rejects it, because Realtime Database enforces a type for each field once it's first written`, false, `RTDB is schemaless: any path can hold any type at any time. (Rules <i>can</i> validate types, but the Admin SDK bypasses rules.)`]] },

   { t: "mcq", q: `When would GraphQL be a better fit than REST for an API like yours?`, opts: [
     [`When the data needs to be cached by browsers and CDNs, since GraphQL responses are cacheable by default`, false, `The reverse: GraphQL usually sends queries as POSTs to one URL, which standard HTTP caching can't help with. REST is better here.`],
     [`When many different clients each need different slices of the data and round trips are expensive`, true, `That's GraphQL's sweet spot: each client asks for exactly what it needs in one request. For one web client built alongside its backend, REST is simpler.`],
     [`When the API has to stay simple to secure, because GraphQL limits which queries a client can send`, false, `GraphQL lets clients compose deep, expensive queries, which makes rate limiting and authorisation <i>harder</i>, not easier.`],
     [`When the data lives in a relational database, because GraphQL can only query SQL tables`, false, `GraphQL sits in front of anything: SQL, NoSQL, other APIs. It's independent of storage.`]] },

   { t: "mcq", q: `Your API has no rate limiting. Which problem does adding it mainly address?`, opts: [
     [`A runaway client or attacker sending huge numbers of requests, running up cost and slowing it for everyone`, true, `Right. Limits per user or IP (answering 429) protect availability and cost, and slow down brute-force attempts such as guessing one-time codes.`],
     [`Users seeing each other's data, because too many requests at once can mix up two users' sessions`, false, `Data isolation comes from authorization and scoped paths, not request rates. Volume doesn't mix up sessions.`],
     [`Requests from unapproved websites, because rate limits only apply to origins that aren't on the allow-list`, false, `That's CORS's area. Rate limits count requests per client regardless of which page sent them.`],
     [`Firebase data corruption, since too many simultaneous writes to one path damage the stored JSON`, false, `Firebase handles concurrent writes safely: the last write wins, or a transaction decides. Corruption isn't the risk.`]] },

   { t: "read", html: TERMS([
       ["REST", "Resources named by URLs, standard methods, stateless, cacheable (Fielding, 2000)."],
       ["Richardson levels", "0: one URL · 1: resources · 2: methods + status codes · 3: hypermedia."],
       ["RPC / GraphQL / gRPC", "Named functions · client-shaped queries · typed binary contracts."],
       ["Validation at the boundary", "Check every input's meaning before using it."],
       ["Idempotency key", "Client-chosen id that makes retried POSTs harmless (your saveId)."],
       ["Rate limiting", "Cap requests per client; answer 429."],
       ["Path traversal", "Escaping the intended area via special path characters."]]) +
     FURTHER([`Roy Fielding's dissertation, chapter 5 (readable and short).`, `Stripe's API docs, "Idempotent requests": a model for good API documentation.`, `Microsoft's "REST API Guidelines" and Google's "API Design Guide" (both public on GitHub and Google Cloud).`, `OWASP API Security Top 10 (2023).`]) }
 ]},

 { sec: "Unit 6 · Quality attributes" },

 /* ===================== 13. Security engineering ===================== */
 { id: "u-security", title: "13. Thinking like a security engineer",
   intro: `Earlier lectures covered individual defences. This one is about the method: how security engineers look at a whole system, find where it could fail, and decide what to fix first. You'll apply it to your own architecture.`,
   steps: [
   { t: "read", html: OBJ([
       `describe the CIA triad, trust boundaries and attack surface`,
       `run a STRIDE threat model over a system`,
       `apply defence in depth, least privilege and failing closed`,
       `manage vulnerabilities in dependencies and decide whether a new one affects you`]) +
     LEC("The vocabulary", `
<p>Security goals are usually summarised as the ${TT("CIA triad", `Confidentiality (only the right people can read it), Integrity (only the right people can change it, and changes are detectable), Availability (it works when needed). Most security controls protect one or more of the three.`)}: <b>confidentiality</b> (only the right people can read data), <b>integrity</b> (only the right people can change it) and <b>availability</b> (it works when it's needed). A leaked token breaks confidentiality; a forged write breaks integrity; a flood of requests breaks availability.</p>
<p>Two ideas organise the analysis. A ${TT("trust boundary", `A line in a system where data or requests pass between parts with different levels of trust, such as from a user's browser into your server. Every boundary needs checks: authentication, validation, authorization.`)} is anywhere data crosses from a less-trusted part of the system to a more-trusted one. The ${TT("attack surface", `Everything an attacker can reach and interact with: every endpoint, input field, open port, dependency and credential. Reducing it (removing unused endpoints, dead code, extra permissions) is one of the cheapest security wins.`)} is everything an attacker can reach. Your job is to defend every boundary and keep the surface small.</p>` +
     ARCH({ w: 780, h: 300, title: "Trust boundaries in your system", nodes: [
       { id: "u", x: 20, y: 120, w: 160, h: 60, label: "User's browser", sub: "untrusted: anyone can edit it", color: "danger", tip: `Assume everything arriving from here might be forged: tokens, paths, bodies, headers (except those the browser itself controls, like Origin).` },
       { id: "be", x: 310, y: 120, w: 170, h: 60, label: "Your backend", sub: "trusted: checks everything", color: "azure", tip: `The single place where identity is verified, input is validated and access is decided.` },
       { id: "fb", x: 600, y: 40, w: 160, h: 56, label: "Firebase", sub: "trusts the admin key", color: "google", tip: `Trusts anything signed with the service account. That's why the key's protection matters so much.` },
       { id: "cg", x: 600, y: 200, w: 160, h: 56, label: "Cognito", sub: "trusted identity source", color: "aws", tip: `Your backend trusts Cognito's signed ID tokens, after checking them.` },
       { id: "ci", x: 310, y: 230, w: 170, h: 56, label: "CI pipeline", sub: "can deploy anything", color: "github", tip: `Whoever controls the pipeline controls production. A boundary people often forget.` }],
     groups: [{ x: 280, y: 20, w: 490, h: 270, label: "Your trusted zone", color: "you", tip: `Inside here, components trust each other's credentials. Every arrow crossing into it is a trust boundary.` }],
     edges: [{ from: "u", to: "be", label: "BOUNDARY: verify + validate", color: "danger" }, { from: "be", to: "fb", label: "admin key" }, { from: "be", to: "cg", label: "client secret" }, { from: "ci", to: "be", label: "deploys", dash: true }] })) },

   { t: "read", html: LEC("Threat modelling with STRIDE", `
<p>${TT("Threat modelling", `A structured way to find problems in a design before attackers do: draw the system, mark the trust boundaries, and systematically ask what could go wrong at each one. Done early, it's far cheaper than fixing breaches.`)} means drawing the system, marking the boundaries, and asking "what could go wrong here?" systematically rather than by gut feeling. The most widely used checklist is ${TT("STRIDE", `Developed at Microsoft in 1999. Six threat categories, each the opposite of a security property: Spoofing (authentication), Tampering (integrity), Repudiation (non-repudiation), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authorization).`)}, from Microsoft in 1999. Each letter is a type of threat:</p>` +
     TABLE(["Threat", "Means", "Property it attacks", "Applied to your app (in general terms)"], [
       ["<b>S</b>poofing", "Pretending to be someone else", "Authentication", "Using a stolen token; the login flow's state and nonce block several forms"],
       ["<b>T</b>ampering", "Changing data or code without permission", "Integrity", "Editing a token is blocked by its HMAC signature; generic writes accept any value shape"],
       ["<b>R</b>epudiation", "Denying having done something", "Accountability", "There's no audit log of who changed what, and when"],
       ["<b>I</b>nformation disclosure", "Reading what you shouldn't", "Confidentiality", "Per-user paths prevent cross-user reads; tokens in localStorage are exposed to XSS"],
       ["<b>D</b>enial of service", "Making it unavailable", "Availability", "No rate limiting; whole-folder reads grow with history"],
       ["<b>E</b>levation of privilege", "Gaining powers you shouldn't have", "Authorization", "Demo-to-write is blocked by requireWriteAuth; the pipeline and admin key are the highest-value targets"]], "STRIDE, applied at a high level") + `
<p>Industry-wide data points the same way. The ${TT("OWASP Top 10", `A regularly updated, data-driven list of the most critical web application security risks from the Open Worldwide Application Security Project. The 2021 edition is the most widely cited; a 2025 update keeps Broken Access Control first and adds Software Supply Chain Failures as its own category.`)} lists the most common serious web risks. In its widely cited 2021 edition, number one is <b>broken access control</b> (Lecture 3), followed by cryptographic failures, injection (including XSS) and insecure design. The 2025 update keeps access control first and gives software supply chain failures (Lectures 6 and 9) a category of its own.</p>`) },

   { t: "sort", q: `Which STRIDE category does each scenario belong to?`, buckets: ["Spoofing", "Tampering", "Info disclosure", "Denial of service", "Elevation of privilege"], items: [
     [`A script floods an endpoint until the app is too slow for everyone`, 3],
     [`An attacker replays a stolen bearer token to act as its owner`, 0],
     [`A read-only demo user finds a way to save data`, 4],
     [`An error message reveals an internal file path and library version`, 2],
     [`Someone alters a request in transit to change a workout's weights`, 1, `TLS prevents this on the network; validation limits what a forged request can do.`],
     [`A compromised CI action deploys a modified image to production`, 4, `Gaining production-level power through the pipeline.`]] },

   { t: "read", html: LEC("Principles that run through every good design", `
<ul>
<li><b>${TT("Defence in depth", `Layering independent controls so that one failure isn't a breach. Like a castle: moat, walls, gate, guards. In software: validation, authorization, least privilege, monitoring, each assuming the others might fail.`)}.</b> Assume each control can fail, and layer independent ones. XSS defences (Lecture 6) are a good example: safe DOM APIs, then a CSP, then HttpOnly cookies and short lifetimes.</li>
<li><b>Least privilege</b> (Lecture 10). Each credential and component gets only what it needs.</li>
<li><b>${TT("Fail closed", `When something is missing or goes wrong, deny access rather than allow it. The opposite, "fail open", keeps things working during errors at the expense of security.`)}.</b> When something is missing or broken, deny rather than allow.</li>
<li><b>Secure defaults.</b> The easiest path should be the safe one.</li>
<li><b>Minimise the attack surface.</b> Dead code, unused endpoints and forgotten files are surface with no benefit.</li></ul>` +
     FLAG("good", "your app fails closed on its most important secret", `If <code>SESSION_SECRET</code> isn't set in production, your backend <i>throws on start-up</i> instead of quietly using a default. That's failing closed: a misconfigured deploy doesn't start, rather than starting with a guessable signing key that would let anyone forge logins. In development it falls back to a clearly named development-only value, which is the right split.`) +
     FLAG("warn", "dead files are attack surface too", `Your repo contains files nothing uses any more: old Firebase setup code, a legacy copy of the app, a workflow in a folder GitHub never runs, and a service worker configured for an old Firebase project. They don't run, but they confuse reviewers, show up in searches, and could be deployed by accident. Deleting them is the cheapest security improvement available.`) +
     LEC("Vulnerability management", `
<p>Most of the code in your app isn't yours: it's in <code>node_modules</code>, the base image, and the CDN libraries the frontend loads. Publicly known vulnerabilities in these get a ${TT("CVE", `Common Vulnerabilities and Exposures: a public id (like CVE-2025-30066) for one specific known flaw, with a description and the affected versions. A CVSS score from 0 to 10 estimates severity.`)} id and a severity score. The routine is: know what you're running (a ${TT("software bill of materials", `An SBOM: a machine-readable list of every component and version in your software. When a new vulnerability is announced, it answers "are we affected?" in seconds.`)}, or at least your lockfile and base image), get alerts (Dependabot, <code>npm audit</code>, image scanning), and patch on a schedule, faster for severe issues.</p>
<p>When a new vulnerability makes the news, the first question is always <b>"do we run the affected component, in the affected version, in a way that exposes it?"</b> A PHP vulnerability doesn't touch a stack with no PHP. A Node.js one might, and then the version, and whether the vulnerable feature is used, decide how urgent it is.</p>`)) },

   { t: "mcq", q: `A serious vulnerability is announced in a popular Express middleware. What's the right first step?`, opts: [
     [`Check whether your lockfile has the affected package and version, and whether you use that feature`, true, `Exactly: establish exposure first. Your package-lock.json is your bill of materials. If you're affected, patch and redeploy (your pipeline makes that one push); if not, record why and move on.`],
     [`Take the backend offline straight away until the maintainers publish a fix and its full details`, false, `Taking a service down for a vulnerability you might not even be exposed to costs users availability for nothing. Assess first.`],
     [`Run <code>npm update</code> on every package in the backend to pull in all the latest versions at once`, false, `Blanket updates can introduce breaking changes and don't confirm whether you were exposed. Target the affected package.`],
     [`Rotate every secret in the system, since any vulnerability could have exposed the environment variables`, false, `Rotation is right if you find evidence of compromise or exposure. As a reflex for every advisory, it's disruptive and doesn't address the flaw.`]] },

   { t: "mcq", q: `Which of these is the clearest example of defence in depth in your system?`, opts: [
     [`Using HTTPS for every request between the browser and the backend`, false, `Essential, but one layer protecting one thing (traffic in transit).`],
     [`Database paths scoped to the caller's sub, plus path validation, plus Firebase rules denying direct access`, true, `Three independent layers protecting user data: even if one fails (a validation bug, say), the others still prevent cross-user access or direct database access from browsers.`],
     [`Storing all of the backend's secrets as Container App secrets instead of keeping them in the source code`, false, `A good practice, but a single control, not layered ones.`],
     [`Running the backend on a managed container platform instead of a virtual machine`, false, `That shifts responsibility to Azure (Lecture 8). It's not layering of controls.`]] },

   { t: "branch", q: `Triage: three findings, limited time`, start: "a", nodes: {
     a: { say: `<p>A security review of a small app like yours finds three things. You have one evening. What do you fix first?</p><ul><li>(1) A write path that a malicious website could trigger for a logged-in user</li><li>(2) The container runs as root</li><li>(3) No audit log of data changes</li></ul>`, opts: [
       [`(2), because root inside the container would give an attacker the most power`, "bad1", ``],
       [`(1), because it's exploitable today by anyone who can get a user onto a web page`, "b", ``],
       [`(3), because without logs you couldn't tell whether anything had already happened`, "bad2", ``]] },
     bad1: { end: "bad", say: `Running as root makes a <i>successful</i> break-in worse, but it needs another flaw first. Prioritise what's directly exploitable now: likelihood times impact.` },
     bad2: { end: "bad", say: `Logs help you detect and investigate, and they matter. But a hole someone can use today comes first; then improve detection.` },
     b: { say: `<p>Good. You've fixed (1). Which do you take on next, and why?</p>`, opts: [
       [`(2): a one-line change that limits the damage of any future break-in`, "win", ``],
       [`(3): build a full audit system covering every endpoint before anything else`, "bad3", ``],
       [`Neither: with (1) fixed, the remaining findings no longer matter`, "bad4", ``]] },
     bad3: { end: "bad", say: `Valuable, but it's a project, not an evening. Quick, high-value hardening first, then plan the bigger work.` },
     bad4: { end: "bad", say: `Defence in depth means fixing one layer doesn't make the others irrelevant. They're the safety net for the flaw you haven't found yet.` },
     win: { end: "good", say: `That's sound triage: exploitable issues first (likelihood × impact), then cheap hardening that limits future damage, then larger investments like audit logging, scheduled properly.` } },
     why: `Prioritise by likelihood × impact: directly exploitable issues first, then cheap hardening, then larger projects.` },

   { t: "read", html: TERMS([
       ["CIA triad", "Confidentiality, integrity, availability."],
       ["Trust boundary", "Where data crosses into a more-trusted zone. Check everything there."],
       ["Attack surface", "Everything reachable. Smaller is safer."],
       ["STRIDE", "Spoofing, Tampering, Repudiation, Info disclosure, DoS, Elevation."],
       ["Defence in depth", "Independent layers, each assuming the others may fail."],
       ["Fail closed", "Missing or broken? Deny."],
       ["CVE / SBOM", "A known flaw's public id · the list of what you run."]]) +
     FURTHER([`<i>Threat Modeling: Designing for Security</i>, Adam Shostack.`, `OWASP Top 10 (owasp.org/Top10) and the OWASP Threat Modeling Cheat Sheet.`, `The Threat Modeling Manifesto (threatmodelingmanifesto.org): a two-page summary.`]) }
 ]},

 /* ===================== 14. Reliability and observability ===================== */
 { id: "u-reliability", title: "14. Reliability and observability",
   intro: `Everything fails eventually: servers, networks, providers, your own code. Reliable systems aren't ones that never fail; they're ones designed to fail in small, visible, recoverable ways. This lecture covers measuring reliability, designing for failure, and being able to see what your system is doing.`,
   steps: [
   { t: "read", html: OBJ([
       `express availability in "nines" and calculate the effect of dependencies`,
       `define SLIs, SLOs, SLAs and error budgets`,
       `apply timeouts, retries with backoff, idempotency and graceful degradation`,
       `explain logs, metrics and traces, and what your app is missing`]) +
     LEC("Measuring reliability", `
<p>Availability is usually written as a percentage of time a service works, in "nines":</p>` +
     TABLE(["Availability", "Downtime per year", "Downtime per month"], [
       ["99% (\"two nines\")", "3.65 days", "7.3 hours"],
       ["99.9% (\"three nines\")", "8.8 hours", "43.8 minutes"],
       ["99.99% (\"four nines\")", "52.6 minutes", "4.4 minutes"],
       ["99.999% (\"five nines\")", "5.3 minutes", "26 seconds"]], "The nines") + `
<p>Each extra nine costs far more than the last. Google's Site Reliability Engineering practice (described in a free 2016 book) formalised how to decide how much reliability is enough:</p>
<ul>
<li>An ${TT("SLI", `Service Level Indicator: a measurement of how the service is doing from the user's point of view, such as "share of API requests answered successfully in under 500 ms".`)} is what you measure (share of requests that succeed quickly).</li>
<li>An ${TT("SLO", `Service Level Objective: an internal target for an SLI over a period, like "99.5% of requests succeed each month". Deliberately below 100%.`)} is your target for it (99.5% per month).</li>
<li>An ${TT("SLA", `Service Level Agreement: a contract with customers promising a level of service, with penalties (usually refunds) if missed. Set looser than the internal SLO, to leave a margin.`)} is a contractual promise with penalties, looser than the SLO.</li>
<li>The ${TT("error budget", `100% minus the SLO: the amount of failure you're allowed. While budget remains, ship features quickly; when it's spent, slow down and work on reliability. It turns "how careful should we be?" into a number.`)} is the gap between the SLO and 100%: failure you're allowed to "spend" on shipping changes.</li></ul>` +
     LEC("Dependencies multiply", `
<p>If a request needs several services to <i>all</i> be up, their availabilities multiply. Four services at 99.9% each give 0.999 × 0.999 × 0.999 × 0.999 ≈ <b>99.6%</b>, about 35 hours of potential downtime a year instead of 9. Every provider you depend on in series lowers your ceiling. That's one quantitative argument for fewer moving parts, and for designing so that some parts can fail without taking everything down.</p>`)) },

   { t: "mcq", q: `A login needs GitHub Pages, your backend, Cognito and Firebase all working. If each is independently available 99.9% of the time, roughly how available is login?`, opts: [
     [`99.9%, because the overall system can only be as unreliable as its least reliable part`, false, `That would be true if failures always happened at the same time. Independent failures add up, so the total is lower.`],
     [`About 99.6%, because the chance of all four working at once is 0.999 multiplied by itself four times`, true, `Right: 0.999⁴ ≈ 0.996. Roughly 35 hours a year when at least one link is down, four times the downtime of any single part.`],
     [`About 99.99%, because using four separate providers spreads the risk of downtime between them`, false, `Spreading risk works when parts are <i>alternatives</i> (any one will do). Here all four are required, so risks compound.`],
     [`About 96%, because each dependency subtracts a full percentage point from the overall total`, false, `It's multiplication of probabilities, not subtraction of a point per dependency. The effect is real but much smaller than that.`]] },

   { t: "read", html: LEC("Failure modes: what happens when each part breaks?", `
<p>A ${TT("failure mode analysis", `Going through each component and asking: if this fails, what exactly happens to users? Reveals single points of failure, surprising dependencies, and where graceful degradation would help.`)} asks, component by component: <i>if this fails, what do users see?</i> Here's yours. Some answers are surprising.</p>` +
     TABLE(["If this is down…", "Users see", "Why"], [
       ["GitHub Pages", "Nothing loads at all", "The app's files come from there (unless the browser cached them)"],
       ["Cognito", "New logins fail; people already logged in carry on", "Your backend issues its own 8-hour tokens, so it doesn't consult Cognito again until they expire"],
       ["Your backend", "The page loads but has no data, and login fails", "Every data request and the login flow go through it"],
       ["Firebase", "Login may work, but data requests fail with errors", "The backend can't read or write user data"],
       ["Container registry", "Normally nothing, <b>until</b> a new replica must start", "Running replicas already have the image. But with scale-to-zero, the first request after an idle period needs to pull it"],
       ["GitHub Actions", "Nothing", "Only deploys stop. Running services don't depend on CI"]], "Your system's failure modes") + `
<p>The Cognito row shows a general principle: <b>caching identity decouples you from the identity provider's availability</b>, at the cost of slower revocation. The registry row shows a hidden dependency: something that seems irrelevant to serving traffic becomes critical exactly when the platform needs to scale.</p>` +
     LEC("Designing for failure", `
<p>Standard patterns, each answering one kind of failure:</p>` +
     TABLE(["Pattern", "What it does", "Example"], [
       ["Timeouts", "Never wait forever for another service", "Give up on a Firebase call after a few seconds and return a clear error"],
       [`Retries with ${TT("exponential backoff and jitter", `Wait longer after each failed attempt (1 s, 2 s, 4 s…) and add randomness, so thousands of clients don't all retry in sync and overwhelm a recovering service.`)}`, "Try again, waiting longer each time, with randomness", "The frontend retrying a failed save after 1 s, 2 s, 4 s"],
       ["Idempotency", "Make retries safe", "Your saveId (Lecture 12): retrying can't duplicate a workout"],
       [`${TT("Circuit breaker", `After repeated failures calling a service, stop calling it for a while and fail fast instead, giving it time to recover and keeping your own threads free. Then test with a single call before resuming.`)}`, "After repeated failures, stop calling for a while and fail fast", "Stop hammering a struggling dependency"],
       [`${TT("Graceful degradation", `Keep the core working when a non-essential part fails: show cached data, hide a broken widget, queue writes for later, rather than failing the whole page.`)}`, "Keep the core working when a part fails", "Show the last loaded workouts with a \"can't sync right now\" notice"],
       [`${TT("Health probes", `Endpoints the platform calls to check a replica. Liveness: "is it alive, or should it be restarted?". Readiness: "can it take traffic yet?". Startup probes cover slow starts.`)}`, "Let the platform check each replica", "A readiness check that fails until Firebase is reachable"],
       ["Backups, with restore tests", "Recover from data loss or bad writes", "Regular exports of the database, and actually trying a restore"]], "Resilience patterns") +
     MYTH(`Retrying failed requests always makes a system more reliable.`, `Retries without idempotency create duplicates. Retries without backoff turn a brief outage into a self-inflicted flood (a "retry storm"), as every client hammers the recovering service at once. Retries are only safe with idempotency, backoff, jitter and a cap.`))) },

   { t: "sort", q: `Which resilience pattern does each description match?`, buckets: ["Timeout", "Backoff + jitter", "Circuit breaker", "Graceful degradation"], items: [
     [`After ten failures in a row, stop calling the service for 30 seconds and fail instantly`, 2],
     [`Show yesterday's chart with a "can't refresh" notice when the backend is unreachable`, 3],
     [`Give up waiting for Firebase after 5 seconds and return an error`, 0],
     [`Wait 1, 2, then 4 seconds between attempts, plus a random extra delay`, 1],
     [`Hide the analytics panel if its data fails to load, but keep logging workouts`, 3],
     [`Never let a request hang until the platform kills it`, 0]] },

   { t: "read", html: LEC("Observability: seeing inside a running system", `
<p>When something goes wrong in production, you can't attach a debugger. You can only look at what the system recorded about itself. ${TT("Observability", `How well you can understand a system's internal state from what it outputs: its logs, metrics and traces. A highly observable system lets you answer new questions about failures without shipping new code first.`)} is how well you can answer questions about a running system from those records. It rests on three kinds of signal:</p>` +
     TABLE(["Signal", "What it is", "Answers", "Example"], [
       ["Logs", "Timestamped records of events", "What exactly happened, in detail?", "\"Could not create workout: timeout\" with a user id and request id"],
       ["Metrics", "Numbers aggregated over time", "Is something wrong, and how badly?", "Requests per minute, error rate, 95th-percentile response time"],
       [`${TT("Traces", `A record of one request's journey through every service it touched, with timings for each step. Shows where time went and where errors started. OpenTelemetry is the open standard for producing them.`)}`, "One request's path through every component, with timings", "Where did the time go? Where did it fail?", "Browser → backend 40 ms → Firebase 900 ms"]], "The three signals") + `
<p>Practical habits: write ${TT("structured logs", `Logs written as data (usually JSON with named fields) instead of free text, so tools can filter and aggregate them: every error for user X, or every request slower than one second.`)} (JSON with fields, not free-form sentences); give each request a ${TT("correlation id", `A unique id attached to a request at the edge and included in every log line and downstream call it causes, so one request's story can be pulled out of millions of lines.`)} that appears in every log line it causes; and <b>alert on symptoms users feel</b> (error rate, slowness), not on every internal blip. ${TT("OpenTelemetry", `An open, vendor-neutral standard (and set of libraries) for producing traces, metrics and logs. Instrument once, then send the data to any backend: Azure Monitor, Datadog, Grafana and others.`)} has become the standard way to produce all three.</p>` +
     CASE("what you can see today", `<p>Your backend writes <code>console.error</code> messages to standard output, which Container Apps collects. You can read them in Azure's log stream, and that's genuinely the right first step: logs to stdout is twelve-factor practice. What's missing is everything that would <i>tell you</i> something is wrong before a user does: no metrics dashboard, no alert on error rates, no request ids tying a frontend error to a backend log line, and no external check that the site is up. Azure Monitor alerts on the Container App's built-in metrics, plus a free uptime checker, would cover the basics in an afternoon.</p>`)) },

   { t: "mcq", q: `Your app has no alerts configured. Firebase starts failing for 10% of requests at 2 a.m. How do you most likely find out?`, opts: [
     [`Container Apps restarts the failing replicas automatically and emails you a summary of what it did`, false, `Container Apps restarts replicas that crash or fail health probes, but your app is up and answering 500s. Nothing tells the platform that's bad, and nothing emails you.`],
     [`A user notices failed saves and tells you, possibly hours later`, true, `That's the honest answer for most small systems. Logs record what happened, but nobody is watching them. An alert on error rate turns hours into minutes.`],
     [`Firebase notifies the account owner of elevated error rates on the project within a few minutes`, false, `Providers publish status pages for their own outages, but they don't alert you about your app's error rate. That's your monitoring's job.`],
     [`The next deploy fails, because GitHub Actions checks the backend's health before building a new image`, false, `Your workflow doesn't check the running service at all; it builds and deploys.`]] },

   { t: "mcq", q: `What's the difference between a liveness probe and a readiness probe?`, opts: [
     [`Liveness asks "should this replica be restarted?"; readiness asks "should it be sent traffic right now?"`, true, `Right. A replica can be alive but not ready (still starting, or its database is unreachable): it should get no traffic, but restarting it wouldn't help. Mixing the two up causes needless restart loops.`],
     [`Liveness checks the database connection; readiness checks that the container image downloaded successfully`, false, `Neither probe is tied to a specific check like that. They differ in what the platform <i>does</i> when one fails: restart, or stop routing traffic.`],
     [`Liveness runs only once at start-up; readiness runs continuously for as long as the replica is up`, false, `Both run continuously. A separate "startup probe" covers slow-starting apps.`],
     [`Liveness is checked by the load balancer; readiness is checked by the application code itself`, false, `The platform runs both; your app just answers them.`]] },

   { t: "read", html: TERMS([
       ["Nines", "Availability as a percentage: 99.9% ≈ 8.8 hours a year down."],
       ["SLI / SLO / SLA", "What you measure · your target · your contractual promise."],
       ["Error budget", "Allowed failure: 100% minus the SLO."],
       ["Graceful degradation", "Keep the core working when parts fail."],
       ["Backoff + jitter", "Wait longer between retries, with randomness."],
       ["Logs / metrics / traces", "What happened · how much · where the time went."],
       ["Liveness / readiness", "Restart it? · Send it traffic?"]]) +
     FURTHER([`<i>Site Reliability Engineering</i> (Google, free at sre.google/books): chapters on SLOs and on handling overload.`, `<i>Release It!</i>, Michael Nygard: the origin of the circuit breaker pattern and many others.`, `OpenTelemetry docs: "Observability primer".`]) }
 ]},

 { id: "u-capstone", title: "15. Capstone: reviewing and evolving your system",
   intro: `Time to put it together. Professionals explain systems at several levels of zoom, write their decisions down, and plan how a system should change as it grows. This lecture gives you those tools, then tests your judgement with the kind of scenarios used in system design interviews.`,
   steps: [
   { t: "read", html: OBJ([
       `describe a system at the right level of zoom using the C4 model`,
       `record an architectural decision as an ADR`,
       `prioritise an evolution roadmap by risk and value`,
       `answer system design questions about your own app with clear trade-offs`]) +
     LEC("Explaining a system: the C4 model", `
<p>Simon Brown's ${TT("C4 model", `Four levels of architecture diagram, like zoom levels on a map: Context (the system and its users and neighbours), Containers (the separately running parts), Components (the major pieces inside one container), Code (classes and functions). Most conversations need only the first two.`)} describes software at four levels of zoom, like a map. Most conversations, including interviews, need only the first two:</p>` +
     LAYERS("Your system at four zoom levels", [
       { title: "1 · Context", layers: [["\"A workout tracker. Users log in with Cognito, data is stored in Firebase, and GitHub builds and hosts it.\"", "you", `Who uses it and what it talks to. No technology details yet. The level for non-technical people and the first minute of an interview.`]] },
       { title: "2 · Containers", layers: [["SPA (GitHub Pages) · Express API (Azure Container Apps) · Firebase RTDB · Cognito", "azure", `The separately deployed or running parts, and how they communicate. The level of the overview diagram in Lecture 2. Note that "container" here means any running unit, not specifically Docker.`]] },
       { title: "3 · Components", layers: [["Inside the API: auth middleware · guards · data path validation · workout handlers · Firebase admin module", "google", `The major parts inside one container. Useful for a new developer joining the backend.`]] },
       { title: "4 · Code", layers: [["Functions and classes: verifyToken, normalizeDataPath, ApiSnapshot…", "browser", `Rarely drawn: the code is the diagram. The My code module lives at this level.`]] }],
       "In an interview, start at level 1, then zoom to level 2, and only go deeper when asked.") +
     LEC("Writing decisions down: ADRs", `
<p>Six months from now, nobody remembers <i>why</i> the app has both a cookie and a bearer token. An ${TT("Architecture Decision Record", `A short document capturing one significant decision: the context, the decision, and its consequences. Proposed by Michael Nygard in 2011. Kept in the repo, numbered, never deleted, only superseded by later ones.`)} (ADR), proposed by Michael Nygard in 2011, is a short note recording one decision. Here's what one for your app could look like:</p>
<div class="model"><b>ADR 004: Accept a signed bearer token alongside the session cookie</b>
<p><b>Status:</b> Accepted.</p>
<p><b>Context:</b> The frontend (github.io) and backend (azurecontainerapps.io) are different sites. Safari and Firefox block the session cookie on API calls from the frontend, so phone users can't stay logged in.</p>
<p><b>Decision:</b> After login, hand the frontend a single-use code via the URL fragment, which it exchanges for an HMAC-signed, 8-hour token sent as <code>Authorization: Bearer</code>. Keep cookie sessions for browsers that still allow them.</p>
<p><b>Consequences:</b> Works on every browser. Tokens are exposed to XSS through localStorage and can't be revoked individually. One-time codes live in memory, so the backend must run as a single replica. Revisit if the frontend and backend move to one domain.</p></div>
<p>ADRs are short, kept in the repo next to the code, and never edited after the fact (a new ADR supersedes an old one). They're also excellent interview material: "here's a decision I made, what I traded, and when I'd revisit it" is exactly what interviewers are looking for.</p>`)) },

   { t: "mcq", q: `In an interview you're asked "walk me through your project's architecture". What's the strongest opening?`, opts: [
     [`Start with the Dockerfile and the deployment workflow, since that's where the most interesting engineering work happened`, false, `Starting at the build details loses the listener before they know what the system is for. Zoom in only once they have the big picture.`],
     [`One sentence on what it does for users, then the main running parts and how they talk, then zoom in where they're curious`, true, `That's C4 levels 1 then 2. It shows you can communicate at the right altitude, and lets the interviewer steer you to what they care about.`],
     [`List every technology involved, from Express and Firebase to Vite and Cognito, so they can see the breadth of experience`, false, `A list of names shows little understanding. Interviewers want to hear how parts fit together and why.`],
     [`Explain the most complex part in depth first, the custom login handoff, to show technical depth early on`, false, `Depth is good once there's context. Without the big picture, the login handoff has nothing to hang on.`]] },

   { t: "read", html: LEC("An evolution roadmap", `
<p>Architecture is never finished. A useful exercise is to sort known issues by <b>when</b> they become a problem, rather than fixing everything at once or nothing at all:</p>` +
     TABLE(["Horizon", "Change", "Why then", "Lecture"], [
       ["Now (any users)", "Review cookie-authenticated writes against the CSRF checklist; switch user text from innerHTML to textContent; pin CDN scripts", "Exploitable regardless of scale", "6"],
       ["Now", "Delete dead files; add path filters to workflows; run as non-root", "Cheap, removes surface and waste", "7, 9, 13"],
       ["Before a second replica", "Move sessions and one-time codes to a shared store (or drop cookie sessions entirely)", "In-memory state breaks with replicas or scale-to-zero", "5, 8"],
       ["Before real users rely on it", "Error-rate alerts, uptime check, database backups with a tested restore", "You need to know before users tell you", "14"],
       ["As history grows", "Move analytics to the server, or the data to a relational database", "Whole-folder reads grow every month", "11"],
       ["When convenient", "One domain for frontend and API; then first-party cookies replace the token handoff", "Removes a whole class of complexity", "5"],
       ["Optional", "Consolidate providers (e.g. all-Azure or all-Google)", "Fewer consoles, credentials and network hops, at migration cost", "2, 3"]], "Your system's roadmap, by horizon") + `
<p>Notice the shape: security issues that are exploitable today come first regardless of scale, cheap wins next, and scale-driven changes are scheduled just ahead of the scale that needs them. That's what "it depends" looks like once you've done the analysis.</p>`) },

   { t: "sort", q: `When should each change happen?`, buckets: ["Now, at any scale", "Before scaling out", "Only if circumstances change"], items: [
     [`Moving one-time login codes into a shared store`, 1],
     [`Switching user-entered text from innerHTML to textContent`, 0],
     [`Migrating every provider onto a single cloud`, 2],
     [`Adding a CSRF defence to cookie-authenticated writes`, 0],
     [`Replacing in-memory sessions with Redis`, 1],
     [`Splitting the backend into microservices`, 2, `Only with a much bigger team or very different scaling needs.`]] },

   { t: "branch", q: `System design interview: "Your app goes viral"`, start: "a", nodes: {
     a: { say: `<p>The interviewer says: <i>"Your workout tracker is featured on TV and goes from 20 users to 50,000 overnight. What breaks first, and what do you do?"</i> Where do you start?</p>`, opts: [
       [`Say I'd rewrite the backend as microservices on Kubernetes to handle the load`, "bad1", ``],
       [`Ask what the traffic looks like, then walk the request path to find the first bottleneck`, "b", ``],
       [`Say I'd move everything to the biggest Azure plan available, to be safe`, "bad2", ``]] },
     bad1: { end: "bad", say: `A rewrite takes months; the spike is tonight. Interviewers look for diagnosis before solutions, and the smallest change that works.` },
     bad2: { end: "bad", say: `Scaling up one replica hits a ceiling, and it doesn't touch the actual first failure. Find the bottleneck first.` },
     b: { say: `<p>Good: clarify, then trace. Walking the request path, which constraint bites first at 50,000 users?</p>`, opts: [
       [`GitHub Pages can't serve the static files to that many people at the same time`, "bad3", ``],
       [`You can't add replicas, because sessions and login codes live in one replica's memory`, "c", ``],
       [`Cognito's free tier stops allowing any new sign-ups once you pass that volume`, "bad4", ``]] },
     bad3: { end: "bad", say: `Static files on a CDN-backed host are the easiest part of the system to scale. The constraint is in your own server.` },
     bad4: { end: "bad", say: `Cognito would start billing, not refusing. Check pricing, but it isn't what breaks first. Look at what stops your own backend from scaling.` },
     c: { say: `<p>Right. You move that state to a shared store so the app can scale out. What's the <i>next</i> thing to watch as usage grows?</p>`, opts: [
       [`Database cost and speed, because screens download whole folders of growing history`, "win", ``],
       [`The CI pipeline, because more users means many more deployments are needed`, "bad5", ``],
       [`The TLS certificate, because each one only covers a limited number of users`, "bad6", ``]] },
     bad5: { end: "bad", say: `Deploy frequency depends on your team, not your user count. Think about what grows with users: data, reads and cost.` },
     bad6: { end: "bad", say: `Certificates have no user limit. Think about what grows with every user and every month: data volume and reads.` },
     win: { end: "good", say: `That's a strong answer: clarify, trace the request path, fix the first hard constraint (stateful replicas), then anticipate the next (unbounded reads and Firebase cost, solved with server-side aggregation, pagination, or a relational store). You named trade-offs at each step, which is what system design interviews reward.` } },
     why: `Clarify the scenario, trace the request path, fix the first real bottleneck with the smallest change, then name the next one. State in memory blocks scaling out; unbounded reads come next.` },

   { t: "mcq", q: `An interviewer asks: "Why didn't you just use Firebase Auth instead of Cognito, given your data is in Firebase?" Which answer shows the best judgement?`, opts: [
     [`Cognito is more secure than Firebase Auth, because AWS has stricter compliance certifications than Google does`, false, `Both are mature, certified services. "More secure" without specifics sounds like a guess, and interviewers will probe it.`],
     [`It would have meant fewer providers; I'd explain my reason, and that switching now means re-keying data`, true, `This owns the trade-off honestly: the cost (more providers), the reason, and the real switching cost (data keyed by Cognito subs, Lecture 3). Interviewers value that more than a claim that the choice was perfect.`],
     [`There isn't a meaningful difference, since all identity providers implement the same OIDC standard`, false, `The protocol is shared, but user ids, features, pricing and lock-in differ, and your database layout depends on the choice.`],

   { t: "read", html: `<div class="obj"><b>Course summary: what you now know</b><ul>

 ]}
];

/* Place each right answer at a position drawn from a shuffled "bag", so positions are evenly spread
   with no pattern, and shuffle the wrong options around it. Seeded, so it's stable between visits. */
(function () {
  let seed = 20261029;
  const rnd = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bags = {};
  const draw = k => { if (!bags[k] || !bags[k].length) bags[k] = shuffle([...Array(k).keys()]); return bags[k].pop(); };
  MYSYS.forEach(l => (l.steps || []).forEach(s => {
    if (s.t === "mcq") {
      const right = s.opts.filter(o => o[1]);
      if (right.length !== 1) { s.opts = shuffle(s.opts); return; }
      const opts = shuffle(s.opts.filter(o => !o[1]));
      opts.splice(draw(s.opts.length), 0, right[0]);
      s.opts = opts;
    }
    if (s.t === "branch") Object.values(s.nodes).forEach(n => { if (n.opts) n.opts = shuffle(n.opts); });
  }));
})();
