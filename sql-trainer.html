<style>
/* Layout: record-shop counter. Lesson crate on the left, the request + editor + receipt-style results on the right. */
:root {
  --bg: #eaeef3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #16243a;
  --muted: #56667d;
  --line: #d3dbe5;
  --accent: #e3a624;
  --accent-ink: #875900;
  --on-accent: #1a1405;
  --good: #1d8457;
  --good-bg: #e2f4ea;
  --bad: #b93d29;
  --bad-bg: #fbe9e5;
  --editor-bg: #15213a;
  --editor-fg: #e9eff8;
  --editor-muted: #8fa0bb;
  --vinyl: #15213a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1524; --surface: #162139; --surface-2: #1b2843; --ink: #e6ecf5; --muted: #93a3ba;
    --line: #2a3a58; --accent: #f0b73a; --accent-ink: #f3c25a; --on-accent: #1a1405;
    --good: #4cc48b; --good-bg: #133326; --bad: #f2806c; --bad-bg: #3a1c19;
    --editor-bg: #0a1120; --editor-fg: #e9eff8; --editor-muted: #7d8dab; --vinyl: #05080f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1524; --surface: #162139; --surface-2: #1b2843; --ink: #e6ecf5; --muted: #93a3ba;
  --line: #2a3a58; --accent: #f0b73a; --accent-ink: #f3c25a; --on-accent: #1a1405;
  --good: #4cc48b; --good-bg: #133326; --bad: #f2806c; --bad-bg: #3a1c19;
  --editor-bg: #0a1120; --editor-fg: #e9eff8; --editor-muted: #7d8dab; --vinyl: #05080f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
code, pre, textarea { font-family: var(--font-mono); }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; font-size: .88em; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Record (logo) ---------- */
.record {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background:
    radial-gradient(circle, var(--bg) 0 7%, var(--accent) 8% 26%, var(--vinyl) 27% 100%);
  box-shadow: inset 0 0 0 4px var(--vinyl), inset 0 0 0 5px rgba(255,255,255,.08), inset 0 0 0 9px var(--vinyl), inset 0 0 0 10px rgba(255,255,255,.08);
}
.record.spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Gate ---------- */
.gate {
  min-height: 100%; display: grid; place-items: center;
  padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gate-card {
  width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 32px 28px; display: grid; gap: 18px;
}
.gate-card .record { width: 72px; height: 72px; }
.gate-card h1 { font-size: 2rem; font-weight: 800; }
.gate-card p { margin: 0; color: var(--muted); }
.gate-row { display: flex; gap: 8px; }
.gate-row input {
  flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
.gate-err { color: var(--bad); font-weight: 700; min-height: 1.5em; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
kbd { font-family: var(--font-mono); font-size: .72em; opacity: .7; }

/* ---------- App shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.25rem; font-weight: 800; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.xp { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.rank { text-align: right; line-height: 1.2; }
.rank b { font-family: var(--font-display); display: block; }
.rank span { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.xpbar { width: 120px; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }
.nav-toggle { display: none; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
.nav {
  border-right: 1px solid var(--line); padding: 18px 12px 40px;
  position: sticky; top: calc(61px + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - 61px); overflow-y: auto;
}
.nav h2 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); padding: 0 10px 8px; }
.nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
  padding: 7px 10px; border-radius: 8px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center;
}
.nav button:hover { background: var(--surface-2); }
.nav button.current { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 700; }
.nav .num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: .75rem; font-family: var(--font-mono); border: 1.5px solid var(--line); color: var(--muted);
}
.nav .done .num { background: var(--good); border-color: var(--good); color: var(--surface); }
.nav .boss .num { border-color: var(--accent); color: var(--accent-ink); }
.nav .section-label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }

.main {
  padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; min-width: 0; max-width: 900px; width: 100%;
}
@media (min-width: 861px) { .main { padding-left: 36px; padding-right: 36px; } }
.eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
.lesson-head { display: grid; gap: 6px; }
.lesson-head h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; }

.memo {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start;
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
}
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 16px; min-width: 0; }
.bubble .who { font-size: .8rem; color: var(--muted); font-weight: 700; }
.bubble p { margin: 2px 0 0; }

.teach { max-width: 68ch; display: grid; gap: 12px; }
.teach p { margin: 0; }
.teach ul { margin: 0; padding-left: 1.2em; }
.example {
  background: var(--editor-bg); color: var(--editor-fg); border-radius: var(--radius);
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px 10px 14px; min-width: 0;
}
.example pre { margin: 0; flex: 1; min-width: 0; overflow-x: auto; font-size: .9rem; padding: 2px 0; }
.example button {
  flex: none; border: 1px solid rgba(255,255,255,.2); background: transparent; color: var(--editor-fg);
  border-radius: 6px; padding: 3px 10px; font-size: .8rem;
}
.example button:hover { background: rgba(255,255,255,.1); }

.task {
  border: 2px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px;
  background: var(--surface); display: grid; gap: 4px;
}
.task b { font-family: var(--font-display); font-size: 1.05rem; }

details.schema { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.schema summary { padding: 10px 14px; cursor: pointer; font-weight: 700; }
.schema-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.tbl { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; min-width: 0; }
.tbl button { border: 0; background: none; padding: 0; color: var(--accent-ink); font-family: var(--font-mono); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.tbl ul { list-style: none; margin: 4px 0 0; padding: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.tbl li span { color: var(--ink); }

.editor-wrap { background: var(--editor-bg); border-radius: var(--radius); overflow: hidden; }
.editor-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; color: var(--editor-muted); font-size: .8rem; border-bottom: 1px solid rgba(255,255,255,.08); }
.editor-bar .dots { display: flex; gap: 6px; }
.editor-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.15); }
textarea#sql {
  display: block; width: 100%; min-height: 150px; resize: vertical; border: 0; outline: none;
  background: transparent; color: var(--editor-fg); padding: 14px 16px; font-size: .98rem; line-height: 1.6; tab-size: 2;
  caret-color: var(--accent);
}
textarea#sql::placeholder { color: var(--editor-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .spacer { flex: 1; }

.feedback { border-radius: var(--radius); padding: 12px 16px; font-weight: 700; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.info { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
.feedback .msg { flex: 1; min-width: 200px; }
.feedback .msg small { display: block; font-weight: 400; color: var(--ink); opacity: .85; }
.hint { background: var(--surface); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.hint pre { margin: 6px 0 0; white-space: pre-wrap; font-size: .9rem; }

.results { display: grid; gap: 6px; min-width: 0; }
.results .cap { font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--surface-2); font-family: var(--font-mono); font-size: .8rem; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.null { color: var(--muted); font-style: italic; }
td.num { text-align: right; font-family: var(--font-mono); font-size: .85rem; }

.finale { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 8px; }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
  .app.nav-open .nav { display: block; }
  .nav-toggle { display: inline-flex; }
  .xpbar { display: none; }
  .brand small { display: none; }
}
@media (max-width: 480px) {
  .rank span { display: none; }
  .brand h1 { font-size: 1.05rem; }
}
@media (prefers-reduced-motion: reduce) {
  .record.spin, .shake { animation: none; }
  .xpbar i { transition: none; }
}
</style>

<!-- Password gate -->
<div class="gate" id="gate">

    <div class="record"></div>

    <div class="gate-row">
      <label for="pw" class="sr" hidden>Password</label>
      <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button class="btn btn-primary" type="submit">Open</button>
    </div>
    <div class="gate-err" id="gate-err" aria-live="polite"></div>

</div>

<!-- App -->
<div id="app-root" hidden>
  <header class="topbar">

</div>

const L = [

const LESSONS = L.filter(x => x.id);
const CHECKABLE = LESSONS.filter(x => !x.play);
const XP_CLEAN = 15, XP_REVEALED = 5;
const RANKS = [[0,"Browser"],[30,"Crate Digger"],[90,"Shop Assistant"],[170,"Record Buyer"],[260,"Data Wrangler"],[340,"Query Wizard"]];

/* ---- Saved progress (per browser, best effort) ---- */
const KEY = "ferry-street-sql-v1";
let state = { current: LESSONS[0].id, done: {}, revealed: {}, drafts: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function xp() { return Object.values(state.done).reduce((a, v) => a + v, 0); }
function rankFor(x) { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (x >= RANKS[i][0]) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { r, next }; }

/* ---- Helpers ---- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let SQL = null;
const sqlReady = (typeof initSqlJs === "function")
  ? initSqlJs().then(s => { SQL = s; })
  : Promise.reject(new Error("The SQL engine could not load. Check your connection and reload."));

function freshDb() { const db = new SQL.Database(); db.run(SEED); return db; }
function lastResult(results) {
  if (!results || !results.length) return { columns: [], values: [] };
  return results[results.length - 1];
}
function runOn(db, sql) { return lastResult(db.exec(sql)); }

function normCell(v) {
  if (v === null || v === undefined) return "∅";
  if (typeof v === "number") return String(Math.round(v * 1e6) / 1e6);
  return String(v);
}
function normRows(res, ordered) {
  const rows = res.values.map(r => JSON.stringify(r.map(normCell)));
  return ordered ? rows : rows.slice().sort();
}
function compare(exp, got, ordered) {
  const ec = exp.columns.length, gc = got.columns.length;
  if (gc === 0 && got.values.length === 0) return { ok: false, why: "Your query returned no rows.", tip: `Expected ${exp.values.length} row${exp.values.length === 1 ? "" : "s"}. Check your WHERE condition.` };
  if (ec !== gc) return { ok: false, why: `Wrong number of columns: expected ${ec}, you have ${gc}.`, tip: "Check the columns listed in the task, in order." };
  if (exp.values.length !== got.values.length) return { ok: false, why: `Expected ${exp.values.length} row${exp.values.length === 1 ? "" : "s"}, you got ${got.values.length}.`, tip: "Your filter is keeping too many or too few rows." };
  const a = normRows(exp, ordered), b = normRows(got, ordered);
  if (a.every((r, i) => r === b[i])) return { ok: true };
  if (ordered) {
    const as = a.slice().sort(), bs = b.slice().sort();
    if (as.every((r, i) => r === bs[i])) return { ok: false, why: "Right rows, wrong order.", tip: "Check your ORDER BY." };
  }
  return { ok: false, why: "Right shape, but some values don't match.", tip: "Check the columns are the right ones and in the right order." };
}

/* ---- Rendering ---- */
function renderTop() {
  const x = xp(); const { r, next } = rankFor(x);
  $("rank-name").textContent = r[1];
  $("xp-text").textContent = next ? `${x} XP · ${next[0] - x} to ${next[1]}` : `${x} XP · top rank`;
  const pct = next ? ((x - r[0]) / (next[0] - r[0])) * 100 : 100;
  $("xp-fill").style.width = Math.max(3, pct) + "%";
}

function renderNav() {
  let n = 0;
  const doneCount = CHECKABLE.filter(l => state.done[l.id]).length;
  let html = `<h2>${doneCount} of ${CHECKABLE.length} done</h2><ol>`;
  for (const item of L) {
    if (item.sec) { html += `<li class="section-label">${esc(item.sec)}</li>`; continue; }
    n++;
    const cls = [state.done[item.id] ? "done" : "", item.boss ? "boss" : "", item.id === state.current ? "current" : ""].join(" ");
    const mark = state.done[item.id] ? "✓" : (item.play ? "∞" : n);
    html += `<li><button type="button" class="${cls}" data-id="${item.id}"><span class="num">${mark}</span><span>${esc(item.title)}</span></button></li>`;
  }
  $("nav").innerHTML = html + "</ol>";
}

function lessonIndex(id) { return LESSONS.findIndex(l => l.id === id); }

function renderLesson() {
  const les = LESSONS[lessonIndex(state.current)] || LESSONS[0];
  const idx = lessonIndex(les.id);
  const label = les.play ? "Bonus" : les.boss ? "Boss level" : `Lesson ${idx + 1} of ${CHECKABLE.length}`;
  const done = state.done[les.id];
  const schemaHtml = SCHEMA.map(t => `<div class="tbl"><button type="button" data-peek="${t.name}">${t.name}</button><ul>${t.cols.map(c => `<li><span>${c[0]}</span> ${esc(c[1])}</li>`).join("")}</ul></div>`).join("");

  $("main").innerHTML = `
    <div class="lesson-head">
      <div class="eyebrow">${label}${done ? " · completed" : ""}</div>
      <h2>${esc(les.title)}</h2>
    </div>
    <div class="memo">
      <div class="avatar" aria-hidden="true">D</div>
      <div class="bubble"><div class="who">Dot, shop owner</div><p>${esc(les.story)}</p></div>
    </div>
    <section class="teach">${les.teach}
      ${les.ex.map((e, i) => `<div class="example"><pre>${esc(e)}</pre><button type="button" data-ex="${i}">Try it</button></div>`).join("")}
    </section>
    ${les.task ? `<div class="task"><span class="eyebrow">Your task</span><b>${les.task}</b></div>` : ""}
    <details class="schema"${idx < 2 ? " open" : ""}><summary>Shop database: 4 tables (tap a name to peek)</summary><div class="schema-grid">${schemaHtml}</div></details>
    <div class="editor-wrap">
      <div class="editor-bar"><div class="dots"><i></i><i></i><i></i></div><span>SQLite · Ctrl/⌘ + Enter to run</span></div>
      <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Type your SQL here..." aria-label="SQL editor"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="button" id="run">${les.play ? "Run" : "Run &amp; check"} <kbd>Ctrl↵</kbd></button>
      ${les.play ? "" : `<button class="btn" type="button" id="hint-btn">Hint</button><button class="btn btn-ghost" type="button" id="reveal-btn">Show answer</button>`}
      <span class="spacer"></span>
      <button class="btn btn-ghost" type="button" id="clear-btn">Clear</button>
    </div>
    <div id="hint-box"></div>
    <div id="feedback" aria-live="polite"></div>
    <div id="results" class="results"></div>
    ${les.play ? finaleHtml() : ""}
  `;
  const ta = $("sql");
  ta.value = state.drafts[les.id] ?? les.starter ?? "";
  bindLesson(les);
  renderNav(); renderTop();
}

function finaleHtml() {
  const doneCount = CHECKABLE.filter(l => state.done[l.id]).length;
  return `<div class="finale"><span class="eyebrow">Your record</span><h3>${doneCount} of ${CHECKABLE.length} lessons done, ${xp()} XP, rank: ${esc(rankFor(xp()).r[1])}</h3>
  <p style="margin:0;color:var(--muted)">Want a clean slate? <button class="btn btn-ghost" type="button" id="reset-btn">Reset all progress</button><span id="reset-confirm"></span></p></div>`;
}

function showTable(res, caption) {
  const box = $("results");
  if (!res.columns.length) { box.innerHTML = `<div class="cap"><span>${esc(caption)}</span></div><div class="feedback info">No rows came back.</div>`; return; }
  const head = res.columns.map(c => `<th>${esc(c)}</th>`).join("");
  const body = res.values.map(r => "<tr>" + r.map(v => v === null ? `<td class="null">NULL</td>` : typeof v === "number" ? `<td class="num">${esc(normCell(v))}</td>` : `<td>${esc(v)}</td>`).join("") + "</tr>").join("");
  box.innerHTML = `<div class="cap"><span>${esc(caption)}</span><span>${res.values.length} row${res.values.length === 1 ? "" : "s"}</span></div>
    <div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function feedback(kind, html) { $("feedback").innerHTML = html ? `<div class="feedback ${kind}">${html}</div>` : ""; }

function friendlyError(msg) {
  let tip = "";
  if (/no such column/i.test(msg)) tip = "Check the spelling of column names, and put text values in 'single quotes'.";
  else if (/no such table/i.test(msg)) tip = "Check the table name. Open the database panel to see them all.";
  else if (/syntax error/i.test(msg)) tip = "Something is in the wrong place. Check commas between columns and the order: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT.";
  else if (/incomplete input/i.test(msg)) tip = "The query ends too early. Missing a closing bracket or quote?";
  else if (/misuse of aggregate/i.test(msg)) tip = "Aggregates like COUNT() can't go in WHERE. Use HAVING after GROUP BY.";
  return `<div class="msg">The database said: ${esc(msg)}${tip ? `<small>${esc(tip)}</small>` : ""}</div>`;
}

function spin(on) { $("logo").classList.toggle("spin", on); }

function run(les) {
  const sql = $("sql").value.trim();
  state.drafts[les.id] = $("sql").value; save();
  if (!sql) { feedback("info", `<div class="msg">Type a query first. Stuck? Press Hint.</div>`); return; }
  if (!SQL) { feedback("info", `<div class="msg">The SQL engine is still loading. Try again in a second.</div>`); return; }
  spin(true);
  setTimeout(() => spin(false), 600);

  let got, db = freshDb();
  try {
    got = runOn(db, sql);
    if (les.mutate) {
      try { got = runOn(db, les.verify); }
      catch (e) { db.close(); feedback("bad", friendlyError(e.message)); $("results").innerHTML = ""; return; }
    }
  } catch (e) { db.close(); feedback("bad", friendlyError(e.message)); $("results").innerHTML = ""; return; }
  db.close();

  showTable(got, les.mutate ? les.verifyLabel : "Your result");
  if (les.play) { feedback("", ""); return; }

  const edb = freshDb();
  let exp;
  try { exp = les.mutate ? (edb.exec(les.sol), runOn(edb, les.verify)) : runOn(edb, les.sol); }
  finally { edb.close(); }

  const c = compare(exp, got, !!les.ordered || !!les.mutate);
  if (c.ok) {
    const first = !state.done[les.id];
    if (first) state.done[les.id] = state.revealed[les.id] ? XP_REVEALED : XP_CLEAN;
    save();
    const gained = first ? `+${state.done[les.id]} XP` : "Already done";
    const nextL = LESSONS[lessonIndex(les.id) + 1];
    feedback("good", `<div class="msg">${pick(["Nailed it!", "Spot on!", "Dot is impressed.", "That's the one!", "Beautiful query."])} ${gained}</div>
      ${nextL ? `<button class="btn btn-primary" type="button" id="next-btn">Next: ${esc(nextL.title)} →</button>` : ""}`);
    if (nextL) $("next-btn").onclick = () => go(nextL.id);
    if (first) confetti();
    renderNav(); renderTop();
  } else {
    feedback("bad", `<div class="msg">${esc(c.why)}<small>${esc(c.tip)}</small></div>`);
  }
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.createElement("div"); layer.className = "confetti";
  const colors = ["var(--accent)", "var(--good)", "var(--ink)", "var(--bad)"];
  const btn = $("run").getBoundingClientRect();
  for (let i = 0; i < 36; i++) {
    const p = document.createElement("i");
    p.style.left = (btn.left + btn.width / 2) + "px"; p.style.top = btn.top + "px";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--dx", (Math.random() * 360 - 180) + "px");
    p.style.setProperty("--dy", (Math.random() * -260 - 40) + "px");
    p.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    p.style.animationDelay = (Math.random() * 0.12) + "s";
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1700);
}

function go(id) {
  state.current = id; save();
  renderLesson();
  $("app").classList.remove("nav-open"); $("nav-toggle").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}

function bindLesson(les) {
  const ta = $("sql");
  $("run").onclick = () => run(les);
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(les); }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault(); const s = ta.selectionStart;
      ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });
  ta.addEventListener("input", () => { state.drafts[les.id] = ta.value; save(); });
  $("clear-btn").onclick = () => { ta.value = ""; state.drafts[les.id] = ""; save(); ta.focus(); };
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => {
    ta.value = les.ex[+b.dataset.ex]; ta.focus();
    if (!SQL) return;
    // Run the example without grading it
    const db = freshDb();
    try { showTable(runOn(db, ta.value), "Example result"); feedback("info", `<div class="msg">That's the example. Now change it to solve the task.</div>`); }
    catch (e) { feedback("bad", friendlyError(e.message)); }
    finally { db.close(); }
  });
  document.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => {
    if (!SQL) return;
    const db = freshDb();
    try { showTable(runOn(db, `SELECT * FROM ${b.dataset.peek};`), `Peek: ${b.dataset.peek}`); } finally { db.close(); }
  });
  if (!les.play) {
    $("hint-btn").onclick = () => { $("hint-box").innerHTML = `<div class="hint"><b>Hint</b><pre>${esc(les.hint)}</pre></div>`; };
    $("reveal-btn").onclick = () => {
      if (!state.revealed[les.id]) { state.revealed[les.id] = true; save(); }
      $("hint-box").innerHTML = `<div class="hint"><b>Answer</b> ${state.done[les.id] ? "" : `<span style="color:var(--muted)">(now worth ${XP_REVEALED} XP instead of ${XP_CLEAN})</span>`}<pre>${esc(les.sol)}</pre></div>`;
    };
  } else {
    const rb = $("reset-btn");
    rb.onclick = () => {
      $("reset-confirm").innerHTML = ` Sure? <button class="btn" type="button" id="reset-yes">Yes, reset</button>`;
      $("reset-yes").onclick = () => { state = { current: LESSONS[0].id, done: {}, revealed: {}, drafts: {} }; save(); renderLesson(); };
    };
  }
}

/* ---- Boot ---- */
function startApp() {
  $("gate").hidden = true; $("app-root").hidden = false;
  $("nav").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) go(b.dataset.id); });
  $("nav-toggle").onclick = () => {
    const open = $("app").classList.toggle("nav-open");
    $("nav-toggle").setAttribute("aria-expanded", String(open));
  };
  renderLesson();
  sqlReady.catch(err => feedback("bad", `<div class="msg">${esc(err.message)}</div>`));
}

let unlocked = false;
try { unlocked = localStorage.getItem(KEY + "-open") === "1"; } catch (e) {}
if (unlocked) startApp();
$("gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("pw").value.trim().toLowerCase();
  if (v === PASSWORD) {
    try { localStorage.setItem(KEY + "-open", "1"); } catch (e) {}
    startApp();
  } else {
    $("gate-err").textContent = "That's not it. Try again.";
    const card = $("gate-form"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    $("pw").select();
  }
});
})();
</script>
