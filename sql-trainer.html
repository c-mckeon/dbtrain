const CRAFT = [
 { sec: "Understanding code" },
 { id: "c-read", title: "Read before you write",
   intro: `Welcome to the team! First ticket: <i>"Order confirmation emails sometimes show the wrong total."</i> You've never seen this codebase. No pressure.`,
   steps: [
   { t: "read", html: `<p>Most working developers spend far more time <b>reading</b> code than writing it. As AI tools write more of the first drafts, that tips even further. The valuable skill is understanding code, judging it, and knowing what to change.</p><p>Before you touch an unfamiliar system, get a rough map: how it runs, where the relevant code lives, and why it's the way it is.</p>` },
   { t: "order", q: `Put these first steps on the email bug in a sensible order.`, items: [
     "Reproduce it: find an order where the email total was wrong and compare it with the database",
     "Find where the email is built (search the code for the template, or for \"total\")",
     "Trace where that total comes from, back to its source",
     "Form a guess about the cause, and check it",
     "Write a test that fails because of the bug",
     "Fix it, and watch the test pass"],
     why: `Reproduce first: you can't confirm a fix for a bug you can't see. And write the failing test <i>before</i> the fix. It proves you understand the cause, and it stops the bug quietly coming back later.` },
   { t: "mcq", q: `A teammate says "just ask the AI". You paste the ticket into an assistant, and it suggests a change to a file you haven't opened. Best move?`, opts: [
     ["Apply it. If the tests pass, ship it", false, `Passing tests only prove what the tests check, and this bug already got past them. You'd be shipping a change you can't explain.`],
     ["Read that file and trace the code path yourself, then judge whether the change fixes the actual cause", true, `Yes. The suggestion is a useful lead, and it's saved you searching. But you're still responsible for understanding what you ship.`],
     ["Ignore AI suggestions on principle", false, `That throws away a useful tool. Assistants are great at searching, explaining unfamiliar code and drafting. The mistake is skipping understanding, not using AI.`]] },
   { t: "sort", q: `It's your first week. What deserves your attention early, and what can wait?`, buckets: ["Look at early", "Can wait"], items: [
     ["The README and setup instructions", 0, "How to run the thing at all."],
     ["Tests for the part of the code you're changing", 0, "They show how the code is meant to behave, and give you a safety net."],
     ["<code>git log</code> and <code>git blame</code> for the file", 0, "The history explains <i>why</i> the code looks the way it does, which you can't get from the code alone."],
     ["How the app is deployed", 0, "You need to know how your change reaches customers."],
     ["Rewriting the build system you don't like", 1, "Week one is for learning why things are the way they are. Big rewrites come later, if ever, and with the team's agreement."],
     ["Renaming variables across the codebase to your taste", 1, "Pure churn. It makes everyone else's work harder to review and merge."]] }
 ]},

 { id: "c-names", title: "Names and readability",
   intro: `I asked for a review of some old code and got back: "I have no idea what <code>f(l, t)</code> does." Neither do I.`,
   steps: [
   { t: "read", html: `<p>Code is read far more often than it's written: by teammates, by future you, and now by AI tools that take their context from your code. Clear names are the cheapest documentation there is.</p><ul><li>Name things after what they <b>mean</b>, not their type: <code>overdue_orders</code>, not <code>list2</code>.</li><li>Functions should say what they do or return: <code>send_receipt()</code>, <code>is_gold()</code>.</li><li>Comments should explain <b>why</b>, not repeat <b>what</b>. If a comment just restates the code, a better name usually removes the need for it.</li></ul>` },
   { t: "mcq", q: `Best name for a function that returns customers who haven't bought anything in a given number of months?`, opts: [
     ["<code>get_data()</code>", false, `Every function gets data. This tells the reader nothing.`],
     ["<code>process_customers()</code>", false, `"Process" hides what actually happens. Does it email them? Delete them?`],
     ["<code>customers_inactive_for(months)</code>", true, `It reads like a sentence where it's used: <code>customers_inactive_for(12)</code>.`],
     ["<code>cust_inact_12()</code>", false, `Cryptic abbreviations, and the 12 is baked in, so you'd need another function for 6 months.`]] },
   { t: "spot", q: `Click the comments that add nothing (they just repeat the code).`, code: py`
# add one to count
count += 1
# Supplier API returns pence, not pounds
price = response["price"] / 100
# loop over albums
for album in albums:
    # Skip pre-orders: they're charged on release day
    if album.preorder:
        continue
`, bad: [0, 4], why: `Those two describe what anyone can see. The other two record facts the code can't express: why divide by 100, and why pre-orders are skipped. Those are the comments worth keeping.` },
   { t: "write", q: `Rewrite this so it explains itself. Each item in <code>l</code> is a tuple <code>(title, artist, price, stock)</code>.<pre class="code">def f(l, t):
    r = []
    for x in l:
        if x[2] > t and x[3] == 0:
            r.append(x[0])
    return r</pre>`, placeholder: "def ...", mono: true,
     model: `def sold_out_titles_above(albums, min_price):
    return [
        title
        for title, artist, price, stock in albums
        if price > min_price and stock == 0
    ]`,
     checklist: ["The function name says what it returns", "The parameters have meaningful names", "Unpacked the tuple (or used an object) instead of x[2] and x[3]", "Someone new could understand it without a comment"] }
 ]},

 { sec: "Design principles" },
 { id: "c-srp", title: "One job each",
   intro: `The monthly report broke because someone changed the email server. Why would an email change break the maths?`,
   steps: [
   { t: "read", html: `<p>The <b>single responsibility principle</b> says a function, class or module should have one reason to change. When one piece of code does several jobs, changing any of them risks breaking the others, and you can't test one job without the rest.</p><p>It's the "S" in <b>SOLID</b>, a set of five design principles that come up in interviews. You met three in the Objects course: <b>O</b>pen/closed (add behaviour without editing existing code), <b>L</b>iskov substitution (a subclass should work wherever its parent does) and <b>D</b>ependency inversion (depend on abstractions). The fifth, <b>I</b>nterface segregation, means code shouldn't be forced to depend on methods it doesn't use.</p>` },
   { t: "spot", q: `This function is meant to calculate the month's total. Click the lines doing a different job.`, code: py`
def monthly_total(path):
    rows = list(csv.DictReader(open(path)))
    total = sum(float(r["price"]) * int(r["qty"]) for r in rows)
    html = f"<h1>Total: £{total:.2f}</h1>"
    send_email("dot@ferrystreet.example", html)
    return total
`, bad: [1, 3, 4], why: `Reading the file, building HTML and sending email are three more jobs, each with its own reason to change (file format, design, email provider). As it stands, testing the maths means having a real file and sending a real email.` },
   { t: "mcq", q: `Which split is best?`, opts: [
     ["<code>load_sales(path)</code>, <code>calculate_total(rows)</code>, <code>render_report(total)</code> and <code>send_report(html)</code>, called in turn by a short <code>run_monthly_report()</code>", true, `Each piece can be tested and changed on its own, and the top-level function reads like a summary of the process.`],
     ["Four classes: <code>SalesLoaderManager</code>, <code>TotalCalculatorService</code>…", false, `Same split, much more ceremony. Plain functions are enough here.`],
     ["Leave it: it's only 6 lines", false, `Short isn't the same as simple. The trouble is its parts can't be tested or changed separately.`]] },
   { t: "read", html: `<p>Another famous principle is <b>DRY</b>: don't repeat yourself. It's good advice, but easy to overdo. Two pieces of code can <i>look</i> alike while existing for different reasons. Merge them, and when one needs to change, you end up adding flags and special cases.</p><p>A popular rule of thumb is to wait until you've written something three times before abstracting it. <b>Duplication is far cheaper than the wrong abstraction.</b></p>` },
   { t: "mcq", q: `Receipts and invoices have five near-identical formatting lines. Legal says invoices need different rounding rules next quarter. What do you do?`, opts: [
     ["Merge them into one <code>format_document(kind)</code>, with an if for the rounding", false, `You'd be welding together two things that are about to grow apart, and more ifs will follow.`],
     ["Leave them separate for now: they look alike but change for different reasons", true, `Yes. DRY is about knowledge, not text that happens to look the same. These encode two different sets of rules.`],
     ["Copy the lines into a third place for the new rules", false, `Now there are three copies, and the problem is worse.`]] }
 ]},

 { id: "c-yagni", title: "Keep it simple",
   intro: `A contractor quoted three weeks for a "flexible reporting platform". Dot asked for one list of this week's sales.`,
   steps: [
   { t: "read", html: `<p><b>KISS</b> (keep it simple) and <b>YAGNI</b> (you aren't gonna need it) push back against building for imagined futures. Code written "just in case" costs time now, has to be read and maintained forever, and the guess about the future is usually wrong.</p><p>This matters more now that AI makes code cheap to <i>produce</i>. The real cost of code is reading, reviewing and maintaining it, and an assistant can generate a lot of it very quickly.</p><p>Simple isn't careless, though. Handling cases that really happen today isn't YAGNI.</p>` },
   { t: "sort", q: `Build it now, or wait until it's actually needed?`, buckets: ["Build it now", "Wait until needed"], items: [
     ["Handle orders with zero items (it already happens)", 0, "A real case today."],
     ["Support 12 currencies (the shop is UK-only, with no plans to change)", 1, "Pure speculation."],
     ["A plugin system for payment providers (we use one)", 1, "When a second provider actually arrives, you'll know what the plugin needs to look like."],
     ["Check email addresses are valid on signup", 0, "Bad input happens on day one."],
     ["Make the database swappable in case we leave SQLite someday", 1, "A clean, simple design is already easy to change. Extra layers cost you now, and the guess is usually wrong."],
     ["Back up the database every night", 0, "Not speculative: losing data is a matter of when, not if."]] },
   { t: "mcq", q: `Which decisions deserve the most careful thought up front?`, opts: [
     ["Every decision equally", false, `That's how three-week reporting platforms happen. Spend thinking time where it pays off.`],
     ["Ones that are hard to reverse: table design for live data, the shape of a public API, signing a hosting contract", true, `Yes. Decisions that are cheap to change can be made quickly and fixed later. Expensive-to-change ones deserve care. Amazon calls these "one-way" and "two-way" doors.`],
     ["Variable names", false, `Worth getting right, but renaming is cheap. That's a two-way door.`]] },
   { t: "mcq", q: `Dot needs this week's sales on a page. Which do you build?`, opts: [
     ["One query and a simple page: about half a day", true, `Ship it, learn what Dot actually uses, and grow it from there.`],
     ["A configurable reporting engine for any future report: about two weeks", false, `You'd be guessing at needs nobody has stated. Build the second report when someone asks for it, then see what the two have in common.`]] }
 ]},

 { id: "c-tests", title: "Tests that pay off",
   intro: `Every time we change checkout, something else breaks. Can we stop doing that?`,
   steps: [
   { t: "read", html: `<p>Tests let you change code without fear. They're also becoming the main way to <b>check AI-written code</b>: if you can describe the behaviour you want as tests, you can verify any implementation, whoever or whatever wrote it.</p><p>The <b>test pyramid</b>:</p><ul><li><b>Unit tests</b> (lots): one function or class on its own. Fast and precise.</li><li><b>Integration tests</b> (some): several parts together, such as your code plus a real database.</li><li><b>End-to-end tests</b> (a few): the whole system, used the way a customer would. Slow and brittle, but they catch what the others miss.</li></ul><p>Good tests check <b>behaviour</b> (what the code promises), not implementation details (how it happens to work today).</p>` },
   { t: "sort", q: `What kind of test is each of these?`, buckets: ["Unit", "Integration", "End-to-end"], items: [
     ["<code>calculate_total()</code> returns 32.00 for two £16 albums", 0, "One function, no outside systems."],
     ["Saving an order writes the right rows to a real test database", 1, "Your code and the database, together."],
     ["A browser script buys an album on the test site and checks the email arrives", 2, "The whole system, used as a customer would."],
     ["<code>LoyaltyCard.redeem()</code> raises an error with under 100 points", 0, "One class's behaviour."],
     ["The <code>/orders/999</code> page returns \"not found\", with the real database behind it", 1, "The web layer plus the database."]] },
   { t: "spot", q: `This test will break the next time someone tidies up Basket's internals, even if Basket still works. Which line is the problem?`, code: py`
def test_total():
    basket = Basket(NoDiscount())
    basket.add(Album("Snowline", 16.0), 2)
    assert basket._items[0][1] == 2
    assert basket.total() == 32.0
`, bad: [3], why: `It checks a private detail (how items are stored), not behaviour. If Basket switches to a dictionary, this fails while the shop works fine. Tests that fail for no real reason teach people to ignore failing tests.` },
   { t: "mcq", q: `A test fails about 1 run in 20 on the build server. Everyone just presses re-run. What should happen?`, opts: [
     ["Keep re-running: it's only one test", false, `Soon there are five flaky tests, nobody trusts a failing build, and a real failure gets re-run away.`],
     ["Treat it as a bug: find the cause (timing, test order, shared state, the real clock or network) and fix it, or quarantine it with a ticket", true, `Yes. A flaky test is either a bug in the test, or a real intermittent bug in the code, and those are the worst kind to meet in production.`],
     ["Delete it", false, `You'd lose whatever it was protecting, and maybe hide a real timing bug.`]] },
   { t: "tests", q: `Now write some tests yourself. Here's the function to test:<pre class="code">points_for(amount, is_gold)</pre><ul><li>1 point per whole £1 spent (£16.99 earns 16)</li><li>Gold customers get double</li><li>A negative amount raises <code>ValueError</code></li></ul><p>Write <code>test_</code> functions using <code>assert</code>. For errors, use <code>with raises(ValueError):</code>. Your tests run against the correct version (where they should all pass) and against <b>four broken versions</b>. Aim to catch every one.</p>`,
     starter: py`def test_one_point_per_pound():
    assert points_for(10, False) == 10

# Add more tests. Think about:
# - what if the amount has pence?
# - what about Gold customers?
# - what about bad input?
`,
     impls: [
       ["Your tests pass on the correct version", py`def points_for(amount, is_gold):
    if amount < 0:
        raise ValueError("negative amount")
    return int(amount) * (2 if is_gold else 1)`, true],
       ["Catches bug: forgets to double for Gold", py`def points_for(amount, is_gold):
    if amount < 0:
        raise ValueError("negative amount")
    return int(amount)`, false],
       ["Catches bug: rounds pence instead of dropping them", py`def points_for(amount, is_gold):
    if amount < 0:
        raise ValueError("negative amount")
    return round(amount) * (2 if is_gold else 1)`, false],
       ["Catches bug: accepts negative amounts", py`def points_for(amount, is_gold):
    return int(amount) * (2 if is_gold else 1)`, false],
       ["Catches bug: doubles for everyone", py`def points_for(amount, is_gold):
    if amount < 0:
        raise ValueError("negative amount")
    return int(amount) * 2`, false]],
     solution: py`def test_one_point_per_pound():
    assert points_for(10, False) == 10

def test_pence_are_dropped():
    assert points_for(16.99, False) == 16

def test_gold_gets_double():
    assert points_for(10, True) == 20

def test_negative_amount_rejected():
    with raises(ValueError):
        points_for(-1, False)
`, why: `This is called <b>mutation testing</b>: plant bugs and see whether your tests notice. Tests that pass on broken code give false confidence. Choosing the cases that matter (edges like £16.99, both kinds of customer, bad input) is the skill, and it's exactly what you'd use to check code an AI wrote for you.` }
 ]},

 { sec: "Working in a team" },
 { id: "c-ai", title: "Working with AI assistants",
   intro: `We all use AI coding tools here. Some people get great results and some ship a mess. The difference is mostly the person driving.`,
   steps: [
   { t: "read", html: `<p>AI assistants now write a lot of first-draft code. The skills that matter are shifting towards:</p><ul><li><b>Specifying clearly:</b> context, constraints, examples, and what "done" looks like.</li><li><b>Breaking work down</b> into steps small enough to check.</li><li><b>Verifying:</b> reading the output, running it, testing it, and catching plausible-looking mistakes.</li><li><b>Judgement:</b> recognising when output is wrong, over-built, insecure, or not what was needed.</li></ul><p>You're still responsible for everything you ship, whoever typed it.</p>` },
   { t: "mcq", q: `Which request will get the best result?`, opts: [
     [`"Add discounts."`, false, `The assistant has to guess what kind, where, with what rules, and how you'll check it. It will guess something plausible and probably wrong.`],
     [`"You are a world-class 10x engineer. Write perfect, bug-free discount code."`, false, `Flattery and demands add no information. The assistant still doesn't know what you need.`],
     [`"In <code>shop/basket.py</code>, add a <code>PercentOff</code> pricing rule like the existing <code>NoDiscount</code>. 10% off should turn £32.00 into £28.80. Don't change Basket's public methods. Add unit tests next to the existing ones in <code>tests/test_basket.py</code> and run them."`, true, `Where the code lives, a pattern to follow, a concrete example, constraints, and how to verify. That's a spec, and it's exactly what a human teammate would need too.`]] },
   { t: "spot", q: `An assistant wrote this to give 10% off orders over £50. Each item has <code>.price</code> and <code>.qty</code>. There are three problems. Click them.`, code: py`
def apply_discount(order):
    total = sum(item.price for item in order.items)
    if total > 50:
        total = total * 0.1
    order.total = round(total)
    return order.total
`, bad: [1, 3, 4], why: `Line 2 ignores quantity. Line 4 charges 10% of the price instead of taking 10% off (it should be <code>* 0.9</code>). Line 5 rounds to whole pounds. Every line <i>looks</i> reasonable at a glance, which is exactly why AI-written code needs careful reading and tests.` },
   { t: "mcq", q: `The assistant tells you to <code>pip install fastcsv-pro</code>. You've never heard of it. What do you do?`, opts: [
     ["Install it: the assistant wouldn't suggest something fake", false, `Assistants sometimes invent plausible-sounding package names. Attackers register those names with malicious code ("slopsquatting"), and installing a package runs its code on your machine.`],
     ["Check it exists, is the package you think it is, and is maintained (its PyPI page, repository, download numbers), and ask whether the built-in <code>csv</code> module would do", true, `Yes. Every dependency is code you're choosing to trust. Fewer dependencies means less risk.`],
     ["Install it in a virtual environment so it's safe", false, `A virtual environment keeps packages tidy. It doesn't stop malicious code running with your permissions.`]] },
   { t: "write", q: `Write a request to an AI assistant to add a "sort by price" option to the shop's album list page. Make up reasonable details about the codebase.`, placeholder: "In ... please ...",
     model: `In the Flask app, the album list is rendered by albums() in shop/views.py using templates/albums.html. Add a "Sort by price" option next to the existing "Sort by title" link.

- ?sort=price_asc and ?sort=price_desc should sort by price. Any other value keeps the current title sort.
- Sort in the SQL query (ORDER BY), not in Python.
- Don't add any new dependencies.
- Add tests to tests/test_views.py for both directions and for an unknown sort value, then run the whole test suite.

Before changing anything, show me a short plan, and ask if anything is unclear.`,
     checklist: ["Said where the relevant code lives", "Described the behaviour wanted, with specific values", "Gave constraints (what not to change, no new dependencies, and so on)", "Said how to verify it (tests to add or run)", "Asked for a plan or a small first step, or invited questions"] },
   { t: "mcq", q: `The assistant's change passes every test, but you don't understand one part of it. Merge?`, opts: [
     ["Yes: the tests pass", false, `Then you can't explain it in review, maintain it, or spot what the tests missed.`],
     ["Not yet. Ask the assistant or a teammate to explain it, read the docs, and merge once you could explain the change yourself", true, `A good rule: never merge code you couldn't defend in a code review.`],
     ["Delete that part and see if the tests still pass", false, `If they do, either your tests are missing a case or the code really was unnecessary. Either way, you need to understand it first.`]] }
 ]},

 { id: "c-review", title: "Code review",
   intro: `Reviews here have got a bit… spicy. Let's work out what good looks like, on both sides.`,
   steps: [
   { t: "read", html: `<p>Code review catches bugs, spreads knowledge around the team, and keeps the codebase consistent. Good review comments are:</p><ul><li><b>Specific:</b> point at the problem and explain why it matters.</li><li><b>Kind:</b> about the code, not the person.</li><li><b>Clear about weight:</b> is this blocking, or a "nit" (a small preference)?</li><li><b>Helpful:</b> suggest a way forward where you can.</li></ul><p>Small pull requests get better reviews. Nobody reads 2,000 lines carefully.</p>` },
   { t: "mcq", q: `A PR loads every order into memory just to count them. Which comment is best?`, opts: [
     [`"This is wrong."`, false, `It doesn't say what's wrong, why it matters, or what to do instead.`],
     [`"Why would you do it like this??"`, false, `It reads as an attack, so the author gets defensive instead of fixing it.`],
     [`"This loads every order into memory just to count them, which will get slow as orders grow. Could we use <code>SELECT COUNT(*)</code> instead? Happy to pair on it."`, true, `A specific problem, why it matters, a concrete suggestion, and an offer to help.`],
     [`"nit: lgtm"`, false, `This approves a real performance problem and calls it a nitpick.`]] },
   { t: "sort", q: `Block the merge, or nice-to-have?`, buckets: ["Must fix before merge", "Nit (nice to have)"], items: [
     ["SQL built with an f-string from user input", 0, "SQL injection. Always blocking."],
     ["A variable could have a clearer name", 1, "Worth mentioning, labelled as a nit."],
     ["No test for the new refund path", 0, "Money logic with no test."],
     ["\"I'd use a list comprehension here\"", 1, "A style preference."],
     ["Deletes customer accounts with no confirmation step", 0, "Irreversible and risky."],
     ["An extra blank line", 1, "Let an automatic formatter deal with this."]] },
   { t: "mcq", q: `A reviewer leaves 14 comments on your PR, some quite blunt. What's the best response?`, opts: [
     ["Fix everything silently, whatever you think", false, `Some comments might be wrong, and silent changes teach nobody anything.`],
     ["Assume good intent: fix what's right, ask about what's unclear, and push back with reasons where you disagree", true, `Reviews are a conversation. If the tone is a pattern, raise it privately later, separately from the code.`],
     ["Argue every point in the PR thread", false, `Long threads go nowhere. For a real disagreement, a five-minute call usually settles it.`]] },
   { t: "mcq", q: `Which PR is most likely to get a careful review?`, opts: [
     [`2,400 lines: "Refactor + new checkout + fix typos"`, false, `Reviewers skim, and bugs slip through in the noise.`],
     ["180 lines, one feature, with a description of what changed, why, and how to test it", true, `Small and focused, with the context explained up front.`],
     ["40 lines with no description", false, `Small is good, but now the reviewer has to work out why you made the change.`]] }
 ]},

 { id: "c-git", title: "Version control habits",
   intro: `I ran <code>git log</code> to find out why the discount code changed. Every commit message says "fix" or "changes".`,
   steps: [
   { t: "read", html: `<p>Your git history is a story the team reads later, usually while debugging something urgent.</p><ul><li>Make <b>small, focused commits</b>, one logical change each.</li><li><b>Commit messages</b> start with a short summary in the imperative ("Fix…", "Add…"), followed by <i>why</i> if it isn't obvious.</li><li>Use a <b>branch</b> for each change, merged through a pull request.</li><li><b>Never commit secrets.</b> Git remembers everything.</li></ul>` },
   { t: "mcq", q: `Which is the best commit message?`, opts: [
     ["<code>fix</code>", false, `Fix what? Why? Nobody can tell.`],
     ["<code>Updated files</code>", false, `Every commit updates files.`],
     [`<pre>Fix gift card balance going negative on refunds

Refunds called spend() with a negative amount, which
skipped the balance check. Add a separate refund()
method and a test.</pre>`, true, `A summary line, then the cause and the approach. Six months from now, someone will thank you.`],
     ["<code>FINALLY got it working!!!</code>", false, `Relatable, but it tells the reader nothing about what changed.`]] },
   { t: "order", q: `Put a typical feature workflow in order.`, items: [
     "Pull the latest main branch",
     "Create a branch for the change",
     "Make small commits as you go",
     "Push, and open a pull request with a description",
     "Respond to the review and update",
     "Merge, then delete the branch"],
     why: `Starting from the latest main avoids painful conflicts later. Deleting merged branches keeps the repository easy to find your way around.` },
   { t: "mcq", q: `You committed a live API key and pushed it. What now?`, opts: [
     ["Delete the line in a new commit", false, `The key is still in the history, readable by anyone with access. Bots scan public repositories for keys within minutes.`],
     ["Revoke the key and issue a new one straight away, then remove it from the code and load it from an environment variable", true, `Assume a leaked secret is compromised. Replacing it is the only real fix. Cleaning up the history is optional tidying.`],
     ["Make the repository private", false, `It may already have been copied, and everyone with access can still see it.`]] }
 ]},

 { id: "c-debug", title: "Debugging methodically",
   intro: `Checkout crashes for some customers and not others. Two people have been changing random things for an hour.`,
   steps: [
   { t: "read", html: `<p>Debugging is the scientific method applied to code:</p><ol><li><b>Reproduce</b> it reliably.</li><li><b>Read</b> the error properly. In a Python traceback, start at the bottom line, then follow the frames upward.</li><li><b>Form a hypothesis</b> and test it, changing one thing at a time.</li><li><b>Narrow it down:</b> binary search, either through the code or through the history with <code>git bisect</code>.</li><li><b>Fix the cause</b>, add a test, and ask what else might have the same flaw.</li></ol><p>If you change random things until it works, you don't know why it broke, or why it's fixed.</p>` },
   { t: "mcq", q: `What's the most likely cause?`, code: py`
Traceback (most recent call last):
  File "shop/web.py", line 88, in checkout
    total = basket.total()
  File "shop/basket.py", line 41, in total
    return self.pricing.apply(subtotal)
AttributeError: 'NoneType' object has no attribute 'apply'
`, opts: [
     ["The basket's <code>pricing</code> is <code>None</code>: some baskets are created without a pricing rule", true, `Yes. "'NoneType' object has no attribute 'apply'" means <code>self.pricing</code> is None. Next question: where do baskets get created without one? That would also explain why only some customers are affected.`],
     ["There's a bug inside <code>apply()</code>", false, `apply() is never reached. Python fails while trying to find it on None.`],
     ["Line 88 of web.py has a typo", false, `Line 88 is just where the call started. The bottom line tells you what actually went wrong.`]] },
   { t: "order", q: `"Checkout worked last Monday and it's broken today, with forty commits in between." Put the steps in order.`, items: [
     "Reproduce the failure locally",
     "Confirm last Monday's version works (your last known good commit)",
     "Run git bisect between the good and bad commits to find the one that broke it",
     "Read that commit's changes to understand the cause",
     "Write a test that fails because of the bug",
     "Fix it, and check the test passes"],
     why: `<code>git bisect</code> binary-searches the history, so 40 commits take about 6 checks. It's one of the most underused tools in git.` },
   { t: "mcq", q: `You've been stuck on a bug for 90 minutes. Best move?`, opts: [
     ["Keep going: asking for help looks weak", false, `Teams lose far more time to people stuck in silence than to quick questions.`],
     ["Write down what you know, what you've tried and what you expected, then ask a teammate, starting with that summary", true, `Writing it down often solves it by itself ("rubber ducking"). If not, your teammate can help in minutes instead of starting from zero.`],
     ["Rewrite the whole module from scratch", false, `You'd probably bring the bug back, plus new ones, without ever learning the cause.`]] }
 ]},

 { id: "c-security", title: "Security habits",
   intro: `We take payments and store customer details. Security isn't someone else's job here, because there is no someone else.`,
   steps: [
   { t: "read", html: `<p>Every developer needs a security baseline:</p><ul><li><b>Never trust input.</b> Use placeholders for SQL (remember the injection boss level?), and validate and escape user data.</li><li><b>Keep secrets out of code.</b> Use environment variables or a secrets manager.</li><li><b>Least privilege.</b> Give people, programs and AI agents only the access they need.</li><li><b>Look after dependencies.</b> Pin versions, update regularly, and question every new package.</li><li><b>Protect personal data.</b> Think before you log it, copy it, or paste it into tools.</li></ul><p>AI assistants learned from a huge amount of insecure code, and they repeat those patterns confidently. Reviewing for security is your job.</p>` },
   { t: "sort", q: `Fine or risky?`, buckets: ["Fine", "Risky"], items: [
     ["An API key in a <code>.env</code> file listed in <code>.gitignore</code>", 0, "It stays out of the repository."],
     ["An API key pasted into the code \"just for testing\"", 1, "\"Just for testing\" code gets committed all the time."],
     ["Queries using <code>?</code> placeholders", 0, "The standard defence against SQL injection."],
     ["The website's database user can drop tables", 1, "If the site is compromised, the attacker gets that power too. Least privilege."],
     ["Dependency versions pinned in a lockfile", 0, "Builds are repeatable, and nothing unexpected sneaks in."],
     ["Pasting the customer list into a public AI chatbot to tidy it up", 1, "Personal data has left your control, and you may have broken data protection law."],
     ["Logging full card numbers to help with debugging", 1, "Logs get copied everywhere, and card data has strict rules (PCI DSS)."]] },
   { t: "spot", q: `Click the three lines with security problems.`, code: py`
API_KEY = "sk_live_51HxQ2eFerryStreet"

def find_customer(name):
    sql = f"SELECT * FROM customers WHERE name = '{name}'"
    return db.execute(sql).fetchall()

def reset_password(user, new_password):
    user.set_password(new_password)
    log.info(f"Reset password for {user.email} to {new_password}")
`, bad: [0, 3, 8], why: `A hard-coded live key, SQL built from user input, and a password written into the logs. All three are common, and all three turn up in AI-generated code.` },
   { t: "mcq", q: `An AI coding agent asks for permission to run any shell command and push straight to main. You want it to fix one failing test. What do you allow?`, opts: [
     ["Everything: it's faster", false, `One bad command or poisoned instruction, and it could delete files, leak secrets, or ship broken code to customers.`],
     ["The narrowest access that does the job: edit files and run tests on a branch, with you reviewing before anything is merged", true, `Least privilege applies to tools and agents just as much as to people.`],
     ["Nothing: agents are never safe", false, `With sensible limits they're very productive. The answer is limits, not avoidance.`]] }
 ]},

 { sec: "Bigger picture" },
 { id: "c-tradeoffs", title: "Trade-offs and decisions",
   intro: `A new hire wants to rebuild the site as microservices on Kubernetes. We get about 200 visitors a day.`,
   steps: [
   { t: "read", html: `<p>Senior engineers rarely say "X is best". They say "X costs this and buys that, and here's why it fits <i>our</i> situation." Useful questions to ask:</p><ul><li>What problem are we actually solving, and how big is it?</li><li>What are the options? There are always at least two, and "do nothing" is one of them.</li><li>What does each option cost to build, run, learn and undo?</li><li>What fits this team's skills and timeline?</li></ul><p>Prefer boring, well-understood technology unless something new solves a problem you actually have. And write important decisions down, so future teammates know <i>why</i>.</p>` },
   { t: "mcq", q: `About 200 visitors a day, and a team of three. The proposal is six microservices on Kubernetes. Your view?`, opts: [
     ["Go for it: it's how big companies do it", false, `Big companies adopted microservices to solve problems of scale and team size that we don't have. We'd pay all the running costs for none of the benefits.`],
     ["Keep one well-structured app, and revisit if real scaling or team-size problems appear", true, `A single app (a "monolith") is simpler to build, test, deploy and debug. Splitting it later, along boundaries you understand by then, is very doable.`],
     ["Rewrite it in a faster language first", false, `Speed isn't the problem at 200 visitors a day.`]] },
   { t: "mcq", q: `The site is moving to several servers that all write orders at the same time. SQLite or PostgreSQL?`, opts: [
     ["SQLite", false, `SQLite is excellent, but it's a file on one machine's disk and allows one writer at a time. Several servers writing at once is exactly where it struggles.`],
     ["PostgreSQL", true, `It's a database server built for many connections writing at once over a network. The changed situation justifies the extra running cost.`],
     ["A spreadsheet", false, `Please no.`]] },
   { t: "write", q: `Write a short <b>decision record</b>: should the shop build its own card payment handling, or use a payment provider like Stripe? Include the context, the options, the decision, and the consequences.`, placeholder: "Context: ...",
     model: `Context: We're adding online card payments. We're a team of three with no payment-security specialists.

Options: (1) Handle card details ourselves. (2) Use a payment provider such as Stripe, so card data never touches our servers.

Decision: Use a payment provider.

Why: Handling card numbers ourselves would mean strict PCI DSS compliance work, security audits, and serious liability if we were breached. A provider handles fraud checks, card rules and refunds, and we could be live in days instead of months.

Consequences: We pay roughly 1.5% to 3% per transaction, and we depend on the provider's uptime and terms. Revisit if fees become a significant cost at our volume.`,
     checklist: ["Described the context (team size, constraints)", "Listed at least two options", "Stated a clear decision", "Gave reasons, including security or compliance", "Named the costs or downsides of the choice", "Said when to revisit the decision"] }
 ]},

 { id: "c-comms", title: "Communicating",
   intro: `Dot's latest ticket says, in full: "Make checkout faster." That's it. That's the ticket.`,
   steps: [
   { t: "read", html: `<p>More and more of the job is turning fuzzy goals into precise ones, for teammates and AI tools alike. Asking good questions, giving clear updates and raising bad news early are what make people want you on their team.</p>` },
   { t: "mcq", q: `What's your first response to "Make checkout faster"?`, opts: [
     ["Start optimising database queries", false, `You might speed up a part nobody's waiting on.`],
     [`Ask: how slow is it now, for whom, measured how, and what would "fast enough" look like?`, true, `You can't hit a target nobody has defined. The answer might even be "the payment page looks frozen", which is a design problem, not a speed problem.`],
     [`Reply "done" after adding caching everywhere`, false, `Caching adds complexity and brings its own bugs. Measure first.`]] },
   { t: "write", q: `Dot asks: "Can we add gift wrapping?" Write the questions you'd ask before estimating the work.`, placeholder: "- ...",
     model: `- Which products can be gift-wrapped: everything, or only albums?
- Does it cost extra? Per item or per order?
- Is there a choice of paper, or a gift message?
- Should prices be hidden on the packing slip?
- How will staff know to wrap an order? (Packing slip? Order screen?)
- What happens on returns: is the wrapping fee refunded?
- Is there a deadline, such as Christmas?`,
     checklist: ["Asked about scope (which products, which options)", "Asked about money (price, refunds)", "Asked how it reaches the people doing the work (packing slip, order screen)", "Asked about timing or a deadline", "The questions are specific enough for Dot to answer quickly"] },
   { t: "mcq", q: `Which end-of-day status update is most useful?`, opts: [
     [`"Working on gift wrap."`, false, `Nobody can plan around this.`],
     [`"Gift wrap: the checkout part is done and tested. Blocked on the wrapping price from Dot. Risk: the packing slip change might slip to Thursday. Next: the email template."`, true, `What's done, what's blocked and who can unblock it, the risks, and what's next. Thirty seconds to read, and everyone knows where things stand.`],
     ["A 600-word message about everything you tried today", false, `The important parts are buried. Lead with the status, and offer details if anyone wants them.`]] },
   { t: "mcq", q: `It's day 2 of a task you estimated at 3 days. You now think it'll take 8. What do you do?`, opts: [
     ["Say nothing and work late to catch up", false, `Surprises at the deadline are the worst kind. People needed the chance to plan around it.`],
     ["Tell the team now, with the new estimate, the reason, and options (cut scope, ship in stages, or accept the delay)", true, `Bad news early is useful information. Bad news late is a crisis.`],
     ["Quietly drop some requirements", false, `Other people are relying on those. Trading off scope is a team decision.`]] }
 ]},

 { sec: "Final round" },
 { id: "c-boss", title: "Boss level: a week on the team", boss: true,
   intro: `Monday morning. New ticket: <i>"Customers want to save albums to a wishlist."</i> It's yours, start to finish.`,
   steps: [
   { t: "mcq", q: `Monday, 9:15. First move?`, opts: [
     ["Ask an AI to generate the whole feature", false, `You don't know what "the whole feature" is yet.`],
     ["Clarify scope with Dot (logged-in customers only? shareable? an alert when an album is back in stock?) and check what already exists in the database", true, `Ten minutes of questions can save days. And you might already have a <code>wishlist</code> table from the SQL course…`],
     ["Start building the most complete version you can imagine", false, `YAGNI. Build what's actually needed, then extend it.`]] },
   { t: "order", q: `Dot says: logged-in customers only, no sharing, and stock alerts can come later. Put the plan in order.`, items: [
     "Design the table: wishlist(customer_id, album_id), unique per pair",
     "Write tests for adding, removing and listing wishlist items",
     "Implement the wishlist functions until the tests pass",
     "Add the button and the wishlist page",
     "Try it by hand on a test copy of the site",
     "Open a small PR with a clear description"] },
   { t: "spot", q: `Tuesday. An assistant drafted the "add to wishlist" function. Click the two problem lines.`, code: py`
def add_to_wishlist(con, customer_id, album_id):
    rows = con.execute(f"SELECT * FROM wishlist WHERE customer_id = {customer_id}").fetchall()
    if album_id in rows:
        return
    con.execute("INSERT INTO wishlist (customer_id, album_id) VALUES (?, ?)", (customer_id, album_id))
    con.commit()
`, bad: [1, 2], why: `Line 2 builds SQL with an f-string. Line 3 compares a number to a list of row <i>tuples</i>, so it never matches and duplicates get added. It looks perfectly reasonable, it would pass a quick manual test, and it's wrong.` },
   { t: "mcq", q: `Wednesday. A reviewer comments: "Instead of checking for duplicates in Python, add <code>UNIQUE (customer_id, album_id)</code> and use <code>INSERT OR IGNORE</code>." Your response?`, opts: [
     ["Agree: the database enforces it even when two requests arrive at once, and the Python gets simpler", true, `A rule in the database can't be raced, forgotten or bypassed. That's a good review, and a good response.`],
     ["Push back: Python checks are more flexible", false, `Flexibility isn't the goal for a rule that must always hold.`],
     ["Do both, to be extra safe", false, `The Python check adds nothing but a second query and more code to maintain.`]] },
   { t: "mcq", q: `Friday, 4:45pm. It's approved. Deploy now?`, opts: [
     ["Yes: ship it before the weekend", false, `If it breaks, either nobody's around to notice, or someone's weekend is ruined.`],
     ["Deploy Monday morning while the team is around, or ship it switched off behind a feature flag and turn it on when someone can watch", true, `A wishlist isn't urgent. Choose a moment when problems will be noticed and fixed quickly.`],
     ["Deploy, and mute the alerts", false, `Hiding problems is not the same as avoiding them.`]] },
   { t: "write", q: `Write the PR description for the wishlist feature.`, placeholder: "## What\n...",
     model: `## What
Logged-in customers can save albums to a wishlist and see them on a new /wishlist page.

## Why
Ticket #142: customers asked for a way to remember albums for later. Sharing and stock alerts are out of scope for now (agreed with Dot).

## How
- New table wishlist(customer_id, album_id) with UNIQUE(customer_id, album_id). Adding uses INSERT OR IGNORE.
- add/remove/list functions in shop/wishlist.py, all using ? placeholders.
- A heart button on album pages, and a new /wishlist page.

## Testing
- Unit tests for adding (including duplicates), removing and listing.
- Tested by hand: add, add again, remove, and a logged-out user is sent to the login page.

## Risks
New table only, with no changes to existing data. Safe to roll back.`,
     checklist: ["Says what changed", "Says why, and links the ticket", "Notes what's out of scope", "Explains how it works at a high level", "Describes how it was tested", "Mentions risks or rollback"] }
 ]}
];

/* ---------- Build course: one growing project ---------- */
const GLOSS = {
  variable: ["variable", "A name that points at a value, like <code>price = 16</code>. You can point the name at a new value later."],
  string: ["string", "Text, written inside quotes: <code>\"Snowline\"</code>. The quotes are how Python tells text apart from names."],
  function: ["function", "A named, reusable set of steps. You define it once with <code>def</code>, then run (\"call\") it as often as you like."],
  parameter: ["parameter", "A blank in a function's definition, like <code>price</code> in <code>def add_vat(price):</code>. It gets filled in each time the function is called."],
  argument: ["argument", "The actual value you pass in when you call a function, like <code>10</code> in <code>add_vat(10)</code>. It fills the parameter's blank."],
  call: ["call", "Running a function. Writing brackets after its name, <code>greet(\"Ruth\")</code>, means \"run it now with these arguments\"."],
  ret: ["return", "How a function hands a value back to the code that called it. <code>return</code> also ends the function."],
  none: ["None", "Python's value for \"nothing here\". A function with no <code>return</code> gives back None."],
  list: ["list", "An ordered collection in square brackets: <code>[16, 12, 20]</code>. Items are numbered from 0."],
  dict: ["dictionary", "Labelled values in curly brackets: <code>{\"title\": \"Snowline\", \"price\": 16}</code>. You look values up by their label (the key)."],
  key: ["key", "The label in a dictionary, like <code>\"title\"</code>. <code>album[\"title\"]</code> gets the value stored under it."],
  index: ["index", "An item's position in a list, counting from 0. <code>albums[0]</code> is the first item."],
  tuple: ["tuple", "Like a list but fixed, written with round brackets: <code>(7, 2)</code>. A one-item tuple needs a trailing comma: <code>(7,)</code>."],
  library: ["library", "Code someone else wrote and packaged up for you to use, like httpx or FastAPI. You install it, then import it."],
  import: ["import", "Loading a library so your file can use it: <code>import httpx</code>."],
  method: ["method", "A function that belongs to a value, called with a dot: <code>title.upper()</code>. The thing before the dot is what it works on."],
  exception: ["exception", "An error that stops the normal flow, like <code>KeyError</code>. Code can raise one on purpose, and catch one with try/except."],
  client: ["client", "The program that sends a request: a phone app, a browser, or your own Python script."],
  server: ["server", "A program that waits for requests and answers them. Your API is a server."],
  request: ["request", "A message from a client to a server: a method, a URL, headers and sometimes a body."],
  response: ["response", "The server's reply: a status code, headers and usually a body."],
  http: ["HTTP", "The rules for how clients and servers talk on the web: the layout of requests and responses. HTTPS is the same thing, encrypted."],
  api: ["API", "A set of URLs (endpoints) that programs, not people, use to get or change data. Your shop's API is how the phone app talks to the shop."],
  endpoint: ["endpoint", "One method plus one path that your API answers, like <code>GET /albums/{id}</code>."],
  url: ["URL", "A web address: <code>https://host/path?query</code>."],
  method_http: ["HTTP method", "The verb of a request: GET (read), POST (create), PUT/PATCH (change), DELETE (remove)."],
  json: ["JSON", "A text format for data that looks almost exactly like Python dictionaries and lists. It's how most APIs send data."],
  status: ["status code", "A three-digit number at the top of every response saying how it went: 2xx fine, 4xx the client's mistake, 5xx the server's fault."],
  header: ["header", "An extra labelled line on a request or response, like <code>Content-Type: application/json</code>."],
  body: ["body", "The main content of a request or response, usually JSON. GET requests normally have none."],
  path_param: ["path parameter", "A part of the URL path that changes, like the <code>7</code> in <code>/albums/7</code>. Written as <code>/albums/{id}</code> in the code."],
  query_param: ["query parameter", "Optional settings after the <code>?</code> in a URL: <code>?genre=jazz&amp;limit=10</code>."],
  api_key: ["API key", "A long secret string that identifies your program to someone else's API. Treat it like a password."],
  env_var: ["environment variable", "A setting stored outside your code, in the system running it. Secrets go here so they never end up in your code or git."],
  timeout: ["timeout", "How long to wait for a reply before giving up."],
  rate_limit: ["rate limit", "A cap on how many requests you can make in a time window. Go over it and you get 429 Too Many Requests."],
  cache: ["cache", "A saved copy of a result, so you don't have to fetch or work it out again for a while."],
  decorator: ["decorator", "A line starting with <code>@</code> just above a function. It hands the function to something else, here FastAPI, to register it for a URL."],
  type_hint: ["type hint", "A label like <code>: int</code> after a parameter saying what kind of value it should be. FastAPI uses hints to convert and check inputs."],
  validation: ["validation", "Checking that incoming data has the right shape and values before you use it."],
  transaction: ["transaction", "A group of database changes that happen all together or not at all (BEGIN … COMMIT)."],
  authn: ["authentication", "Working out who someone is (a login, a token, a key). Fails with 401."],
  authz: ["authorisation", "Working out whether that person is allowed to do this. Fails with 403."],
  token: ["token", "A long random string a server hands out at login. The client sends it with each request to prove who it is."],
  hash: ["hash", "A one-way scramble of data. Passwords are stored as hashes so even you can't read them back."],
  llm: ["LLM", "Large language model: an AI model that takes text in and generates text out. You use one through an API, like any other."],
  ai_tokens: ["tokens (AI)", "The chunks of text a model reads and writes, roughly ¾ of a word each. You pay per token, both in and out."],
  system_prompt: ["system prompt", "Standing instructions for the model (role, rules, tone) sent with every request, separate from the user's message."],
  structured: ["structured output", "Asking the model to reply with data in a fixed shape (usually JSON), so your code can use it."],
  tool: ["tool", "A function you describe to a model. The model can ask your code to run it; your code decides whether to."],
  eval: ["eval", "A set of example inputs plus checks, run against an AI feature to score how often it behaves. The AI version of a test suite."],
  deploy: ["deploy", "Putting a new version of your code onto the server that real users hit."],
  ci: ["CI", "Continuous integration: a service that automatically runs your tests every time you push code."],

 { id: "w-func", title: "Functions, arguments and return", lights: [],

 { id: "w-http", title: "Clients, servers and requests", lights: ["client"],
   intro: `Now the web. When a customer taps "Browse" in Dot's app, their phone sends a request across the internet to a server, and the server replies. That's the whole idea. Let's look at one exchange up close.`,
   steps: [
   { t: "read", html: `<p>A ${g("client")} is the program asking: a phone app, a browser, or your Python script. A ${g("server")} is a program waiting to answer. That's what we're building.</p>
     <p>Every ${g("request")} carries an ${g("method_http", "HTTP method")} (what you want to do), a ${g("url", "URL")} (which thing), ${g("header", "headers")} (extra info) and sometimes a ${g("body")} (data you're sending). Here's a real one. It's just text in a fixed layout:</p>` + H(`
GET /albums/7 HTTP/1.1
Host: api.ferrystreet.shop
Accept: application/json
`) + `<p>And the ${g("response")}: a ${g("status")}, headers, then the body:</p>` + H(`
HTTP/1.1 200 OK
Content-Type: application/json

{"id": 7, "title": "Snowline", "price": 16.0, "stock": 5}
`) },
   { t: "sort", q: `Split this URL into its parts:<br><code>https://api.ferrystreet.shop/albums?genre=jazz&amp;limit=10</code>`, buckets: ["Scheme", "Host", "Path", "Query"], items: [
     [`<code>https</code>`, 0, `The scheme: which protocol to use. The S means it's encrypted.`],
     [`<code>api.ferrystreet.shop</code>`, 1, `The host: which server to send it to.`],
     [`<code>/albums</code>`, 2, `The path: which thing on that server.`],
     [`<code>genre=jazz</code>`, 3, `A query parameter, after the <code>?</code>.`],
     [`<code>limit=10</code>`, 3, `Another query parameter. Multiple ones are joined with <code>&amp;</code>.`]] },
   { t: "read", html: `<p>The main methods:</p><ul>

   { t: "sort", q: `Which method fits?`, buckets: ["GET", "POST", "PATCH", "DELETE"], items: [

   { t: "mcq", q: `Why is a link like <code>GET /albums/7/delete</code> a bad idea?`, opts: [

     [`Everything assumes GET is safe to repeat. Link previews, search crawlers and browser prefetching may "visit" it and delete the album`, true, `Exactly. This has deleted real data. Use DELETE /albums/7, which nothing visits by accident.`],
