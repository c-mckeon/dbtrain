       { from: "p", to: "b", label: "cookie: third-party, often blocked", color: "danger", dash: true, tip: `Safari and Firefox block or partition it by default.` },
       { from: "t", to: "b2", label: "Authorization: Bearer token, always sent", color: "browser", tip: `Cookie rules don't apply to headers your own code adds.` }] }) +
     LEC("Where should a browser keep a token?", `
<p>Once you use a bearer token, your JavaScript has to keep it somewhere. Every option trades one risk for another:</p>` +
     TABLE(["Storage", "Survives reload?", "Readable by injected script?", "Sent automatically (CSRF risk)?", "Notes"], [
       ["localStorage <b>(yours)</b>", "Yes, indefinitely", "Yes", "No", "Simple; the main risk is theft by XSS"],
       ["sessionStorage", "Only in that tab", "Yes", "No", "Same XSS risk, shorter exposure"],
       ["JavaScript memory", "No: lost on reload", "Harder (a script can still use it while the page runs)", "No", "Usually paired with a refresh mechanism"],
       ["HttpOnly cookie", "Yes", "No", "Yes", "Back to cookie rules: needs same-site hosting and CSRF defences"],
       [`${TT("Backend-for-frontend (BFF)", `A small server on the <i>same site</i> as the frontend that holds the tokens itself and gives the browser only a first-party, HttpOnly session cookie. Tokens never reach JavaScript at all. The current IETF recommendation for high-security browser apps.`)}`, "Yes", "No: tokens never reach the browser", "Yes, but first-party and SameSite-protected", "Most secure, most moving parts"]], "Token storage options") +
     MYTH(`An XSS attacker can't do anything if the token is in an HttpOnly cookie.`, `They can't <i>steal</i> it, but while their script runs in your page it can still send requests, and the browser attaches the cookie. HttpOnly limits the damage to the time the page is open; it doesn't remove it. Preventing XSS in the first place is the real fix.`)) },

   { t: "sort", q: `Server-side session cookie or self-contained bearer token in localStorage? Which is each statement true of?`, buckets: ["Session cookie", "Bearer token"], items: [
     [`An injected script on the page could read it and send it elsewhere`, 1, `localStorage is open to any script running on the page.`],
     [`It can be revoked instantly by deleting one record on the server`, 0],
     [`It keeps working when the browser blocks third-party cookies`, 1, `It's a header your code adds.`],
     [`The browser attaches it automatically, which is why cross-site request forgery is a concern`, 0],
     [`It stays valid until it expires, even after the user's account is disabled`, 1, `Unless you add a blocklist, which brings server state back.`],
     [`With several servers, they all need access to the same shared store`, 0]] },

   { t: "read", html: CASE("both at once, and why", `<p>Your backend accepts <b>either</b> credential. A middleware runs on every request: if there's a valid <code>Authorization: Bearer</code> header, it builds the user from the token and skips the session; otherwise it falls back to express-session and the cookie. Desktop browsers that still allow the cookie can use it; phones use the token.</p>
<p>Three consequences follow, each a textbook trade-off:</p>
<ul>
<li><b>Sessions live in memory.</b> express-session's default store is a JavaScript object in the container's RAM. Its own documentation warns it isn't for production: every restart or deploy logs cookie users out, and two replicas would each have their own sessions.</li>
<li><b>Tokens can't be revoked.</b> An 8-hour token stays valid for 8 hours. Changing <code>SESSION_SECRET</code> invalidates every token at once, which is your only "log everyone out" switch.</li>
<li><b>The token is homemade.</b> It uses sound building blocks: standard HMAC-SHA256, a constant-time comparison (<code>timingSafeEqual</code>) that doesn't leak the signature through response timing, and a built-in expiry. But the format, claims and key rotation are your own, so they lack the years of review a standard JWT library has had. "Don't roll your own crypto" is mostly about inventing algorithms, which you didn't do, but custom formats carry some of the same risk.</li></ul>
<p>The structural fix would remove the reason for having two credentials: serve the frontend and backend from <b>one site</b> (say <code>leanlog.app</code> and <code>api.leanlog.app</code>). The cookie becomes first-party, <code>SameSite=Lax</code> works, and phones stop blocking it.</p>`) },

   { t: "mcq", q: `Users on desktop say they're "randomly" logged out a few times a week. Phone users don't have this problem. Which explanation fits your architecture best?`, opts: [
     [`Desktop browsers delete HttpOnly cookies after a few hours, while phones keep them for the full Max-Age`, false, `Browsers keep HttpOnly cookies for their Max-Age like any other. HttpOnly only hides them from JavaScript.`],
     [`Desktop users rely on the session cookie, and sessions live in memory that each deploy or restart wipes`, true, `Yes. The cookie survives, but the session it points to is gone after a restart. Phones use self-contained tokens, which need no server memory. A shared session store (Redis, a database) would fix it.`],
     [`Cognito expires desktop logins sooner than mobile ones, because desktop sessions count as higher risk`, false, `After login your backend doesn't consult Cognito again, so Cognito's settings can't explain mid-session logouts.`],
     [`The bearer token's signature check fails on desktop browsers that handle base64url encoding differently`, false, `Base64url is fully standard, and desktop users mostly aren't using the token anyway.`]] },

   { t: "mcq", q: `You move the frontend to <code>leanlog.app</code> and the backend to <code>api.leanlog.app</code>. What changes for the session cookie?`, opts: [
     [`Nothing: they're still different hostnames, so the browser treats the cookie as third-party as before`, false, `Different hostnames, yes, but the same <i>site</i>. Third-party blocking is about sites, not hostnames.`],
     [`The cookie stops working entirely, because cookies can't be shared between a domain and its subdomains`, false, `Cookies can be scoped to a parent domain, and a cookie for api.leanlog.app works on requests to api.leanlog.app from leanlog.app.`],
     [`It becomes first-party, so phones stop blocking it and SameSite=Lax could replace None`, true, `Exactly. Both are the same site, so the browser no longer treats requests between them as cross-site. That one change could remove the reason for the bearer token.`],
     [`The cookie now needs to be encrypted, because subdomains can read each other's HttpOnly cookies`, false, `HttpOnly blocks JavaScript everywhere, and a cookie with no Domain attribute is only sent to its exact host.`]] },

   { t: "branch", q: `A code review: where does the token live?`, start: "a", nodes: {
     a: { say: `<p>A reviewer comments on your frontend: <i>"Bearer token in localStorage. That's an XSS risk."</i> How do you respond?</p>`, opts: [
       [`Point out that the token is signed with HMAC, so it can't be misused even if a script reads it`, "bad1", ``],
       [`Agree: any script injected into the page could read and send it. Then discuss how to reduce that`, "b", `Owning the trade-off is the strong move.`],
       [`Explain that localStorage is isolated per origin, so other websites can't read it`, "bad3", ``]] },
     bad1: { end: "bad", say: `A signature stops a token being <i>changed</i>, not being <i>used</i>. A stolen token is presented exactly as it is, and it's valid.` },
     bad3: { end: "bad", say: `True, but beside the point. XSS means the attacker's script runs <i>inside your origin</i>, where it reads localStorage as easily as your own code does.` },
     b: { say: `<p>Which set of changes addresses the risk best for an app of this size?</p>`, opts: [
       [`Rename the localStorage key to something random, so attackers' scripts don't know where to look`, "bad2", ``],
       [`Cut XSS openings (safe DOM APIs, pinned scripts, a CSP) and shorten the token's lifetime`, "win", ``],
       [`Encrypt the token with a key stored in the frontend code before saving it to localStorage`, "bad4", ``]] },
     bad2: { end: "bad", say: `An injected script can simply list every key in localStorage. Obscuring the name buys nothing.` },
     bad4: { end: "bad", say: `The key ships in the same JavaScript the attacker's script can read, so it decrypts as easily as your code does. Encryption needs a secret the attacker doesn't have.` },
     win: { end: "good", say: `That's the mature answer: remove the root cause (injection points), limit what an attack can achieve (shorter lifetime), and know the structural option (same-site hosting with HttpOnly cookies, or a BFF) for when the stakes justify the complexity.` } },
     why: `A token in localStorage can be stolen by any script running in the page. Reduce the openings for XSS and the token's lifetime, or move to same-site HttpOnly cookies or a BFF.` },

   { t: "read", html: TERMS([
       ["Session (reference)", "Client holds an id; server looks up the data. Easy logout, needs shared storage."],
       ["Token (value)", "Client holds signed data. No lookup, hard to revoke."],
       ["Refresh token", "Long-lived, revocable credential used to mint short-lived access tokens."],
       ["HttpOnly / Secure / SameSite", "Hide from JS · HTTPS only · control cross-site sending."],
       ["Site vs origin", "Registrable domain vs exact scheme+host+port."],
       ["Third-party cookie", "Belongs to a different site from the page; increasingly blocked."],
       ["BFF", "Same-site server that keeps tokens out of the browser entirely."]]) +
     FURTHER([`MDN: "Using HTTP cookies" and "SameSite cookies".`, `OWASP Cheat Sheet: "Session Management".`, `web.dev: "SameSite cookies explained".`]) }
 ]},

 /* ===================== 6. Browser security model ===================== */
 { id: "u-browser", title: "6. The browser's security model",
   intro: `Your users' browsers enforce a set of rules that decide what one website can do to another. Most web vulnerabilities are either a misunderstanding of these rules or a way around them. We'll cover the same-origin policy, CORS, CSRF, XSS and the defences for each.`,
   steps: [
   { t: "read", html: OBJ([
       `explain the same-origin policy and the attack it prevents`,
       `say precisely what CORS does and doesn't protect`,
       `explain cross-site request forgery and rank its defences`,
       `explain cross-site scripting, its impact, and the layers that prevent it`]) +
     LEC("The same-origin policy", `
<p>Imagine you're logged into your bank in one tab and visit a random blog in another. If the blog's JavaScript could call <code>fetch("https://yourbank.com/accounts")</code> and <i>read the answer</i> (your browser would happily attach your bank cookies), every website could empty every inbox and account. The ${TT("same-origin policy", `Introduced by Netscape in 1995. A page's scripts may freely read data from their own origin, but may not read responses from other origins unless those origins explicitly allow it. It's the web's fundamental isolation boundary.`)}, introduced in 1995, prevents this: a page's scripts can only <b>read</b> responses from their own ${TT("origin", `Scheme + host + port. https://c-mckeon.github.io is one origin; your backend's https URL is another.`)}.</p>
<p>Note the word <i>read</i>. The policy was retrofitted onto a web where pages could always <i>send</i> things cross-site: forms post to other sites, images load from anywhere. So by default, cross-origin requests can often still be <b>sent</b>, but the response can't be <b>read</b>. That gap matters for CSRF below.</p>` +
     LEC("CORS: a controlled exception", `
<p>Your frontend and backend are different origins, so by default your own frontend couldn't read your own API's answers. ${TT("CORS", `Cross-Origin Resource Sharing, standardised around 2014 and now part of the Fetch standard. Lets a server tell browsers which other origins may read its responses, with which methods and headers, and whether credentials are allowed.`)} (Cross-Origin Resource Sharing) lets a server tell the browser: "this other origin may read my responses."</p>
<p>For anything beyond the simplest requests (a JSON body, an Authorization header), the browser first sends a ${TT("preflight", `An automatic OPTIONS request the browser sends before a non-simple cross-origin request, asking "may this origin send this method with these headers?". No body, no user data. If the answer isn't yes, the real request is never sent.`)}: an <code>OPTIONS</code> request asking permission. Here's your backend's answer, word by word (hover anything):</p>` +
     AC({ src: "backend/app.js", from: 162, to: 174, bands: [[163, 166, "valid"], [167, 169, "config"], [170, 172, "resp"]], notes: {
       "'/api'": `Only routes under /api get CORS headers. Login pages are visited directly, so they don't need them.`,
       requestOrigin: `The calling page's origin. The browser sets this header itself, and page JavaScript can't fake it.`,
       "'Origin'": `The request header naming the calling origin.`,
       frontendOrigins: `Your allow-list, read from the FRONTEND_ORIGINS setting.`,
       header: `Sets a response header.`,
       "'Access-Control-Allow-Origin'": `"This origin may read my response." Echoing the specific origin, not <code>*</code>, is required when credentials are allowed.`,
       "'Access-Control-Allow-Credentials'": `Lets the browser send cookies on cross-origin calls and expose the response.`,
       "'true'": `Header value.`,
       "'Access-Control-Allow-Methods'": `Methods allowed cross-origin.`,
       "'GET, POST, PUT, PATCH, DELETE, OPTIONS'": `Every method your API uses.`,
       "'Access-Control-Allow-Headers'": `Request headers a cross-origin page may send.`,
       "'Content-Type, Authorization'": `JSON bodies and the bearer token.`,
       method: `The HTTP method of this request.`,
       "'OPTIONS'": `The preflight.`,
       "204": `"Allowed, nothing more to say."`,
       sendStatus: `Sends a status code with no body.` } }) +
     MYTH(`CORS protects my API from unauthorised callers.`, `CORS is enforced <b>only by browsers</b>, and only to protect <i>users</i> from malicious <i>pages</i>. curl, Postman, scripts and servers ignore it completely. It never replaces authentication. And because simple requests are still <i>sent</i>, it isn't a defence against CSRF either.`))) },

   { t: "sort", q: `True or false?`, buckets: ["True", "False"], items: [
     [`A script on evil.example can't read your API's responses unless your CORS headers allow evil.example`, 0],
     [`A strict CORS allow-list stops someone scripting calls to your API from their laptop`, 1, `Only browsers enforce CORS.`],
     [`The preflight OPTIONS request includes the JSON body of the real request`, 1, `It only asks permission: method and headers.`],
     [`A plain HTML form on another site can submit a POST to your backend, whatever your CORS settings say`, 0, `Simple form posts are sent without a preflight; only reading the response is blocked.`],
     [`Allowing <code>*</code> as the origin is fine when cookies are needed, as long as HTTPS is used`, 1, `Browsers refuse <code>*</code> together with credentials.`],
     [`The Origin header is set by the browser, and page JavaScript can't change it`, 0]] },

   { t: "read", html: LEC("Cross-site request forgery (CSRF)", `
<p>${TT("CSRF", `Cross-Site Request Forgery: a malicious page makes the victim's browser send a request to a site where they're logged in. The browser attaches the victim's cookies automatically, so the target site treats it as genuine. The attacker can't read the response, but the action still happens.`)} exploits the gap the same-origin policy leaves: a malicious page can't <i>read</i> your bank's responses, but it can make your browser <i>send</i> a request, and if the bank uses cookies, the browser attaches them automatically. A hidden form that auto-submits a transfer is the classic example. The attacker never sees the result. They don't need to.</p>
<p>For CSRF to work, three things must all be true:</p>
<ol>
<li>The site authenticates the request using something the browser attaches <b>automatically</b> (cookies, not a header your code adds).</li>
<li>The browser actually <b>sends</b> that cookie on a cross-site request (SameSite=None, or an old browser).</li>
<li>The request can be made <b>without a preflight</b>: a simple form-style POST the server accepts.</li></ol>
<p>Break any one of them and the attack fails. That's why the defences come in layers:</p>` +
     TABLE(["Defence", "Which condition it breaks", "Notes"], [
       ["Bearer tokens instead of cookies", "1", "Attacker pages can't add your Authorization header. Your mobile path is immune for this reason."],
       ["SameSite=Lax or Strict cookies", "2", "Chrome's default since 2020, but cross-site setups like yours often must use None."],
       ["Accept only JSON (reject form encodings)", "3", "A JSON content type forces a preflight, which your CORS allow-list would refuse."],
       ["Check Origin / Sec-Fetch-Site on writes", "all", "The server refuses state-changing requests whose Origin isn't on the allow-list."],
       [`${TT("CSRF tokens", `A random value the server embeds in its own pages and requires on every write. An attacker's page can't read it (same-origin policy), so it can't include it. The traditional defence, built into most server-rendered frameworks.`)}`, "all", "The classic defence for server-rendered forms."]], "CSRF defences") +
     FLAG("risk", "check your own backend against this list", `Go through the three conditions one at a time against your own backend's cookie path: which content types does it parse, and does anything check Origin on writes? The specifics are deliberately kept off this public page. Closing it is a small change from the defence table.`)) },

   { t: "mcq", q: `An attacker's page contains a hidden form that auto-submits a POST to a cookie-authenticated API. The API's CORS policy allows only its own frontend. What happens?`, opts: [
     [`The browser blocks the submission, because CORS forbids cross-origin POSTs that the API hasn't allowed`, false, `CORS blocks <i>reading</i> responses (and preflighted requests). A plain form POST needs no preflight, so it's sent.`],
     [`It's sent with the cookie (if SameSite allows); the reply is unreadable, but the action still happens`, true, `That's CSRF in one sentence. The fix is to break a condition: SameSite cookies, JSON-only parsing, Origin checks, CSRF tokens, or header-based auth.`],
     [`The request arrives without any cookies, because browsers never attach cookies to form submissions`, false, `Form submissions have carried cookies since the 1990s. That's what made CSRF possible in the first place. SameSite now limits it, if it's set.`],
     [`The request fails, because the attacker's page can't know the URL of a private API`, false, `API URLs aren't secrets; they're visible in any frontend's network traffic. Security must never depend on them staying hidden.`]] },

   { t: "read", html: LEC("Cross-site scripting (XSS)", `
<p>${TT("XSS", `Cross-Site Scripting: the attacker gets their JavaScript to run inside your page, in your origin. From there it can do anything your own code can: read localStorage, call your API with the user's credentials, change what's on screen.`)} is the opposite situation: the attacker's script runs <i>inside your origin</i>, so the same-origin policy no longer protects you. It can read localStorage, make API calls as the user, change the page, or capture keystrokes. It typically gets in through:</p>
<ul>
<li><b>Untrusted text inserted as HTML.</b> <code>el.innerHTML = workout.notes</code> turns a note containing <code>&lt;img src=x onerror=…&gt;</code> into running code. <code>el.textContent = workout.notes</code> just displays the characters. Data from users, URLs or APIs is untrusted.</li>
<li><b>Third-party scripts.</b> A script loaded from a CDN runs with full power in your page. In 2024 the <i>polyfill.io</i> domain was sold and began serving malicious code to over 100,000 sites that loaded it.</li></ul>
<p>Defences come in layers again:</p>` +
     LAYERS("XSS defence in depth (hover each layer)", [
       { title: "Prevent", layers: [
         ["Safe DOM APIs (textContent)", "browser", `Insert untrusted data as text, never as HTML. Frameworks such as React and Vue escape by default, which removed whole classes of XSS.`],
         ["Sanitise when HTML is needed", "browser", `If you truly need user-supplied HTML, pass it through a sanitiser such as DOMPurify first.`]] },
       { title: "Contain", layers: [
         ["Content Security Policy", "azure", `A response header listing where scripts may come from. Even if markup is injected, the browser refuses to run scripts the policy doesn't allow. Strong but takes care to roll out.`],
         ["Subresource Integrity + pinned versions", "azure", `<code>&lt;script src=… integrity="sha384-…"&gt;</code> makes the browser refuse a CDN file whose contents changed. Pin exact versions so "latest" can't change under you.`]] },
       { title: "Limit damage", layers: [
         ["HttpOnly cookies", "aws", `Tokens a script can't read can't be taken away for later use.`],
         ["Short token lifetimes", "aws", `A stolen token is only useful until it expires.`]] }]) +
     FLAG("warn", "worth auditing in your frontend", `Your frontend builds much of its interface with <code>innerHTML</code>, and it loads some libraries from public CDNs without pinned versions or integrity hashes. Most of those innerHTML uses insert your own fixed markup, which is fine. The ones to check are those that include text a user typed (exercise names, notes). Switching those to <code>textContent</code>, and pinning CDN scripts with integrity hashes, closes the main openings. Because your token lives in localStorage, XSS is the attack that matters most for your app.`)) },

   { t: "mcq", q: `Your app shows exercise names a user typed. Which change most directly prevents those names becoming running code?`, opts: [
     [`Insert them with <code>textContent</code> (or escape them) instead of building HTML strings with them`, true, `That stops the injection at its source: the browser displays characters and never parses them as markup. A CSP and HttpOnly cookies are valuable extra layers, but they limit damage rather than prevent it.`],
     [`Move the bearer token from localStorage into a cookie, so injected scripts can't find it`, false, `That limits what an injected script can <i>steal</i>, but the script still runs and can still act as the user while the page is open.`],
     [`Tighten the CORS allow-list so only your own frontend's origin can call the backend`, false, `CORS controls which other origins can read your API's responses. XSS runs inside your own allowed origin, so CORS doesn't affect it at all.`],
     [`Validate on the backend that names are under 50 characters before saving them`, false, `Length limits help a little, but short attack strings exist. The fix is how the frontend displays the data.`]] },

   { t: "sort", q: `Match each defence to the threat it primarily addresses.`, buckets: ["CSRF", "XSS", "Neither (it's CORS's job)"], items: [
     [`Requiring a CSRF token or Origin check on every write`, 0],
     [`A Content Security Policy that only allows scripts from your own origin`, 1],
     [`Using textContent instead of innerHTML for user-entered text`, 1],
     [`SameSite=Lax on the session cookie`, 0],
     [`Deciding which other origins' pages may read your API's JSON`, 2],
     [`Subresource Integrity hashes on CDN script tags`, 1, `A tampered CDN file is a route for attacker scripts into your page.`]] },

   { t: "read", html: TERMS([
       ["Same-origin policy", "Pages can only read responses from their own origin."],
       ["CORS", "A server's opt-in letting named origins read its responses. Browser-enforced only."],
       ["Preflight", "The browser's OPTIONS permission check before non-simple requests."],
       ["CSRF", "Another site makes the victim's browser send an authenticated request."],
       ["XSS", "Attacker script runs inside your origin."],
       ["CSP / SRI", "Restrict where scripts may come from · refuse altered CDN files."]]) +
     FURTHER([`PortSwigger Web Security Academy (free): interactive labs on CSRF, XSS and CORS, the best practical resource there is.`, `MDN: "Same-origin policy" and "Cross-Origin Resource Sharing (CORS)".`, `OWASP Cheat Sheets: "Cross-Site Request Forgery Prevention" and "Cross Site Scripting Prevention".`]) }
 ]},

 { sec: "Unit 3 · Running software" },

 /* ===================== 7. Containers ===================== */
 { id: "u-containers", title: "7. Containers",
   intro: `Containers changed how almost all server software is packaged and run, in about ten years. We'll cover the problem they solve, how they actually work (they're not tiny virtual machines), how images are built, and then read your Dockerfile as a professional would review it.`,
   steps: [
   { t: "read", html: OBJ([
       `explain the problem containers solve and how they differ from virtual machines`,
       `describe images, layers, registries, tags and digests`,
       `predict how instruction order affects build speed`,
       `review a Dockerfile against common production practices`]) +
     LEC("\"It works on my machine\"", `
<p>Before containers, deploying meant installing your app onto a server that had its own operating system version, its own installed libraries and its own history of manual changes. The app worked on your laptop and failed in production because some version somewhere was different. Teams wrote long setup documents, and servers slowly drifted apart until nobody knew exactly what was on them.</p>
<p>A ${TT("container image", `A packaged, read-only filesystem holding your app and everything it needs (the OS userland, language runtime, libraries, your code) plus metadata such as which command to run. Built once, run anywhere a container runtime exists.`)} fixes this by packaging the app <i>together with</i> everything it depends on: the operating-system files, the Node.js runtime, your node_modules and your code. The same image runs identically on your laptop, a CI runner and Azure. A ${TT("container", `A running instance of an image: a normal process on the host, isolated so it sees its own filesystem, network and process list, and limited in how much CPU and memory it can use.`)} is a running instance of that image, the way an object is an instance of a class.</p>` +
     TIMELINE("Containers didn't appear from nowhere", [
       ["1979", "Unix <code>chroot</code>: give a process its own view of the filesystem."],
       ["2000–04", "FreeBSD jails and Solaris Zones: fuller isolation."],
       ["2006–08", "Linux cgroups (from Google engineers) and namespaces; LXC combines them."],
       ["2013", "<b>Docker</b> makes it easy: Dockerfiles, layered images, a public registry."],
       ["2015", "The Open Container Initiative standardises image formats; Kubernetes 1.0 released."],
       ["Today", "The default way to ship server software, including yours."]])) },

   { t: "read", html: LEC("Containers are not small virtual machines", `
<p>A ${TT("virtual machine", `Software that imitates a whole computer. A hypervisor gives each VM virtual hardware, and each VM boots its own complete operating system with its own kernel. Strong isolation, but heavy: gigabytes of disk and tens of seconds to start.`)} imitates an entire computer and boots its own operating system, kernel and all. A container is just a normal process on the host, which the host's kernel <i>fences off</i>:</p>` +
     LAYERS("Virtual machines vs containers (hover the layers)", [
       { title: "Virtual machines", layers: [
         ["Your app", "you"], ["Libraries + runtime", "google"], ["Guest OS + its own kernel", "danger", `Every VM carries a full operating system. That's why VMs take tens of seconds to boot and gigabytes of disk.`],
         ["Hypervisor", "github", `Software (or firmware) that carves one physical machine into several virtual ones. Examples: KVM, Hyper-V, VMware ESXi.`], ["Host hardware", "github"]] },
       { title: "Containers", layers: [
         ["Your app", "you"], ["Libraries + runtime", "google", `In your case: Alpine Linux's files, Node 22 and your node_modules. Shipped inside the image.`],
         ["Container runtime", "azure", `Software such as containerd that sets up the isolation and starts the process.`],
         ["Host OS kernel (shared)", "browser", `All containers on a host share one kernel. That's why they start in milliseconds and weigh megabytes, and also why their isolation is weaker than a VM's: a kernel bug can affect every container on the machine.`], ["Host hardware", "github"]] }],
       "Containers share the host's kernel, so they start in milliseconds and are much lighter, but they isolate less strongly than VMs.") + `
<p>The fencing uses two Linux kernel features. ${TT("Namespaces", `Give a process its own view of system resources: its own process list (it thinks it's PID 1), its own network interfaces, its own filesystem mounts, its own hostname. It simply can't see the rest of the machine.`)} control what a process can <i>see</i>: its own files, process list and network. ${TT("cgroups", `Control groups: limit and measure how much CPU, memory and I/O a group of processes may use. This is how a platform enforces "0.5 vCPU, 1 GB memory" for your container.`)} control how much it can <i>use</i>: CPU and memory limits. That's all a container is. Cloud providers that run many customers' containers on shared hardware usually wrap each one in a lightweight VM as well, for stronger isolation.</p>` +
     LEC("Images, layers and registries", `
<p>An image is built from a ${TT("Dockerfile", `A text recipe: each line is an instruction (FROM, COPY, RUN…) that adds a layer to the image.`)}, one instruction at a time. Each instruction that changes files produces a ${TT("layer", `A read-only snapshot of the filesystem changes made by one instruction. Layers are stacked to form the image, shared between images, and cached between builds.`)}, a snapshot of what changed. Layers are cached: when you rebuild, Docker reuses every layer up to the first instruction whose inputs changed, then rebuilds everything after it.</p>
<p>Built images are pushed to a ${TT("registry", `A server that stores and serves images. Docker Hub is the public default; clouds have their own (Azure ACR — yours — AWS ECR, Google Artifact Registry, GitHub's GHCR).`)}, a store for images, and pulled from there wherever they run. Images are named with a ${TT("tag", `A human-readable label such as <code>node:22-alpine</code> or <code>backend:3f9c2e1</code>. Tags are <b>mutable</b>: the owner can point the same tag at a different image later.`)}, which is a movable label, or exactly identified by a ${TT("digest", `A hash of the image's contents, like <code>sha256:9b1c…</code>. It can never point to anything else, so pinning by digest guarantees you get exactly the same bytes.`)}, a hash of its contents that can never change.</p>`)) },

   { t: "read", html: CASE("your Dockerfile, every word", `<p>Fifteen lines that turn your backend folder into an image. Hover any word.</p>` + AC_DOCKER + `<p>And what's deliberately kept out of the build:</p>` + AC_DOCKERIGNORE) },

   { t: "mcq", q: `You swap the two COPY steps, so <code>COPY . .</code> comes first and <code>npm ci</code> runs after it. What changes?`, opts: [
     [`Nothing: Docker works out the dependency order itself, so instruction order only affects readability`, false, `Docker runs instructions strictly in order, and its cache works in order too. That's why order matters so much.`],
     [`The image gets bigger, because npm then installs devDependencies along with production ones`, false, `<code>--omit=dev</code> still applies. Order affects caching, not what npm installs.`],
     [`Every code change now reruns the slow install, since its layer follows one that always changes`, true, `Right. Rebuilding starts at the first changed layer. With your code copied first, every commit invalidates the install. Stable things first, changing things last.`],
     [`The build fails, because npm ci refuses to run in a folder that already holds application code`, false, `npm ci doesn't care what else is in the folder. It only reads package.json and the lockfile.`]] },

   { t: "read", html: LEC("Production practices, and how yours measures up", `
<p>A working Dockerfile and a production-grade one differ in a handful of well-known ways:</p>` +
     TABLE(["Practice", "Why", "Yours"], [
       ["Small, maintained base image", "Less to download, fewer packages with vulnerabilities", "✓ <code>node:22-alpine</code>"],
       ["Install from the lockfile", "Identical dependencies on every build", "✓ <code>npm ci</code>"],
       ["Order for caching", "Fast rebuilds", "✓ dependencies before code"],
       ["Keep secrets out of the build", "Anything copied into a layer can be read by anyone who pulls the image, even if a later layer deletes it", "✓ .dockerignore excludes .env and the key file"],
       ["Run as a non-root user", "Limits the damage if an attacker gets code running in the container", "✗ runs as root: add <code>USER node</code>"],
       ["Start the process directly", "Lets the app receive the platform's shutdown signal and close cleanly", "△ <code>npm start</code> sits between the platform and Node"],
       ["Pin the base image", "Builds don't silently change", "△ the tag moves with every patch release"],
       ["Multi-stage builds", "Build tools stay out of the final image", "Not needed: there's no build step"]], "Dockerfile review") + `
<h4>Signals and graceful shutdown</h4>
<p>When a platform scales down or deploys a new version, it sends the container a ${TT("SIGTERM", `A polite "please shut down" signal. A well-behaved server stops accepting new requests, finishes the ones in flight, closes connections, then exits. If it hasn't exited after a grace period, the platform sends SIGKILL, which ends it instantly.`)} signal and waits a few seconds before killing it outright. A well-behaved server catches the signal, finishes the requests already in progress and exits. When <code>npm</code> is the main process, it has historically not passed signals on reliably, so Node may never hear the request and gets killed mid-request. <code>CMD ["node", "app.js"]</code> avoids the middleman. It's a small detail, and exactly the kind interviewers use to tell people who've run containers in production from people who've only built them.</p>
<h4>Tags vs digests: a trade-off, not a rule</h4>
<p><code>node:22-alpine</code> is a moving tag. Each rebuild picks up the newest Node 22 patch and Alpine fixes: good for security, but a build can change without your code changing. Pinning a digest gives exactly reproducible builds, but then you must update deliberately (tools such as Dependabot or Renovate open the pull requests for you). Most teams pin, and automate the updates.</p>`) },

   { t: "sort", q: `Virtual machine or container? Which is each statement true of?`, buckets: ["Virtual machine", "Container"], items: [
     [`Boots its own operating system kernel`, 0],
     [`Typically starts in well under a second`, 1],
     [`Isolation relies on Linux namespaces and cgroups`, 1],
     [`Stronger isolation, because the hypervisor separates whole operating systems`, 0],
     [`A kernel vulnerability on the host could affect all of them at once`, 1, `They share one kernel.`],
     [`Usually measured in gigabytes, because a full OS is included`, 0]] },

   { t: "mcq", q: `A teammate's Dockerfile does <code>COPY . .</code> then <code>RUN rm .env</code> to "keep the secrets out". Why isn't that safe?`, opts: [
     [`The rm step only runs when the container starts, so the file is still present during the build`, false, `RUN executes during the build, not at start-up. The file is removed from the final view, but that isn't the problem.`],
     [`Removing files inside a container needs root, so the command quietly fails and leaves the file in place`, false, `Builds run as root by default, so the removal works. The problem is what the layer before it captured.`],
     [`The earlier layer still contains .env, and anyone who pulls the image can extract that layer`, true, `Exactly. Layers are additive snapshots, so a later deletion only hides the file. The fix is never to copy it in: .dockerignore, as your backend does.`],
     [`Docker encrypts layers created by COPY, so the secret file becomes unreadable without the build key`, false, `Layers aren't encrypted. They're compressed archives anyone with pull access can unpack.`]] },

   { t: "mcq", q: `Azure scales your app down and the container is told to stop. A user's workout save is half-finished at that moment. What decides whether it completes?`, opts: [
     [`Whether the process receives the shutdown signal and finishes in-flight requests before the grace period ends`, true, `That's graceful shutdown. It needs the signal to reach Node (simplest with <code>node</code> as the main process) and the server to stop accepting new connections while finishing current ones.`],
     [`Whether Firebase is configured to retry writes when the client connection drops partway through`, false, `If your process is killed before it sends the write, Firebase never hears about it. The decision happens in your container.`],
     [`Whether the image was built with <code>NODE_ENV=production</code>, which enables Express's built-in shutdown handling`, false, `NODE_ENV affects Express's error output and caching, not signal handling. Graceful shutdown has to be written or added.`],
     [`Nothing: Azure only stops containers that have had no requests for several minutes, so this can't happen`, false, `Deploys and scale-downs stop replicas that may be busy. Platforms rely on the grace period, not on waiting for silence.`]] },

   { t: "read", html: TERMS([
       ["Image / container", "The packaged filesystem and recipe · a running, isolated instance of it."],
       ["Namespaces / cgroups", "What a process can see · how much it can use."],
       ["Layer", "A cached snapshot per instruction. Order instructions from stable to changing."],
       ["Registry", "Stores and serves images (Docker Hub, ACR, ECR, GHCR)."],
       ["Tag vs digest", "A movable label vs an unchangeable content hash."],
       ["SIGTERM / graceful shutdown", "The polite stop signal, and finishing in-flight work before exiting."]]) +
     FURTHER([`Docker docs: "Dockerfile best practices" and "Multi-stage builds".`, `Snyk's "10 best practices to containerize Node.js web applications with Docker".`, `Julia Evans' zine <i>How Containers Work</i>: a clear, illustrated explanation of namespaces and cgroups.`]) }
 ]},

 /* ===================== 8. Cloud platforms and scaling ===================== */
 { id: "u-cloud", title: "8. Cloud platforms and scaling",
   intro: `"The cloud" covers everything from renting a bare virtual machine to calling a fully managed login service. Knowing where each product sits on that range, and what you're still responsible for, is the core of cloud architecture. Then: what scaling really requires of your code.`,
   steps: [
   { t: "read", html: OBJ([
       `define cloud computing and place services on the IaaS → SaaS spectrum`,
       `explain the shared responsibility model for each level`,
       `compare ways to run a backend like yours, and say why Container Apps fits`,
       `explain horizontal scaling and why it requires stateless servers`]) +
     LEC("What \"cloud\" means", `
<p>Cloud computing is renting computing as a metered service instead of owning machines. The US standards body NIST's 2011 definition lists five traits: <b>on-demand self-service</b> (click or call an API, no human involved), <b>broad network access</b>, <b>resource pooling</b> (many customers share hardware), <b>rapid elasticity</b> (grow and shrink quickly) and <b>measured service</b> (pay for what you use).</p>
<p>AWS started selling storage and virtual machines in 2006, Google launched App Engine in 2008 and Azure opened in 2010. Today, the main design question isn't <i>whether</i> to use the cloud but <b>how much of the work to hand over</b>:</p>` +
     SPECTRUM("Service models: who manages what", "You manage more", "Provider manages more", [
       ["On-premises", "you own the hardware", "github", `You buy machines, rack them, patch everything. Full control, full responsibility.`],
       ["IaaS", "rent VMs: EC2, Azure VMs", "danger", `Infrastructure as a Service. The provider handles hardware and virtualisation; you manage the OS, patches, runtime, app and scaling.`],
       ["CaaS", "run containers: Container Apps, Cloud Run, Fargate", "azure", `Containers as a Service. You supply an image; the platform runs, scales and networks it. You still own what's inside the image. <b>Your backend lives here.</b>`],
       ["PaaS", "push code: App Service, Heroku, Render", "you", `Platform as a Service. You supply code; the platform builds and runs it on runtimes it maintains.`],
       ["FaaS", "functions: Lambda, Azure Functions", "google", `Functions as a Service, or "serverless". You supply individual functions; they run per event and scale to zero automatically.`],
       ["BaaS / SaaS", "whole services: Cognito, Firebase, GitHub", "aws", `Backend / Software as a Service. You configure and call a finished product. Cognito, Firebase and GitHub Pages are here.`]]) + `
<p>Your system spans nearly the whole spectrum: CaaS for the backend, BaaS for identity and data, SaaS for code hosting, CI and static hosting. That's typical of modern small systems: build only what's specific to you, and rent everything else.</p>`) },

   { t: "read", html: LEC("The shared responsibility model", `
<p>Every cloud provider publishes a ${TT("shared responsibility model", `The provider is responsible for security "of" the cloud (data centres, hardware, the virtualisation layer, their managed services); you're responsible for security "in" the cloud (your code, configuration, data, identities and access). Where the line falls depends on the service level.`)}: the provider secures the cloud itself, and you secure what you put in it. The higher up the spectrum, the more the provider takes on, but some things are <b>always yours</b>:</p>` +
     LAYERS("Who is responsible? (hover the layers)", [
       { title: "Virtual machine (IaaS)", layers: [
         ["Your data & access settings", "you"], ["Your code & dependencies", "you"], ["Runtime (Node)", "you"], ["Operating system & patches", "you"], ["Virtualisation & hardware", "azure"]] },
       { title: "Container Apps (CaaS)", layers: [
         ["Your data & access settings", "you"], ["Your code & dependencies", "you"], ["Runtime + base image (inside your image)", "you", `Because the image is yours, so is keeping Node and Alpine patched: rebuild regularly.`], ["Host OS, Kubernetes, scaling, TLS", "azure", `Azure patches the machines and the orchestration layer your container runs on.`], ["Virtualisation & hardware", "azure"]] },
       { title: "Managed service (Cognito)", layers: [
         ["Your data & access settings", "you", `Even fully managed: you choose password policies, MFA, allowed redirect URLs and who can administer the pool.`], ["Service software", "aws"], ["Runtime & OS", "aws"], ["Infrastructure", "aws"]] }],
       "Purple is yours, blue/orange is the provider's. Data, identities and access settings are always yours.") +
     MYTH(`It's in the cloud, so the provider handles security.`, `Most cloud breaches aren't the provider being hacked. They're customers' misconfigurations: public storage buckets, leaked keys, admin rights granted too widely. The provider secures the building; you're responsible for locking your own door.`)) },

   { t: "sort", q: `On Azure Container Apps, who is responsible for each of these?`, buckets: ["You", "Azure"], items: [
     [`Patching the Linux machines your containers run on`, 1],
     [`Updating vulnerable packages in your node_modules`, 0],
     [`Rebuilding the image to pick up Node and Alpine security fixes`, 0, `The base image is inside your image, so it's your job.`],
     [`Issuing and renewing the TLS certificate for the default domain`, 1],
     [`Deciding the minimum and maximum number of replicas`, 0],
     [`Physical security of the data centre`, 1]] },

   { t: "read", html: LEC("Ways to run a backend like yours", `
<p>An Express server could run in many places. Each option is a different point on the control-versus-convenience trade-off:</p>` +
     TABLE(["Option", "You manage", "Scales to zero?", "Good for", "Trade-off"], [
       ["Virtual machine", "OS, patches, process manager, TLS, scaling", "No", "Full control, steady load", "Most operations work"],
       ["App Service / Heroku / Render (PaaS)", "Code and config", "Some tiers", "Simple web apps", "Less control over the runtime"],
       ["<b>Container Apps</b> / Cloud Run / App Runner (CaaS)", "The image and config", "Yes", "Containerised web apps and APIs", "Cold starts at zero; some platform-specific concepts"],
       ["Kubernetes (AKS, EKS, GKE)", "Cluster config, deployments, networking, upgrades", "Not by default", "Many services and teams; complex needs", "Steep learning curve; a lot of operations"],
       ["Functions (Lambda, Azure Functions)", "Individual functions", "Yes", "Event-driven tasks, bursty traffic", "Execution limits; long-lived Express apps need adapting"]], "Hosting options for a containerised API") + `
<p>Azure Container Apps is itself built on ${TT("Kubernetes", `An open-source system, originally from Google (2014), for running containers across many machines: it schedules them, restarts failures, scales, and routes traffic. Powerful, and famously complex.`)}, the industry-standard container orchestrator, with ${TT("KEDA", `Kubernetes Event-Driven Autoscaling: scales workloads by events such as HTTP traffic or queue length, including down to zero.`)} for autoscaling and ${TT("Envoy", `A high-performance proxy that sits in front of services, terminating TLS and routing traffic. Used by Container Apps for its ingress.`)} handling incoming traffic. You get much of Kubernetes' power without operating a cluster. Knowing that is useful: concepts such as revisions, ingress and replicas carry straight over if you ever work with Kubernetes directly.</p>` +
     ARCH({ w: 760, h: 300, title: "Inside Azure Container Apps", nodes: [
       { id: "u", x: 10, y: 120, w: 120, h: 56, label: "Internet", sub: "HTTPS requests", color: "browser", tip: `Browsers calling your backend.` },
       { id: "ing", x: 170, y: 120, w: 140, h: 56, label: "Ingress (Envoy)", sub: "TLS ends here", color: "azure", tip: `Holds the certificate, decrypts HTTPS, and forwards plain HTTP to port 3000 on a replica, adding <code>X-Forwarded-Proto: https</code>. That's why your code sets <code>trust proxy</code>: so Express believes the request was secure and will set Secure cookies.` },
       { id: "r1", x: 380, y: 60, w: 160, h: 50, label: "Replica 1", sub: "a running container", color: "azure", tip: `One running copy of your image, with its own memory.` },
       { id: "r2", x: 380, y: 186, w: 160, h: 50, label: "Replica 2 (when scaled)", sub: "separate memory", color: "danger", tip: `A second copy starts with <b>empty memory</b>. Anything replica 1 kept in RAM is unknown here.` },
       { id: "acr", x: 600, y: 20, w: 150, h: 56, label: "Registry (ACR)", sub: "images by commit SHA", color: "azure", tip: `Each revision runs one exact image.` },
       { id: "sec", x: 600, y: 220, w: 150, h: 56, label: "Secrets + env vars", sub: "app configuration", color: "aws", tip: `Injected into every replica at start-up (Lecture 10).` }],
     edges: [{ from: "u", to: "ing", label: "HTTPS" }, { from: "ing", to: "r1", label: "HTTP :3000" }, { from: "ing", to: "r2", label: "HTTP :3000", dash: true }, { from: "acr", to: "r1", label: "image", dash: true }, { from: "sec", to: "r2", label: "env", dash: true }, { from: "sec", to: "r1", label: "env", dash: true }] })) },

   { t: "read", html: LEC("Scaling: up, out, and the stateless rule", `
<p>There are two ways to handle more load. ${TT("Vertical scaling", `"Scaling up": give the one server more CPU and memory. Simple, needs no code changes, but has a ceiling and still leaves one point of failure.`)} gives one server more CPU and memory: simple, but limited, and still one point of failure. ${TT("Horizontal scaling", `"Scaling out": run more copies (replicas) behind a load balancer. No hard ceiling, survives a copy failing, but only works if any copy can serve any request.`)} runs more copies behind a load balancer: no real ceiling, and one copy failing doesn't take the service down. Cloud platforms are built around scaling out.</p>
<p>But scaling out has one strict requirement: <b>any replica must be able to serve any request</b>. That means no important state may live in a single replica's memory. Servers like this are called ${TT("stateless", `The server keeps nothing between requests that another copy would need. State lives in shared stores (database, cache) or in the request itself (a signed token). Stateless servers can be added, removed and restarted freely.`)}: state lives in shared stores (a database, a cache such as ${TT("Redis", `An extremely fast in-memory data store, used everywhere for sessions, caches, rate-limit counters and queues. Managed versions exist on every cloud.`)}) or travels inside the request (a signed token).</p>` +
     CASE("what breaks at two replicas", `<p>Two things in your backend live only in one process's memory: the <b>express-session store</b> and the <b>one-time login codes</b> (the <code>authCodes</code> Map). With two replicas, a user's callback can land on replica 1, which stores the code, while the frontend's <code>POST /api/token</code> lands on replica 2, which has never heard of it. Login fails, intermittently. Your signed tokens, by contrast, are already stateless: either replica can verify them, because both have the same secret.</p>
<p>Platforms offer ${TT("session affinity", `Also called sticky sessions: the load balancer sends a given client to the same replica each time, usually using a cookie. It hides state problems until a replica restarts or is removed.`)} ("sticky sessions") as a workaround, sending each client back to the same replica. It helps until a replica restarts or scales away, and then the state is lost anyway. The real fix is a shared store.</p>`) +
     LEC("Scale to zero and cold starts", `
<p>Platforms such as Container Apps can run <b>zero</b> replicas when there's no traffic, and you pay nothing for compute. The first request then waits for a ${TT("cold start", `The delay while the platform pulls your image (if not cached), starts a container and waits for your app to be ready. Seconds for a small Node app. Smaller images and faster start-up shorten it.`)}: pulling the image, starting the container, booting Node. Setting a minimum of one replica removes cold starts for a small, constant cost. It's a classic cost-versus-latency trade-off, and the right answer depends on whether a slow first request matters to your users.</p>`)) },

   { t: "mcq", q: `You set your Container App to 3 replicas for reliability. Which part of your app is the first to show intermittent failures?`, opts: [
     [`Saving workouts, because three replicas writing to Firebase at once corrupt each other's data`, false, `Firebase handles concurrent writes from many clients routinely, and your saves are per-user with an idempotency key.`],
     [`Logging in, because the one-time codes live in one replica's memory and the next request may hit another`, true, `Right. The code is stored in whichever replica handled the callback; the token exchange that follows may land elsewhere. A shared store (Redis, or even the database) fixes it.`],
     [`CORS, because each replica keeps its own copy of the origin allow-list and they gradually drift apart`, false, `All replicas read the same FRONTEND_ORIGINS setting at start-up. Configuration doesn't drift.`],
     [`Bearer-token checks, because tokens signed by one replica can't be verified by another`, false, `Every replica has the same SESSION_SECRET, so any of them can verify any token. That part is already stateless.`]] },

   { t: "branch", q: `Choosing your scaling settings`, start: "a", nodes: {
     a: { say: `<p>You're paying for one always-on replica, and the app has around 20 users, mostly in the evenings. A friend says "set the minimum to zero, it's free when idle". What's the main thing you're trading?</p>`, opts: [
       [`Data safety: Azure deletes the container's storage when it scales to zero`, "bad1", ``],
       [`Latency: the first request after a quiet period waits for a cold start`, "b", ``],
       [`Security: replicas started from zero skip the ingress and its HTTPS`, "bad1b", ``]] },
     bad1: { end: "bad", say: `Your data is in Firebase, not the container. (That's the point of stateless containers: losing one costs nothing.) What scale-to-zero costs is a slow first request.` },
     bad1b: { end: "bad", say: `Every replica sits behind the same ingress, however it was started. The trade is latency: a cold start on the first request.` },
     b: { say: `<p>You go to zero. Users now complain that the <i>first</i> login of the evening sometimes fails outright, not just slowly. Most likely reason?</p>`, opts: [
       [`Cognito rejects logins coming from replicas that have only just started`, "bad2", ``],
       [`A replica stopping mid-login takes the in-memory session and one-time code with it`, "win", ``],
       [`Zero replicas means the app has no TLS certificate until the first request has finished`, "bad3", ``]] },
     bad2: { end: "bad", say: `Cognito has no idea how old your replica is. Look at what your own process keeps in memory, and what happens when that process stops between steps of a flow.` },
     bad3: { end: "bad", say: `TLS ends at the ingress, which is always running. Certificates don't depend on your replicas.` },
     win: { end: "good", say: `Exactly. If the platform scales to zero between the start of a login and its end, the session and one-time code vanish with the replica. It's the same root cause as multiple replicas: state in process memory. Fix that, and both scale-to-zero and scale-out become safe.` } },
     why: `Scale-to-zero trades a cold start for cost. Any state kept in process memory is lost whenever a replica stops, which is why stateless servers are the foundation of cloud scaling.` },

   { t: "read", html: TERMS([
       ["IaaS / CaaS / PaaS / FaaS / SaaS", "How much of the stack you hand over, from VMs to finished products."],
       ["Shared responsibility", "Provider secures the cloud; you secure your code, configuration, data and access."],
       ["Kubernetes", "The standard container orchestrator; Container Apps hides it from you."],
       ["Vertical / horizontal scaling", "A bigger server vs more servers."],
       ["Stateless server", "Keeps nothing that another replica would need."],
       ["Session affinity", "Sticky routing to one replica: a patch, not a design."],
       ["Cold start", "Delay starting a replica from zero."]]) +
     FURTHER([`NIST SP 800-145, "The NIST Definition of Cloud Computing" (two pages).`, `Microsoft Learn: "Azure Container Apps overview" and "Scaling in Azure Container Apps".`, `The Twelve-Factor App (12factor.net), factor VI "Processes": why processes should be stateless.`]) }
 ]},

 { sec: "Unit 4 · Delivery" },

 /* ===================== 9. CI/CD ===================== */
 { id: "u-cicd", title: "9. Continuous integration and delivery",
   intro: `How code gets from your laptop to users is now as much a part of a system's design as the code itself. We'll cover where CI/CD came from, what a mature pipeline contains, how teams release safely, and then compare your two workflows against all of it.`,
   steps: [
   { t: "read", html: OBJ([
       `distinguish continuous integration, continuous delivery and continuous deployment`,
       `list the stages of a mature pipeline and what each one catches`,
       `compare release strategies: rolling, blue-green, canary, feature flags`,
       `explain GitHub Actions' building blocks and its main supply-chain risk`]) +
     LEC("Where CI/CD came from", `
<p>In the 1990s, developers often worked separately for weeks or months, then tried to merge everything before a release. The merge would explode with conflicts and bugs nobody could trace: "integration hell". Releases were rare, manual events, often with a weekend set aside for them.</p>` +
     TIMELINE("From integration hell to deploying many times a day", [
       ["Late 1990s", "Extreme Programming popularises <b>continuous integration</b>: merge daily, build and test automatically."],
       ["2000–06", "Martin Fowler's \"Continuous Integration\" article spreads the practice."],
       ["2009", "The <b>DevOps</b> movement: developers and operations share responsibility for running software."],
       ["2010", "<i>Continuous Delivery</i> (Humble &amp; Farley): every change should be releasable."],
       ["2018", "<i>Accelerate</i> shows, with data, that frequent small releases go with <i>fewer</i> failures."],
       ["2019", "GitHub Actions launches, bringing CI/CD into the repository itself."]]) + `
<p>The counter-intuitive finding behind all of this: <b>releasing more often is safer</b>, not riskier. Small changes are easy to review, easy to test and easy to roll back, and when one breaks, you know exactly which change did it. The research programme behind <i>Accelerate</i> (DORA) measures delivery with four numbers you'll hear in interviews: ${TT("the four DORA metrics", `Deployment frequency (how often you release), lead time for changes (commit to production), change failure rate (what share of releases cause problems), and time to restore service (how quickly you recover). High performers do well on all four at once.`)}.</p>` +
     LEC("Three terms that get blurred", `
<p>${TT("Continuous integration (CI)", `Everyone merges small changes into the main branch frequently, and every change is automatically built and tested, so problems surface within minutes.`)}: every change is merged often and automatically built and tested.<br>
${TT("Continuous delivery", `Every change that passes the pipeline is releasable at any moment. Releasing is a deliberate button press, not a project.`)}: every change that passes the pipeline <i>could</i> be released at the press of a button.<br>
${TT("Continuous deployment", `Every change that passes the pipeline goes to production automatically, with no human step.`)}: every change that passes goes to production automatically.</p>
<p>Continuous deployment only works safely when the pipeline really checks things. Without automated tests, "passes the pipeline" just means "it compiled".</p>`)) },

   { t: "read", html: LEC("Anatomy of a mature pipeline", `
<p>Here's what a well-developed pipeline for an app like yours could look like. Stages in green exist in your workflows; grey ones don't yet.</p>` +
     FLOW("A mature pipeline (hover each stage)", [
       ["Pull request", "change proposed", "#8b949e", `Work happens on a branch. Opening a PR triggers the checks <i>before</i> anything reaches main. Your workflows run only after pushing to main.`],
       ["Lint + test", "fast feedback", "#8b949e", `Static checks and automated tests. The single biggest gap in most hobby pipelines, including yours.`],
       ["Security scan", "dependencies, secrets", "#8b949e", `Dependency audits (npm audit, Dependabot), secret scanning, image scanning for known vulnerabilities.`],
       ["Build artifact", "image tagged by SHA", "browser", `✓ Yours: docker build, tagged with the commit SHA. Build once; the same artifact goes everywhere.`],
       ["Deploy to staging", "a production-like copy", "#8b949e", `A second environment where the new version runs against test data first.`],
       ["Verify", "smoke tests, health checks", "#8b949e", `Automated checks that the deployed version actually answers correctly.`],
       ["Deploy to production", "the release", "browser", `✓ Yours: az containerapp update, and the frontend pushed to LeanLog.`],
       ["Monitor + roll back", "watch, then react", "#8b949e", `Alerts on error rates; a fast path back to the previous version.`]],
       "Green = in your pipeline today. Grey = common next steps.") +
     LEC("Releasing safely", `
<p>Even with good tests, some problems only show up with real traffic. Release strategies limit how many users a bad version can hurt:</p>` +
     TABLE(["Strategy", "How it works", "Rollback", "Cost"], [
       ["Recreate", "Stop the old version, start the new one", "Redeploy the old one (with downtime)", "Downtime on every release"],
       [`${TT("Rolling", `Replace replicas one at a time, so some old and some new run together for a while. The default on most platforms, including Container Apps in single-revision mode.`)}`, "Replace replicas a few at a time", "Roll forward or back gradually", "Old and new versions briefly run side by side"],
       [`${TT("Blue-green", `Run the new version (green) fully alongside the old (blue), test it, then switch all traffic at once. Switching back is instant.`)}`, "Run old and new side by side, then switch all traffic", "Instant: switch back", "Double the resources during the switch"],
       [`${TT("Canary", `Send a small percentage of traffic (say 5%) to the new version, watch the error rates, and increase gradually. Named after canaries in coal mines.`)}`, "Send a small share of traffic to the new version first", "Shift the traffic back", "Needs good monitoring to judge it"],
       [`${TT("Feature flags", `Ship new code switched off, and turn it on for chosen users at runtime. Separates deploying code from releasing features.`)}`, "Deploy code switched off; turn it on per user at runtime", "Flip the flag", "Flag management, and old flags pile up"]], "Release strategies") + `
<p>Container Apps supports several of these: each deployment creates a new ${TT("revision", `An immutable snapshot of your app's image and configuration. Container Apps can keep several revisions and split traffic between them by percentage, which makes blue-green and canary releases possible.`)}, and in multiple-revision mode you can split traffic between revisions by percentage. Because your images are tagged with commit SHAs, "roll back" just means pointing traffic at the previous revision, or redeploying the previous SHA.</p>`)) },

   { t: "sort", q: `Continuous integration, continuous delivery or continuous deployment? Which practice does each describe?`, buckets: ["Continuous integration", "Continuous delivery", "Continuous deployment"], items: [
     [`Every change that passes the checks goes live with no human step`, 2],
     [`Developers merge into main at least daily and every merge is built and tested`, 0],
     [`The release is a button press that could happen at any moment`, 1],
     [`Your workflows: every push to main deploys straight to production`, 2, `Continuous deployment, though without a test stage.`],
     [`A failing test blocks a pull request from being merged`, 0],
     [`A product manager chooses when to ship an already-tested build`, 1]] },

   { t: "read", html: LEC("GitHub Actions' building blocks", `
<p>A ${TT("workflow", `A YAML file in .github/workflows describing an automated process: when it runs (triggers) and what it does (jobs made of steps).`)} is a YAML file in <code>.github/workflows/</code>. It has ${TT("triggers", `The events that start a workflow: push, pull_request, a schedule (cron), a manual button (workflow_dispatch), a release, and many more. Triggers can be filtered by branch and by which file paths changed.`)} (<code>on:</code> push, pull_request, schedule…), one or more ${TT("jobs", `Groups of steps that run on one machine. Jobs run in parallel unless one declares it needs another.`)} that each run on a fresh ${TT("runner", `The virtual machine that executes a job. GitHub-hosted runners are wiped after every job, so nothing leaks between runs.`)} machine, and ${TT("steps", `Individual commands (run:) or reusable actions (uses:) executed in order within a job.`)} that either run shell commands or use published ${TT("actions", `Reusable steps published in repositories, like actions/checkout or azure/login. You run someone else's code with access to your job's secrets, so they deserve the same scrutiny as any dependency.`)}. Here's your backend workflow (hover anything):</p>` + AC_DEPLOY) },

   { t: "read", html: LEC("The supply-chain risk in <code>uses:</code>", `
<p>Every <code>uses: someone/action@v4</code> runs someone else's code inside your pipeline, with access to your secrets and your cloud login. And <code>@v4</code> is a <b>tag</b>, which the action's owner (or whoever compromises their account) can move to different code at any time.</p>
<p>This isn't hypothetical. In March 2025, the popular <i>tj-actions/changed-files</i> action, used by over 20,000 repositories, was compromised: its tags were moved to a malicious commit that printed the pipeline's secrets into the build logs, which are public for public repositories. Repositories that had <b>pinned the action to a full commit SHA</b> (<code>uses: tj-actions/changed-files@a1b2c3…</code>) were unaffected, because a commit SHA can't be moved.</p>
<p>The usual policy: pin third-party actions to commit SHAs (tools like Dependabot keep them updated), trust official ones (<code>actions/*</code>, your cloud provider's) more, and give each workflow only the ${TT("permissions", `The <code>permissions:</code> block limits what the job's automatic GITHUB_TOKEN can do. Least privilege: grant only what the job needs.`)} it needs. Your backend workflow already restricts its permissions to <code>id-token: write</code> and <code>contents: read</code>, which is good practice.</p>` +
     CASE("your frontend workflow", `<p>The frontend workflow builds with Vite and then pushes the result into a <i>different</i> repository (LeanLog) using a personal access token:</p>` + AC_DEPLOYFE + `
<p>It works, and it's a common pattern, but compare it with the alternatives:</p>` +
     TABLE(["Approach", "Credential needed", "Notes"], [
       ["Push into another repo with a PAT <b>(yours)</b>", "A personal access token stored as a secret", "Simple. A classic PAT can act as <i>you</i> on many repos; <code>rsync --delete</code> removes anything added to LeanLog by hand."],
       ["Fine-grained PAT or deploy key", "Token limited to LeanLog only", "Same flow, much smaller blast radius if the secret leaks."],
       ["GitHub Pages deploy action", "None beyond the workflow's own token", "<code>actions/deploy-pages</code> publishes a build artifact straight to Pages; no second repo needed."]], "Publishing the frontend")) +
     FLAG("warn", "both workflows run on every push", `Neither workflow filters by changed paths, so a README edit rebuilds and redeploys both the backend and the frontend. Adding <code>paths: ['backend/**']</code> and <code>paths: ['frontend/**']</code> under each <code>push:</code> trigger makes each workflow run only when its own half changes. That means faster feedback, fewer needless releases, and less risk.`)) },

   { t: "mcq", q: `A bad commit reaches production and every save fails. Given how your pipeline tags and deploys images, what's the fastest safe recovery?`, opts: [
     [`Revert the commit in git and wait for both workflows to rebuild and redeploy everything from scratch`, false, `That works, but it's the slow path: a full build while users wait. And if the revert itself goes wrong, you're still down.`],
     [`Point the Container App back at the previous image tag, then fix the bug properly at your own pace`, true, `Right. The previous SHA-tagged image is still in the registry and known to work. Restoring service first and diagnosing second is the standard order. (Frontend changes would need their own rollback in LeanLog.)`],
     [`Rebuild the previous commit locally with Docker and push it to the registry tagged <code>latest</code>`, false, `Rebuilding risks a different result (moving base-image tags, a different machine), and "latest" isn't what Container Apps is running anyway.`],
     [`Restart the Container App, since a fresh replica clears whatever bad state the new version created`, false, `A restart runs the same broken image again. The fault is in the code, not in runtime state.`]] },

   { t: "mcq", q: `Why does pinning <code>uses: some/action@&lt;full commit SHA&gt;</code> protect you where <code>@v3</code> doesn't?`, opts: [
     [`GitHub scans pinned actions for malware before each run, while tagged versions skip the scan`, false, `GitHub doesn't scan actions differently based on how they're referenced.`],
     [`A commit SHA identifies exact code that can't be changed, while a tag can be moved to new code at any time`, true, `Exactly the tj-actions lesson. A tag is a pointer anyone with write access can move; a commit SHA is a hash of the content itself.`],
     [`SHA references run in an isolated sandbox without access to the workflow's secrets`, false, `Pinned or not, an action runs with the same access. Pinning controls <i>which code</i> runs, not what it can reach.`],
     [`Tags are only checked out once a day, so a fix to an action can take hours to reach your workflow`, false, `Tags resolve on every run. That's precisely why a moved tag takes effect immediately.`]] },

   { t: "order", q: `Put the stages of a mature pipeline in order.`, items: [
     `A pull request is opened with the change`,
     `Lint and automated tests run against the branch`,
     `After merge, one artifact is built and tagged with the commit SHA`,
     `That artifact is deployed to a staging environment and smoke-tested`,
     `The same artifact is promoted to production, perhaps as a canary`,
     `Error rates are monitored, with rollback ready`] },

   { t: "read", html: TERMS([
       ["CI", "Merge often; build and test every change automatically."],
       ["Continuous delivery / deployment", "Always releasable · released automatically."],
       ["Artifact", "The built output (your image), built once and promoted unchanged."],
       ["Rolling / blue-green / canary", "Replace gradually · switch all at once · test on a slice."],
       ["Feature flag", "Deploy code switched off; release by flipping it on."],
       ["DORA metrics", "Deploy frequency, lead time, change failure rate, time to restore."],
       ["Pin to SHA", "Reference third-party actions by unchangeable commit."]]) +
     FURTHER([`<i>Accelerate</i>, Forsgren, Humble &amp; Kim: the research on delivery performance.`, `GitHub Docs: "Security hardening for GitHub Actions".`, `Search: "tj-actions changed-files incident" for the full write-ups.`]) }
 ]},

 /* ===================== 10. Secrets and configuration ===================== */
 { id: "u-secrets", title: "10. Secrets, configuration and machine identity",
   intro: `Every system has values that differ between environments, and some that would be disastrous to leak. How you separate, store, scope and rotate them is one of the most practical skills in cloud work. We'll also cover how machines prove their identity to each other, which your deploy pipeline does in the modern way.`,
   steps: [
   { t: "read", html: OBJ([
       `separate code, configuration and secrets, and explain why`,
       `compare ways of storing secrets and the ways they leak`,
       `explain workload identity federation and why it beats stored keys`,
       `assess a secret's blast radius and plan for rotation`]) +
     LEC("Code, configuration, secrets", `
<p>In 2011, engineers at Heroku published <i>The Twelve-Factor App</i>, a set of rules for building cloud software. Factor III says: <b>store configuration in the environment</b>. The test: could you open-source the code right now without exposing anything? If yes, configuration is properly separated.</p>
<p>The reason goes beyond security. One image should run unchanged in development, staging and production, with only its ${TT("environment variables", `Named values the operating system gives a process when it starts, read in Node as <code>process.env.NAME</code>. The standard way to pass configuration into containers.`)} differing. That's what lets the pipeline "build once, deploy many".</p>
<p>Within configuration, separate what's <b>sensitive</b> from what's merely <b>specific</b>:</p>` +
     TABLE(["Kind", "Examples in your app", "If it leaked"], [
       ["Public by design", "Cognito client id and issuer, the backend URL, Firebase database URL", "Nothing. These appear in browsers' traffic anyway."],
       ["Configuration", "FRONTEND_ORIGINS, redirect URIs, NODE_ENV", "Nothing, but a wrong value breaks things."],
       ["Identifiers", "Azure client, tenant and subscription ids used by your workflow", "Little on their own: they say <i>which</i> identity, not how to prove it."],
       ["Secrets", "SESSION_SECRET, Cognito client secret, Firebase service account key, the LeanLog PAT", "Serious: each grants real power (next section)."]], "Not every setting is a secret") +
     MYTH(`I can hide an API key in the frontend by putting it in an environment variable at build time.`, `Build tools like Vite copy <code>VITE_</code> variables <i>into the JavaScript bundle</i>, which every visitor downloads. Anything the browser needs, the user can read. Real secrets belong on the server, and the browser should call the server.`)) },

   { t: "read", html: LEC("Where secrets live, and how they leak", `
<p>From least to most mature:</p>` +
     TABLE(["Storage", "Example", "Strengths", "Weaknesses"], [
       ["Hard-coded in source", "<code>const secret = 'abc'</code>", "None", "In git history forever; everyone with repo access has it"],
       ["<code>.env</code> file, git-ignored", "Your local setup", "Fine for local development", "Copied around by hand; easy to commit by accident"],
       ["Platform secret settings", "Container App secrets, GitHub Actions secrets <b>(yours)</b>", "Encrypted, access-controlled, injected at runtime", "Scattered across platforms; manual rotation"],
       [`${TT("Dedicated secret manager", `A service built for secrets: Azure Key Vault, AWS Secrets Manager, Google Secret Manager, HashiCorp Vault. Central storage, fine-grained access, audit logs of every read, versioning and automated rotation.`)}`, "Azure Key Vault, AWS Secrets Manager, HashiCorp Vault", "Central, audited, versioned, rotation support", "Another service to set up"],
       ["No secret at all", "Managed identities, OIDC federation (below)", "Nothing to leak or rotate", "Only works where the platforms support it"]], "Secret storage, from worst to best") + `
<p>Secrets leak through predictable routes:</p>
<ul>
<li><b>Git history.</b> Deleting a committed secret in a later commit doesn't remove it from history. Bots scan public GitHub continuously, and leaked cloud keys are often abused within minutes. GitHub's secret scanning and push protection catch many common formats.</li>
<li><b>Image layers</b>, as in Lecture 7.</li>
<li><b>Logs and error messages</b> that print a configuration object, a request header or a connection string.</li>
<li><b>Frontend bundles</b>, as in the misconception above.</li>
<li><b>CI logs</b>, as in the tj-actions attack.</li></ul>
<p>When a secret leaks, the order is always: <b>revoke or rotate it first</b>, then clean up, then investigate. Removing it from git is the least urgent step, because once it's been exposed you have to assume someone already has a copy.</p>`) },

   { t: "sort", q: `How sensitive is each of these values?`, buckets: ["Secret: must never leak", "Fine to be public"], items: [
     [`The Cognito client id`, 1, `It's in the login redirect URL that every user's browser sees.`],
     [`The session secret that signs your tokens`, 0, `With it, anyone could forge a token for any user.`],
     [`The list of allowed frontend origins`, 1],
     [`The Firebase service account JSON`, 0, `Full admin access to the database, bypassing all rules.`],
     [`A Firebase web config "apiKey"`, 1, `It only identifies the project; security rules decide access.`],
     [`The personal access token used to push to LeanLog`, 0]] },

   { t: "read", html: LEC("Machine identity: proving who a program is", `
<p>People log in with passwords and MFA. But your pipeline also needs to log into Azure, and your backend into Firebase. How does a <i>program</i> prove who it is?</p>
<p>The traditional answer is a long-lived key: a service-principal password, an access key, a service-account JSON file. It works, but it's a secret that can leak, must be rotated by hand, and usually stays valid for months or years.</p>
<p>The modern answer is ${TT("workload identity federation", `Instead of a stored key, the workload presents a short-lived token signed by a platform the cloud already trusts (GitHub, Kubernetes, another cloud). The cloud checks the signature and specific claims (which repo, which branch) and issues temporary credentials. There's no long-lived secret anywhere.`)}: the platform running your code (GitHub Actions, Kubernetes, another cloud) issues a short-lived, signed token describing the workload, such as "repository your-account/your-repo, branch main". The cloud is configured to trust that issuer and those exact claims, and swaps the token for temporary credentials. There's nothing stored to steal.</p>` +
     ARCH({ w: 760, h: 250, title: "Two ways your systems authenticate", legend: [["browser", "No stored secret (federated)"], ["danger", "Long-lived secret"]], nodes: [
       { id: "gh", x: 20, y: 30, w: 190, h: 56, label: "GitHub Actions job", sub: "deploy workflow", color: "github", tip: `Each run, GitHub can mint an OIDC token for this job because the workflow asks for <code>id-token: write</code>.` },
       { id: "az", x: 540, y: 30, w: 200, h: 56, label: "Azure (Entra ID)", sub: "trusts GitHub's tokens", color: "azure", tip: `Configured with a "federated credential": accept tokens from GitHub for this repo and branch, and give them this identity's permissions for a short time.` },
       { id: "be", x: 20, y: 160, w: 190, h: 56, label: "Your backend", sub: "Container App", color: "azure", tip: `Reads FIREBASE_SERVICE_ACCOUNT_JSON from its environment.` },
       { id: "fb", x: 540, y: 160, w: 200, h: 56, label: "Firebase (Google)", sub: "accepts the key file", color: "google", tip: `The service account key never expires unless revoked or rotated.` }],
     edges: [
       { from: "gh", to: "az", label: "short-lived OIDC token → temporary access", color: "browser", tip: `No password is stored anywhere. Even GitHub's AZURE_CLIENT_ID "secret" is just an identifier.` },
       { from: "be", to: "fb", label: "long-lived service account key", color: "danger", dash: true, tip: `A secret that grants full admin access to the database, valid until someone revokes it.` }] }) +
     CASE("one modern, one traditional", `<p>Your deploy workflow uses <code>azure/login</code> with OIDC federation, the approach Microsoft and GitHub recommend. The three "secrets" it uses are identifiers, not passwords. That's genuinely good practice.</p>
