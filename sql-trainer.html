const TRACKS = {
  oop: { name: "Objects", who: "Dot, shop owner", av: "D", lessons: OOP,
         ranks: [[0, "Scripter"], [35, "Class Act"], [85, "Encapsulator"], [145, "Pattern Spotter"], [205, "Object Architect"]] },
  craft: { name: "Craft", who: "Rafa, tech lead", av: "R", lessons: CRAFT,
         ranks: [[0, "New Starter"], [35, "Teammate"], [85, "Trusted Reviewer"], [145, "Problem Solver"], [205, "Tech Lead Material"]] },
  web: { name: "Build", who: "Jo, backend developer", av: "J", lessons: WEB, map: WEB_MAP, gloss: true,
         ranks: [[0, "Tinkerer"], [60, "Request Reader"], [140, "API Builder"], [230, "AI Integrator"], [310, "Shipper"]] },
};

/* ---------- Step engine ---------- */
function tLessons(t) { return TRACKS[t].lessons.filter(x => x.id); }
function tLesson(t, id) { return tLessons(t).find(l => l.id === id) || tLessons(t)[0]; }
function reached(t, id) { return tstate[t].reached[id] || 0; }
function isDone(t, les) { return reached(t, les.id) >= les.steps.length; }
const isSkipped = (t, key) => !!(tstate[t].skipped && tstate[t].skipped[key]);
function allSkipped(t, les) { return les.steps.every((s, i) => s.t === "read" || isSkipped(t, les.id + ":" + i)); }
const earnsBonus = (t, les) => isDone(t, les) && !allSkipped(t, les);
function tXp(t) {
  const x = Object.values(tstate[t].xp).reduce((a, b) => a + b, 0);
  return x + tLessons(t).filter(l => earnsBonus(t, l)).length * LESSON_BONUS;
}
function lessonXp(t, les) {
  let x = 0;
  for (const k in tstate[t].xp) if (k.startsWith(les.id + ":")) x += tstate[t].xp[k];
  return x + (earnsBonus(t, les) ? LESSON_BONUS : 0);
}

function stepRenderTop(t) {
  const x = tXp(t), ranks = TRACKS[t].ranks;
  let r = ranks[0], next = null;
  for (let i = 0; i < ranks.length; i++) if (x >= ranks[i][0]) { r = ranks[i]; next = ranks[i + 1] || null; }
  $("rank-name").textContent = r[1];
  $("xp-text").textContent = next ? `${x} XP · ${next[0] - x} to ${next[1]}` : `${x} XP · top rank`;
  const pct = next ? ((x - r[0]) / (next[0] - r[0])) * 100 : 100;
  $("xp-fill").style.width = Math.max(3, pct) + "%";
}

function stepRenderNav(t) {
  const list = tLessons(t);
  const doneCount = list.filter(l => isDone(t, l)).length;
  let n = 0, html = `<h2>${doneCount} of ${list.length} done</h2><ol>`;
  for (const item of TRACKS[t].lessons) {
    if (item.sec) { html += `<li class="section-label">${esc(item.sec)}</li>`; continue; }
    n++;
    const done = isDone(t, item), skip = done && allSkipped(t, item);
    const cls = [done ? (skip ? "skipped" : "done") : "", item.boss ? "boss" : "", item.id === tstate[t].current ? "current" : ""].join(" ");
    html += `<li><button type="button" class="${cls}" data-id="${item.id}"${skip ? ` title="Skipped"` : ""}><span class="num">${skip ? "»" : done ? "✓" : n}</span><span>${esc(item.title)}</span></button></li>`;
  }
  html += "</ol>";
  if (TRACKS[t].gloss) {
    const keys = Object.keys(GLOSS).sort((a, b) => GLOSS[a][0].localeCompare(GLOSS[b][0]));
    html += `<details class="gloss"><summary>Glossary (${keys.length} terms)</summary><dl>${keys.map(k => `<dt>${esc(GLOSS[k][0])}</dt><dd>${GLOSS[k][1]}</dd>`).join("")}</dl></details>`;
  }
  $("nav").innerHTML = html;
}

function projectMap(t, les) {
  const T = TRACKS[t], lit = new Set(), now = new Set(les.lights || []);
  for (const l of tLessons(t)) if (isDone(t, l)) (l.lights || []).forEach(x => lit.add(x));
  const box = id => { const c = T.map[id]; return `<div class="pm-box ${lit.has(id) ? "lit" : ""} ${now.has(id) ? "now" : ""}"><b>${c[0]}</b><small>${c[1]}</small></div>`; };
  return `<details class="pmap" open><summary>Your project: Ferry Street online <span>${lit.size} of ${Object.keys(T.map).length} parts built</span></summary>
    <div class="pm-flow">${box("client")}<span class="pm-arrow" aria-hidden="true">→</span>${box("api")}<span class="pm-arrow" aria-hidden="true">→</span><div class="pm-stack">${box("db")}${box("prices")}${box("ai")}</div></div>
    <div class="pm-flow pm-under">${box("auth")}${box("evals")}${box("live")}</div>
    <p class="hint-line">Green parts are built. Outlined ones are what this lesson works on.</p></details>`;
}

function setTrack(t) {
  active = t;
  try { localStorage.setItem("ferry-street-active", t); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.track === t)));
  $("app").classList.remove("nav-open"); $("nav-toggle").setAttribute("aria-expanded", "false");
  if (t === "sql") renderLesson(); else stepRenderLesson(t);
  window.scrollTo({ top: 0 });
}

function stepGo(id) {
  tstate[active].current = id; tsave();
  stepRenderLesson(active);
  $("app").classList.remove("nav-open"); $("nav-toggle").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}

function stepRenderLesson(t, focus) {
  const T = TRACKS[t], list = tLessons(t);
  const les = tLesson(t, tstate[t].current);
  tstate[t].current = les.id;
  const idx = list.indexOf(les), r = reached(t, les.id), n = les.steps.length, done = r >= n;
  const dots = les.steps.map((s, i) => `<i class="${i < r ? "ok" : i === r ? "on" : ""}"></i>`).join("");
  $("main").innerHTML = `
    <div class="lesson-head">
      <div class="eyebrow">${les.boss ? "Boss level" : `Lesson ${idx + 1} of ${list.length}`}${done ? (allSkipped(t, les) ? " · skipped" : " · completed") : ""}</div>
      <h2>${esc(les.title)}</h2>
      ${done ? "" : `<div><button type="button" class="link-btn" id="skip-lesson">Skip this lesson →</button></div>`}
    </div>
    <div class="memo">
      <div class="avatar" aria-hidden="true">${T.av}</div>
      <div class="bubble"><div class="who">${esc(les.who || T.who)}</div><p>${les.intro}</p></div>
    </div>
    ${T.map ? projectMap(t, les) : ""}
    <div class="progress-dots" role="img" aria-label="Step ${Math.min(r + 1, n)} of ${n}">${dots}</div>
    <div class="steps" id="steps"></div>`;
  const box = $("steps");
  const sk = $("skip-lesson");
  if (sk) sk.onclick = () => {
    for (let j = r; j < n; j++) if (les.steps[j].t !== "read") tstate[t].skipped[les.id + ":" + j] = true;
    tstate[t].reached[les.id] = n; tsave();
    const nx = list[idx + 1];
    if (nx) stepGo(nx.id); else { stepRenderLesson(t); window.scrollTo({ top: 0 }); }
  };
  for (let i = 0; i <= Math.min(r, n - 1); i++) box.appendChild(renderStep(t, les, i, i < r));
  if (done) {
    const next = list[idx + 1];
    box.insertAdjacentHTML("beforeend", `<div class="finale" id="step-finish"><span class="eyebrow">Lesson complete</span>
      <h3>${esc(les.title)}: ${lessonXp(t, les)} XP earned</h3>
      <div class="actions">${next ? `<button class="btn btn-primary" type="button" id="next-lesson">Next: ${esc(next.title)} →</button>` : `<span><b>That's the whole ${esc(T.name)} course.</b> Well done.</span>`}
      <button class="btn btn-ghost" type="button" id="restart-lesson">Go through it again</button></div></div>`);
    if (next) $("next-lesson").onclick = () => stepGo(next.id);
    $("restart-lesson").onclick = () => {
      tstate[t].reached[les.id] = 0;
      for (const k in tstate[t].skipped) if (k.startsWith(les.id + ":")) delete tstate[t].skipped[k];
      tsave();
      for (const k in attempts) if (k.startsWith(les.id + ":")) delete attempts[k];
      stepRenderLesson(t); window.scrollTo({ top: 0 });
    };
  }
  stepRenderNav(t); stepRenderTop(t);
  if (focus !== undefined) {
    const el = document.getElementById(focus === "finish" ? "step-finish" : "step-" + focus);
    if (el) el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
  }
}

function renderStep(t, les, i, solved) {
  const s = les.steps[i], key = les.id + ":" + i;
  const el = document.createElement("section");
  el.className = "step t-" + s.t + (solved ? " solved" : "");
  el.id = "step-" + i;
  const skipped = solved && isSkipped(t, key);
  const head = s.t === "read" ? "" : `<div class="step-kind"><span class="eyebrow">${KIND[s.t]}</span>${skipped ? `<span class="skip-chip">skipped · answer shown</span>` : solved ? `<span class="done-chip">✓ done</span>` : `<button type="button" class="link-btn skip-step" data-skip>Skip</button>`}</div>`;
  el.innerHTML = head + (s.q ? `<div class="q">${s.q}</div>` : "") + (s.code && s.t !== "spot" ? C(s.code) : "") + `<div class="body"></div><div class="fb" aria-live="polite"></div>`;
  const ctx = { t, les, i, s, key, el, body: el.querySelector(".body"), fb: el.querySelector(".fb"), solved };
  BUILD[s.t](ctx);
  if (solved && s.why) ctx.fb.innerHTML = `<div class="explain">${s.why}</div>`;
  const skb = el.querySelector("[data-skip]");
  if (skb) skb.onclick = () => { tstate[t].skipped[key] = true; tsave(); advance(t, les, i); };
  return el;
}

function contButton(ctx) {
  const last = ctx.i === ctx.les.steps.length - 1;
  return `<div class="actions"><button class="btn btn-primary" type="button" data-cont>${last ? "Finish lesson" : "Continue"} →</button></div>`;
}
function bindCont(ctx) {
  const b = ctx.fb.querySelector("[data-cont]");
  b.onclick = () => advance(ctx.t, ctx.les, ctx.i);
  b.focus({ preventScroll: true });
}

function succeed(ctx, opts = {}) {
  const { t, s, key, fb } = ctx;
  let gained = "";
  if (!(key in tstate[t].xp)) {
    const full = FULL[s.t];
    const x = opts.xp != null ? opts.xp : ((attempts[key] || 0) === 0 ? full : Math.ceil(full / 2));
    tstate[t].xp[key] = x; tsave();
    gained = ` +${x} XP`;
    stepRenderTop(t);
  }
  fb.innerHTML = `<div class="feedback good"><div class="msg">${pick(PRAISE)}${gained}</div></div>${opts.extra || ""}${s.why ? `<div class="explain">${s.why}</div>` : ""}${contButton(ctx)}`;
  bindCont(ctx);
}
function miss(ctx, html) {
  attempts[ctx.key] = (attempts[ctx.key] || 0) + 1;
  ctx.fb.innerHTML = `<div class="feedback bad"><div class="msg">${html}</div></div>`;
}
function note(ctx, html) { ctx.fb.innerHTML = `<div class="feedback info"><div class="msg">${html}</div></div>`; }

function advance(t, les, i) {
  const was = isDone(t, les);
  tstate[t].reached[les.id] = Math.max(reached(t, les.id), i + 1); tsave();
  const now = isDone(t, les);
  stepRenderLesson(t, now ? "finish" : i + 1);
  if (now && !was) { const f = $("step-finish"); if (f) confetti(f); }
}

const normOut = x => String(x).replace(/\r/g, "").split("\n").map(l => l.trim().replace(/\s+/g, " ")).join("\n").trim();
const safeId = k => k.replace(/[^a-z0-9]/gi, "-");

function seededOrder(n, seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => (h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0, (h >>> 0) / 4294967296);
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}

const BUILD = {
  read(ctx) {
    ctx.body.innerHTML = ctx.s.html;
    if (!ctx.solved) { ctx.fb.innerHTML = contButton(ctx); ctx.fb.querySelector("[data-cont]").onclick = () => advance(ctx.t, ctx.les, ctx.i); }
  },

  mcq(ctx) {
    const { s, body, solved } = ctx;
    const multi = s.opts.filter(o => o[1]).length > 1;
    body.innerHTML = `${multi && !solved ? `<p class="hint-line">Pick all that apply.</p>` : ""}<div class="opts">${s.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span>${o[0]}</span></button>`).join("")}</div>${multi && !solved ? `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>` : ""}`;
    const btns = [...body.querySelectorAll(".opt")];
    const showWhy = (b, j) => { if (!b.querySelector(".why")) b.insertAdjacentHTML("beforeend", `<span class="why">${s.opts[j][2]}</span>`); };
    if (solved) { btns.forEach((b, j) => { b.disabled = true; if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); } }); return; }
    if (!multi) {
      btns.forEach((b, j) => b.onclick = () => {
        if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); btns.forEach(x => x.disabled = true); succeed(ctx); }
        else { b.classList.add("wrong"); b.disabled = true; showWhy(b, j); miss(ctx, "Not that one. Read why, then try another."); }
      });
    } else {
      btns.forEach(b => b.onclick = () => b.classList.toggle("picked"));
      body.querySelector("[data-check]").onclick = () => {
        const picked = btns.map(b => b.classList.contains("picked"));
        if (s.opts.every((o, j) => o[1] === picked[j])) {
          btns.forEach((b, j) => { b.disabled = true; b.classList.remove("picked"); if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); } });
          body.querySelector("[data-check]").remove(); succeed(ctx);
        } else {
          const right = s.opts.filter((o, j) => o[1] && picked[j]).length, total = s.opts.filter(o => o[1]).length;
          const extra = s.opts.filter((o, j) => !o[1] && picked[j]).length;
          miss(ctx, `You have ${right} of ${total} right${extra ? `, plus ${extra} that shouldn't be picked` : ""}.`);
        }
      };
    }
  },

  predict(ctx) {
    const { s, body, solved, key } = ctx;
    const answers = [].concat(s.answer);
    const multiLine = answers[0].includes("\n");
    if (solved) { body.innerHTML = `<div class="model"><b>Output</b><pre>${esc(answers[0])}</pre></div>`; return; }
    const id = "pred-" + safeId(key);
    body.innerHTML = `<label for="${id}" class="hint-line">What does it print?${multiLine ? " One line per print()." : ""}</label>
      ${multiLine ? `<textarea id="${id}" class="answer-input" rows="${answers[0].split("\n").length}" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>` : `<input id="${id}" class="answer-input" spellcheck="false" autocapitalize="off" autocomplete="off">`}
      <div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button><span data-giveup></span></div>`;
    const inp = body.querySelector(".answer-input");
    const check = () => {
      const v = normOut(inp.value);
      if (!v) { note(ctx, "Type what you think it prints first."); return; }
      if (answers.some(a => normOut(a) === v)) {
        inp.readOnly = true; body.querySelector(".actions").remove();
        succeed(ctx, { extra: `<div class="model"><b>Output</b><pre>${esc(answers[0])}</pre></div>` });
      } else {
        miss(ctx, multiLine ? "Not quite. Check each line: one per print() call." : "Not quite. Trace it through one line at a time.");
        const g = body.querySelector("[data-giveup]");
        if (attempts[key] >= 2 && g && !g.innerHTML) {
          g.innerHTML = `<button class="btn btn-ghost" type="button">Show answer</button>`;
          g.firstChild.onclick = () => { inp.value = answers[0]; check(); };
        }
      }
    };
    body.querySelector("[data-check]").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && (!multiLine || e.ctrlKey || e.metaKey)) { e.preventDefault(); check(); } });
  },

  sort(ctx) {
    const { s, body, solved, key } = ctx;
    const choice = s.items.map(() => -1);
    body.innerHTML = s.items.map((it, j) => `<div class="sort-row" data-j="${j}"><div class="item">${it[0]}${solved && it[2] ? `<small>${it[2]}</small>` : ""}</div>${solved ? `<span class="chip">${esc(s.buckets[it[1]])}</span>` : `<div class="seg" role="group" aria-label="Choose a group">${s.buckets.map((b, k) => `<button type="button" aria-pressed="false" data-k="${k}">${esc(b)}</button>`).join("")}</div>`}</div>`).join("") + (solved ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>`);
    if (solved) return;
    const rows = [...body.querySelectorAll(".sort-row")];
    const addSmall = (row, j, prefix) => { if (s.items[j][2] && !row.querySelector(".item small")) row.querySelector(".item").insertAdjacentHTML("beforeend", `<small>${prefix}${s.items[j][2]}</small>`); };
    rows.forEach((row, j) => row.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
      choice[j] = +b.dataset.k;
      row.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      row.classList.remove("right", "wrong");
      const sm = row.querySelector(".item small"); if (sm) sm.remove();
    }));
    body.querySelector("[data-check]").onclick = () => {
      const left = choice.filter(c => c < 0).length;
      if (left) { note(ctx, `Sort every item first (${left} left).`); return; }
      let wrong = 0;
      rows.forEach((row, j) => { const ok = choice[j] === s.items[j][1]; row.classList.toggle("right", ok); row.classList.toggle("wrong", !ok); if (!ok) wrong++; });
      if (!wrong) {
        rows.forEach((row, j) => { row.querySelectorAll(".seg button").forEach(b => b.disabled = true); addSmall(row, j, ""); });
        body.querySelector("[data-check]").remove(); succeed(ctx);
      } else {
        miss(ctx, `${s.items.length - wrong} of ${s.items.length} right. Change the ones marked ✗.`);
        if (attempts[key] >= 2) rows.forEach((row, j) => { if (row.classList.contains("wrong")) addSmall(row, j, "Hint: "); });
      }
    };
  },

  spot(ctx) {
    const { s, body, solved } = ctx;
    const lines = trimCode(s.code).split("\n");
    const sel = new Set();
    body.innerHTML = `${solved ? "" : `<p class="hint-line">Tap lines to select them${s.bad.length > 1 ? ` (there are ${s.bad.length} to find)` : ""}, then press Check.</p>`}<div class="spot">${lines.map((l, j) => `<button type="button" data-j="${j}" aria-pressed="false" ${solved ? "disabled" : ""} class="${solved && s.bad.includes(j) ? "bad" : ""}"><span class="ln">${j + 1}</span><span>${hl(l) || " "}</span></button>`).join("")}</div>${solved ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>`}`;
    if (solved) return;
    const btns = [...body.querySelectorAll(".spot button")];
    btns.forEach((b, j) => b.onclick = () => {
      if (sel.has(j)) sel.delete(j); else sel.add(j);
      b.classList.toggle("sel", sel.has(j)); b.setAttribute("aria-pressed", String(sel.has(j)));
    });
    body.querySelector("[data-check]").onclick = () => {
      if (!sel.size) { note(ctx, "Select at least one line first."); return; }
      const found = s.bad.filter(j => sel.has(j)).length, extra = sel.size - found;
      if (found === s.bad.length && !extra) {
        btns.forEach((b, j) => { b.disabled = true; b.classList.remove("sel"); if (s.bad.includes(j)) b.classList.add("bad"); });
        body.querySelector("[data-check]").remove(); succeed(ctx);
      } else {
        miss(ctx, `You found ${found} of ${s.bad.length}.${extra ? ` ${extra} of your picks ${extra === 1 ? "is" : "are"} fine as written.` : ""}`);
      }
    };
  },

  order(ctx) {
    const { s, body, solved, key } = ctx;
    let cur = solved ? s.items.map((_, j) => j) : seededOrder(s.items.length, key);
    let locked = solved;
    const render = (marks, focusSel) => {
      body.innerHTML = `<ol class="order-list">${cur.map((j, p) => `<li class="${marks && marks[p] ? "right" : ""}"><span class="pos">${p + 1}.</span><span class="txt">${s.items[j]}</span>${locked ? "" : `<span class="mv"><button type="button" data-up="${p}" aria-label="Move up" ${p === 0 ? "disabled" : ""}>↑</button><button type="button" data-down="${p}" aria-label="Move down" ${p === cur.length - 1 ? "disabled" : ""}>↓</button></span>`}</li>`).join("")}</ol>${locked ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check order</button></div>`}`;
      if (locked) return;
      const move = (p, q) => { [cur[p], cur[q]] = [cur[q], cur[p]]; render(null, q === 0 ? `[data-down="0"]` : `[data-up="${q}"]`); };
      body.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
      body.querySelectorAll("[data-down]").forEach(b => b.onclick = () => { const p = +b.dataset.down; [cur[p], cur[p + 1]] = [cur[p + 1], cur[p]]; render(null, p + 1 === cur.length - 1 ? `[data-up="${p + 1}"]` : `[data-down="${p + 1}"]`); });
      if (focusSel) { const f = body.querySelector(focusSel); if (f) f.focus(); }
      body.querySelector("[data-check]").onclick = () => {
        const marks = cur.map((j, p) => j === p);
        const right = marks.filter(Boolean).length;
        if (right === cur.length) { locked = true; render(marks); succeed(ctx); }
        else { render(marks); miss(ctx, `${right} of ${cur.length} are in the right place (marked green). Keep going.`); }
      };
    };
    render(solved ? cur.map(() => true) : null);
  },

  branch(ctx) {
    const { t, s, key, body, solved } = ctx;
    if (solved) {
      const route = tstate[t].drafts[key];
      if (Array.isArray(route) && route.length) body.innerHTML = `<div class="model"><b>Your route</b><ol>${route.map(r => `<li>${r}</li>`).join("")}</ol></div>`;
      return;
    }
    let path = [];                       // [{ node, j }]
    const nodeAt = () => path.length ? s.nodes[path[path.length - 1].node].opts[path[path.length - 1].j][1] : s.start;
    const render = () => {
      const id = nodeAt(), n = s.nodes[id];
      const past = path.map(p => { const o = s.nodes[p.node].opts[p.j]; return `<li><b>${o[0]}</b>${o[2] ? `<span>${o[2]}</span>` : ""}</li>`; }).join("");
      let html = past ? `<ol class="br-log">${past}</ol>` : "";
      if (!n.end) {
        html += `<div class="br-now">${n.say}</div><div class="opts">${n.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span>${o[0]}</span></button>`).join("")}</div>`;
        body.innerHTML = html;
        body.querySelectorAll(".opt").forEach(b => b.onclick = () => { path.push({ node: id, j: +b.dataset.j }); render(); });
      } else if (n.end === "good") {
        body.innerHTML = html + `<div class="br-end good"><b>How it turned out</b><div>${n.say}</div></div>`;
        tstate[t].drafts[key] = path.map(p => s.nodes[p.node].opts[p.j][0]); tsave();
        succeed(ctx);
      } else {
        body.innerHTML = html + `<div class="br-end bad"><b>How it turned out</b><div>${n.say}</div></div><div class="actions"><button class="btn btn-primary" type="button" data-back>Undo last decision</button><button class="btn btn-ghost" type="button" data-restart>Start again</button></div>`;
        miss(ctx, "That didn't go well. Undo your last decision, or start again.");
        body.querySelector("[data-back]").onclick = () => { path.pop(); ctx.fb.innerHTML = ""; render(); };
        body.querySelector("[data-restart]").onclick = () => { path = []; ctx.fb.innerHTML = ""; render(); };
      }
    };
    render();
  },

  code(ctx) { labStep(ctx, false); },
  tests(ctx) { labStep(ctx, true); },

  write(ctx) {
    const { t, s, key, body, solved } = ctx;
    const draft = tstate[t].drafts[key] || "";
    if (solved) {
      body.innerHTML = `${draft ? `<div class="model" style="border-left-color:var(--accent)"><b>Your answer</b><pre>${esc(draft)}</pre></div>` : ""}<details class="reveal"><summary>Model answer</summary><div class="model"><pre>${esc(s.model)}</pre></div></details>`;
      return;
    }
    const id = "write-" + safeId(key);
    body.innerHTML = `<label for="${id}" class="hint-line">Write your answer here. It's saved as you type.</label>
      <textarea id="${id}" class="write-input" placeholder="${esc(s.placeholder || "")}"${s.mono ? ` style="font-family:var(--font-mono);font-size:.9rem" spellcheck="false"` : ""}></textarea>
      <div class="actions"><button class="btn btn-primary" type="button" data-compare>Compare with a model answer</button></div><div class="compare"></div>`;
    const ta = body.querySelector(".write-input");
    ta.value = draft;
    ta.addEventListener("input", () => { tstate[t].drafts[key] = ta.value; tsave(); });
    body.querySelector("[data-compare]").onclick = () => {
      if (ta.value.trim().length < 40) { note(ctx, "Write a bit more first. Having a go before you look is what makes it stick."); return; }
      ctx.fb.innerHTML = "";
      body.querySelector("[data-compare]").closest(".actions").remove();
      const cmp = body.querySelector(".compare");
      cmp.innerHTML = `<div style="display:grid;gap:10px"><div class="model"><b>A model answer</b><pre>${esc(s.model)}</pre></div>
        <p class="hint-line">Yours doesn't need to match it. Tick what your answer covers:</p>
        <div class="checklist">${s.checklist.map((c, j) => `<label><input type="checkbox" id="${id}-c${j}"><span>${esc(c)}</span></label>`).join("")}</div>
        <div class="actions"><button class="btn btn-primary" type="button" data-done>Done</button></div></div>`;
      cmp.querySelector("[data-done]").onclick = () => {
        const boxes = [...cmp.querySelectorAll(".checklist input")];
        const missing = s.checklist.filter((c, j) => !boxes[j].checked);
        const x = Math.max(1, Math.round(FULL.write * (s.checklist.length - missing.length) / s.checklist.length));
        cmp.querySelectorAll("input").forEach(i => i.disabled = true);
        cmp.querySelector("[data-done]").closest(".actions").remove();
        succeed(ctx, { xp: x, extra: missing.length ? `<div class="explain"><b>Worth including next time:</b><ul>${missing.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : "" });
      };
    };
  },
};

/* ---------- Python code labs (Pyodide, loaded on first use) ---------- */
const PYODIDE_BASE = "https://cdn.jsdelivr.net/npm/pyodide@0.26.4/";
let pyPromise = null, pyReady = false;
const HARNESS = py`
import io, json, contextlib, traceback

class _Raises:
    def __init__(self, exc):
        self.exc = exc
    def __enter__(self):
        return self
    def __exit__(self, t, v, tb):
        if t is None:
            raise AssertionError(f"expected {self.exc.__name__} to be raised, but nothing was raised")
        return issubclass(t, self.exc)

def raises(exc):
    return _Raises(exc)

def _fmt(e):
    msg = str(e)
    return f"{type(e).__name__}: {msg}" if msg else type(e).__name__

def _line(e):
    if isinstance(e, SyntaxError):
        return e.lineno
    for fr in reversed(traceback.extract_tb(e.__traceback__)):
        if fr.filename == "<your code>":
            return fr.lineno
    return None

def _load(user_code, ns, out):
    with contextlib.redirect_stdout(out):
        exec(compile(user_code, "<your code>", "exec"), ns)

def _fail(e, out):
    return json.dumps({"error": _fmt(e), "line": _line(e), "out": out.getvalue()[-2000:], "results": []})

def run_tests(user_code, spec):
    tests = json.loads(spec)
    out = io.StringIO()
    ns = {"__name__": "__main__", "raises": raises}
    try:
        _load(user_code, ns, out)
    except Exception as e:
        return _fail(e, out)
    results = []
    for name, code in tests:
        try:
            with contextlib.redirect_stdout(out):
                exec(code, dict(ns))
            results.append([name, True, ""])
        except AssertionError as e:
            results.append([name, False, str(e) or "the check failed"])
        except Exception as e:
            results.append([name, False, _fmt(e)])
    return json.dumps({"error": None, "out": out.getvalue()[-2000:], "results": results})

def run_mutants(user_code, spec):
    impls = json.loads(spec)
    out = io.StringIO()
    results = []
    for label, impl, should_pass in impls:
        ns = {"__name__": "__main__", "raises": raises}
        exec(impl, ns)
        try:
            _load(user_code, ns, out)
        except Exception as e:
            return _fail(e, out)
        tests = [(k, v) for k, v in ns.items() if k.startswith("test_") and callable(v)]
        if not tests:
            return json.dumps({"error": "No tests found. Name each test function test_something.", "line": None, "out": "", "results": []})
        failed = []
        for k, fn in tests:
            try:
                with contextlib.redirect_stdout(out):
                    fn()
            except Exception as e:
                failed.append(f"{k}: {_fmt(e)}")
        if should_pass:
            results.append([label, not failed, "; ".join(failed)[:400]])
        else:
            results.append([label, bool(failed), "" if failed else "all your tests passed on this broken version"])
    return json.dumps({"error": None, "out": "", "results": results})
`;

function loadPy() {
  if (pyPromise) return pyPromise;
  const loading = new Promise((resolve, reject) => {
    const start = () => window.loadPyodide({ indexURL: PYODIDE_BASE }).then(p => { p.runPython(HARNESS); pyReady = true; resolve(p); }, reject);
    if (window.loadPyodide) { start(); return; }
    const sc = document.createElement("script");
    sc.src = PYODIDE_BASE + "pyodide.js";
    sc.onload = start;
    sc.onerror = () => reject(new Error("Python could not be downloaded"));
    document.head.appendChild(sc);
  });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("Python took too long to load")), 90000));
  pyPromise = Promise.race([loading, timeout]);
  pyPromise.catch(() => { pyPromise = null; });
  return pyPromise;
}

function labStep(ctx, mutants) {
  const { t, s, key, body, solved } = ctx;
  const draft = tstate[t].drafts[key];
  if (solved) {
    body.innerHTML = `${draft ? `<details class="reveal"><summary>Your code</summary>${C(draft)}</details>` : ""}<details class="reveal"><summary>Model answer</summary>${C(s.solution)}</details>`;
    return;
  }
  const id = "lab-" + safeId(key);
  body.innerHTML = `<div class="editor-wrap lab"><div class="editor-bar"><div class="dots"><i></i><i></i><i></i></div><span>Python · Ctrl/⌘ + Enter to run</span></div>
    <textarea id="${id}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python editor"></textarea></div>
    <div class="actions"><button class="btn btn-primary" type="button" data-run>${mutants ? "Run my tests" : "Run tests"} <kbd>Ctrl↵</kbd></button>
    <button class="btn btn-ghost" type="button" data-reset>Reset code</button><span class="spacer"></span>
    <button class="btn btn-ghost" type="button" data-sol>Show model answer</button></div>
    <div class="lab-sol"></div><div class="lab-out" aria-live="polite"></div>`;
  const ta = body.querySelector("textarea"), out = body.querySelector(".lab-out"), solBox = body.querySelector(".lab-sol"), runBtn = body.querySelector("[data-run]");
  ta.value = draft ?? s.starter;
  const saveDraft = () => { tstate[t].drafts[key] = ta.value; tsave(); };
  ta.addEventListener("input", saveDraft);
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault(); const st = ta.selectionStart;
      ta.value = ta.value.slice(0, st) + "    " + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = st + 4; saveDraft();
    }
  });
  const resetBtn = body.querySelector("[data-reset]");
  resetBtn.onclick = () => {
    if (resetBtn.dataset.armed) { ta.value = s.starter; saveDraft(); resetBtn.textContent = "Reset code"; delete resetBtn.dataset.armed; ta.focus(); }
    else { resetBtn.dataset.armed = "1"; resetBtn.textContent = "Click again to reset"; setTimeout(() => { if (resetBtn.isConnected) { resetBtn.textContent = "Reset code"; delete resetBtn.dataset.armed; } }, 4000); }
  };
  const showSol = () => {
    attempts[key] = Math.max(attempts[key] || 0, 1);
    if (!solBox.innerHTML) solBox.innerHTML = `<details class="reveal" open><summary>Model answer</summary>${C(s.solution)}<p class="hint-line">Looking halves this step's XP. Type it out rather than pasting: it sticks better.</p></details>`;
  };
  body.querySelector("[data-sol]").onclick = showSol;
  runBtn.onclick = run;

  async function run() {
    if (runBtn.disabled) return;
    runBtn.disabled = true;
    out.innerHTML = `<div class="feedback info"><div class="msg">${pyReady ? "Running…" : "Loading Python (about 12 MB, first time only)…"}</div></div>`;
    try {
      const pyo = await loadPy();
      pyo.globals.set("USER_CODE", ta.value);
      pyo.globals.set("SPEC_JSON", JSON.stringify(mutants ? s.impls : s.tests));
      const res = JSON.parse(pyo.runPython(mutants ? "run_mutants(USER_CODE, SPEC_JSON)" : "run_tests(USER_CODE, SPEC_JSON)"));
      show(res);
    } catch (e) {
      out.innerHTML = `<div class="feedback info"><div class="msg">Python couldn't load here. It downloads from cdn.jsdelivr.net, which may be blocked in this view, or you may be offline.<small>You can still compare your code with the model answer and mark this step done.</small></div><button class="btn" type="button" data-self>Compare and mark done</button></div>`;
      out.querySelector("[data-self]").onclick = () => { showSol(); succeed(ctx); };
    } finally { runBtn.disabled = false; }
  }

  function show(res) {
    if (res.error) {
      out.innerHTML = res.out && res.out.trim() ? `<p class="hint-line">Printed output:</p><pre class="stdout">${esc(res.out)}</pre>` : "";
      miss(ctx, `Your code didn't run: <code>${esc(res.error)}</code>${res.line ? ` on line ${res.line}` : ""}.`);
      return;
    }
    const list = `<div class="tests">${res.results.map(r => `<div class="${r[1] ? "pass" : "fail"}"><span>${esc(r[0])}${!r[1] && r[2] ? `<small>${esc(r[2])}</small>` : ""}</span></div>`).join("")}</div>`;
    out.innerHTML = list + (res.out && res.out.trim() ? `<p class="hint-line">Printed output:</p><pre class="stdout">${esc(res.out)}</pre>` : "");
    const passed = res.results.filter(r => r[1]).length, total = res.results.length;
    if (passed === total) { succeed(ctx); return; }
    if (mutants) {
      if (!res.results[0][1]) miss(ctx, "Your tests fail on the correct version, so one of them expects the wrong thing. See the details above.");
      else { const caught = res.results.slice(1).filter(r => r[1]).length; miss(ctx, `Your tests caught ${caught} of ${total - 1} bugs. Which cases haven't you tried yet?`); }
    } else miss(ctx, `${passed} of ${total} tests pass.`);
  }
}

/* ---- Boot ---- */
function startApp() {
  if (hotel) { hotel.stop(); hotel = null; }
  $("gate").hidden = true; $("app-root").hidden = false;
  $("nav").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) (active === "sql" ? go : stepGo)(b.dataset.id); });
  $("nav-toggle").onclick = () => {
    const open = $("app").classList.toggle("nav-open");
    $("nav-toggle").setAttribute("aria-expanded", String(open));
  };
  $("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-track]"); if (b && b.dataset.track !== active) setTrack(b.dataset.track); });
  $("main").addEventListener("click", e => {
    const b = e.target.closest(".term"); if (!b) return;
    const next = b.nextElementSibling;
    if (next && next.classList.contains("term-def")) { next.remove(); b.setAttribute("aria-expanded", "false"); return; }
    const d = GLOSS[b.dataset.term]; if (!d) return;
    b.insertAdjacentHTML("afterend", `<span class="term-def" role="note"><b>${esc(d[0])}:</b> ${d[1]}</span>`);
    b.setAttribute("aria-expanded", "true");
  });
  setTrack(active);
  sqlReady.catch(err => feedback("bad", `<div class="msg">${esc(err.message)}</div>`));
}

/* ---- Front page: a little pixel-art hotel lobby ---- */
let hotel = null;
function startHotel() {
  const cv = $("room"), ctx = cv && cv.getContext && cv.getContext("2d");
  if (!ctx) return null;
  const N = 9, OX = 192, OY = 92, WH = 76;
  const still = reduced();
  const P = (x, y, z = 0) => [OX + (x - y) * 16, OY + (x + y) * 8 - z];
  const poly = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); };
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  // c = [top, front-left face, front-right face]
  const box = (x, y, w, d, h, c, z = 0) => {
    poly([P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)], c[2]);
    poly([P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)], c[1]);
    poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], c[0]);
  };

  /* Furniture: footprint tiles are blocked; key is used for draw order */
  const RED = ["#d9534f", "#b03a37", "#8f2d2b"], WOOD = ["#c58b4e", "#9c6a37", "#7f5429"];
  const furn = [
    { tiles: [[0, 0]], key: 1, draw() {
        box(.28, .28, .44, .44, 9, ["#d07a4a", "#a95c33", "#8a4826"]);
        const [cx, cy] = P(.5, .5, 9);
        [[-6, -6, 8, 6], [-2, -12, 6, 8], [1, -7, 7, 6], [-7, -14, 5, 5], [2, -16, 5, 6], [-3, -19, 6, 5]].forEach(([dx, dy, w, h], i) => rect(cx + dx, cy + dy, w, h, i % 2 ? "#3f9c4a" : "#2e7d3a"));
      } },
    { tiles: [[2, 0], [3, 0], [4, 0]], key: 4.2, draw() {
        box(2.2, .1, 2.6, .3, 22, RED);
        box(2.2, .15, .3, .8, 13, RED);
        box(2.45, .35, 2.1, .6, 8, ["#e46b66", "#b03a37", "#8f2d2b"]);
        box(4.5, .15, .3, .8, 13, RED);
      } },
    { tiles: [[0, 3]], key: 3.6, draw(t) {
        box(.1, 3.05, .75, .9, 30, ["#6b4fa3", "#523b80", "#3f2d63"]);
        const on = Math.floor(t * 3) % 3;
        ["#ff5ea8", "#ffd23f", "#4dd6ff"].forEach((c, i) => {
          const q = P(.85, 3.32 + i * .25, 22);
          rect(q[0] - 2, q[1], 3, 3, i === on ? c : "#2a1f42");
        });
        const g1 = P(.85, 3.3, 10); rect(g1[0] - 10, g1[1], 9, 2, "#c9b8f0"); rect(g1[0] - 10, g1[1] + 4, 9, 1, "#c9b8f0");
      } },
    { tiles: [[6, 1]], key: 7.4, draw() {
        box(6.3, 1.3, .1, .1, 11, WOOD); box(6.9, 1.3, .1, .1, 11, WOOD); box(6.3, 1.9, .1, .1, 11, WOOD); box(6.9, 1.9, .1, .1, 11, WOOD);
        box(6.2, 1.2, .9, .9, 2, WOOD, 11);
        box(6.55, 1.55, .2, .2, 10, ["#555", "#444", "#333"], 13);
        box(6.42, 1.42, .46, .46, 7, ["#ffe9a8", "#f2cf6b", "#d9b24e"], 22);
      } },
    { tiles: [[7, 7]], key: 14.9, draw(t) {
        const [x, y] = P(7.5, 7.5);
        const b = still ? 0 : Math.round(Math.sin(t * 2) * .6);
        rect(x - 4, y - 5 + b, 8, 4, "#ffd23f"); rect(x + 1, y - 9 + b, 4, 4, "#ffd23f");
        rect(x + 5, y - 7 + b, 2, 1, "#ff8a1f"); rect(x + 3, y - 8 + b, 1, 1, "#111");
      } },
  ];
  const blocked = new Set(furn.flatMap(f => f.tiles.map(([a, b]) => a + "," + b)));
  blocked.add("8,8");

  /* Room: walls, window, picture, door, floor, rug */
  function drawRoom(t) {
    poly([P(0, 0, WH), P(0, N, WH), P(0, N), P(0, 0)], "#a9b8c9");
    poly([P(0, 0, WH), P(N, 0, WH), P(N, 0), P(0, 0)], "#c6d2de");
    poly([P(0, 0, WH), P(0, N, WH), P(-.3, N, WH), P(-.3, -.3, WH)], "#e6ecf2");
    poly([P(0, 0, WH), P(N, 0, WH), P(N, -.3, WH), P(-.3, -.3, WH)], "#eef2f6");
    poly([P(-.3, N, WH), P(0, N, WH), P(0, N, -6), P(-.3, N, -6)], "#7d8ea3");
    poly([P(N, -.3, WH), P(N, 0, WH), P(N, 0, -6), P(N, -.3, -6)], "#93a3b6");
    poly([P(0, 0, 4), P(0, N, 4), P(0, N), P(0, 0)], "#8797aa");
    poly([P(0, 0, 4), P(N, 0, 4), P(N, 0), P(0, 0)], "#a3b1c1");
    // window on the right wall, with drifting clouds
    const win = [P(5.2, 0, 60), P(7.6, 0, 60), P(7.6, 0, 28), P(5.2, 0, 28)];
    ctx.save(); ctx.beginPath(); win.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.clip();
    poly(win, "#7cc6f2");
    const drift = still ? 0 : (t * 4) % 90;
    [[0, 34, 14], [38, 44, 10], [64, 30, 12]].forEach(([dx, z, w]) => {
      const x0 = 5.2 + ((dx + drift) % 90) / 36, q = P(x0, 0, z + 18);
      rect(q[0] - 30, q[1], w, 3, "#fff"); rect(q[0] - 27, q[1] - 2, w - 6, 2, "#fff");
    });
    ctx.restore();
    ctx.strokeStyle = "#f4f7fa"; ctx.lineWidth = 2; ctx.beginPath(); win.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); let a = P(6.4, 0, 60), b = P(6.4, 0, 28); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); a = P(5.2, 0, 44); b = P(7.6, 0, 44); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    // picture on the left wall
    poly([P(0, 2, 58), P(0, 3.6, 58), P(0, 3.6, 30), P(0, 2, 30)], "#4a3424");
    poly([P(0, 2.12, 55), P(0, 3.48, 55), P(0, 3.48, 44), P(0, 2.12, 44)], "#ff9a52");
    poly([P(0, 2.12, 44), P(0, 3.48, 44), P(0, 3.48, 38), P(0, 2.12, 38)], "#e0566b");
    poly([P(0, 2.12, 38), P(0, 3.48, 38), P(0, 3.48, 33), P(0, 2.12, 33)], "#5b3a7a");
    // door on the left wall
    poly([P(0, 6.4, 44), P(0, 7.7, 44), P(0, 7.7), P(0, 6.4)], "#e6ecf2");
    poly([P(0, 6.55, 41), P(0, 7.55, 41), P(0, 7.55), P(0, 6.55)], "#3a2a1e");
    // floor
    poly([P(0, N), P(N, N), P(N, N, -7), P(0, N, -7)], "#8a7552");
    poly([P(N, 0), P(N, N), P(N, N, -7), P(N, 0, -7)], "#6f5d40");
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) poly([P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)], (i + j) % 2 ? "#cdb98f" : "#c2ad82");
    poly([P(3.6, 4), P(7, 4), P(7, 7), P(3.6, 7)], "#3f6fa8");
    poly([P(3.8, 4.2), P(6.8, 4.2), P(6.8, 6.8), P(3.8, 6.8)], "#5089c9");
    poly([P(4.4, 4.8), P(6.2, 4.8), P(6.2, 6.2), P(4.4, 6.2)], "#3f6fa8");
  }

  /* Avatars */
  const PEOPLE = [
    ["Pixie", "#ff6fae", "#2b2b6b", "#f1c27d", "#5a2d0c"], ["Bram", "#3bb273", "#33363d", "#e0ac69", "#1b1b1b"],
    ["Lou", "#ffd23f", "#4b3a8c", "#c68642", "#2b1a0e"], ["Nico", "#4dd6ff", "#223", "#f1c27d", "#d9a441"],
    ["Juno", "#a970ff", "#3a2a1e", "#8d5524", "#111"], ["Otto", "#ff8a3d", "#2d4a6b", "#ffdbac", "#7a7a7a"],
  ];
  const LINES = ["hey!", "hiii", "o/", "nice rug", "who put the duck there", "brb", "lol", "this song is so good", "anyone wanna trade a sofa?",
    "omg the lamp", ":)", "dance party at 8!!", "wb", "i love this room", "haha", "same", "the window view tho", "sit down, stay a while",
    "is the jukebox taking requests?", "cool hair", "ty", "k going to the pool", "*waves*", "where's everyone from?", "back!", "lmao"];
  const free = () => { const out = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!blocked.has(i + "," + j)) out.push([i, j]); return out; };
  const spots = free();
  const avs = PEOPLE.map((p, k) => { const s = spots[(k * 11 + 5) % spots.length]; return { name: p[0], shirt: p[1], pants: p[2], skin: p[3], hair: p[4], x: s[0], y: s[1], path: [], wait: 1 + k * .7, face: k % 2 ? 1 : -1, dance: 0, wave: 0, moving: false }; });
  const occ = $("occ"); if (occ) occ.textContent = avs.length;

  function route(a, goal) {
    const start = [Math.round(a.x), Math.round(a.y)], key = p => p[0] + "," + p[1];
    const prev = { [key(start)]: null }, q = [start];
    while (q.length) {
      const c = q.shift();
      if (c[0] === goal[0] && c[1] === goal[1]) break;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const n = [c[0] + dx, c[1] + dy], k = key(n);
        if (n[0] < 0 || n[1] < 0 || n[0] >= N || n[1] >= N || blocked.has(k) || k in prev) continue;
        prev[k] = c; q.push(n);
      }
    }
    const out = []; for (let c = goal; c && key(c) in prev && prev[key(c)]; c = prev[key(c)]) out.unshift(c);
    return out;
  }

  const bubbles = $("bubbles");
  function say(a, text) {
    if (!bubbles || bubbles.children.length > 4) return;
    const [sx, sy] = P(a.x + .5, a.y + .5);
    const el = document.createElement("div");
    el.className = "hb";
    el.style.left = (sx / 384 * 100) + "%"; el.style.top = ((sy - 32) / 256 * 100) + "%";
    el.innerHTML = `<b>${esc(a.name)}:</b>${esc(text)}`;
    bubbles.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }

  function update(a, dt) {
    if (a.dance) a.dance = Math.max(0, a.dance - dt);
    if (a.wave) a.wave = Math.max(0, a.wave - dt);
    if (a.path.length && !still) {
      const [tx, ty] = a.path[0], dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy), step = 1.7 * dt;
      a.moving = true;
      const sdx = dx - dy; if (Math.abs(sdx) > .01) a.face = sdx > 0 ? 1 : -1;
      if (d <= step) { a.x = tx; a.y = ty; a.path.shift(); } else { a.x += dx / d * step; a.y += dy / d * step; }
      return;
    }
    a.moving = false;
    a.wait -= dt;
    if (a.wait > 0) return;
    const r = Math.random();
    if (r < .38 && !still) { const g2 = spots[Math.floor(Math.random() * spots.length)]; if (!avs.some(o => o !== a && Math.round(o.x) === g2[0] && Math.round(o.y) === g2[1])) a.path = route(a, g2); a.wait = 1 + Math.random() * 2; }
    else if (r < .72) { say(a, LINES[Math.floor(Math.random() * LINES.length)]); a.wait = 2.5 + Math.random() * 3; }
    else if (r < .84) { a.wave = 1.6; a.wait = 2 + Math.random() * 2; }
    else if (r < .94 && !still) { a.dance = 4; a.wait = 4.5; }
    else a.wait = 2 + Math.random() * 3;
  }

  function drawAv(a, t) {
    const [sx, sy] = P(a.x + .5, a.y + .5);
    const bob = a.dance ? Math.round(Math.abs(Math.sin(t * 9)) * 2) : 0;
    const x = Math.round(sx), y = Math.round(sy) - bob, fr = a.moving ? Math.floor(t * 7) % 2 : 0, fc = a.face;
    rect(x - 5, Math.round(sy) - 1, 10, 2, "rgba(0,0,0,.2)"); rect(x - 3, Math.round(sy) - 2, 6, 1, "rgba(0,0,0,.2)");
    rect(x - 3, y - 9, 2, 9 - fr, a.pants); rect(x + 1, y - 9, 2, 8 + fr, a.pants);
    rect(x - 3, y - 1 - fr, 2, 1, "#1b1b1b"); rect(x + 1, y - 1 + fr - 1 + 1, 2, 1, "#1b1b1b");
    rect(x - 4, y - 18, 8, 10, a.shirt); rect(x - 4, y - 18, 8, 1, "rgba(255,255,255,.35)");
    const dswing = a.dance ? (Math.floor(t * 9) % 2 ? -3 : 0) : 0;
    rect(x - 5, y - 17 + (fr ? 1 : 0) + dswing, 1, 7, a.skin);
    if (a.wave) rect(x + 4, y - 25 + (Math.floor(t * 6) % 2), 1, 8, a.skin); else rect(x + 4, y - 17 + (fr ? 0 : 1) + (a.dance ? -dswing - 3 : 0), 1, 7, a.skin);
    rect(x - 3, y - 25, 7, 7, a.skin);
    rect(x - 3, y - 26, 7, 3, a.hair); rect(fc > 0 ? x - 4 : x + 3, y - 25, 2, 4, a.hair);
    rect(fc > 0 ? x + 1 : x - 2, y - 22, 1, 1, "#111"); rect(fc > 0 ? x + 3 : x, y - 22, 1, 1, "#111");
  }

  function drawNotes(t) {
    if (still) return;
    for (let i = 0; i < 3; i++) {
      const ph = (t * .5 + i / 3) % 1, [x, y] = P(.9, 3.5, 34 + ph * 40);
      ctx.globalAlpha = 1 - ph;
      rect(x + Math.sin(ph * 6 + i) * 4, y, 2, 2, "#fff"); rect(x + Math.sin(ph * 6 + i) * 4 + 1, y - 5, 1, 5, "#fff"); rect(x + Math.sin(ph * 6 + i) * 4 + 2, y - 5, 2, 1, "#fff");
      ctx.globalAlpha = 1;
    }
  }

  let raf = 0, last = performance.now(), stopped = false;
  function frame(now) {
    const t = now / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
    avs.forEach(a => update(a, dt));
    ctx.clearRect(0, 0, 384, 256);
    drawRoom(t);
    const items = furn.map(f => ({ k: f.key, d: () => f.draw(t) })).concat(avs.map(a => ({ k: a.x + a.y + 1.01, d: () => drawAv(a, t) })));
    items.sort((p, q) => p.k - q.k).forEach(i => i.d());
    drawNotes(t);
    if (!stopped) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  setTimeout(() => !stopped && say(avs[0], "hey!"), 600);
  return { stop() { stopped = true; cancelAnimationFrame(raf); if (bubbles) bubbles.innerHTML = ""; } };
}

let unlocked = false;
try { unlocked = sessionStorage.getItem(KEY + "-open") === "1"; } catch (e) {}
if (unlocked) startApp(); else hotel = startHotel();
$("gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("pw").value.trim().toLowerCase();
  if (v === PASSWORD) {
    try { sessionStorage.setItem(KEY + "-open", "1"); } catch (e) {}
    startApp();
  } else {
    const card = $("gate-form"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    $("pw").value = "";
  }
});
})();
</script>
