<title>Ferry Street</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: record-shop counter. Lesson crate on the left, the request + editor + receipt-style results on the right. */
:root {
  --bg: #eaeef3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #16243a;
  --muted: #56667d;
  --line: #d3dbe5;
  --accent: #e3a624;
  --accent-ink: #875900;
  --on-accent: #1a1405;
  --good: #1d8457;
  --good-bg: #e2f4ea;
  --bad: #b93d29;
  --bad-bg: #fbe9e5;
  --editor-bg: #15213a;
  --editor-fg: #e9eff8;
  --editor-muted: #8fa0bb;
  --vinyl: #15213a;
  --hl-kw: #f0b73a;
  --hl-str: #8fd3a8;
  --hl-com: #8193b2;
  --hl-num: #f4a38f;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1524; --surface: #162139; --surface-2: #1b2843; --ink: #e6ecf5; --muted: #93a3ba;
    --line: #2a3a58; --accent: #f0b73a; --accent-ink: #f3c25a; --on-accent: #1a1405;
    --good: #4cc48b; --good-bg: #133326; --bad: #f2806c; --bad-bg: #3a1c19;
    --editor-bg: #0a1120; --editor-fg: #e9eff8; --editor-muted: #7d8dab; --vinyl: #05080f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1524; --surface: #162139; --surface-2: #1b2843; --ink: #e6ecf5; --muted: #93a3ba;
  --line: #2a3a58; --accent: #f0b73a; --accent-ink: #f3c25a; --on-accent: #1a1405;
  --good: #4cc48b; --good-bg: #133326; --bad: #f2806c; --bad-bg: #3a1c19;
  --editor-bg: #0a1120; --editor-fg: #e9eff8; --editor-muted: #7d8dab; --vinyl: #05080f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
code, pre, textarea { font-family: var(--font-mono); }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; font-size: .88em; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Record (logo) ---------- */
.record {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background:
    radial-gradient(circle, var(--bg) 0 7%, var(--accent) 8% 26%, var(--vinyl) 27% 100%);
  box-shadow: inset 0 0 0 4px var(--vinyl), inset 0 0 0 5px rgba(255,255,255,.08), inset 0 0 0 9px var(--vinyl), inset 0 0 0 10px rgba(255,255,255,.08);
}
.record.spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Gate ---------- */
.gate {
  min-height: 100%; display: grid; place-items: center;
  padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gate-card {
  width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 32px 28px; display: grid; gap: 18px;
}
.gate-card .record { width: 72px; height: 72px; }
.gate-card h1 { font-size: 2rem; font-weight: 800; }
.gate-card p { margin: 0; color: var(--muted); }
.gate-row { display: flex; gap: 8px; }
.gate-row input {
  flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
.gate-err { color: var(--bad); font-weight: 700; min-height: 1.5em; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
kbd { font-family: var(--font-mono); font-size: .72em; opacity: .7; }

/* ---------- App shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.25rem; font-weight: 800; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
.xp { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.rank { text-align: right; line-height: 1.2; }
.rank b { font-family: var(--font-display); display: block; }
.rank span { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.xpbar { width: 120px; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }
.nav-toggle { display: none; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
.nav {
  border-right: 1px solid var(--line); padding: 18px 12px 40px;
  position: sticky; top: calc(61px + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - 61px); overflow-y: auto;
}
.nav h2 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); padding: 0 10px 8px; }
.nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
  padding: 7px 10px; border-radius: 8px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center;
}
.nav button:hover { background: var(--surface-2); }
.nav button.current { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 700; }
.nav .num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: .75rem; font-family: var(--font-mono); border: 1.5px solid var(--line); color: var(--muted);
}
.nav .done .num { background: var(--good); border-color: var(--good); color: var(--surface); }
.nav .boss .num { border-color: var(--accent); color: var(--accent-ink); }
.nav .section-label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }

.main {
  padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; min-width: 0; max-width: 900px; width: 100%;
}
@media (min-width: 861px) { .main { padding-left: 36px; padding-right: 36px; } }
.eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); font-weight: 700; }
.lesson-head { display: grid; gap: 6px; }
.lesson-head h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; }

.memo {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start;
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
}
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 16px; min-width: 0; }
.bubble .who { font-size: .8rem; color: var(--muted); font-weight: 700; }
.bubble p { margin: 2px 0 0; }

.teach { max-width: 68ch; display: grid; gap: 12px; }
.teach p { margin: 0; }
.teach ul { margin: 0; padding-left: 1.2em; }
.example {
  background: var(--editor-bg); color: var(--editor-fg); border-radius: var(--radius);
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 10px 10px 14px; min-width: 0;
}
.example pre { margin: 0; flex: 1; min-width: 0; overflow-x: auto; font-size: .9rem; padding: 2px 0; }
.example button {
  flex: none; border: 1px solid rgba(255,255,255,.2); background: transparent; color: var(--editor-fg);
  border-radius: 6px; padding: 3px 10px; font-size: .8rem;
}
.example button:hover { background: rgba(255,255,255,.1); }
.example.py { flex-direction: column; gap: 4px; }
.example.py pre { width: 100%; }
.example .tag { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; font-family: var(--font-body); }
.hint ul { padding-left: 1.2em; }

.task {
  border: 2px dashed var(--accent); border-radius: var(--radius); padding: 14px 16px;
  background: var(--surface); display: grid; gap: 4px;
}
.task b { font-family: var(--font-display); font-size: 1.05rem; }

details.schema { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.schema summary { padding: 10px 14px; cursor: pointer; font-weight: 700; }
.schema-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.tbl { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; min-width: 0; }
.tbl button { border: 0; background: none; padding: 0; color: var(--accent-ink); font-family: var(--font-mono); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.tbl ul { list-style: none; margin: 4px 0 0; padding: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.tbl li span { color: var(--ink); }

.editor-wrap { background: var(--editor-bg); border-radius: var(--radius); overflow: hidden; }
.editor-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; color: var(--editor-muted); font-size: .8rem; border-bottom: 1px solid rgba(255,255,255,.08); }
.editor-bar .dots { display: flex; gap: 6px; }
.editor-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.15); }
textarea#sql {
  display: block; width: 100%; min-height: 150px; resize: vertical; border: 0; outline: none;
  background: transparent; color: var(--editor-fg); padding: 14px 16px; font-size: .98rem; line-height: 1.6; tab-size: 2;
  caret-color: var(--accent);
}
textarea#sql::placeholder { color: var(--editor-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .spacer { flex: 1; }

.feedback { border-radius: var(--radius); padding: 12px 16px; font-weight: 700; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.info { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
.feedback .msg { flex: 1; min-width: 200px; }
.feedback .msg small { display: block; font-weight: 400; color: var(--ink); opacity: .85; }
.hint { background: var(--surface); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.hint pre { margin: 6px 0 0; white-space: pre-wrap; font-size: .9rem; }

.results { display: grid; gap: 6px; min-width: 0; }
.results .cap { font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--surface-2); font-family: var(--font-mono); font-size: .8rem; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.null { color: var(--muted); font-style: italic; }
td.num { text-align: right; font-family: var(--font-mono); font-size: .85rem; }

.finale { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 8px; }

/* ---------- Tabs ---------- */
.topbar { flex-wrap: wrap; }
.tabs { display: flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 7px; font-weight: 700; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

/* ---------- Step lessons (Objects, Craft) ---------- */
.progress-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.progress-dots i { width: 22px; height: 6px; border-radius: 99px; background: var(--line); }
.progress-dots i.on { background: var(--accent); }
.progress-dots i.ok { background: var(--good); }
.steps { display: grid; gap: 18px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.step.read { background: transparent; border: 0; padding: 0; }
.step.solved { opacity: .92; }
.step .q { font-family: var(--font-display); font-size: 1.12rem; font-weight: 600; line-height: 1.35; }
.step p { margin: 0; }
.step ul, .step ol { margin: 0; padding-left: 1.2em; }
.step-kind { display: flex; align-items: center; gap: 8px; }
.step-kind .done-chip { font-size: .75rem; color: var(--good); font-weight: 700; }
.code { background: var(--editor-bg); color: var(--editor-fg); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: .88rem; line-height: 1.6; margin: 0; white-space: pre; }
.code .k { color: var(--hl-kw); } .code .s { color: var(--hl-str); } .code .c { color: var(--hl-com); font-style: italic; } .code .n { color: var(--hl-num); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.picked { border-color: var(--accent); background: var(--surface-2); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.opt .why { font-size: .9rem; color: var(--ink); opacity: .85; }
.opt pre { margin: 0; white-space: pre-wrap; font-size: .85rem; }
.sort-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sort-row:last-child { border-bottom: 0; }
.sort-row .item { flex: 1 1 220px; min-width: 0; }
.sort-row .item small { display: block; color: var(--muted); }
.sort-row.right .item::before { content: "✓ "; color: var(--good); font-weight: 700; }
.sort-row.wrong .item::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 99px; padding: 4px 12px; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .8rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.spot { background: var(--editor-bg); border-radius: var(--radius); padding: 8px 0; overflow-x: auto; }
.spot button { display: flex; width: 100%; min-width: max-content; border: 0; background: transparent; color: var(--editor-fg); font-family: var(--font-mono); font-size: .88rem; text-align: left; padding: 2px 14px 2px 0; white-space: pre; line-height: 1.6; }
.spot button .ln { width: 38px; flex: none; text-align: right; padding-right: 12px; color: var(--editor-muted); user-select: none; }
.spot button:hover:not(:disabled) { background: rgba(255,255,255,.06); }
.spot button.sel { background: rgba(240,183,58,.22); box-shadow: inset 3px 0 0 var(--accent); }
.spot button.bad { background: rgba(242,128,108,.22); box-shadow: inset 3px 0 0 var(--bad); }
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.order-list li .pos { font-family: var(--font-mono); color: var(--muted); width: 1.5em; flex: none; }
.order-list li .txt { flex: 1; min-width: 0; }
.order-list li.right { border-color: var(--good); }
.order-list li .mv { display: flex; gap: 4px; flex: none; }
.order-list li .mv button { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 6px; width: 32px; height: 30px; }
.answer-input { width: 100%; font-family: var(--font-mono); font-size: .92rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); resize: vertical; }
.write-input { width: 100%; font: inherit; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-height: 140px; resize: vertical; line-height: 1.5; }
.checklist { display: grid; gap: 6px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; }
.checklist input { margin-top: .3em; accent-color: var(--accent); }
.model { border-left: 4px solid var(--good); background: var(--surface-2); padding: 10px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 6px; }
.model pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: .86rem; }
.explain { border-left: 4px solid var(--accent); background: var(--surface-2); padding: 10px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 6px; }
.lab textarea { display: block; width: 100%; min-height: 240px; resize: vertical; border: 0; outline: none; background: transparent; color: var(--editor-fg); padding: 14px 16px; font-size: .9rem; line-height: 1.6; tab-size: 4; caret-color: var(--accent); white-space: pre; overflow-x: auto; }
.tests { display: grid; gap: 4px; font-size: .92rem; }
.tests div { display: flex; gap: 8px; align-items: baseline; }
.tests .pass::before { content: "✓"; color: var(--good); font-weight: 700; }
.tests .fail::before { content: "✗"; color: var(--bad); font-weight: 700; }
.tests small { color: var(--muted); font-family: var(--font-mono); font-size: .8rem; display: block; }
.stdout { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--font-mono); font-size: .82rem; white-space: pre-wrap; max-height: 180px; overflow: auto; margin: 0; }
.step .body, .step .fb, .lab-out, .lab-sol, .compare { display: grid; gap: 10px; min-width: 0; }
.step .fb:empty, .lab-out:empty, .lab-sol:empty, .compare:empty, .step .body:empty { display: none; }
.step, .finale { scroll-margin-top: 90px; }
.hint-line { color: var(--muted); font-size: .9rem; margin: 0; }
.q ul, .q ol, .q p { font-family: var(--font-body); font-size: 1rem; font-weight: 400; margin-top: 8px; line-height: 1.55; }
.q pre.code { font-weight: 400; margin-top: 10px; }
.q code, .opt code { font-weight: 400; }
details.reveal summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); }
details.reveal[open] summary { margin-bottom: 8px; }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }

(function () {

(5,4,12,'2024-02-02',1),(6,4,13,'2024-02-02',1),(7,5,4,'2024-02-14',1),(8,6,10,'2024-02-20',3),
(9,7,3,'2024-03-01',1),(10,7,17,'2024-03-01',1),(11,8,15,'2024-03-09',1),(12,9,18,'2024-03-15',2),
(13,10,6,'2024-03-22',1),(14,10,7,'2024-03-22',1),(15,10,12,'2024-03-30',2),(16,1,8,'2024-04-04',1),
(17,3,14,'2024-04-11',1),(18,2,19,'2024-04-18',1),(19,6,11,'2024-04-25',2),(20,4,3,'2024-05-02',1),
(21,12,1,'2024-05-09',1),(22,9,4,'2024-05-16',1),(23,5,16,'2024-05-23',1),(24,8,14,'2024-06-01',2),
(25,10,13,'2024-06-08',1),(26,7,9,'2024-06-15',1),(27,3,2,'2024-06-22',1),(28,4,15,'2024-06-29',1);

const SCHEMA = [
  { name: "artists", cols: [["id","number"],["name","text"],["genre","text"],["country","text"],["formed","year"]] },
  { name: "albums", cols: [["id","number"],["title","text"],["artist_id","→ artists.id"],["year","number"],["price","£"],["stock","copies"]] },
  { name: "customers", cols: [["id","number"],["name","text"],["city","text"],["joined","date"],["email","text or NULL"]] },
  { name: "sales", cols: [["id","number"],["customer_id","→ customers.id"],["album_id","→ albums.id"],["sold_on","date"],["qty","copies"]] },
];

/* ---- Lessons ---- */
const L = [
 { sec: "The basics" },
 { id: "select-all", title: "Meet the shop",
   story: "Welcome aboard! I'm Dot, I run Ferry Street Records. Everything we know lives in a database. Let's start by having a look at the artists we stock.",
   teach: `<p>A database holds <b>tables</b>, like spreadsheets with named columns. You ask it questions in <b>SQL</b>. The most common question is a <code>SELECT</code>:</p>
<p><code>SELECT</code> says what columns you want, <code>FROM</code> says which table. The <code>*</code> means "every column". The semicolon at the end is optional but tidy.</p>`,
   ex: ["SELECT * FROM customers;"],
   task: "Show every column and every row of the <code>artists</code> table.",
   starter: "", sol: "SELECT * FROM artists;",
   hint: "Same as the example, just a different table name." },

 { id: "columns", title: "Pick your columns",
   story: "I'm printing price tags. I don't need everything, just each album's title and its price.",
   teach: `<p>Instead of <code>*</code>, list the columns you want, separated by commas. They come back in the order you write them.</p>`,
   ex: ["SELECT name, city FROM customers;"],
   task: "List the <code>title</code> and <code>price</code> of every album, in that order.",
   sol: "SELECT title, price FROM albums;",
   hint: "SELECT column1, column2 FROM albums;" },

 { id: "where", title: "Filter with WHERE",
   story: "We're making a bargain bin. Which albums cost less than £15?",
   teach: `<p><code>WHERE</code> keeps only the rows that pass a test. For numbers you can compare with
<code>=</code> <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code> and <code>&lt;&gt;</code> (not equal).</p>`,
   ex: ["SELECT title, year FROM albums WHERE year < 2005;"],
   task: "Show the <code>title</code> and <code>price</code> of albums that cost less than 15.",
   sol: "SELECT title, price FROM albums WHERE price < 15;",
   hint: "Add WHERE price < 15 after FROM albums." },

 { id: "text", title: "Matching text",
   story: "A customer wants jazz. Who are our jazz artists, and where are they from?",
   teach: `<p>Text values go in <b>single quotes</b>: <code>'Jazz'</code>. Without quotes, SQL thinks <code>Jazz</code> is a column name and complains.</p>
<p>Text matching with <code>=</code> is exact, so <code>'jazz'</code> and <code>'Jazz'</code> are different.</p>`,
   ex: ["SELECT name FROM customers WHERE city = 'Leeds';"],
   task: "Show the <code>name</code> and <code>country</code> of every artist whose <code>genre</code> is Jazz.",
   sol: "SELECT name, country FROM artists WHERE genre = 'Jazz';",
   hint: "WHERE genre = 'Jazz' (capital J, single quotes)." },

 { id: "and-or", title: "AND, OR, NOT",
   story: "I want to put recent records in the window, but only ones we actually have on the shelf.",
   teach: `<p>Combine tests with <code>AND</code> (both must be true) or <code>OR</code> (either one). <code>NOT</code> flips a test.
When you mix AND and OR, use brackets to be clear: <code>WHERE (a OR b) AND c</code>.</p>`,
   ex: ["SELECT title FROM albums WHERE price > 20 OR stock = 0;", "SELECT name FROM artists WHERE country = 'UK' AND NOT genre = 'Punk';"],
   task: "Show the <code>title</code> of albums released after 2015 that are in stock (<code>stock</code> greater than 0).",
   sol: "SELECT title FROM albums WHERE year > 2015 AND stock > 0;",
   hint: "Two conditions joined with AND: year > 2015 AND stock > 0" },

 { id: "order", title: "Sorting with ORDER BY",
   story: "Show me the price list, fanciest records at the top.",
   teach: `<p><code>ORDER BY column</code> sorts the result. It sorts smallest first (<code>ASC</code>) unless you add <code>DESC</code>.
It goes after <code>WHERE</code> if you have one.</p>`,
   ex: ["SELECT name, joined FROM customers ORDER BY joined;", "SELECT title, year FROM albums ORDER BY year DESC;"],
   task: "Show <code>title</code> and <code>price</code> of all albums, most expensive first.",
   sol: "SELECT title, price FROM albums ORDER BY price DESC;", ordered: true,
   hint: "ORDER BY price DESC" },

 { id: "limit", title: "Top N with LIMIT",
   story: "I only have room for three records in the glass cabinet. Which three are the most expensive?",
   teach: `<p><code>LIMIT n</code> keeps only the first n rows. With <code>ORDER BY</code> it gives you "top 3", "newest 5" and so on. It always goes last.</p>`,
   ex: ["SELECT name, joined FROM customers ORDER BY joined DESC LIMIT 2;"],
   task: "Show the <code>title</code> and <code>price</code> of the 3 most expensive albums, priciest first.",
   sol: "SELECT title, price FROM albums ORDER BY price DESC LIMIT 3;", ordered: true,
   hint: "Take the last lesson's answer and add LIMIT 3 at the end." },

 { sec: "Sharper filters" },
 { id: "like", title: "Patterns with LIKE",
   story: "Someone called earlier and left a message. All I caught was that their name starts with M. Can you narrow it down?",
   teach: `<p><code>LIKE</code> matches text against a pattern. <code>%</code> means "any characters (or none)" and <code>_</code> means "exactly one character".</p>
<ul><li><code>'M%'</code> starts with M</li><li><code>'%Moon%'</code> contains Moon</li><li><code>'%s'</code> ends with s</li></ul>
<p>In SQLite, LIKE ignores upper/lower case for normal letters.</p>`,
   ex: ["SELECT title FROM albums WHERE title LIKE '%city%';"],
   task: "Show the <code>name</code> of every customer whose name starts with M.",
   sol: "SELECT name FROM customers WHERE name LIKE 'M%';",
   hint: "WHERE name LIKE 'M%'" },

 { id: "in-between", title: "IN and BETWEEN",
   story: "We're doing a noughties night. Find every album released from 2000 to 2010.",
   teach: `<p><code>BETWEEN a AND b</code> is a range test, and it includes both ends. <code>IN (...)</code> checks against a list, which saves writing lots of ORs.</p>`,
   ex: ["SELECT name, city FROM customers WHERE city IN ('Leeds', 'Dublin');", "SELECT title, price FROM albums WHERE price BETWEEN 15 AND 18;"],
   task: "Show the <code>title</code> and <code>year</code> of albums released between 2000 and 2010 (including both).",
   sol: "SELECT title, year FROM albums WHERE year BETWEEN 2000 AND 2010;",
   hint: "WHERE year BETWEEN 2000 AND 2010" },

 { id: "null", title: "Missing values: NULL",
   story: "I want to email everyone about the noughties night. Who haven't we got an email address for?",
   teach: `<p><code>NULL</code> means "no value here". It is not zero and not empty text. It is so special that <code>= NULL</code> never matches anything.
You have to write <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>`,
   ex: ["SELECT name, email FROM customers WHERE email IS NOT NULL;"],
   task: "Show the <code>name</code> of every customer with no email address.",
   sol: "SELECT name FROM customers WHERE email IS NULL;",
   hint: "WHERE email IS NULL (not = NULL)" },

 { id: "distinct", title: "No repeats with DISTINCT",
   story: "I'm making genre dividers for the racks. What genres do we have? Just one of each, please.",
   teach: `<p><code>SELECT DISTINCT</code> removes duplicate rows from the result.</p>`,
   ex: ["SELECT DISTINCT city FROM customers;"],
   task: "List each <code>genre</code> from the artists table once.",
   sol: "SELECT DISTINCT genre FROM artists;",
   hint: "SELECT DISTINCT genre FROM ..." },

 { sec: "Counting and grouping" },
 { id: "aggregates", title: "Counting and totals",
   story: "The accountant is asking two things: how many different albums do we sell, and how many copies are on the shelves in total?",
   teach: `<p><b>Aggregate functions</b> squash many rows into one answer:</p>
<ul><li><code>COUNT(*)</code> number of rows</li><li><code>SUM(col)</code> total</li><li><code>AVG(col)</code> average</li><li><code>MIN(col)</code> and <code>MAX(col)</code></li></ul>`,
   ex: ["SELECT COUNT(*) FROM customers;", "SELECT MIN(price), MAX(price), AVG(price) FROM albums;"],
   task: "Return one row with two columns: the number of albums, and the total of the <code>stock</code> column.",
   sol: "SELECT COUNT(*), SUM(stock) FROM albums;",
   hint: "SELECT COUNT(*), SUM(stock) FROM albums;" },

 { id: "alias", title: "Maths and naming with AS",
   story: "For insurance I need to know what each album's stock is worth: price times copies.",
   teach: `<p>You can do maths in a SELECT: <code>+ - * /</code>. Use <code>AS</code> to give the new column a readable name.
<code>ROUND(x, 2)</code> rounds to 2 decimal places.</p>`,
   ex: ["SELECT title, price, price * 1.2 AS price_with_tax FROM albums;"],
   task: "Show each album's <code>title</code> and its stock value (<code>price * stock</code>) named <code>stock_value</code>.",
   sol: "SELECT title, price * stock AS stock_value FROM albums;",
   hint: "SELECT title, price * stock AS stock_value FROM albums;" },

 { id: "group", title: "GROUP BY",
   story: "Where do our customers live? I'd like a count per city, so I know where to put up posters.",
   teach: `<p><code>GROUP BY col</code> splits rows into groups that share a value, then runs your aggregate once per group.
Select the grouping column too, so you can tell the groups apart.</p>`,
   ex: ["SELECT genre, COUNT(*) FROM artists GROUP BY genre;", "SELECT artist_id, AVG(price) FROM albums GROUP BY artist_id;"],
   task: "Show each <code>city</code> and how many customers live there.",
   sol: "SELECT city, COUNT(*) FROM customers GROUP BY city;",
   hint: "SELECT city, COUNT(*) FROM customers GROUP BY city;" },

 { id: "having", title: "Filtering groups with HAVING",
   story: "Posters cost money. Only show me cities with at least 2 customers.",
   teach: `<p><code>WHERE</code> filters rows <i>before</i> grouping. <code>HAVING</code> filters groups <i>after</i>, so it can use aggregates like <code>COUNT(*)</code>.</p>`,
   ex: ["SELECT genre, COUNT(*) FROM artists GROUP BY genre HAVING COUNT(*) > 1;"],
   task: "Show each <code>city</code> and its customer count, but only cities with 2 or more customers.",
   sol: "SELECT city, COUNT(*) FROM customers GROUP BY city HAVING COUNT(*) >= 2;",
   hint: "Add HAVING COUNT(*) >= 2 after the GROUP BY." },

 { sec: "Joining tables" },
 { id: "join", title: "Joining tables",
   story: "The albums table only says artist_id 3, artist_id 7... I can't read that. Put the artist's name next to each album.",
   teach: `<p>Tables link to each other with ids. <code>albums.artist_id</code> points at <code>artists.id</code>.
A <code>JOIN</code> glues matching rows together side by side, and <code>ON</code> says how they match.</p>
<p>When two tables share a column name (both have <code>id</code>), write <code>table.column</code> to say which one.</p>`,
   ex: ["SELECT sales.sold_on, customers.name\nFROM sales\nJOIN customers ON sales.customer_id = customers.id;"],
   task: "Show each album's <code>title</code> and its artist's <code>name</code>.",
   sol: "SELECT albums.title, artists.name FROM albums JOIN artists ON albums.artist_id = artists.id;",
   hint: "FROM albums JOIN artists ON albums.artist_id = artists.id" },

 { id: "three-way", title: "Table aliases and bigger joins",
   story: "I'd love a readable sales log: who bought what, and when.",
   teach: `<p>Typing table names gets old. Give each table a short alias right after its name, then use it everywhere.
You can chain as many JOINs as you need.</p>`,
   ex: ["SELECT al.title, ar.name\nFROM albums al\nJOIN artists ar ON al.artist_id = ar.id;"],
   task: "For every sale show the customer's <code>name</code>, the album <code>title</code> and <code>sold_on</code>, in that order.",
   sol: "SELECT c.name, a.title, s.sold_on FROM sales s JOIN customers c ON s.customer_id = c.id JOIN albums a ON s.album_id = a.id;",
   hint: "FROM sales s\nJOIN customers c ON s.customer_id = c.id\nJOIN albums a ON s.album_id = a.id" },

 { id: "join-group", title: "Joins plus GROUP BY",
   story: "Who's actually selling? Total copies sold per artist, best sellers first.",
   teach: `<p>Joins and grouping work together: join first to get the columns you need, then group.
To break ties when sorting, add a second column: <code>ORDER BY total DESC, name</code>.</p>`,
   ex: ["SELECT c.city, SUM(s.qty) AS copies\nFROM sales s\nJOIN customers c ON s.customer_id = c.id\nGROUP BY c.city\nORDER BY copies DESC;"],
   task: "Show each artist's <code>name</code> and total copies sold (<code>SUM(qty)</code>). Highest first, ties sorted by name A to Z. Leave out artists with no sales.",
   sol: "SELECT ar.name, SUM(s.qty) AS total FROM sales s JOIN albums al ON s.album_id = al.id JOIN artists ar ON al.artist_id = ar.id GROUP BY ar.name ORDER BY total DESC, ar.name;", ordered: true,
   hint: "sales → albums → artists. GROUP BY ar.name, ORDER BY total DESC, ar.name" },

 { id: "left-join", title: "LEFT JOIN",
   story: "I think there's an artist in our system with no albums in the shop at all. Can you find them?",
   teach: `<p>A plain <code>JOIN</code> drops rows that have no match. A <code>LEFT JOIN</code> keeps every row from the left table and fills the missing side with NULL.
So "things with no match" = <code>LEFT JOIN</code> + <code>WHERE right.id IS NULL</code>.</p>`,
   ex: ["SELECT c.name, s.id\nFROM customers c\nLEFT JOIN sales s ON s.customer_id = c.id\nWHERE s.id IS NULL;"],
   task: "Show the <code>name</code> of every artist who has no albums.",
   sol: "SELECT ar.name FROM artists ar LEFT JOIN albums al ON al.artist_id = ar.id WHERE al.id IS NULL;",
   hint: "FROM artists ar LEFT JOIN albums al ON al.artist_id = ar.id WHERE al.id IS NULL" },

 { id: "subquery", title: "Queries inside queries",
   story: "Which albums are priced above our average price? I might be overcharging.",
   teach: `<p>A <b>subquery</b> is a query in brackets used inside another query. Here the inner one works out a single number, and the outer one uses it.</p>`,
   ex: ["SELECT name FROM customers\nWHERE id IN (SELECT customer_id FROM sales WHERE qty > 1);"],
   task: "Show the <code>title</code> and <code>price</code> of albums that cost more than the average album price.",
   sol: "SELECT title, price FROM albums WHERE price > (SELECT AVG(price) FROM albums);",
   hint: "WHERE price > (SELECT AVG(price) FROM albums)" },

 { sec: "Changing data" },
 { id: "insert", title: "Adding rows with INSERT",
   story: "New regular! Zoe Hart from Leeds signed up today, 2024-10-01. She didn't give an email.",
   teach: `<p><code>INSERT INTO table (columns) VALUES (values);</code> adds a row. Skip the <code>id</code> and the database picks the next number for you.</p>
<p>Don't worry about breaking things: every run starts from a fresh copy of the shop.</p>`,
   ex: ["INSERT INTO artists (name, genre, country, formed)\nVALUES ('Test Band', 'Rock', 'UK', 2024);\nSELECT * FROM artists;"],
   task: "Add customer <b>Zoe Hart</b>, city <b>Leeds</b>, joined <b>2024-10-01</b>, email NULL.",
   mutate: true, verify: "SELECT name, city, joined, email FROM customers ORDER BY id;", verifyLabel: "customers table after your change",
   sol: "INSERT INTO customers (name, city, joined, email) VALUES ('Zoe Hart', 'Leeds', '2024-10-01', NULL);",
   hint: "INSERT INTO customers (name, city, joined, email)\nVALUES ('Zoe Hart', 'Leeds', '2024-10-01', NULL);" },

 { id: "update", title: "Changing rows with UPDATE",
   story: "Our supplier put prices up. Add £1 to every album that currently costs under £15.",
   teach: `<p><code>UPDATE table SET col = value WHERE ...;</code> changes existing rows. You can use the old value: <code>SET price = price + 1</code>.</p>
<p><b>Always</b> think about the WHERE. Leave it out and every row changes.</p>`,
   ex: ["UPDATE albums SET stock = 10 WHERE title = 'Snowline';\nSELECT title, stock FROM albums;"],
   task: "Increase <code>price</code> by 1 for every album priced under 15.",
   mutate: true, verify: "SELECT id, title, price FROM albums ORDER BY id;", verifyLabel: "albums table after your change",
   sol: "UPDATE albums SET price = price + 1 WHERE price < 15;",
   hint: "UPDATE albums SET price = price + 1 WHERE price < 15;" },

 { id: "delete", title: "Removing rows with DELETE",
   story: "Time for a clear-out. Remove every album we've got zero copies of.",
   teach: `<p><code>DELETE FROM table WHERE ...;</code> removes rows. Same warning as UPDATE: without WHERE it empties the whole table.</p>`,
   ex: ["DELETE FROM customers WHERE city = 'Glasgow';\nSELECT * FROM customers;"],
   task: "Delete every album whose <code>stock</code> is 0.",
   mutate: true, verify: "SELECT id, title, stock FROM albums ORDER BY id;", verifyLabel: "albums table after your change",
   sol: "DELETE FROM albums WHERE stock = 0;",
   hint: "DELETE FROM albums WHERE stock = 0;" },

 { id: "create", title: "Making a table",
   story: "Customers keep asking us to hold records for them. Let's start a wishlist. Ana (customer 5) wants Woodsmoke (album 9).",
   teach: `<p><code>CREATE TABLE</code> makes a new, empty table. You list each column and its type: <code>INTEGER</code>, <code>TEXT</code>, <code>REAL</code> (decimals).
<code>INTEGER PRIMARY KEY</code> makes an id that fills itself in.</p>
<p>You can run several statements at once, separated by semicolons.</p>`,
   ex: ["CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT);\nINSERT INTO notes (body) VALUES ('Order more jazz');\nSELECT * FROM notes;"],
   task: "Create a table <code>wishlist</code> with columns <code>id</code>, <code>customer_id</code> and <code>album_id</code>, then insert one row: customer 5, album 9.",
   mutate: true, verify: "SELECT customer_id, album_id FROM wishlist;", verifyLabel: "wishlist table after your change",

   hint: "CREATE TABLE wishlist (id INTEGER PRIMARY KEY, customer_id INTEGER, album_id INTEGER);\nINSERT INTO wishlist (customer_id, album_id) VALUES (5, 9);" },

 { id: "boss", title: "Boss level: best customer", boss: true,
   story: "Big one to finish the querying course. I want to send a thank-you card to whoever has spent the most money here. Who is it, and how much?",
   teach: `<p>Everything comes together: join <code>sales</code> to <code>albums</code> to get prices, work out <code>qty * price</code> for each sale,
join <code>customers</code> for names, group by customer, sum, sort, and keep the top one.</p>`,
   ex: [],
   task: "Show the <code>name</code> and total spent (sum of <code>qty * price</code>) of the single biggest-spending customer.",
   sol: "SELECT c.name, SUM(s.qty * a.price) AS spent FROM sales s JOIN albums a ON s.album_id = a.id JOIN customers c ON s.customer_id = c.id GROUP BY c.id ORDER BY spent DESC LIMIT 1;", ordered: true,

 { sec: "Building apps" },
 { id: "design", title: "Designing a table",
   story: "We're hiring! I want to keep track of staff in the database. Can you set up a proper table, one that won't let me type in rubbish?",
   teach: `<p>When you build an app, you design the tables before you write the code that uses them. For every column you decide three things: its <b>name</b>, the <b>type</b> of data it holds, and what's <b>allowed</b> in it.</p>
<p>SQLite's main types are <code>INTEGER</code> (whole numbers), <code>REAL</code> (decimals) and <code>TEXT</code>. Bigger databases such as PostgreSQL add more, like <code>DATE</code>, <code>BOOLEAN</code> and <code>VARCHAR(100)</code>.</p>
<p><b>Constraints</b> are rules the database enforces on every insert and update, whichever program sends it:</p>
<ul><li><code>PRIMARY KEY</code> gives each row a unique id. <code>INTEGER PRIMARY KEY</code> numbers itself, so you never supply it.</li>
<li><code>NOT NULL</code> means a value must be supplied.</li>
<li><code>DEFAULT x</code> is the value used when an insert leaves the column out.</li></ul>
<p>Why not just check in Python? Because bugs happen, quick scripts skip the checks, and several programs may share one database. A rule in the table catches all of them. In this track, your table is graded by running tests against it: some inserts should be allowed and some should be rejected.</p>`,
   ex: ["CREATE TABLE suppliers (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL,\n  country TEXT DEFAULT 'UK'\n);\nINSERT INTO suppliers (name) VALUES ('Vinyl Direct');\nSELECT * FROM suppliers;"],
   py: "import sqlite3\n\ncon = sqlite3.connect(\"shop.db\")   # creates the file if it doesn't exist\ncon.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS staff (\n        id   INTEGER PRIMARY KEY,\n        name TEXT NOT NULL,\n        role TEXT NOT NULL DEFAULT 'clerk'\n    )\n\"\"\")\ncon.commit()\n# IF NOT EXISTS lets this run every time your app starts without crashing.",
   task: "Create a table <code>staff</code> with: <code>id</code> (self-numbering primary key), <code>name</code> (text, required) and <code>role</code> (text, required, defaults to <code>'clerk'</code>).",
   probes: [
     ["Add Jo with no role given", "INSERT INTO staff (name) VALUES ('Jo');"],
     ["Jo's role", "SELECT role FROM staff WHERE name = 'Jo';"],
     ["Add Sam as manager", "INSERT INTO staff (name, role) VALUES ('Sam', 'manager');"],
     ["Add someone with no name", "INSERT INTO staff (role) VALUES ('clerk');"],
     ["Add Kit with role NULL", "INSERT INTO staff (name, role) VALUES ('Kit', NULL);"],
     ["Ids handed out", "SELECT id FROM staff ORDER BY id;"]],
   sol: "CREATE TABLE staff (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL,\n  role TEXT NOT NULL DEFAULT 'clerk'\n);",
   hint: "CREATE TABLE staff (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL,\n  role TEXT ... DEFAULT ...\n);" },

 { id: "unique", title: "No duplicates with UNIQUE",
   story: "I'm starting a newsletter. Last time I used a spreadsheet and half the list got every email twice.",
   teach: `<p><code>UNIQUE</code> means no two rows may share a value in that column. Insert a duplicate and the database refuses with an error.</p>
<p>The database is the right place for this rule. If your Python asks "is this email already there?" and then inserts, two sign-ups arriving at the same moment can both pass the check. The database's own check can't be raced like that.</p>
<p>Two details:</p>
<ul><li>UNIQUE still allows several NULLs, because NULL means "unknown" and two unknowns don't count as equal. Add <code>NOT NULL</code> if the value is required.</li>
<li>You can make a <i>combination</i> unique: <code>UNIQUE (customer_id, album_id)</code> allows each pair only once.</li></ul>
<p>In Python, a broken rule arrives as a <code>sqlite3.IntegrityError</code>. Catch it and turn it into a friendly message instead of a crash.</p>`,
   ex: ["CREATE TABLE codes (id INTEGER PRIMARY KEY, code TEXT UNIQUE);\nINSERT INTO codes (code) VALUES ('A1');\nINSERT INTO codes (code) VALUES ('A1');"],
   py: "email = input(\"Your email: \")\ntry:\n    with con:\n        con.execute(\"INSERT INTO newsletter (email) VALUES (?)\", (email,))\n    print(\"Thanks for signing up!\")\nexcept sqlite3.IntegrityError:\n    print(\"You're already on the list.\")",
   task: "Create a table <code>newsletter</code> with <code>id</code> (primary key) and <code>email</code> (text, required, no duplicates).",
   probes: [
     ["Sign up maya@example.com", "INSERT INTO newsletter (email) VALUES ('maya@example.com');"],
     ["Sign up tom@example.com", "INSERT INTO newsletter (email) VALUES ('tom@example.com');"],
     ["Sign up maya@example.com again", "INSERT INTO newsletter (email) VALUES ('maya@example.com');"],
     ["Sign up with no email", "INSERT INTO newsletter (email) VALUES (NULL);"],
     ["Rows in the table", "SELECT COUNT(*) FROM newsletter;"]],
   sol: "CREATE TABLE newsletter (\n  id INTEGER PRIMARY KEY,\n  email TEXT NOT NULL UNIQUE\n);",
   hint: "A column can have several constraints: email TEXT NOT NULL UNIQUE" },

 { id: "check", title: "Custom rules with CHECK",
   story: "We're selling gift cards. The old till once let a card go to minus £20. Never again.",
   teach: `<p><code>CHECK (condition)</code> lets you write your own rule. Every insert <i>and</i> every update must leave the condition true, or the change is rejected.</p>
<ul><li><code>CHECK (balance &gt;= 0)</code></li>
<li><code>CHECK (stars BETWEEN 1 AND 5)</code></li>
<li><code>CHECK (status IN ('open', 'shipped', 'cancelled'))</code></li></ul>
<p>Because it covers updates, a buggy "spend £30 from a £10 card" fails with an error instead of quietly leaving a negative balance.</p>
<p>One catch: a CHECK passes when the value is NULL, because the answer is "unknown" rather than false. Pair it with <code>NOT NULL</code> when the value is required.</p>`,
   ex: ["CREATE TABLE ratings (id INTEGER PRIMARY KEY, stars INTEGER CHECK (stars BETWEEN 1 AND 5));\nINSERT INTO ratings (stars) VALUES (4);\nINSERT INTO ratings (stars) VALUES (11);"],
   py: "def spend(code, amount):\n    try:\n        with con:\n            con.execute(\n                \"UPDATE gift_cards SET balance = balance - ? WHERE code = ?\",\n                (amount, code),\n            )\n    except sqlite3.IntegrityError:\n        print(\"Not enough left on that card.\")",
   task: "Create <code>gift_cards</code> with <code>id</code> (primary key), <code>code</code> (text, required, unique) and <code>balance</code> (decimal, required, never below 0).",
   probes: [
     ["New card GIFT-01 with £25", "INSERT INTO gift_cards (code, balance) VALUES ('GIFT-01', 25);"],
     ["New card GIFT-02 with -£5", "INSERT INTO gift_cards (code, balance) VALUES ('GIFT-02', -5);"],
     ["Spend £30 from GIFT-01", "UPDATE gift_cards SET balance = balance - 30 WHERE code = 'GIFT-01';"],
     ["Spend £10 from GIFT-01", "UPDATE gift_cards SET balance = balance - 10 WHERE code = 'GIFT-01';"],
     ["GIFT-01 balance", "SELECT balance FROM gift_cards WHERE code = 'GIFT-01';"],
     ["Another card called GIFT-01", "INSERT INTO gift_cards (code, balance) VALUES ('GIFT-01', 5);"],
     ["Card with no balance", "INSERT INTO gift_cards (code) VALUES ('GIFT-03');"]],
   sol: "CREATE TABLE gift_cards (\n  id INTEGER PRIMARY KEY,\n  code TEXT NOT NULL UNIQUE,\n  balance REAL NOT NULL CHECK (balance >= 0)\n);",
   hint: "balance REAL NOT NULL CHECK (balance >= 0)" },

 { id: "fk", title: "Foreign keys", fk: true,
   story: "Customers want to leave reviews. Last week someone's script saved a review for an album we've never stocked.",
   teach: `<p>In the first course, <code>albums.artist_id</code> pointed at <code>artists.id</code>, but nothing stopped anyone typing artist_id 999. A <b>foreign key</b> makes the link official:</p>
<p><code>album_id INTEGER REFERENCES albums(id)</code></p>
<p>Now the database refuses:</p>
<ul><li>a review for an album that doesn't exist</li>
<li>deleting an album that still has reviews, which would leave them pointing at nothing</li></ul>
<p>You can choose what a delete does instead: <code>ON DELETE CASCADE</code> deletes the reviews too, and <code>ON DELETE SET NULL</code> blanks the link. With neither, the delete is refused.</p>
<p><b>SQLite quirk:</b> foreign keys are only enforced if each connection runs <code>PRAGMA foreign_keys = ON;</code>. This lesson turns it on for you. In your own Python, do it right after connecting. PostgreSQL and most other databases always enforce them.</p>`,
   ex: ["SELECT al.title, ar.name\nFROM albums al JOIN artists ar ON al.artist_id = ar.id\nLIMIT 3;"],
   py: "con = sqlite3.connect(\"shop.db\")\ncon.execute(\"PRAGMA foreign_keys = ON\")   # every time you connect\n\ntry:\n    with con:\n        con.execute(\"INSERT INTO reviews (album_id, stars) VALUES (?, ?)\", (album_id, stars))\nexcept sqlite3.IntegrityError as e:\n    print(\"Couldn't save review:\", e)",
   task: "Create <code>reviews</code> with <code>id</code> (primary key), <code>album_id</code> (required, must point to a real album in <code>albums</code>) and <code>stars</code> (whole number, required, 1 to 5).",
   probes: [
     ["5-star review of Snowline (album 8)", "INSERT INTO reviews (album_id, stars) VALUES (8, 5);"],
     ["Review of album 999", "INSERT INTO reviews (album_id, stars) VALUES (999, 4);"],
     ["Review with no album", "INSERT INTO reviews (album_id, stars) VALUES (NULL, 4);"],
     ["9-star review of Snowline", "INSERT INTO reviews (album_id, stars) VALUES (8, 9);"],
     ["Delete Snowline (it has a review)", "DELETE FROM albums WHERE id = 8;"],
     ["Delete Woodsmoke (no reviews)", "DELETE FROM albums WHERE id = 9;"]],
   sol: "CREATE TABLE reviews (\n  id INTEGER PRIMARY KEY,\n  album_id INTEGER NOT NULL REFERENCES albums(id),\n  stars INTEGER NOT NULL CHECK (stars BETWEEN 1 AND 5)\n);",
   hint: "album_id INTEGER NOT NULL REFERENCES albums(id)\nstars INTEGER NOT NULL CHECK (...)" },

 { id: "many-to-many", title: "Many-to-many links", fk: true,
   story: "I want to tag albums: 'rainy day', 'staff pick' and so on. An album can have lots of tags and a tag can be on lots of albums. Where does that even go?",
   teach: `<p>Links between tables come in a few shapes:</p>
<ul><li><b>One-to-many:</b> one artist has many albums. Put <code>artist_id</code> on the albums table, as the shop already does.</li>
<li><b>Many-to-many:</b> albums have many tags and tags have many albums. Neither table can hold the link by itself.</li></ul>
<p>For many-to-many you add a <b>junction table</b> holding one row per link: (album 8, tag 1), (album 8, tag 2), (album 12, tag 2). Its primary key is the <i>pair</i> of columns, <code>PRIMARY KEY (album_id, tag_id)</code>, so the same link can't be added twice.</p>
<p>Tempted to store <code>'rainy day,staff pick'</code> as text in one column? Don't. You can't join on it, renaming a tag means editing every album, and nothing stops typos. Splitting data so each fact is stored exactly once is called <b>normalisation</b>, and it's the heart of good table design.</p>`,
   ex: ["CREATE TABLE pairs (a INTEGER, b INTEGER, PRIMARY KEY (a, b));\nINSERT INTO pairs VALUES (1, 1), (1, 2), (2, 1);\nSELECT * FROM pairs;"],
   py: "def tags_for(album_id):\n    rows = con.execute(\"\"\"\n        SELECT t.name\n        FROM album_tags l\n        JOIN tags t ON t.id = l.tag_id\n        WHERE l.album_id = ?\n        ORDER BY t.name\n    \"\"\", (album_id,)).fetchall()\n    return [name for (name,) in rows]\n\n# In an ORM like SQLAlchemy this is relationship(secondary=album_tags),\n# but underneath it's exactly this junction table.",
   task: "Create <code>tags</code> (<code>id</code> primary key, <code>name</code> required and unique) and <code>album_tags</code> (<code>album_id</code> pointing to albums, <code>tag_id</code> pointing to tags, both required, with the pair as the primary key).",
   probes: [
     ["Add tag 'rainy day'", "INSERT INTO tags (name) VALUES ('rainy day');"],
     ["Add tag 'staff pick'", "INSERT INTO tags (name) VALUES ('staff pick');"],
     ["Add tag 'rainy day' again", "INSERT INTO tags (name) VALUES ('rainy day');"],
     ["Tag Snowline as rainy day", "INSERT INTO album_tags (album_id, tag_id) VALUES (8, 1);"],
     ["Tag Snowline as staff pick", "INSERT INTO album_tags (album_id, tag_id) VALUES (8, 2);"],
     ["Tag Accra Nights as staff pick", "INSERT INTO album_tags (album_id, tag_id) VALUES (12, 2);"],
     ["Tag Snowline as rainy day again", "INSERT INTO album_tags (album_id, tag_id) VALUES (8, 1);"],
     ["Tag Snowline with tag 99", "INSERT INTO album_tags (album_id, tag_id) VALUES (8, 99);"],
     ["Snowline's tags", "SELECT t.name FROM album_tags l JOIN tags t ON t.id = l.tag_id WHERE l.album_id = 8 ORDER BY t.name;"]],
   sol: "CREATE TABLE tags (\n  id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL UNIQUE\n);\nCREATE TABLE album_tags (\n  album_id INTEGER NOT NULL REFERENCES albums(id),\n  tag_id INTEGER NOT NULL REFERENCES tags(id),\n  PRIMARY KEY (album_id, tag_id)\n);",
   hint: "Two CREATE TABLE statements. The second ends with:\n  PRIMARY KEY (album_id, tag_id)" },

 { id: "migrate", title: "Changing tables: migrations",
   story: "Customers want a text when new stock lands. We need a phone number column and an opt-in setting, without losing two years of customer data.",
   teach: `<p>Your tables will change as your app grows. You can't drop and recreate them, because the data in them is real. <code>ALTER TABLE</code> changes a table in place:</p>
<ul><li><code>ALTER TABLE customers ADD COLUMN phone TEXT;</code></li>
<li><code>ALTER TABLE customers RENAME COLUMN city TO town;</code></li>
<li><code>ALTER TABLE customers DROP COLUMN phone;</code></li></ul>
<p>Existing rows get NULL in a new column, or its DEFAULT if it has one. That's why you can only add a <code>NOT NULL</code> column if you also give it a DEFAULT: otherwise every existing row would break the rule.</p>
<p>Each change like this is a <b>migration</b>. In a real project, migrations are kept as numbered files in your code, so every copy of the database (your laptop, the live server, a teammate's machine) gets the same changes in the same order. Tools handle this for you: <b>Alembic</b> with SQLAlchemy, or Django's <code>makemigrations</code> and <code>migrate</code>.</p>`,
   ex: ["ALTER TABLE artists ADD COLUMN website TEXT;\nSELECT * FROM artists;"],
   py: "# A tiny homemade migration runner.\n# PRAGMA user_version is a spare number SQLite keeps for you.\nMIGRATIONS = [\n    \"ALTER TABLE customers ADD COLUMN phone TEXT\",\n    \"ALTER TABLE customers ADD COLUMN alerts INTEGER NOT NULL DEFAULT 0\",\n]\n\ndone = con.execute(\"PRAGMA user_version\").fetchone()[0]\nfor number, sql in enumerate(MIGRATIONS[done:], start=done + 1):\n    with con:\n        con.execute(sql)\n        con.execute(f\"PRAGMA user_version = {number}\")  # our own number, not user input",
   task: "Add two columns to <code>customers</code>: <code>phone</code> (text) and <code>alerts</code> (whole number, required, default 0).",
   requires: [["ALTER\\s+TABLE", "Use ALTER TABLE so the existing customers are kept."]],
   probes: [
     ["Customers still there", "SELECT COUNT(*) FROM customers;"],
     ["Maya's alerts setting", "SELECT alerts FROM customers WHERE name = 'Maya Chen';"],
     ["Save Maya's phone number", "UPDATE customers SET phone = '0113 496 0000' WHERE name = 'Maya Chen';"],
     ["Turn alerts on for Maya", "UPDATE customers SET alerts = 1 WHERE name = 'Maya Chen';"],
     ["Set Tom's alerts to NULL", "UPDATE customers SET alerts = NULL WHERE name = 'Tom Reilly';"],
     ["Customers with alerts on", "SELECT name, phone FROM customers WHERE alerts = 1;"]],
   sol: "ALTER TABLE customers ADD COLUMN phone TEXT;\nALTER TABLE customers ADD COLUMN alerts INTEGER NOT NULL DEFAULT 0;",
   hint: "Two statements:\nALTER TABLE customers ADD COLUMN phone TEXT;\nALTER TABLE customers ADD COLUMN alerts ... ;" },

 { id: "index", title: "Speed with indexes",
   story: "The website's 'your orders' page is getting slow. Every time someone logs in, we look up their sales.",
   teach: `<p>To find one customer's sales, the database normally reads <i>every</i> row in <code>sales</code>. That's a <b>full table scan</b>: fine for 28 rows, painful for 28 million.</p>
<p>An <b>index</b> works like the index at the back of a book: a sorted list of values with a pointer to each row. With an index on <code>sales(customer_id)</code> the database jumps straight to the right rows.</p>
<ul><li>Index columns you often use in <code>WHERE</code>, <code>JOIN ... ON</code> or <code>ORDER BY</code>. Foreign key columns are the classic case.</li>
<li>Primary keys and UNIQUE columns get an index automatically.</li>
<li>Don't index everything. Each index takes space and makes inserts and updates a little slower, because it has to be kept up to date.</li></ul>
<p>Put <code>EXPLAIN QUERY PLAN</code> in front of a query to see how it will run. <code>SCAN</code> means it reads everything. <code>SEARCH ... USING INDEX</code> means it jumps straight there. Run both examples below and compare.</p>`,
   ex: ["EXPLAIN QUERY PLAN\nSELECT * FROM sales WHERE customer_id = 4;", "CREATE INDEX idx_demo ON sales(customer_id);\nEXPLAIN QUERY PLAN\nSELECT * FROM sales WHERE customer_id = 4;"],
   py: "con.execute(\"CREATE INDEX IF NOT EXISTS idx_sales_customer ON sales(customer_id)\")\n\n# In SQLAlchemy you'd write:  customer_id = mapped_column(ForeignKey(...), index=True)\n# In Django:                  customer = models.ForeignKey(..., db_index=True)  (on by default)",
   task: "Create an index called <code>idx_sales_customer</code> on the <code>customer_id</code> column of <code>sales</code>.",
   mutate: true, verifyLabel: "indexes in the database after your change",
   verify: "SELECT m.name AS index_name, m.tbl_name AS on_table, i.name AS column_name FROM sqlite_master m JOIN pragma_index_info(m.name) i WHERE m.type = 'index' AND m.name NOT LIKE 'sqlite_%' ORDER BY m.name, i.seqno;",
   sol: "CREATE INDEX idx_sales_customer ON sales(customer_id);",
   hint: "CREATE INDEX name ON table(column);" },

 { id: "transaction", title: "All or nothing: transactions",
   story: "When we sell a record, two things must happen: log the sale and take one off the stock. If the power cuts out between them, the numbers stop adding up.",
   teach: `<p>A <b>transaction</b> groups several statements into one all-or-nothing unit. Either every change is saved, or none is.</p>
<ul><li><code>BEGIN;</code> starts a transaction</li>
<li><code>COMMIT;</code> saves everything since BEGIN</li>
<li><code>ROLLBACK;</code> throws it all away</li></ul>
<p>Until you commit, other connections can't see your half-finished changes. If your program crashes mid-way, the database undoes them. This is the "A" for <b>atomic</b> in ACID, the set of guarantees that makes databases trustworthy.</p>
<p><b>In Python</b>, <code>sqlite3</code> starts a transaction for you when you first change data, and nothing is saved until <code>con.commit()</code>. Forgetting to commit is the classic "my data vanished" bug. The tidy way is <code>with con:</code>, which commits when the block finishes and rolls back if anything inside raises an error.</p>`,
   ex: ["BEGIN;\nUPDATE albums SET price = 0;\nROLLBACK;\nSELECT title, price FROM albums;"],
   py: "def sell(customer_id, album_id, day):\n    with con:   # one transaction: both saved, or neither\n        con.execute(\n            \"INSERT INTO sales (customer_id, album_id, sold_on, qty) VALUES (?, ?, ?, 1)\",\n            (customer_id, album_id, day),\n        )\n        con.execute(\"UPDATE albums SET stock = stock - 1 WHERE id = ?\", (album_id,))\n\nsell(11, 8, \"2024-10-20\")",
   task: "Martin Duff (customer 11) buys one copy of Snowline (album 8) on 2024-10-20. Inside one transaction, add the sale to <code>sales</code> and reduce Snowline's stock by 1.",
   mutate: true, verifyLabel: "what the shop looks like after your transaction",
   verify: "SELECT (SELECT COUNT(*) FROM sales WHERE customer_id = 11 AND album_id = 8 AND sold_on = '2024-10-20' AND qty = 1) AS martins_sale, (SELECT stock FROM albums WHERE id = 8) AS snowline_stock, (SELECT COUNT(*) FROM sales) AS total_sales;",
   requires: [["\\bBEGIN\\b", "Start with BEGIN; so both changes are one transaction."], ["\\bCOMMIT\\b", "Finish with COMMIT; to save the transaction."]],
   sol: "BEGIN;\nINSERT INTO sales (customer_id, album_id, sold_on, qty) VALUES (11, 8, '2024-10-20', 1);\nUPDATE albums SET stock = stock - 1 WHERE id = 8;\nCOMMIT;",
   hint: "BEGIN;\nINSERT INTO sales (...) VALUES (...);\nUPDATE albums SET stock = stock - 1 WHERE ...;\nCOMMIT;" },

 { id: "upsert", title: "Insert or update: upserts",
   setup: "CREATE TABLE plays (album_id INTEGER PRIMARY KEY, count INTEGER NOT NULL);\nINSERT INTO plays VALUES (8, 3), (14, 10);",
   story: "I've put a listening station in the shop. Each time someone plays an album, the app adds 1 to its play count, even the first time it's played. I've made a plays table already.",
   teach: `<p>Apps constantly need "add this row, or if it's already there, update it". Doing that in Python as <i>check, then insert or update</i> takes two trips to the database and can go wrong when two requests arrive together.</p>
<p>An <b>upsert</b> does it in one statement. It needs a PRIMARY KEY or UNIQUE column to spot the clash:</p>
<p><code>INSERT INTO plays (album_id, count) VALUES (8, 1)<br>ON CONFLICT (album_id) DO UPDATE SET count = count + 1;</code></p>
<p>If album 8 has no row yet, it's inserted with a count of 1. If it has one, the update runs instead. Inside <code>DO UPDATE</code>, plain <code>count</code> means the value already in the table, and <code>excluded.count</code> means the value you tried to insert.</p>
<p>Its cousin <code>INSERT OR IGNORE</code> simply skips rows that would clash. PostgreSQL uses the same <code>ON CONFLICT</code> syntax; MySQL calls it <code>ON DUPLICATE KEY UPDATE</code>.</p>
<p>The <code>plays</code> table already exists in this lesson: album 8 has 3 plays and album 14 has 10.</p>`,
   ex: ["INSERT INTO plays (album_id, count) VALUES (14, 50)\nON CONFLICT (album_id) DO UPDATE SET count = excluded.count;\nSELECT * FROM plays;"],
   py: "def record_play(album_id):\n    with con:\n        con.execute(\"\"\"\n            INSERT INTO plays (album_id, count) VALUES (?, 1)\n            ON CONFLICT (album_id) DO UPDATE SET count = count + 1\n        \"\"\", (album_id,))",
   task: "Record one play for Snowline (album 8, already has a row) and one for Woodsmoke (album 9, never played) using upserts.",
   mutate: true, verifyLabel: "plays table after your change",
   verify: "SELECT album_id, count FROM plays ORDER BY album_id;",
   requires: [["ON\\s+CONFLICT", "Use INSERT ... ON CONFLICT ... DO UPDATE, so the same statement works whether or not the row exists."]],
   sol: "INSERT INTO plays (album_id, count) VALUES (8, 1)\nON CONFLICT (album_id) DO UPDATE SET count = count + 1;\nINSERT INTO plays (album_id, count) VALUES (9, 1)\nON CONFLICT (album_id) DO UPDATE SET count = count + 1;",
   hint: "Write the same upsert twice, once with 8 and once with 9:\nINSERT INTO plays (album_id, count) VALUES (8, 1)\nON CONFLICT (album_id) DO UPDATE SET count = count + 1;" },

 { id: "inject", title: "Boss level: break in, then lock up", boss: true, inject: true,
   template: "SELECT name, email FROM customers WHERE name = '{input}'",
   story: "A freelancer built the customer search on our website and swore it was safe. Prove them wrong before someone else does.",
   teach: `<p>Here's the freelancer's Python. It pastes whatever the visitor types straight into the SQL text:</p>
<div class="example py"><span class="tag">Python</span><pre>name = request.args["name"]     # whatever the visitor typed
sql = f"SELECT name, email FROM customers WHERE name = '{name}'"
rows = con.execute(sql).fetchall()</pre></div>
<p>Search for <code>Maya Chen</code> and you get Maya. But the visitor now controls part of the SQL. A quote character ends the text early, and anything typed after it is run as SQL. This is <b>SQL injection</b>, one of the most common ways real websites get breached.</p>
<p><b>Your mission:</b> type something into the search box that makes the site show <i>every</i> customer's email. Once you're in, you'll see the fix.</p>`,
   ex: [],
   win: `<b>Now lock it up. The fix is a placeholder.</b>
<pre>rows = con.execute(
    "SELECT name, email FROM customers WHERE name = ?",
    (name,),
).fetchall()</pre>
<p style="margin:8px 0 0">The SQL and the value travel to the database separately, so a quote in the value is just a quote, never code.</p>
<ul style="margin:6px 0 0"><li>Placeholders are <code>?</code> in sqlite3 and <code>%s</code> in psycopg (PostgreSQL). Named ones look like <code>:name</code>.</li>
<li>They work for values only. Table and column names can't be placeholders, so if those come from users, pick them from a fixed list in your code.</li>
<li>ORMs like SQLAlchemy and Django use placeholders for you, which is a big reason to use them.</li>
<li>Rule of thumb: if you see an f-string, <code>+</code> or <code>.format()</code> building SQL with outside data, it's a bug.</li></ul>`,
   task: "Type a search that makes the site list all 12 customers.",

   hint: "End the name early with a quote, then add a condition that's always true. For example:\n' OR '1'='1" },

function lastResult(results) {
  if (!results || !results.length) return { columns: [], values: [] };

function normCell(v) {
  if (v === null || v === undefined) return "∅";
  if (typeof v === "number") return String(Math.round(v * 1e6) / 1e6);
  return String(v);
}
function normRows(res, ordered) {
  const rows = res.values.map(r => JSON.stringify(r.map(normCell)));
  return ordered ? rows : rows.slice().sort();
}
function compare(exp, got, ordered) {
  const ec = exp.columns.length, gc = got.columns.length;
  if (gc === 0 && got.values.length === 0) return { ok: false, why: "Your query returned no rows.", tip: `Expected ${exp.values.length} row${exp.values.length === 1 ? "" : "s"}. Check your WHERE condition.` };
  if (ec !== gc) return { ok: false, why: `Wrong number of columns: expected ${ec}, you have ${gc}.`, tip: "Check the columns listed in the task, in order." };
  if (exp.values.length !== got.values.length) return { ok: false, why: `Expected ${exp.values.length} row${exp.values.length === 1 ? "" : "s"}, you got ${got.values.length}.`, tip: "Your filter is keeping too many or too few rows." };
  const a = normRows(exp, ordered), b = normRows(got, ordered);
  if (a.every((r, i) => r === b[i])) return { ok: true };
  if (ordered) {
    const as = a.slice().sort(), bs = b.slice().sort();
    if (as.every((r, i) => r === bs[i])) return { ok: false, why: "Right rows, wrong order.", tip: "Check your ORDER BY." };
  }
  return { ok: false, why: "Right shape, but some values don't match.", tip: "Check the columns are the right ones and in the right order." };
}

function friendlyError(msg, les) {
  let tip = "";
  if (les && les.inject) tip = "Your search broke the website's SQL. That crack is exactly what attackers look for. Now make it run cleanly but return everyone.";
  else if (/constraint failed/i.test(msg)) tip = "A table rule refused this change. That's the database protecting your data.";
  else if (/already exists/i.test(msg)) tip = "Every run starts from a fresh shop, so this means your SQL creates the same thing twice.";
  else if (/no such column/i.test(msg)) tip = "Check the spelling of column names, and put text values in 'single quotes'.";
  else if (/no such table/i.test(msg)) tip = "Check the table name. Open the database panel to see them all.";
  else if (/syntax error/i.test(msg)) tip = "Something is in the wrong place. Check commas between columns and the order: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT.";
  else if (/incomplete input/i.test(msg)) tip = "The query ends too early. Missing a closing bracket or quote?";
  else if (/misuse of aggregate/i.test(msg)) tip = "Aggregates like COUNT() can't go in WHERE. Use HAVING after GROUP BY.";
  return `<div class="msg">The database said: ${esc(msg)}${tip ? `<small>${esc(tip)}</small>` : ""}</div>`;
}

/* A database prepared for this lesson (foreign keys, lesson tables) */
function lessonDb(les) {
  const db = freshDb();
  if (les.fk) db.exec("PRAGMA foreign_keys = ON;");
  if (les.setup) db.exec(les.setup);
  return db;
}

/* Run a lesson's checks against a database after someone's SQL ran */
function runProbes(db, probes) {
  const values = probes.map(([label, sql]) => {
    try {
      const r = db.exec(sql);
      if (/^\s*SELECT/i.test(sql)) {
        const res = lastResult(r);
        const flat = res.values.map(row => row.map(v => v === null ? "NULL" : normCell(v)).join(" / ")).join(", ");
        return [label, flat || "(no rows)", ""];
      }
      return [label, "Allowed", ""];
    } catch (e) { return [label, "Rejected", e.message]; }
  });
  return { columns: ["Test", "Result", "Database said"], values };
}

function execLesson(les, sql) {
  const db = lessonDb(les);
  try {
    if (les.inject) {
      const built = les.template.replace("{input}", sql);
      return { res: runOn(db, built), caption: "What the website showed", built };
    }
    const res = runOn(db, sql);
    if (les.probes) return { res: runProbes(db, les.probes), caption: "Tests run against your table" };
    if (les.mutate) return { res: runOn(db, les.verify), caption: les.verifyLabel };
    return { res, caption: "Your result" };
  } finally { db.close(); }
}

function compareProbes(exp, got) {
  for (let i = 0; i < exp.values.length; i++) {
    const [label, want] = exp.values[i], have = got.values[i][1], said = got.values[i][2];
    if (want === have) continue;
    let tip = "Re-read the task and compare it with your CREATE TABLE.";
    if (want === "Rejected" && have === "Allowed") tip = "Your table is missing a rule, so it let this through.";
    else if (want === "Allowed" && have === "Rejected") tip = `Your table refused something it should allow. The database said: ${said}`;
    return { ok: false, why: `Test "${label}": should be ${want}, yours gave ${have}.`, tip };
  }
  return { ok: true };
}

function run(les) {
  const raw = $("sql").value;
  const sql = les.inject ? raw.replace(/\n+$/, "") : raw.trim();
  state.drafts[les.id] = raw; save();
  if (!sql.trim()) { feedback("info", `<div class="msg">${les.inject ? "Type something into the search box first." : "Type a query first."} Stuck? Press Hint.</div>`); return; }
  if (!SQL) { feedback("info", `<div class="msg">The SQL engine is still loading. Try again in a second.</div>`); return; }
  spin(true);
  setTimeout(() => spin(false), 600);

  let out;
  try { out = execLesson(les, sql); }
  catch (e) {
    const built = les.inject ? les.template.replace("{input}", sql) : "";
    feedback("bad", friendlyError(e.message, les));
    $("results").innerHTML = built ? builtHtml(built) : "";
    return;
  }
  if (les.play) { showTable(out.res, out.caption); feedback("", ""); return; }

  let exp;
  try { exp = execLesson(les, les.sol).res; }
  catch (e) { feedback("bad", `<div class="msg">This lesson's own answer failed: ${esc(e.message)}</div>`); return; }

  let c;
  if (les.probes) {
    showTable({ columns: ["Test", "Should be", "Yours", "Database said"], values: out.res.values.map((r, i) => [r[0], exp.values[i][1], r[1], r[2]]) }, out.caption);
    c = compareProbes(exp, out.res);
  } else {
    showTable(out.res, out.caption);
    c = compare(exp, out.res, !!les.ordered || !!les.mutate);
    if (!c.ok && les.inject) {
      const n = out.res.values.length;
      c = { ok: false, why: `The site showed ${n} customer${n === 1 ? "" : "s"}.`, tip: "Make it show all 12. Look at the SQL it built: your text lands between the two quotes." };
    }
  }
  if (out.built) $("results").insertAdjacentHTML("afterbegin", builtHtml(out.built));
  if (c.ok && les.requires) {
    for (const [re, msg] of les.requires) {
      if (!new RegExp(re, "i").test(sql)) { c = { ok: false, why: "Right result, but not the technique this lesson is about.", tip: msg }; break; }
    }
  }
  if (c.ok) {
    if (les.win) $("hint-box").innerHTML = `<div class="hint">${les.win}</div>`;
    const first = !state.done[les.id];
    if (first) state.done[les.id] = state.revealed[les.id] ? XP_REVEALED : XP_CLEAN;
    save();
    const gained = first ? `+${state.done[les.id]} XP` : "Already done";
    const nextL = LESSONS[lessonIndex(les.id) + 1];
    feedback("good", `<div class="msg">${pick(["Nailed it!", "Spot on!", "Dot is impressed.", "That's the one!", "Beautiful query."])} ${gained}</div>
      ${nextL ? `<button class="btn btn-primary" type="button" id="next-btn">Next: ${esc(nextL.title)} →</button>` : ""}`);
    if (nextL) $("next-btn").onclick = () => go(nextL.id);
    if (first) confetti();
    renderNav(); renderTop();
  } else {
    feedback("bad", `<div class="msg">${esc(c.why)}<small>${esc(c.tip)}</small></div>`);
  }
}

     [`A new <code>"stok"</code> key is quietly added, and the real stock is unchanged`, true, `Right. No error and no warning. The bug shows up later, somewhere else, as wrong stock numbers.`],
     [`The stock becomes 4`, false, `Python has no idea "stok" was meant to be "stock". To a dictionary they're unrelated keys.`]],
     why: `Dictionaries accept any key, so nothing describes what an album <i>is</i>. A class fixes that by defining which attributes exist.` },
   { t: "mcq", q: `Someone calls <code>sell(album, 10)</code> when only 5 are in stock. Where does this code stop stock going negative?`, opts: [
     [`Inside <code>sell()</code>`, false, `Look again: sell() just subtracts. It never checks.`],
     [`Nowhere. Every piece of code that changes stock would have to remember to check`, true, `Exactly. The rule "stock can't go below zero" has no home, so sooner or later it gets forgotten.`],
     [`Python refuses negative numbers in a dictionary`, false, `Dictionaries hold whatever you put in them, including -5.`]] },
   { t: "read", html: `<p><b>Object-oriented programming (OOP)</b> bundles data together with the behaviour allowed on it. A <b>class</b> describes a kind of thing. An <b>object</b> (also called an <b>instance</b>) is one actual thing made from it.</p>` + C(py`
class Album:
    def __init__(self, title, price, stock):
        self.title = title
        self.price = price
        self.stock = stock

    def sell(self, qty):
        if qty > self.stock:
            raise ValueError("not enough stock")
        self.stock -= qty
`) + `<p>Now the rule lives <i>inside</i> the album. Any code that sells goes through <code>sell()</code>, so it gets the check for free. The object is responsible for keeping itself valid.</p>
<p>An object has <b>attributes</b> (its data, like <code>title</code>) and <b>methods</b> (its behaviour, like <code>sell()</code>). In this course you'll meet the four big ideas of OOP: <b>encapsulation</b>, <b>inheritance</b>, <b>polymorphism</b> and <b>abstraction</b>. You'll also learn when <i>not</i> to use classes at all.</p>` },
   { t: "sort", q: `Which of these belong to an <code>Album</code> object?`, buckets: ["Attribute (data)", "Method (behaviour)", "Doesn't belong in Album"], items: [
     ["<code>title</code>", 0, "Data each album holds."],
     ["<code>sell(qty)</code>", 1, "Something an album does, changing its own stock."],
     ["<code>price</code>", 0, "Data each album holds."],
     ["<code>is_in_stock()</code>", 1, "A question the album answers about itself."],
     ["<code>apply_discount(percent)</code>", 1, "Behaviour that changes the album's own price."],
     ["A customer's email address", 2, "That's the customer's data. An album shouldn't know who buys it."],
     ["<code>print_daily_sales_report()</code>", 2, "A report covers every sale in the shop. That's not one album's job."]],
     why: `A good class holds its own data plus the behaviour that acts on that data, and nothing else. When unsure, ask: "is this about <i>one album</i>?"` }
