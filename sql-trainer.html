       "this": `Returning <code>this</code> lets calls be chained (<code>ref.orderByChild('date').limitToLast(1).once(...)</code>) without crashing, while silently changing their meaning.` } }) },
   { t: "read", html: `<p>Now look at real app code that relies on those two methods, from <code>app.js</code>:</p>` + AC({ src: "frontend/js/app.js", from: 3286, to: 3307, bands: [[3291, 3291, "err"], [3292, 3306, "ui"]], notes: {
       checkLastWorkoutResult: `Shows "how did you feel after your last workout?" if the latest workout has no result yet.`,
       showPostWorkoutNotes: `A user setting that switches the feature on.`,
       workoutsRef: `A reference to the user's workouts.`,
       "'workouts'": `The workouts folder.`,
       "'date'": `Intended: sort by date.`,
       "1": `Intended: just the latest one.`,
       "'value'": `Read once.`,
       child: `Each workout snapshot (an ApiSnapshot).`,
       workoutKey: `That workout's id.`,
       "// Only show if result is missing or empty": `Your comment.`,
       result: `How the user said they felt.`,
       "''": `Empty fallback.`,
       "'recently'": `Fallback date text.`,
       input: `The text box for the result.`,
       getElementById: `Finds a page element by its id.`,
       "'lastworkoutresult'": `The input's id.`,
       resultSection: `The section containing it.`,
       "'resultsection'": `Its id.`,
       placeholder: `The grey hint text inside the input.`,
       "`Add how you felt after your workout on ${date}`": `The prompt, with the date filled in.`,
       dataset: `The element's data-* attributes.`,
       "// Save the key for use when saving": `Your comment.`,
       classList: `The element's CSS classes.`,
       "'hidden'": `The class that hides the section.` } }) },
   { t: "predict", q: `Using the fake adapter, the user's workouts come back as below (in this key order). Which date ends up in the placeholder? Type just the date.` + AC({ code: `{
  "k1": { "date": "2026-10-01" },
  "k2": { "date": "2026-10-20", "result": "felt strong" },
  "k3": { "date": "2026-09-14" }
}`, lang: "json", notes: { '"k1"': `First workout key.`, '"k2"': `Second key: this workout has a result.`, '"k3"': `Third key.`, '"date"': `Workout date.`, '"result"': `How the user felt.`, '"2026-10-01"': `A date.`, '"2026-10-20"': `The newest date.`, '"felt strong"': `A filled-in result.`, '"2026-09-14"': `The oldest date.` } }), answer: "2026-09-14",
     why: `Because orderByChild and limitToLast do nothing, forEach visits <i>every</i> workout. k1 has no result, so the placeholder says 10-01. k2 has a result, so it's skipped. k3 has no result, so the placeholder is overwritten with 09-14. The prompt asks about a workout from five weeks ago and saves the answer onto it. <b>This is a real bug in your app.</b> The fix is to sort by date and take the last one in the browser, or to give the API a "latest workout" endpoint.` },
   { t: "mcq", q: `What's the general lesson from the adapter's no-op methods?`, opts: [
     [`A stub that silently ignores a call is riskier than one that throws, because callers carry on with wrong results unnoticed`, true, `Yes. "Fail loudly" again: if limitToLast threw "not supported", the bug would have shown up the first day. When AI writes an adapter, check every method it stubs out.`],
     [`Adapters should never be used in real projects, because rewriting every call to the new API by hand is always the safer option`, false, `The adapter was a sensible move: it migrated thousands of lines at once. The problem is only the silent stubs.`],
     [`The bug comes from Firebase itself: the real orderByChild doesn't sort reliably either, so this would have failed anyway`, false, `Real Firebase sorts correctly on the server. The behaviour changed when the adapter replaced it.`]] }
 ]},

   { t: "read", html: AC({ src: "backend/firebase-admin.js", from: 57, to: 72, bands: [[58, 64, "data"], [66, 71, "data"]], notes: {

     [`The Admin SDK bypasses security rules entirely, so the rules only restrict direct browser access and the backend must enforce access itself`, true, `Right. The rules lock out everyone except admin, and your backend is admin. That makes your backend code (guards plus the sub-based path) the real security boundary, and makes the service-account JSON your most sensitive secret.`],

 { id: "m-boss", title: "Code review: your own app", boss: true,
   intro: `Time to put it together the way a senior developer would: review your app's code with fresh eyes. Spot what's strong, what's risky, and what to fix first.`,
   steps: [
   { t: "sort", q: `Strength or problem?`, buckets: ["Strength", "Problem"], items: [
     [`saveId plus transaction makes workout saves idempotent`, 0, `Retries and double taps can't create duplicates.`],
     [`The adapter's orderByChild and limitToLast silently do nothing`, 1, `It causes the "last workout" prompt bug.`],
     [`The server throws at startup without SESSION_SECRET in production`, 0, `Fail fast instead of running insecurely.`],
     [`Firebase config for an old project still ships in the service worker`, 1, `Leftover config, and a sign the feature is dead.`],
     [`An allow-list plus segment checks on every generic data path`, 0, `Users can't reach bookkeeping folders or smuggle extra path levels.`],
     [`Production URLs are hard-coded as fallbacks in the code`, 1, `Misconfiguration gets hidden, and the values are exposed.`],
     [`timingSafeEqual is used for signature comparison`, 0, `It resists timing attacks.`]] },
   { t: "branch", q: `Your first clean-up PR`, start: "a", nodes: {
     a: { say: `<p>You've got one afternoon to improve the codebase. You'll ask an AI assistant to help. What do you tackle first?</p>`, opts: [
       [`Fix the "last workout" bug: sort by date in the browser and take the newest, plus make the adapter's unsupported methods throw so similar bugs surface`, "b", `A real user-facing bug, fixed at the root, with a guard against repeats.`],
       [`Ask the AI to "refactor app.js to be cleaner" (all 140 KB)`, "bad1", `It returns 3,000 changed lines.`]] },
     bad1: { end: "bad", say: `A giant AI refactor of code you don't fully understand, with no tests, is how working apps break. Small, targeted changes you can review line by line are the professional way.` },
     b: { say: `<p>Done and tested by hand. With the time left?</p>`, opts: [
       [`Delete the dead files and the stray workflow, after searching the repo to confirm nothing references them`, "win", ``],
       [`Delete everything in frontend/js that you don't recognise`, "bad2", `The app fails to load.`]] },
     bad2: { end: "bad", say: `"I don't recognise it" isn't "it's unused". Check references first: index.html's script tags, imports, and the Vite config's copy list.` },
     win: { end: "good", say: `A bug fixed at its root, a guard against similar ones, and verified dead code removed. A small, reviewable, valuable PR, which is exactly what teams want to see.` } },
     why: `Prefer small, verified, user-visible fixes, and remove dead code only after checking references.` },
   { t: "mcq", q: `An interviewer asks: "How does your backend know which user's data to return?" Which answer shows you understand your own code?`, opts: [
     [`"The verified Cognito sub from the token or session picks the database path, and nothing in the request can change it, so users only reach their own folder."`, true, `That's precise, it names the trust boundary, and it's true of your code.`],
     [`"The frontend sends the user's id with every request it makes, and the backend uses that id to look up the right folder in the database."`, false, `That describes a broken design, where anyone could send someone else's id. Your app deliberately doesn't do this.`],
     [`"Firebase handles all of that automatically, because its security rules make sure each user only ever sees their own data."`, false, `Your backend uses the Admin SDK, which bypasses the rules. The protection lives in your backend code.`]] }
 ]}
];

 /* ===================== 1. How the web works ===================== */
 { id: "u-web", title: "1. How the web actually works",
   intro: `Welcome to the course. We'll study real systems concepts, the ones every backend and cloud engineer is expected to know, and use your workout tracker as the case study for each one. First: what physically happens between tapping a link and seeing LeanLog.`,
   steps: [
   { t: "read", html: OBJ([
       `explain the client–server model and why one program can be both`,
       `trace a request through DNS, TCP, TLS and HTTP, and say what each layer is for`,
       `read an HTTP request and response, and choose the right status code`,
       `explain what "HTTP is stateless" means and why it shaped every login system ever built`]) +
     LEC("Clients, servers and the roles programs play", `
<p>A ${TT("server", `Not a special kind of computer: any program that <b>listens</b> on a network port and answers requests. A laptop can run a server; a giant data centre machine can run a client.`)} is a program that waits for requests and answers them. A ${TT("client", `The program that <b>starts</b> the conversation by sending a request.`)} is a program that starts the conversation. These are <i>roles in one conversation</i>, not types of machine.</p>
<p>Your Express backend is a good example. When a browser calls <code>/api/workouts</code>, the backend is the server. A moment later it calls Firebase to fetch the data, and now it's the <i>client</i>. During login it's a client of Cognito too. Most real backends spend much of their time being clients of other services.</p>
<p>Programs find each other with two numbers: an ${TT("IP address", `A numeric address for a machine on the network, like <code>140.82.112.3</code> (IPv4) or a longer IPv6 address. Humans never type these; DNS translates names into them.`)} (which machine) and a ${TT("port", `A number from 0–65535 that picks <i>which program</i> on that machine gets the traffic. HTTPS uses 443 by default, plain HTTP 80. Your container listens on 3000 internally.`)} (which program on that machine). HTTPS defaults to port 443, which is why you never see it in URLs.</p>`) },

   { t: "read", html: LEC("The journey of one request", `
<p>When you open LeanLog, four protocols run in sequence, each solving a different problem. Engineers describe them as ${TT("layers", `Each protocol relies on the one below and ignores the details of how it works. HTTP doesn't care how TCP delivers bytes; TCP doesn't care what the bytes mean. This separation is what lets the internet evolve one layer at a time.`)}: each relies on the one beneath and ignores its details.</p>` +
     FLOW("Opening LeanLog, layer by layer (hover each stage)", [
       ["DNS", "name → IP address", "github", `<b>Domain Name System.</b> The browser asks a resolver (usually your ISP's or a public one like 1.1.1.1) "what's the IP for c-mckeon.github.io?". Resolvers walk a hierarchy (root → .io → github.io) and cache answers for a time called the <b>TTL</b>. DNS is why you can move a site to new servers without changing its name.`],
       ["TCP", "reliable connection", "browser", `<b>Transmission Control Protocol.</b> Opens a connection to that IP on port 443 with a three-message handshake. TCP guarantees bytes arrive complete and in order, resending anything lost. (HTTP/3 swaps TCP for QUIC, which does the same job over UDP with fewer round trips.)`],
       ["TLS", "encrypt + prove identity", "aws", `<b>Transport Layer Security</b>, the S in HTTPS. Two jobs: <b>encryption</b> (nobody on the café Wi-Fi can read or alter traffic) and <b>authentication</b> (the server proves it really is github.io by presenting a <b>certificate</b> signed by a Certificate Authority your device trusts).`],
       ["HTTP", "the actual request", "azure", `<b>Hypertext Transfer Protocol.</b> Finally the browser sends <code>GET / HTTP/2</code> plus headers, and the server replies with a status code, headers and the HTML. Everything your code deals with lives at this layer.`],
       ["Render + JS", "page builds itself", "you", `The browser parses the HTML, fetches the CSS and JavaScript it references (each another HTTP request, reusing the connection), then runs your JS. For LeanLog, that JS immediately starts making API calls to your backend: a fresh DNS → TCP → TLS → HTTP journey to a different server.`]],
       "Every API call your frontend makes repeats this, though browsers reuse connections so DNS, TCP and TLS usually happen once per server.") + `
<p>Two practical consequences. First, <b>certificates are why HTTPS can be trusted</b>: since ${TT("Let's Encrypt", `A free, automated Certificate Authority launched in 2015 by a non-profit. Before it, certificates cost money and were renewed by hand, so much of the web stayed on plain HTTP. Today most of the web is HTTPS.`)} made certificates free in 2015, almost every platform issues them automatically. GitHub Pages does this for LeanLog and Azure does it for your backend's default domain, so you never touched a certificate. Second, <b>each layer fails differently</b>, and recognising the symptom tells you which layer to look at:</p>` +
     TABLE(["Layer", "Typical failure", "What the user sees"], [
       ["DNS", "Name doesn't resolve, or points to old servers", "\"Server not found\" / site unreachable"],
       ["TCP", "Server down, firewall blocking the port", "Connection timed out or refused"],
       ["TLS", "Expired or mismatched certificate", "Full-page browser warning: \"Your connection is not private\""],
       ["HTTP", "The server answered, but with an error", "A status code: 401, 404, 500… handled by your app's code"]], "Which layer broke? Read the symptom.")) },

   { t: "mcq", q: `A user on hotel Wi-Fi opens LeanLog. The page loads normally, but every save shows "Authentication required." Which layer is the problem in?`, opts: [
     [`HTTP: the request reached your backend over a working connection, and your code rejected it`, true, `Right. "Authentication required" is the body of a 401 that <i>your</i> requireAuth sent, so DNS, TCP and TLS all worked. The question becomes "why did this request arrive without valid credentials?" (an expired token, a cleared localStorage).`],
     [`DNS: the hotel's resolver returns an outdated address, so saves reach an old copy of the server`, false, `If DNS sent requests to the wrong server, you'd see connection failures or a different site, not your own app's error message.`],
     [`TLS: the hotel network inspects HTTPS traffic, so the backend's certificate is being rejected`, false, `A certificate problem stops the request before it reaches your code, so your app couldn't reply with its own message.`],
     [`TCP: the hotel firewall drops the connection partway through, so the request body never arrives`, false, `A dropped connection shows as a network error in the browser. It doesn't produce a neat reply from your backend.`]] },

   { t: "read", html: LEC("Anatomy of an HTTP exchange", `
<p>HTTP is plain, structured text (HTTP/2 and /3 encode it in binary, but the meaning is identical). Here is a real call from your frontend, simplified:</p>
<pre class="plain"><b>POST /api/workouts HTTP/2</b>              ← method, path, version
Host: &lt;backend-host&gt;                        ← which site on that server
Origin: https://c-mckeon.github.io        ← which page is calling (set by the browser)
Content-Type: application/json            ← how to read the body
Authorization: Bearer eyJ1c2VySW5mbyI6…   ← who's asking

{"date":"2026-10-28","exercises":[…],"saveId":"9b1c…"}

<b>HTTP/2 201 Created</b>                       ← status code + reason
Access-Control-Allow-Origin: https://c-mckeon.github.io
Content-Type: application/json

{"id":"-Nx3…","workout":{…}}</pre>
<p>The <b>method</b> says what kind of action this is. Methods have agreed meanings, and two properties matter enormously in practice:</p>` +
     TABLE(["Method", "Meaning", `${TT("Safe", `Doesn't change anything on the server. Browsers, caches and crawlers feel free to send safe requests whenever they like (prefetching links, for instance).`)}?`, `${TT("Idempotent", `Sending it twice has the same effect as sending it once. If a network blip leaves you unsure whether a request arrived, you can safely retry an idempotent one.`)}?`, "In your API"], [
       ["GET", "Read something", "Yes", "Yes", "<code>GET /api/data?path=settings</code>"],
       ["PUT", "Replace the thing at this address", "No", "Yes", "<code>PUT /api/data</code> sets a value at a path"],
       ["PATCH", "Change part of it", "No", "Usually not guaranteed", "<code>PATCH /api/data</code> merges fields"],
       ["DELETE", "Remove it", "No", "Yes", "<code>DELETE /api/data</code>"],
       ["POST", "Create / do something", "No", "No", "<code>POST /api/workouts</code>, <code>POST /api/data/push</code>"]], "HTTP methods and the two properties that matter") + `
<p>The <b>status code</b> is the server's one-number summary. The first digit is the class:</p>` +
     TABLE(["Class", "Means", "Examples in your backend"], [
       ["2xx", "It worked", "201 after saving a workout · 204 \"done, no body\" after a PUT or a CORS preflight"],
       ["3xx", "Look elsewhere", "302 redirects that bounce the browser to Cognito and back during login"],
       ["4xx", "<b>You</b> (the client) did something wrong", "400 bad data path · 401 not logged in · 403 logged in but not allowed (demo mode) · 404 no such route"],
       ["5xx", "<b>I</b> (the server) failed", "500 when Firebase can't be reached"]], "Status code classes") +
     MYTH(`401 and 403 mean the same thing: access denied.`, `401 means "I don't know who you are; authenticate." 403 means "I know exactly who you are, and you're not allowed." Your demo account gets 403 on writes because it <i>is</i> authenticated. Getting this right helps clients react correctly: a 401 should send the user to log in, a 403 shouldn't.`)) },

   { t: "sort", q: `Your backend is handling each of these. Which class of status code should it answer with?`, buckets: ["2xx", "3xx", "4xx", "5xx"], items: [
     [`A request asks to read a data path that isn't on the allow-list`, 2, `The client asked for something it may not have: 400.`],
     [`The browser hits /login and needs to be sent to Cognito's page`, 1, `A 302 redirect.`],
     [`Firebase times out while the backend is loading workouts`, 3, `Not the client's fault: 500 (or 503/504).`],
     [`A workout is saved and a new record now exists`, 0, `201 Created.`],
     [`The demo account tries to delete an exercise`, 2, `Authenticated but forbidden: 403.`],
     [`An OPTIONS preflight is approved, with nothing else to say`, 0, `204 No Content.`],
     [`The backend crashes on an unexpected null and the error handler catches it`, 3, `A bug on the server side is a 5xx, however it was triggered.`]] },

   { t: "mcq", q: `A phone on a weak signal sends a request, times out, and the app retries automatically. By HTTP's own rules, which request is safe to retry blindly?`, opts: [
     [`<code>POST /api/data/push</code> adding a body-weight entry, since each push gets its own key`, false, `POST isn't idempotent. If the first attempt arrived, the retry adds a second entry. Unique keys make that worse here, because each copy gets its own.`],
     [`<code>PUT /api/data</code> setting the calendar's start month to 9`, true, `PUT is idempotent: "set this to 9" twice leaves it at 9. That's why retry logic and caches treat PUT differently from POST.`],
     [`<code>POST /api/workouts</code> without a saveId, as older app versions sent it`, false, `Without an idempotency key, a retried POST can create a duplicate workout. Your saveId exists to fix exactly that (Lecture 12).`],
     [`<code>PATCH /api/data</code> adding 1 to a stored set counter`, false, `"Add 1" applied twice adds 2. PATCH is only idempotent when it sets absolute values, so it isn't guaranteed.`]] },

   { t: "read", html: LEC("HTTP is stateless, and why that matters so much", `
<p>HTTP has no memory. Each request arrives alone, and the server has no built-in idea that it came from the same person as the last one. This was deliberate: a server that doesn't track conversations is simpler, and any server in a group can answer any request.</p>
<p>But apps need memory ("this person is logged in"), so the web added ways to carry identity <i>inside each request</i>:</p>` +
     TIMELINE("How the web got memory", [
       ["1991", "First website. Pure documents, no logins."],
       ["1994", "Netscape invents <b>cookies</b>, so a shop can remember a basket, and SSL (later TLS)."],
       ["2000s", "Server-side <b>sessions</b>: cookie holds an id, server holds the data."],
       ["2005", "AJAX: pages fetch data in the background. The start of web <i>apps</i>."],
       ["2010s", "Single-page apps and mobile apps call APIs with <b>bearer tokens</b> (OAuth 2.0 in 2012, JWT in 2015)."],
       ["2017–", "Browsers start blocking <b>third-party cookies</b>, which shaped your app."]]) + `
<p>Every login mechanism you'll study in Unit 2 is an answer to one question: <i>how does a stateless request prove who sent it?</i> Your backend answers it two ways at once (a cookie and a bearer token), and by Lecture 5 you'll understand exactly why.</p>` +
     LEC("Static hosting vs application servers", `
<p>Your system uses both kinds of server. ${TT("Static hosting", `Serves files exactly as stored, identical for every visitor. No code runs per request, so it's cheap, fast, nearly unbreakable, and easy to put behind a CDN.`)} (GitHub Pages) hands out the same files to everyone. An <b>application server</b> (your Express backend) runs code for every request and can answer differently for each user.</p>
<p>The split is a modern pattern: put everything that's identical for every user (HTML, CSS, JavaScript, images) on static hosting, often behind a ${TT("CDN", `Content Delivery Network: copies of your files on servers in many cities, so each user downloads from somewhere nearby. Static sites get this almost free.`)}, and keep the application server small and focused on data and security.</p>`) +
     CASE("two kinds of server", `<p>LeanLog's files come from GitHub Pages: free, globally cached, and with nothing to hack because no code runs there. Everything personal comes from your backend. This is why the frontend can't hold secrets: it's a public file anyone can download and read, minified or not.</p>`)) },

   { t: "order", q: `Put the first visit to LeanLog in order, from tapping the link to the first API call.`, items: [
     `The browser asks DNS for the IP address of c-mckeon.github.io`,
     `A TCP connection opens to that address on port 443`,

     `The browser sends GET for the page and receives the HTML`,
     `The browser fetches the JavaScript and runs it`,
     `Your JavaScript calls the backend, starting the same journey to a second server`] },

   { t: "read", html: TERMS([
       ["Client / server", "Roles in a single conversation. Your backend is a server to browsers and a client to Firebase and Cognito."],
       ["DNS", "Turns names into IP addresses, with caching controlled by TTL."],
       ["TLS / HTTPS", "Encryption plus proof of identity via certificates."],
       ["Status code classes", "2xx worked · 3xx look elsewhere · 4xx client's fault · 5xx server's fault."],
       ["Idempotent", "Repeating it has the same effect as doing it once (GET, PUT, DELETE)."],

 /* ===================== 2. Architecture styles ===================== */
 { id: "u-arch", title: "2. Architecture styles, and where your app sits",
   intro: `Architecture is the set of decisions that are expensive to change later. Before zooming into any one technology, let's map the common ways web systems are shaped, the trade-offs each one makes, and where yours fits.`,
   steps: [
   { t: "read", html: OBJ([
       `define software architecture and name the quality attributes it trades between`,
       `compare server-rendered apps, single-page apps with an API, backend-as-a-service, microservices and serverless`,
       `place your system on that map and explain how it evolved`,
       `recognise the strangler-fig and adapter patterns in your own migration`]) +
     LEC("What architecture is (and isn't)", `
<p>Code you can rewrite in an afternoon isn't architecture. Architecture is the shape of the whole: which <b>components</b> exist, how they <b>communicate</b>, and which <b>constraints</b> they live under. A useful test: if changing it would take weeks and touch many parts, it's architectural.</p>
<p>No architecture is best in general. Each one trades between ${TT("quality attributes", `Also called non-functional requirements: the "-ilities". Not what the system does, but how well: secure, scalable, cheap, simple, fast, reliable, easy to change. You can't maximise all of them, so architecture is choosing which to favour.`)}: security, scalability, cost, simplicity, performance, reliability and how easy it is to change. A one-person hobby app and a bank make opposite choices for good reasons. In interviews, "it depends, and here's on what" is a strong answer when you can name what it depends on.</p>` +
     LEC("Five common shapes for a web system", `
<p>Most web systems are a variation or combination of these:</p>` +
     TABLE(["Style", "How it works", "Where secrets & rules live", "Strengths", "Costs"], [
       ["Server-rendered (multi-page)", "The server builds a full HTML page for every click. Classic PHP, Rails, Django.", "Server", "Simple mental model; fast first load; great for SEO", "Every interaction is a full round trip; less app-like"],
       ["Single-page app + API", "The browser downloads the app once, then fetches JSON from an API and redraws itself.", "API server", "Rich, fast interactions; same API can serve mobile apps", "Two programs to build and deploy; cross-origin and auth complexity"],
       ["Backend-as-a-Service", "The browser talks straight to a managed database/auth service (Firebase, Supabase), guarded by security rules.", "In the provider's rules language", "Almost no server code; real-time sync for free", "Logic gets squeezed into rules; hard to hide secrets or call other services"],
       ["Microservices", "Many small services, each owning one business capability and deployed independently.", "Spread across services", "Teams ship independently; scale parts separately", "Network calls everywhere; hard to debug; heavy operations burden"],
       ["Serverless functions", "Small functions run on demand per event (AWS Lambda, Azure Functions). No always-on server.", "In each function", "Pay per use; scales to zero automatically", "Cold starts; time limits; harder local testing; vendor-specific"]], "Architecture styles compared") +
     MYTH(`Microservices are the modern, professional way, and a monolith is legacy.`, `A ${TT("monolith", `One deployable program containing all the server-side features. Your backend/app.js is one. "Monolith" describes how it's deployed, not how messy it is.`)} is the right default for small teams. Microservices solve <i>organisational</i> problems (hundreds of engineers stepping on each other), and charge for it in complexity. Even Amazon Prime Video published a well-known 2023 write-up about moving one system <i>back</i> from microservices to a monolith and cutting its costs by 90%.`))) },

   { t: "sort", q: `Which architecture style does each description fit best?`, buckets: ["Server-rendered", "SPA + API", "Backend-as-a-Service", "Microservices"], items: [
     [`The browser writes directly to the database; access is controlled by rules stored with the database`, 2],
     [`A payments team and a search team deploy their own services on their own schedules`, 3],
     [`Clicking a link fetches a complete new HTML page built on the server`, 0],
     [`The app shell loads once, then JavaScript fetches JSON and updates the screen`, 1],
     [`An iPhone app and a website share the same JSON endpoints`, 1, `One API, many clients: a big reason teams choose this style.`],
     [`An order service calls an inventory service over the network to check stock`, 3, `Network calls between services are the defining (and costly) trait.`]] },

   { t: "read", html: LEC("Your system on the map", `
<p>Your app is a <b>single-page app + API</b>, with a <b>monolithic</b> backend, leaning on three <b>managed services</b> for the hard parts. Hover any box or arrow.</p>` +
     ARCH({ w: 780, h: 420, title: "System overview", legend: [["browser", "Runs on the user's device"], ["aws", "AWS"], ["azure", "Microsoft Azure"], ["google", "Google Firebase"], ["github", "GitHub"]], nodes: [
       { id: "pages", x: 20, y: 320, w: 170, h: 62, label: "GitHub Pages", sub: "static files", color: "github", tip: `<b>Static hosting.</b> Serves the built frontend from the public LeanLog repo. No code runs here.` },
       { id: "browser", x: 20, y: 170, w: 170, h: 62, label: "User's browser", sub: "the single-page app", color: "browser", tip: `<b>The client tier.</b> Runs all the frontend JavaScript, holds the token, draws the charts. Fully visible to the user, so it can hold no secrets.` },
       { id: "cognito", x: 305, y: 20, w: 170, h: 62, label: "AWS Cognito", sub: "identity provider", color: "aws", tip: `<b>A managed identity provider</b>: accounts, passwords, the login page. Lecture 3.` },
       { id: "backend", x: 305, y: 170, w: 170, h: 62, label: "Express backend", sub: "the monolith · Azure", color: "azure", tip: `<b>The logic tier.</b> One deployable program that holds every secret and every access decision.` },
       { id: "actions", x: 305, y: 320, w: 170, h: 62, label: "GitHub Actions", sub: "CI/CD", color: "github", tip: `Builds and deploys both halves. Lecture 9.` },
       { id: "repo", x: 590, y: 20, w: 170, h: 62, label: "Source repo", sub: "private", color: "github", tip: `One repo holding both programs: a "monorepo" in miniature.` },
       { id: "db", x: 590, y: 170, w: 170, h: 62, label: "Firebase RTDB", sub: "data tier", color: "google", tip: `<b>The data tier.</b> A managed JSON-tree database. Lecture 11.` },
       { id: "acr", x: 590, y: 320, w: 170, h: 62, label: "Container Registry", sub: "Azure ACR", color: "azure", tip: `Stores built images. Lecture 7.` }],
     edges: [
       { from: "pages", to: "browser", label: "HTML + JS", tip: `Static files, identical for everyone.` },
       { from: "browser", to: "backend", label: "JSON API calls", color: "browser", tip: `Personal data, per user, authenticated.` },
       { from: "browser", to: "cognito", label: "login page", dash: true, color: "aws", at: .4, tip: `The user types their password on Cognito's page, never on yours.` },
       { from: "backend", to: "cognito", label: "verify login", color: "aws", tip: `Server-to-server token exchange. Lecture 4.` },
       { from: "backend", to: "db", label: "admin access", color: "google", tip: `Only the backend talks to the database.` },
       { from: "repo", to: "actions", label: "push", at: .28 },
       { from: "actions", to: "acr", label: "image", color: "azure" },
       { from: "acr", to: "backend", label: "deploy", color: "azure" },
       { from: "actions", to: "pages", label: "built files", dash: true }] }) + `
<p>Look past the logos and you'll see the classic ${TT("three-tier architecture", `Presentation tier (what the user sees), logic tier (rules and decisions), data tier (storage). Described since the 1990s and still the backbone of most business software.`)}: presentation (the browser), logic (your backend), data (Firebase). The rule that makes it secure is that <b>each tier only trusts the one behind it</b>. The browser can be tampered with by anyone, so the backend re-checks everything; the database only accepts the backend.</p>`) +
     CASE("an accidental multi-cloud", `<p>Your system spans AWS, Azure, Google and GitHub. Companies sometimes go multi-cloud deliberately (to avoid depending on one vendor, or to use each one's best product), but more often it happens one convenient decision at a time, as here. The costs are real: four consoles, four billing accounts, four sets of credentials to secure, and network hops between providers' data centres on every request. The benefit is that each piece is a well-known managed product you didn't have to build. Lecture 15 looks at consolidating.</p>`) },

   { t: "mcq", q: `A friend builds a similar tracker where the browser reads and writes Firebase directly, protected by security rules. Compared with that, what does your backend layer mainly buy you, and what does it cost?`, opts: [
     [`A place users can't tamper with, for secrets and checks, at the cost of a server to run and an extra hop per request`, true, `That's the core trade. Rules can do basic access control, but they can't hold a client secret, call Cognito, or run arbitrary validation. Your backend can, and in return you operate a container and every request travels further.`],
     [`Faster data access, because a backend caches Firebase responses, at the cost of data being slightly out of date`, false, `Your backend doesn't cache, and adding a hop makes requests slower, not faster. Caching is possible but it isn't why the layer exists.`],
     [`Real-time updates across devices, at the cost of more complicated deployment through GitHub Actions`, false, `The reverse: direct Firebase access gives real-time sync for free. Proxying through your backend with one-off reads actually gave that up.`],
     [`Lower hosting bills, since Firebase charges less for server traffic, at the cost of a slower login flow`, false, `Your backend adds a running container to the bill. Cost isn't the benefit here; control is.`]] },

   { t: "read", html: LEC("How your architecture evolved: two classic patterns", `
<p>Your app started as backend-as-a-service: the browser talked to Firebase directly. Then you moved to Cognito for logins and put a backend in front of the data. The interesting part is <i>how</i> that migration was done, because it uses two named patterns.</p>
<h4>The adapter pattern</h4>
<p>Hundreds of lines of frontend code called Firebase's API: <code>database.ref('workouts').once('value', snapshot =&gt; …)</code>. Rather than rewriting them all, <code>api-database.js</code> provides objects with the <i>same shape</i> (<code>ref</code>, <code>child</code>, <code>once</code>, snapshots with <code>val()</code> and <code>forEach()</code>), but which send HTTP requests to your backend instead. An ${TT("adapter", `A piece of code that makes one interface look like another, so existing code keeps working unchanged. Named in the 1994 "Gang of Four" Design Patterns book. A travel plug adapter is the physical version.`)} is code that makes one interface look like another, so callers don't notice the swap.</p>
<h4>The strangler fig</h4>
<p>The ${TT("strangler fig pattern", `Named by Martin Fowler in 2004 after a fig that grows around a host tree until it can stand alone. You route traffic through a new layer, replace pieces behind it one at a time, and the old system is gradually retired, with no "big bang" rewrite.`)} replaces a system gradually: put a new layer in front, move features behind it one at a time, and retire the old parts as you go. Your generic <code>/api/data</code> endpoint is the "anything not migrated yet" path; purpose-built endpoints like <code>/api/workouts</code> are the parts that have been properly moved.</p>` +
     FLOW("Your migration as a strangler fig", [
       ["v1: BaaS", "browser → Firebase directly", "google", `Fast to build, but rules were the only protection and secrets couldn't be kept.`],
       ["Adapter", "same API, new destination", "you", `api-database.js imitates Firebase's client API so old code keeps working.`],
       ["Generic proxy", "/api/data?path=…", "azure", `Every old read and write flows through the backend, scoped to the user and limited by an allow-list.`],
       ["Purpose-built endpoints", "/api/workouts, /api/exercises…", "azure", `Features are moved one by one to endpoints with real validation and clear contracts.`],
       ["Retire the adapter", "the end state", "browser", `Once nothing uses the generic path, it can be removed.`]]) +
     FLAG("warn", "adapters can hide lost behaviour", `An adapter promises "same interface", but the behaviour behind it may differ. Yours accepts Firebase's query methods (ordering, limits) without actually applying them, so code relying on them silently gets different results. The My code module walks through one case. When you write an adapter, either implement each method faithfully or make unsupported ones throw an error.`)) },

   { t: "mcq", q: `Why was the adapter-plus-proxy approach a safer migration than rewriting every frontend data call to use new endpoints in one go?`, opts: [
     [`The app kept working throughout, and each feature could be moved and tested on its own schedule`, true, `That's the strangler fig's whole value: no big-bang cut-over, small reversible steps, and a working app at every stage. The cost is living with two styles of API for a while.`],
     [`An adapter runs faster than direct endpoint calls, so the migrated app performed better under load`, false, `An extra translation layer adds a little overhead, if anything. Performance wasn't the reason.`],
     [`Proxying through one generic endpoint is more secure than many specific endpoints, so it's the better end state`, false, `Usually the opposite: specific endpoints can validate exactly what they accept. The generic path is a transitional convenience, not the goal.`],
     [`Firebase requires clients to keep using its API shape, so the old method names had to stay`, false, `Once the browser talks to your backend, Firebase never sees those calls. The shape was kept for your own frontend code's sake.`]] },

   { t: "mcq", q: `A two-person startup with 300 users proposes splitting their monolith into eight microservices "to be ready for scale". What's the strongest objection?`, opts: [
     [`Microservices can't run on managed container platforms, so they would have to buy servers`, false, `Managed platforms run microservices all the time; Container Apps was designed with them in mind.`],
     [`They'd take on microservices' heavy costs to solve a scaling problem they don't actually have`, true, `Yes. Microservices mainly solve team-coordination and independent-scaling problems. With two people and 300 users, a well-structured monolith is cheaper and faster, and can be split later along boundaries that experience has revealed.`],
     [`Each microservice needs its own database engine, and eight engines would exceed free tiers`, false, `Separate databases per service is common advice, but it isn't the core objection, and they wouldn't need different engines.`],
     [`Monoliths scale better than microservices under heavy load, so the change would hurt performance at scale`, false, `Not as a rule: microservices can scale parts independently. The issue is cost and complexity now, not a performance ceiling later.`]] },

   { t: "read", html: TERMS([
       ["Architecture", "The decisions that are expensive to change: components, connections, constraints."],
       ["Quality attributes", "Security, scalability, cost, simplicity, reliability… traded against each other."],
       ["Three-tier", "Presentation, logic, data. Each tier distrusts the one in front of it."],
       ["Monolith", "One deployable server program. The sensible default for small teams."],
       ["Adapter", "Makes a new implementation look like an old interface."],
       ["Strangler fig", "Replace a system gradually behind a new layer, not in one big rewrite."]]) +
     FURTHER([`Martin Fowler's articles "MonolithFirst" and "StranglerFigApplication" (martinfowler.com).`, `<i>Fundamentals of Software Architecture</i>, Richards &amp; Ford: the standard textbook on styles and trade-offs.`, `Search: "Prime Video monolith 2023" for the case study mentioned above.`]) }
 ]},

 { sec: "Unit 2 · Identity and trust" },

 /* ===================== 3. AuthN and AuthZ ===================== */
 { id: "u-authn", title: "3. Authentication and authorization",
   intro: `Two words that sound alike and get mixed up constantly, even by experienced developers. Getting them straight is the foundation for everything else in this unit, and it explains why your app hands one job to Amazon and keeps the other for itself.`,
   steps: [
   { t: "read", html: OBJ([
       `distinguish authentication from authorization and spot which one a piece of code is doing`,
       `explain how passwords should be stored, and why most teams outsource it entirely`,
       `compare identity providers and the trade-offs of each`,
       `name the main authorization models and the most common access-control flaw`]) +
     LEC("Two questions every request must answer", `
<p><b>${TT("Authentication", `Often shortened to <b>AuthN</b>. Establishing identity: proving you are who you claim. Passwords, passkeys, MFA codes and signed tokens are all authentication.`)}</b>: <i>who are you?</i> Proving identity.<br><b>${TT("Authorization", `Often shortened to <b>AuthZ</b>. Deciding permissions: given who you are, what may you do? Roles, ownership checks and read-only modes are all authorization.`)}</b>: <i>what are you allowed to do?</i> Deciding permissions.</p>
<p>A hotel makes the difference concrete. Reception checks your passport (authentication) and gives you a key card. The card opens your room and the gym, but not other guests' rooms or the staff office (authorization). Losing track of which job is happening where is behind a large share of real security bugs.</p>` +
     FLOW("Every authenticated request in your app", [
       ["Arrives", "with a cookie or bearer token", "browser"],
       ["Authenticate", "is the credential genuine and unexpired?", "aws", `Your bearer-token middleware checks the HMAC signature and expiry; express-session looks the cookie up. Either way, the result is a trusted <code>userInfo</code> with a <code>sub</code>.`],
       ["Authorize", "may this user do this?", "you", `<code>requireAuth</code> demands a known user. <code>requireWriteAuth</code> also blocks demo accounts from writing. The data path is scoped to that user's own branch of the tree.`],
       ["Act", "read or write their data", "google"]]) +
     LEC("Passwords, and why you don't store them", `
<p>If you ever store passwords, you must never store the password itself. You store a ${TT("hash", `The output of a one-way function: easy to compute from the password, practically impossible to reverse. At login you hash what the user typed and compare hashes. Hashing is <i>not</i> encryption: there's no key that undoes it.`)}, so a stolen database doesn't reveal them. But not just any hash. General-purpose hashes like SHA-256 are designed to be <i>fast</i>, and a modern graphics card can try billions of guesses per second against a leaked list. Password hashing uses deliberately <b>slow</b>, ${TT("salted", `A random value stored next to each hash and mixed into it. Two users with the same password get different hashes, so attackers can't crack everyone at once with precomputed tables.`)} algorithms (bcrypt, scrypt, Argon2) so each guess is expensive.</p>
<p>Then there's everything around it: lockouts and rate limits against guessing, breach detection, password resets (a classic weak point), email verification, ${TT("MFA", `Multi-factor authentication: combining something you <b>know</b> (password), something you <b>have</b> (phone, security key) and something you <b>are</b> (fingerprint). Stops most account takeovers even when a password leaks.`)}, and newer ${TT("passkeys", `A phishing-resistant replacement for passwords built on the WebAuthn/FIDO2 standards: your device holds a private key, unlocked by fingerprint or PIN, and proves possession to the site. There's no password to steal or reuse. Supported by Apple, Google and Microsoft since 2022.`)}. Doing all of this well is a specialised job. That's why most teams hand it to an <b>identity provider</b>.</p>`)) },

   { t: "mcq", q: `A startup stores user passwords as plain SHA-256 hashes. Their security reviewer objects. What's the core problem?`, opts: [
     [`SHA-256 can be reversed by anyone who obtains the hashing key, which is often stored alongside the database`, false, `A common confusion between hashing and encryption. Hashes have no key and aren't reversed. They're attacked by guessing.`],
     [`SHA-256 is fast, so after a leak attackers can test billions of guesses per second against every hash`, true, `Right. Speed is a virtue for checksums and a flaw for passwords. Slow, salted algorithms (bcrypt, scrypt, Argon2) turn billions of guesses per second into thousands.`],
     [`SHA-256 was broken in 2017, so matching passwords can now be generated directly from any hash`, false, `That was SHA-1 (the "SHAttered" collision). SHA-256 itself isn't broken. Its problem for passwords is speed, not weakness.`],
     [`SHA-256 hashes are too long for most database columns, so they get truncated and stop matching`, false, `A 64-character string fits easily. Storage size isn't the issue.`]] },

   { t: "read", html: LEC("Identity providers", `
<p>An ${TT("identity provider (IdP)", `A service that owns user accounts and performs authentication, then tells your app who logged in, in a standard, signed format. Your app trusts the IdP's statement instead of checking passwords itself.`)} owns user accounts and does the authenticating, then tells your app <i>who</i> logged in, in a signed message your app can verify. Your app never sees a password. The main options:</p>` +
     TABLE(["Provider", "Type", "Typical fit", "Watch out for"], [
       ["AWS Cognito <b>(yours)</b>", "Managed, part of AWS", "Apps already on AWS; large free tier", "Clunky hosted UI and docs; ties identities to one AWS user pool"],
       ["Auth0 / Okta", "Managed, specialist", "Polished features, enterprise single sign-on", "Price climbs quickly with users and features"],
       ["Microsoft Entra ID / External ID", "Managed, part of Azure", "Company logins; apps already on Azure", "Configuration complexity"],
       ["Firebase Auth / Google Identity Platform", "Managed, part of Google", "Mobile and Firebase apps", "Strong pull toward the rest of Firebase"],
       ["Clerk, Supabase Auth", "Managed, developer-focused", "Fast setup with ready-made UI components", "Smaller vendors; check the exit path"],
       ["Keycloak", "Open source, self-hosted", "Full control, no per-user fees", "You run, patch and secure it yourself"]], "The identity provider landscape") + `
<p>Two related ideas you'll hear constantly. ${TT("Federation", `Trusting identities issued by someone else. "Sign in with Google" is federation: your IdP accepts Google's word for who the user is.`)} means accepting another provider's logins ("Sign in with Google"). ${TT("Single sign-on (SSO)", `Logging in once and being recognised by many apps. Common in companies: one login reaches email, HR, code hosting and so on. Standards: SAML (2005, XML-based, enterprise) and OpenID Connect (2014, JSON-based, everywhere).`)} means logging in once for many apps, which is what companies buy Okta and Entra ID for.</p>` +
     CASE("why your database is keyed by sub", `<p>Cognito identifies each user with a <code>sub</code> (subject), a permanent, unique id such as <code>3f2a…-…</code>. Your data lives at <code>workoutApp/users/&lt;sub&gt;</code>. Emails make bad keys: people change them, and some providers recycle them. But there's a lock-in lesson here too. A <code>sub</code> is only unique <i>within one user pool</i>. If you ever moved to Auth0 or Entra, every user would get a new id, and you'd need a migration that maps old ids to new ones. Your choice of IdP is quietly written into the shape of your database.</p>`)) },

   { t: "mcq", q: `You're moving from Cognito to another identity provider next year. Which part of your system is hardest to change because of how it's built today?`, opts: [
     [`The login button and redirect URLs, because the frontend hard-codes Cognito's hosted page address`, false, `URLs and buttons are configuration, a few lines each. They don't involve users' existing data.`],
     [`The database layout, because every user's data sits under their Cognito <code>sub</code>`, true, `Exactly. New provider, new subs, so every user's tree would need re-keying or a lookup table from new ids to old. Identity choices leak into data design, which is why they count as architectural.`],
     [`The Container App's secrets, because Azure only accepts AWS credentials for apps created alongside Cognito`, false, `Azure stores whatever secrets you give it; it has no link to which IdP you use.`],
     [`The CI/CD workflows, because GitHub Actions authenticates its deploys with Cognito tokens`, false, `Your deploys authenticate to Azure with GitHub's own OIDC tokens. Cognito plays no part.`]] },

   { t: "read", html: LEC("Authorization models", `
<p>Once you know who someone is, there are a few standard ways to decide what they may do:</p>` +
     TABLE(["Model", "Rule looks like", "Example"], [
       ["Ownership", "Users may access what they own", "Your app: each user sees only their own workouts"],
       [`${TT("RBAC", `Role-Based Access Control: permissions attach to roles (admin, editor, viewer), and users get roles. Simple to reason about; the most common model in business software.`)}`, "Permissions attach to roles; users hold roles", "Admin can delete any post; viewer can only read. Your demo account is effectively a \"read-only\" role."],
       [`${TT("ABAC", `Attribute-Based Access Control: rules over attributes of the user, resource and context. "Managers may approve expenses under £1,000 in their own department during working hours." Flexible but harder to audit.`)}`, "Rules over attributes of user, resource and context", "\"Doctors may read records of patients on their ward\""],
       [`${TT("ReBAC", `Relationship-Based Access Control: permissions follow a graph of relationships. Google's Zanzibar paper (2019) describes the system behind Drive and YouTube sharing; open-source versions include OpenFGA and SpiceDB.`)}`, "Follow relationships in a graph", "Google Docs: you can edit because you're in a group that was shared the folder"]], "Authorization models") + `
<p>Whatever the model, one rule is absolute: <b>authorization is enforced on the server</b>. Hiding a button in the frontend is a convenience, not a control, because anyone can send requests without your frontend.</p>
<p>The most common access-control flaw in real APIs is called ${TT("IDOR / BOLA", `Insecure Direct Object Reference, also called Broken Object Level Authorization: the API lets a client name <i>which</i> object to act on (an id in the URL or body) without checking that this user may access it. Ranked first in the OWASP API Security Top 10.`)}: the API lets the client say <i>which</i> record to touch (<code>?userId=123</code>) and forgets to check that it's theirs. Change the number, read someone else's data.</p>` +
     FLAG("good", "authorization by construction", `Your backend never asks the client whose data this is. It derives the user from the verified credential, then builds every database path underneath <code>workoutApp/users/&lt;that sub&gt;</code>. A client <i>can't</i> name another user's data, because there's no parameter for it. Designing so the dangerous request can't even be expressed is stronger than checking each request and hoping no check is forgotten.`)) },

   { t: "sort", q: `Authentication or authorization? Decide what each piece of logic is doing.`, buckets: ["Authentication", "Authorization"], items: [
     [`Building the database path from the caller's own sub`, 1, `Choosing what they may touch.`],
     [`Checking a bearer token's HMAC signature and expiry`, 0, `Establishing that the credential is genuine is authentication.`],
     [`Blocking demo accounts from saving`, 1],
     [`Cognito asking for an MFA code`, 0],
     [`Only showing the admin menu to users with the admin role`, 1, `And the server must enforce it too, not just hide the menu.`],
     [`Looking up the session id from a cookie to find the logged-in user`, 0, `Finding out who's calling, not what they may do.`]] },

   { t: "mcq", q: `A colleague's API has <code>GET /api/workouts?user=abc123</code>, and the server checks that the request carries a valid login token. What's wrong?`, opts: [
     [`Nothing serious: the valid token proves the caller is a real user, so any request they make is legitimate`, false, `The token proves <i>who</i> is calling, not that they may read user abc123's data. This mix-up is exactly how IDOR happens.`],
     [`The token should travel in the URL too, so the server can check it matches the user parameter`, false, `Tokens in URLs leak into logs and browser history. And the fix isn't where the token travels; it's checking ownership.`],
     [`Any logged-in user can read anyone's workouts just by editing the user parameter`, true, `That's IDOR (or BOLA), the top item on OWASP's API Security list. Fix: ignore client-supplied ids for ownership and derive the user from the token, as your backend does, or explicitly check ownership on every request.`],
     [`GET requests can't carry authentication, so this endpoint needs to be changed to POST`, false, `GET requests carry auth headers and cookies like any other. The method isn't the problem.`]] },

   { t: "read", html: TERMS([
       ["Authentication (AuthN)", "Proving who you are."],
       ["Authorization (AuthZ)", "Deciding what you may do. Always enforced on the server."],
       ["Password hashing", "Slow, salted, one-way (bcrypt, scrypt, Argon2). Never fast hashes, never encryption."],
       ["Identity provider", "Owns accounts and authentication; your app trusts its signed statements."],
       ["sub", "The IdP's permanent user id. Unique only within that provider."],
       ["RBAC / ABAC / ReBAC", "Roles, attribute rules, relationship graphs."],
       ["IDOR / BOLA", "Letting clients choose which object to access without an ownership check."]]) +
     FURTHER([`OWASP Cheat Sheets: "Password Storage", "Authorization" and "Authentication" (cheatsheetseries.owasp.org).`, `OWASP API Security Top 10 (2023 edition), item API1: Broken Object Level Authorization.`, `passkeys.dev for how passkeys work.`]) }
 ]},

 /* ===================== 4. OAuth 2.0 and OpenID Connect ===================== */
 { id: "u-oauth", title: "4. OAuth 2.0 and OpenID Connect",
   intro: `These two standards sit behind nearly every "Log in with…" button on the internet, and behind your Cognito login. They're famous for being confusing, mostly because people mix up what each one is for. We'll build them up from the problem they solve.`,
   steps: [
   { t: "read", html: OBJ([
       `explain the problem OAuth was invented to solve and the difference between OAuth and OpenID Connect`,
       `name the four OAuth roles and map them onto your system`,
       `choose the right OAuth flow for web apps, single-page apps, mobile apps and machines`,
       `explain what state, nonce, PKCE and the client secret each protect against`]) +
     LEC("The problem: the password anti-pattern", `
<p>Around 2006, if a new app wanted to import your Gmail contacts, it asked for your <b>Gmail password</b>. The app could then read all your email, change your password, anything, forever, and the only way to revoke it was to change your password everywhere. Engineers at Twitter, Google and elsewhere designed OAuth to fix this: a way to give an app <b>limited, revocable access</b> to your stuff without ever handing over your password.</p>` +
     TIMELINE("From password-sharing to modern login", [
       ["2007", "OAuth 1.0 drafted by engineers from Twitter, Google and others."],
       ["2012", "<b>OAuth 2.0</b> (RFC 6749): simpler, but a framework of options rather than one protocol."],
       ["2014", "<b>OpenID Connect</b> adds a standard identity layer on top of OAuth 2.0."],
       ["2015", "JWT (RFC 7519) and PKCE (RFC 7636) published."],
       ["2019–", "Implicit flow officially discouraged; OAuth 2.1 drafts make PKCE the norm for everyone."]]) + `
<h4>OAuth is about access; OpenID Connect is about identity</h4>
<p><b>${TT("OAuth 2.0", `An authorization framework: lets a user grant an app limited access (scopes) to their resources at another service, by issuing the app an access token. It doesn't, by itself, tell the app who the user is.`)}</b> answers: <i>may this app access that API on the user's behalf?</i> The app receives an ${TT("access token", `A credential the app presents to an API ("bearer" token: whoever holds it can use it). Often short-lived (minutes to an hour). Meant for the API, not for the app to read.`)} with limited ${TT("scopes", `The specific permissions requested, like <code>contacts.read</code> or, in OIDC, <code>openid email</code>. Users see and approve them on the consent screen.`)}.<br><b>${TT("OpenID Connect (OIDC)", `An identity layer on top of OAuth 2.0. Adds the ID token (a signed JWT saying who the user is), the userinfo endpoint, and a discovery document so clients can configure themselves automatically.`)}</b> adds: <i>and who is this user?</i> The app also receives an ${TT("ID token", `A signed JWT, issued by the identity provider <i>for your app</i>, stating who logged in (sub, email), who issued it (iss), who it's for (aud), when it expires (exp), plus the nonce your app sent.`)}, a signed statement about who logged in. Logging users in is an OIDC job. Using OAuth access tokens alone to decide who someone is was a classic mistake that OIDC exists to prevent.</p>`) },

   { t: "read", html: LEC("Four roles, two channels", `
<p>OAuth names four roles. Mapping them onto your system makes the spec readable:</p>` +
     TABLE(["OAuth role", "Meaning", "In your login"], [
       ["Resource owner", "The person whose data it is", "The user logging in"],
       ["Client", "The app that wants access", "<b>Your backend</b> (it holds the client id and secret)"],
       ["Authorization server", "Issues tokens after the user approves", "Cognito"],
       ["Resource server", "The API that accepts the access token", "Cognito's userinfo endpoint (your own API uses its own token instead)"]], "OAuth roles mapped to your system") + `
<p>The second idea is the ${TT("front channel", `Messages passed via the browser: redirects and URL parameters. Visible to the user, browser extensions, history and logs, and possibly tampered with. Never put secrets or long-lived tokens here.`)} versus the ${TT("back channel", `Direct server-to-server HTTPS calls. The browser never sees them, so they can carry secrets like the client secret.`)}. Redirects through the browser are convenient but exposed. Server-to-server calls are private. OAuth's main flow is designed around that difference: only a short-lived, single-use <b>code</b> crosses the front channel, and the real tokens are fetched over the back channel using a secret the browser never sees.</p>
<p>Step through your actual login below. Watch which messages travel through the browser and which go directly between servers.</p>` +
     SEQ({ title: "Your login flow", colW: 220, actors: [
       { id: "b", label: "Browser", color: "browser", tip: `The front channel. Everything passing through here could be seen or altered.` },
       { id: "s", label: "Your backend", color: "azure", tip: `The OAuth <b>client</b>, a "confidential" one because it can keep a secret.` },
       { id: "c", label: "Cognito", color: "aws", tip: `The <b>authorization server</b> and identity provider.` }],
     msgs: [
       { from: "b", to: "s", label: "GET /login", note: `The user clicks "Log in", which points at your backend.` },
       { from: "s", to: "s", label: "make state + nonce", note: `Two random values, saved in a server session. <b>state</b> will tie the eventual callback to <i>this</i> browser's login attempt. <b>nonce</b> will be embedded in the ID token, tying the token to this attempt too.` },
       { from: "s", to: "b", label: "302 → Cognito /authorize", dash: true, note: `Front channel. The URL carries client_id (public by design), redirect_uri, scope <code>openid email</code>, state and nonce. Nothing secret.` },
       { from: "b", to: "c", label: "hosted login page", note: `The password is typed on Cognito's domain. Your code never touches it.` },
       { from: "c", to: "b", label: "302 → /callback?code&state", dash: true, note: `Front channel again. The <b>authorization code</b> is short-lived, single-use and useless without the client secret, so its exposure here is acceptable by design.` },
       { from: "b", to: "s", label: "GET /callback", note: `The backend checks that <code>state</code> matches the one it saved. A mismatch means this callback wasn't started by this browser, and it's rejected.` },
       { from: "s", to: "c", label: "code + client secret", color: "aws", note: `<b>Back channel.</b> Server to server, carrying the secret. This is the step an attacker who stole the code can't perform.` },
       { from: "c", to: "s", label: "ID token + access token", dash: true, color: "aws", note: `openid-client verifies the ID token: signature (using Cognito's published keys), issuer, audience (it's for <i>your</i> client id), expiry, and that the nonce matches.` },
       { from: "s", to: "c", label: "GET userinfo", color: "aws", note: `Using the access token, as OAuth intends: the backend calls a resource server (Cognito's userinfo) for profile details.` },
       { from: "s", to: "b", label: "→ LeanLog #authCode", dash: true, note: `<b>Your own addition, not part of OIDC.</b> Your backend now issues <i>its own</i> one-time code to hand the login over to the frontend on a different site. Notice the shape: it's a miniature authorization-code flow, repeated between your backend and your frontend.` },
       { from: "b", to: "s", label: "POST /api/token", color: "browser", note: `The frontend swaps that one-time code for your backend's signed bearer token, which it uses from now on.` }] })) },

   { t: "mcq", q: `Why does the authorization code travel through the browser, while the tokens are fetched by your backend directly?`, opts: [
     [`Redirects can only carry short values, and tokens are too long to fit in a URL`, false, `Length isn't the reason: the old "implicit" flow put tokens straight into the URL. It was deprecated because the front channel is exposed.`],
     [`The browser is exposed, so only a short-lived code goes there; redeeming it needs the server's secret`, true, `That's the design. A stolen code is nearly worthless: it expires in minutes, works once, and can't be exchanged without the client secret (or, for apps without a secret, the PKCE verifier).`],
     [`Cognito encrypts the code with the user's password, so only the browser that typed the password can read it`, false, `Codes aren't encrypted with passwords. Their protection comes from being short-lived, single-use and tied to a secret.`],
     [`Browsers can't receive JSON from Cognito, so a code is used in place of the token data`, false, `Browsers receive JSON all the time. The split is about which channel is trustworthy.`]] },

   { t: "read", html: LEC("Choosing a flow", `
<p>"OAuth 2.0" is really a family of flows (called ${TT("grant types", `The different ways a client can obtain tokens. Each fits a kind of app, depending on whether it has a browser, a user, and a place to keep secrets.`)}). Which one you use depends on two questions: <i>is there a user present?</i> and <i>can the app keep a secret?</i></p>
<p>An app that runs on a server you control is a ${TT("confidential client", `A client that can keep a secret because its code and config run on infrastructure you control. Your backend is one.`)}. An app whose code ships to users (a single-page app, a mobile app) is a ${TT("public client", `A client that can't keep a secret, because anyone can download its code and pull out anything inside. Single-page and mobile apps are public clients, so they use PKCE instead of a client secret.`)}: anything you put in it, users can extract.</p>` +
     TABLE(["Flow", "Use it for", "Status"], [
       ["Authorization code", "Server-side web apps with a secret (yours)", "✓ Standard"],
       [`Authorization code + ${TT("PKCE", `Proof Key for Code Exchange, pronounced "pixie". The app makes a random secret per login, sends only its hash at the start, then proves it knows the original when swapping the code. A stolen code can't be redeemed without it. Originally for mobile apps; now recommended for all clients.`)}`, "Single-page apps and mobile apps (no secret possible); also recommended on top of a secret", "✓ Recommended everywhere"],
       ["Client credentials", "Machine to machine, no user (a nightly job calling an API)", "✓ Standard"],
       ["Device code", "TVs and devices without a keyboard: \"go to this URL and enter ABCD-1234\"", "✓ Standard"],
       ["Refresh token", "Getting a new access token without making the user log in again", "✓ Standard, with rotation"],
       ["Implicit", "Formerly single-page apps: tokens returned directly in the URL", "✗ Deprecated (tokens leak via the front channel)"],
       ["Password (ROPC)", "The app collects the user's password and sends it on", "✗ Deprecated (reintroduces the problem OAuth solved)"]], "OAuth grant types") +
     LEC("state, nonce, PKCE: what each one stops", `
<p>These three random values look alike but defend against different attacks:</p>
<ul>
<li><b>state</b> protects the <i>callback</i>. Without it, an attacker could start a login with <i>their own</i> account and trick your browser into finishing it, silently logging you into the attacker's account (so your workouts get saved where they can read them). This is "login CSRF". Matching state proves the callback belongs to the login this browser started.</li>
<li><b>nonce</b> protects the <i>ID token</i>. It's copied into the signed token, so a token captured from some other login can't be replayed into yours.</li>
<li><b>PKCE</b> protects the <i>code</i>. Even if malware or a log captures the code, it can't be exchanged without the verifier that never left the app.</li>
</ul>` +
     CASE("standard parts and custom parts", `<p>Your login uses the standard OIDC code flow with a confidential client, through a well-tested library (openid-client), with state and nonce checked. That's textbook. The custom part is the handoff afterwards: a one-time code in the URL fragment, swapped for a homemade token. The standard alternative would be for the frontend to run authorization code + PKCE with Cognito itself, then send Cognito's own access token to your API, which would verify it against Cognito's published keys. That removes the custom token code, but makes the frontend a full OAuth client. Neither is wrong, and knowing that both exist is what matters.</p>`))) },

   { t: "sort", q: `Which OAuth flow fits each situation?`, buckets: ["Auth code + PKCE", "Client credentials", "Device code"], items: [
     [`A smart TV app wants the user to log in using their phone`, 2],
     [`A React single-page app with no backend of its own`, 0, `A public client: PKCE replaces the secret it can't keep.`],
     [`A nightly backup job calling an API, with no user involved`, 1],
     [`An iPhone app logging users in through the system browser`, 0],
     [`A games console showing "visit this URL and enter the code"`, 2],
     [`A billing service calling an invoicing service inside the company`, 1, `Service to service, no user.`]] },

   { t: "mcq", q: `A team's single-page app (no backend) logs users in with the implicit flow, because "that's what the tutorial used". What's the best advice?`, opts: [
     [`Keep it: implicit was designed for single-page apps and is still the recommended flow for them`, false, `It was designed for them in 2012, when browsers had fewer options. It's been discouraged since 2019 because tokens arrive in the URL.`],
     [`Move to the password grant, so tokens never appear in URLs and the app controls the whole login`, false, `The password grant is also deprecated, and worse: the app handles raw passwords, the exact problem OAuth was invented to remove.`],
     [`Switch to authorization code with PKCE: no tokens in URLs, and no client secret needed`, true, `That's current best practice (and part of OAuth 2.1). Browsers can now make the cross-origin token request that implicit was invented to avoid.`],
     [`Embed a client secret in the JavaScript bundle and switch to the plain authorization code flow`, false, `Anything in a bundle is public, so it would no longer be a secret. That's why public clients use PKCE.`]] },

   { t: "read", html: LEC("JWTs: the token format everyone uses", `
<p>OIDC ID tokens, and most access tokens, are ${TT("JWTs", `JSON Web Tokens (RFC 7519), pronounced "jot". Three base64url parts separated by dots: header.payload.signature. Anyone can decode and read the payload; the signature only proves it hasn't been altered and who issued it.`)}: three base64url-encoded parts joined by dots.</p>
<pre class="plain"><b>eyJhbGciOiJSUzI1NiJ9</b>.<b>eyJzdWIiOiIzZjJhIiwiZXhwIjoxNzk5…</b>.<b>Kx9…</b>
 header: algorithm       payload: claims (sub, iss, aud, exp…)     signature</pre>
<p>Two facts trip people up. First, a JWT is <b>signed, not encrypted</b>: anyone can paste it into a decoder and read the claims. Never put secrets in one. Second, a signed token is only as good as the <b>checks</b> made on it: the signature, the expiry, the issuer and the audience must all be verified, every time. Historic JWT bugs came from libraries that accepted <code>"alg": "none"</code> (no signature at all) or confused the algorithm types.</p>
<p>Identity providers sign with a <i>private</i> key and publish the matching public keys at a ${TT("JWKS", `JSON Web Key Set: a public URL where a provider lists its current signing keys, so anyone can verify its tokens. Keys can rotate without breaking clients. OIDC's discovery document (<code>/.well-known/openid-configuration</code>) says where to find it.`)} URL, so anyone can verify their tokens without sharing a secret. Your homemade token uses a different approach: one shared secret (HMAC) both signs and verifies, which only works because the same server does both.</p>`) },

   { t: "mcq", q: `During a demo, someone pastes a user's ID token into an online JWT decoder and reads their email address. Is that a security hole?`, opts: [
     [`Yes: ID tokens are encrypted for the client, so the decoder must have broken the encryption`, false, `ID tokens are normally signed, not encrypted. Decoding them takes no breaking at all.`],
     [`Yes: the identity provider should have hashed the payload so that only the server can recover the email`, false, `A hash can't be "recovered" by anyone. JWT payloads are meant to be readable; their protection is the signature.`],
     [`No: the token's signature hides the payload from anyone who doesn't hold the provider's public key`, false, `Signatures don't hide anything. And public keys are, by definition, public.`],
     [`No: JWT payloads are readable by design, and only the signature stops anyone changing them`, true, `Right. Readable claims are fine; secrets in claims aren't. The real risk would be someone <i>using</i> a stolen token, which is about where tokens are stored (next lecture), not about reading them.`]] },

   { t: "order", q: `Put the authorization code flow in order.`, items: [
     `The app redirects the browser to the provider, with client id, scope, state and nonce`,
     `The user logs in on the provider's own page`,
     `The provider redirects back with a short-lived code and the same state`,
     `The app checks state, then swaps the code (plus its secret or PKCE verifier) for tokens`,
     `The app verifies the ID token's signature, issuer, audience, expiry and nonce`,
     `The app starts its own session for the now-identified user`] },

   { t: "read", html: TERMS([
       ["OAuth 2.0", "Delegated access: an app gets a limited access token for an API."],
       ["OpenID Connect", "Identity on top of OAuth: adds the ID token and userinfo."],
       ["Front / back channel", "Through the browser (exposed) vs server to server (private)."],
       ["Confidential / public client", "Can keep a secret (server) vs can't (SPA, mobile)."],
       ["PKCE", "Per-login proof that replaces or strengthens the client secret."],
       ["state / nonce", "Tie the callback, and the ID token, to this exact login attempt."],
       ["JWT", "Signed, readable token: header.payload.signature."]]) +
     FURTHER([`<i>OAuth 2 in Action</i>, Richer &amp; Sanso: the standard book.`, `oauth.net/2/ and "OAuth 2.0 Security Best Current Practice" (RFC 9700).`, `"OAuth 2.0 for Browser-Based Applications" (IETF draft): the current guidance for single-page apps.`]) }
 ]},

 /* ===================== 5. Sessions, cookies and tokens ===================== */
 { id: "u-sess", title: "5. Sessions, cookies and tokens",
   intro: `Once someone has logged in, every later request has to prove it came from them. There are two big families of solution, both of which your backend uses, plus a browser privacy change that forced your hand. This lecture explains the whole design space.`,
   steps: [
   { t: "read", html: OBJ([
       `compare server-side sessions with self-contained tokens and the trade-offs of each`,
       `explain every cookie attribute and what "same-site" and "third-party" really mean`,
       `weigh the options for storing tokens in a browser`,
       `explain why your app carries both a cookie and a bearer token`]) +
     LEC("Two families: look it up, or carry it with you", `
<p>Remember: HTTP is stateless. After login, each request must carry something that proves who sent it. There are two fundamentally different ways to do it:</p>` +
     TABLE(["", "Server-side session (reference)", "Self-contained token (value)"], [
       ["What the client holds", "A random session id: a meaningless ticket number", "The data itself (user id, expiry), signed by the server"],
       ["What the server does", "Looks the id up in a session store on every request", "Checks the signature and expiry; nothing to look up"],
       ["Logging someone out", "Easy: delete the session from the store", "Hard: the token stays valid until it expires, unless you keep a blocklist"],
       ["Multiple servers", "All of them need the same shared store", "Any server with the key can verify it"],
       ["Typical form", "A cookie, e.g. express-session's <code>connect.sid</code>", "A JWT or similar, often sent as <code>Authorization: Bearer …</code>"],
       ["Your app", "express-session, cookie, kept in memory", "Your HMAC-signed token, 8-hour lifetime, in localStorage"]], "Sessions vs tokens") +
     MYTH(`Tokens are modern and sessions are old-fashioned, so tokens are better.`, `They're different trade-offs. Sessions make logout and revocation trivial but need shared storage. Tokens avoid storage but can't easily be taken back. Large systems often combine them: a short-lived access token (minutes) plus a server-tracked ${TT("refresh token", `A longer-lived credential used only to get new access tokens. Because it's checked against the server each time, it <i>can</i> be revoked, and with rotation each one is single-use, so a stolen copy is detected the moment both parties try to use it.`)} that can be revoked.`)) },

   { t: "read", html: LEC("Cookies in depth", `
<p>A server sets a cookie with a response header, and the browser sends it back automatically on later requests to that server:</p>
<pre class="plain">Set-Cookie: connect.sid=s%3Aab12…; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=None</pre>
<p>Each attribute is a security decision:</p>` +
     TABLE(["Attribute", "What it does", "Your session cookie (production)"], [
       ["HttpOnly", "Page JavaScript can't read the cookie, so an injected script can't steal it", "✓ on"],
       ["Secure", "Only sent over HTTPS", "✓ on"],
       ["Max-Age / Expires", "When the browser discards it. Without one, it's deleted when the browser closes", "8 hours"],
       ["Domain / Path", "Which hosts and paths receive it. Leaving Domain out (as you do) limits it to that exact host", "your backend's host only"],
       [`SameSite`, `Whether it's sent on requests started by <i>other</i> sites. <b>Strict</b>: never. <b>Lax</b>: only on top-level navigations like clicking a link (Chrome's default since 2020). <b>None</b>: always (requires Secure)`, "None, because your frontend is on a different site"]], "Cookie attributes") + `
<h4>What "site" means</h4>
<p>Browsers treat ${TT("site", `Roughly, the registrable domain: example.com and api.example.com are the same site. But domains on the Public Suffix List count as "public suffixes", like .co.uk, so each name under them is its own site.`)} and ${TT("origin", `Scheme + host + port, exactly. https://example.com and https://api.example.com are the same site but different origins.`)} differently. A site is roughly the registrable domain, so <code>app.example.com</code> and <code>api.example.com</code> are the <i>same site</i>. Shared hosting domains like <code>github.io</code> and <code>azurecontainerapps.io</code> are on the ${TT("Public Suffix List", `A community-maintained list of domains under which anyone can register names: .com, .co.uk, but also github.io, herokuapp.com, azurecontainerapps.io and many more. Browsers use it to stop one user's subdomain setting cookies for everyone else's.`)}, so every user's subdomain is its own site. LeanLog on github.io and your backend on azurecontainerapps.io are completely unrelated sites as far as the browser is concerned.</p>
<p>That makes your session cookie a ${TT("third-party cookie", `A cookie belonging to a different site from the one in the address bar. Historically used for cross-site ad tracking, which is why browsers now restrict them, and legitimate cross-site logins get caught too.`)} whenever the LeanLog page calls the backend. And third-party cookies are disappearing:</p>` +
     TIMELINE("The decline of third-party cookies", [
       ["2017", "Safari introduces Intelligent Tracking Prevention."],
       ["2020", "Safari blocks third-party cookies by default. Every iPhone browser uses Safari's engine."],
       ["2021–22", "Firefox isolates cookies per site (Total Cookie Protection) by default."],
       ["2020–25", "Chrome repeatedly announces, delays, then drops its plan to remove them by force; restrictions and user controls remain."],
       ["Your app", "Cookies fail on phones → bearer token added alongside them."]])) },

   { t: "read", html: ARCH({ w: 720, h: 230, title: "Why the cookie fails and the token works", nodes: [
       { id: "p", x: 20, y: 30, w: 200, h: 56, label: "LeanLog page", sub: "c-mckeon.github.io", color: "browser", tip: `The site in the address bar: the "first party".` },
       { id: "b", x: 480, y: 30, w: 220, h: 56, label: "Your backend", sub: "a different site entirely", color: "azure", tip: `Its cookie is third-party in this context.` },
       { id: "t", x: 20, y: 150, w: 200, h: 56, label: "Same page, fetch()", sub: "background API call", color: "browser", tip: `Your JavaScript adds an Authorization header to the request.` },
       { id: "b2", x: 480, y: 150, w: 220, h: 56, label: "Your backend", sub: "reads the header", color: "azure", tip: `The token arrives whatever the cookie policy.` }],
     edges: [
