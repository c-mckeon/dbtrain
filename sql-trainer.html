/* ---------- Hover notes: every annotated token, diagram box and arrow ---------- */
const TIPS = [];
const tip = html => { TIPS.push(html); return TIPS.length - 1; };

/* Notes shared by every snippet: language keywords and operators */
const JSKW = {
  "import": "<b>import</b> pulls code in from another file or package, so this file can use it. Each file is its own module, and nothing from another file is visible unless it's imported.",
  "from": "<b>from</b> names the module the import comes from: a package name (from node_modules), a <code>node:</code> built-in, or a relative path to one of your own files.",
  "export": "<b>export</b> makes this function or value available to other files that import it. Anything not exported stays private to this file.",
  "default": "<b>export default</b> marks the file's main export. Whoever imports it can give it any name they like.",
  "const": "<b>const</b> declares a name that can't be pointed at a different value later. The value itself can still change inside (you can add keys to a const object). Most names in modern JS are const, so a reader knows they won't be reassigned.",
  "let": "<b>let</b> declares a name that <i>can</i> be reassigned later. It's used here because the value is filled in or changed afterwards.",
  "var": "<b>var</b> is the old (pre-2015) way to declare a variable. It has looser scoping rules than let/const, and seeing it is a sign the code is older or copied from older examples.",
  "function": "<b>function</b> defines a named, reusable block of code. Calling it later runs the body with the arguments you pass.",
  "async": "<b>async</b> marks a function that can pause with <code>await</code> while it waits for slow things (network, database). It always returns a Promise, which is an \"answer that arrives later\".",
  "await": "<b>await</b> pauses this async function until the Promise settles, then hands you the result. Other requests keep being served while this one waits, which is what lets one Node server handle many users at once.",
  "return": "<b>return</b> hands a value back to whoever called this function, and stops the function there.",
  "if": "<b>if</b> runs the next block only when the condition is truthy.",
  "else": "<b>else</b> runs when the preceding if-condition was falsy.",
  "try": "<b>try</b> starts a block where errors are caught instead of crashing the whole request. If anything inside throws, control jumps to <code>catch</code>.",
  "catch": "<b>catch</b> receives the error thrown inside try, so the code can log it and send a tidy error response instead of crashing.",
  "finally": "<b>finally</b> runs after try/catch whatever happened, success or failure. It's the right place for clean-up like re-enabling a button.",
  "throw": "<b>throw</b> raises an error. It stops this function and jumps to the nearest catch, or crashes the process if there isn't one.",
  "new": "<b>new</b> creates an object from a class or constructor, such as <code>new Set()</code>, <code>new Map()</code> or <code>new URL()</code>.",
  "class": "<b>class</b> defines a blueprint for objects that bundle data and the functions (methods) that work on it.",
  "constructor": "<b>constructor</b> is the special method that runs once when <code>new ClassName(...)</code> creates an object. It stores the arguments on <code>this</code>.",
  "this": "<b>this</b> means \"the object this method was called on\". Inside a class it's the particular instance.",
  "typeof": "<b>typeof</b> gives a value's basic type as a string: \"string\", \"object\", \"number\", \"function\", \"undefined\"… It's used for defensive checks on untrusted input.",
  "for": "<b>for</b> starts a loop.",
  "of": "<b>for … of</b> loops over each item of a list, Map or Set in turn.",
  "true": "The boolean value <b>true</b>.",
  "false": "The boolean value <b>false</b>.",
  "null": "<b>null</b> means \"deliberately nothing\": an explicit empty value.",
  "undefined": "<b>undefined</b> means \"never set\". It's what you get from a missing property or a missing argument.",
  "delete": "<b>delete</b> removes a property from an object, e.g. clearing a value from the session once it's been used.",
  "=>": "<b>=&gt;</b> is an arrow function: a short way to write a small function. <code>(x) =&gt; x * 2</code> takes x and returns x × 2. Arrow functions are used constantly for callbacks, functions you hand to something else to call later.",
  "...": "<b>...</b> is spread/rest. In <code>{ ...a, b: 1 }</code> it copies all of a's properties into a new object. In <code>const { x, ...rest } = obj</code> it collects \"everything else\" into rest.",
  "?.": "<b>?.</b> is optional chaining. <code>a?.b</code> gives undefined instead of crashing if a is null or undefined. It's defensive code for data that might not be there.",
  "??": "<b>??</b> means \"use the right side only if the left is null or undefined\". Unlike ||, it keeps 0 and \"\".",
  "||": "<b>||</b> (or) gives the left side if it's truthy, otherwise the right side. It's often used for defaults: <code>x || 'fallback'</code>. Careful: 0 and \"\" count as falsy too.",
  "&&": "<b>&amp;&amp;</b> (and) is only true if both sides are. It also short-circuits: <code>a &amp;&amp; b()</code> only calls b if a is truthy.",
  "===": "<b>===</b> is strict equality: same type and same value. Always prefer it over ==, which converts types in surprising ways.",
  "!==": "<b>!==</b> is strict not-equal.",
  "!": "<b>!</b> flips truthy and falsy. <code>!x</code> is true when x is missing, empty, 0 or null.",
  "?": "<b>? :</b> is the ternary operator, a one-line if/else: <code>condition ? valueIfTrue : valueIfFalse</code>.",

function tokenize(code, lang) {
  const re = lang === "yaml" || lang === "docker" || lang === "sh"
    ? /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'[^'\n]*')|(\$\{\{[^}]*\}\}|\$[A-Z_]+)|([A-Za-z_][\w.-]*)|(\d+)|(\s+)|([^\sA-Za-z_\d])/g
    : /(\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|\/(?![*/\s])(?:[^/\\\n[]|\\.|\[(?:[^\]\\\n]|\\.)*\])+\/[gimsuy]*(?=[.,);\s]))|()([A-Za-z_$][\w$]*)|(\d[\d_]*(?:\.\d+)?)|(\s+)|(=>|===|!==|\?\.|\?\?|\.\.\.|\|\||&&|[^\sA-Za-z_$\d])/g;
  const out = []; let m;
  while ((m = re.exec(code))) {
    const [t, c, s, v, w, n, sp] = m;
    out.push({ t, k: c ? "c" : s ? "s" : v ? "v" : w ? "w" : n ? "n" : sp ? "sp" : "p" });
  }
  return out;
}

/* Annotated code. notes: { token: html, "token@line": html } where line is the displayed line number.
   bands: [[fromLine, toLine, "role"]], roles coloured by BAND. Every word token should have a note. */
const BAND = { auth: ["Auth / identity", "#e3a624"], valid: ["Input checks", "#2f81f7"], data: ["Database", "#2da44e"], resp: ["Response", "#a970ff"], config: ["Config", "#8b949e"], err: ["Error handling", "#e5534b"], ui: ["Browser / UI", "#db61a2"], build: ["Build / deploy", "#3fb8af"] };
const AC_MISSING = [];
function AC(o) {
  const lang = o.lang || (o.src && /\.ya?ml$/.test(o.src) ? "yaml" : o.src && /Dockerfile|ignore$/.test(o.src) ? "docker" : o.src && /\.json$/.test(o.src) ? "json" : "js");
  const start = o.src ? o.from : (o.start || 1);
  const hidden = new Set(o.hide || []);
  const lines = o.src ? Array.from({ length: o.to - o.from + 1 }, (_, i) => hidden.has(o.from + i) ? "// … line hidden on purpose (see the Security lesson)" : (SRC[o.src] && SRC[o.src][o.from + i] != null ? SRC[o.src][o.from + i] : "")) : trimCode(o.code).split("\n");
  if (o.src && !o.file) o.file = o.src + "  ·  lines " + o.from + "–" + o.to;
  const notes = Object.assign({}, lang === "js" ? APPN : {}, o.notes || {});
  const kwOK = lang === "js";
  if (lang === "json") lang === "json";
  const bandAt = l => { for (const [a, b, r] of o.bands || []) if (l >= a && l <= b) return r; return null; };
  const body = lines.map((line, i) => {
    const ln = start + i, band = bandAt(ln);
    const toks = tokenize(line, lang).map(({ t, k }) => {
      if (k === "sp") return t;
      const key = t;
      const note = notes[key + "@" + ln] || notes[key] || (kwOK && JSKW[key] && (k === "w" || k === "p") ? JSKW[key] : null) || (k === "c" ? null : null);
      const cls = k === "w" && kwOK && JSKW[key] ? "k" : k === "w" ? "i" : k;
      if (!note) {
        if ((k === "w" || k === "s" || k === "v") && !(k === "w" && kwOK && JSKW[key])) AC_MISSING.push((o.title || o.file || "?") + ":" + ln + " " + t);
        return `<span class="${cls}">${esc(t)}</span>`;
      }
      return `<span class="${cls} tk" tabindex="0" data-tip="${tip(`<code>${esc(t.length > 60 ? t.slice(0, 57) + "…" : t)}</code><div>${note}</div>`)}">${esc(t)}</span>`;
    }).join("");
    return `<span class="cl${band ? " band" : ""}"${band ? ` style="--band:${BAND[band][1]}"` : ""}><span class="ln">${ln}</span>${toks || " "}</span>`;
  }).join("");
  const used = [...new Set((o.bands || []).map(b => b[2]))];
  return `<figure class="ac">${o.file ? `<figcaption><span class="file">${esc(o.file)}</span>${used.length ? `<span class="legend">${used.map(r => `<i style="--band:${BAND[r][1]}">${BAND[r][0]}</i>`).join("")}</span>` : ""}</figcaption>` : ""}<pre class="code acode">${body}</pre><p class="hint-line ac-hint">Hover or tap any word for what it is and why it's there.</p></figure>`;
}

/* Flag callouts */
const FLAG = (kind, title, html) => `<div class="flag flag-${kind}"><b>${kind === "risk" ? "⚠ Security flag" : kind === "warn" ? "△ Worth knowing" : "✓ Done well"}: ${title}</b><div>${html}</div></div>`;

/* Provider colours for diagrams */
const PROV = { aws: "#ff9900", azure: "#2f81f7", google: "#e3a624", github: "#8b949e", browser: "#2da44e", you: "#a970ff", danger: "#e5534b" };

/* Architecture diagram: boxes + labelled arrows, all hoverable */
function ARCH(o) {
  const N = {}; o.nodes.forEach(n => N[n.id] = n);
  const ctr = n => [n.x + n.w / 2, n.y + n.h / 2];
  const clip = (n, tx, ty) => { const [cx, cy] = ctr(n), dx = tx - cx, dy = ty - cy; const s = Math.min(Math.abs((n.w / 2 + 4) / (dx || 1e-9)), Math.abs((n.h / 2 + 4) / (dy || 1e-9))); return [cx + dx * s, cy + dy * s]; };
  let svg = `<svg class="diagram" viewBox="0 0 ${o.w} ${o.h}" role="img" aria-label="${esc(o.title || "Diagram")}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
  (o.groups || []).forEach(g => { svg += `<g${g.tip ? ` class="tk" tabindex="0" data-tip="${tip(g.tip)}"` : ""}><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="12" fill="${PROV[g.color] || g.color}" fill-opacity=".07" stroke="${PROV[g.color] || g.color}" stroke-dasharray="5 4"/><text x="${g.x + 10}" y="${g.y + 18}" class="dg-group" fill="${PROV[g.color] || g.color}">${esc(g.label)}</text></g>`; });
  (o.edges || []).forEach(e => {
    const a = N[e.from], b = N[e.to];
    const [ax, ay] = ctr(a), [bx, by] = ctr(b);
    const off = e.off || 0, nx = -(by - ay), ny = bx - ax, L = Math.hypot(nx, ny) || 1;
    const ox = nx / L * off, oy = ny / L * off;
    const [x1, y1] = clip(a, bx + ox, by + oy), [x2, y2] = clip(b, ax + ox, ay + oy);
    const sx = x1 + ox, sy = y1 + oy, ex = x2 + ox, ey = y2 + oy, at = e.at == null ? .5 : e.at, mx = sx + (ex - sx) * at, my = sy + (ey - sy) * at;
    const col = PROV[e.color] || e.color || "currentColor";
    svg += `<g class="dg-edge${e.tip ? " tk" : ""}"${e.tip ? ` tabindex="0" data-tip="${tip(e.tip)}"` : ""} style="color:${col}"><line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="currentColor" stroke-width="2"${e.dash ? ` stroke-dasharray="6 4"` : ""} marker-end="url(#ah)"${e.both ? ` marker-start="url(#ah)"` : ""}/>`;
    if (e.label) { const w = e.label.length * 6.2 + 12; svg += `<rect x="${mx - w / 2}" y="${my - 10}" width="${w}" height="18" rx="9" class="dg-lbg"/><text x="${mx}" y="${my + 3}" text-anchor="middle" class="dg-elabel">${esc(e.label)}</text>`; }
    svg += `</g>`;
  });
  o.nodes.forEach(n => {
    const col = PROV[n.color] || n.color;
    svg += `<g class="dg-node${n.tip ? " tk" : ""}"${n.tip ? ` tabindex="0" data-tip="${tip(n.tip)}"` : ""}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="2"/>` +
      `<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + (n.sub ? -3 : 5)}" text-anchor="middle" class="dg-label">${esc(n.label)}</text>` +
      (n.sub ? `<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 13}" text-anchor="middle" class="dg-sub">${esc(n.sub)}</text>` : "") + `</g>`;
  });
  svg += `</svg>`;
  const legend = o.legend ? `<div class="dg-legend">${o.legend.map(([c, l]) => `<i style="--band:${PROV[c] || c}">${esc(l)}</i>`).join("")}</div>` : "";
  return `<figure class="dg"><div class="dgwrap">${svg}</div>${legend}<p class="hint-line ac-hint">Hover or tap any box or arrow.</p></figure>`;
}

/* Sequence diagram you can step through */
function SEQ(o) {
  const cw = o.colW || 150, top = 54, row = o.row || 46, W = cw * o.actors.length, H = top + row * o.msgs.length + 20;
  const X = {}; o.actors.forEach((a, i) => X[a.id] = cw * i + cw / 2);
  let svg = `<svg class="diagram seq" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "Sequence diagram")}"><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
  o.actors.forEach(a => { const col = PROV[a.color] || a.color; svg += `<g${a.tip ? ` class="tk" tabindex="0" data-tip="${tip(a.tip)}"` : ""}><rect x="${X[a.id] - cw / 2 + 8}" y="6" width="${cw - 16}" height="34" rx="8" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="2"/><text x="${X[a.id]}" y="28" text-anchor="middle" class="dg-label">${esc(a.label)}</text></g><line x1="${X[a.id]}" y1="40" x2="${X[a.id]}" y2="${H - 6}" stroke="${col}" stroke-opacity=".5" stroke-dasharray="4 4"/>`; });
  o.msgs.forEach((m, i) => {
    const y = top + row * i + row / 2, x1 = X[m.from], x2 = X[m.to], self = m.from === m.to;
    const col = PROV[m.color] || "currentColor";
    svg += `<g class="seq-msg" data-i="${i}" style="color:${col}">`;
    if (self) svg += `<path d="M${x1},${y - 10} h28 v16 h-26" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ah2)"/><text x="${x1 + 34}" y="${y + 2}" class="dg-elabel" text-anchor="start"><tspan class="seq-n">${i + 1}</tspan> ${esc(m.label)}</text>`;
    else { const dir = x2 > x1 ? 1 : -1; svg += `<line x1="${x1}" y1="${y}" x2="${x2 - dir * 3}" y2="${y}" stroke="currentColor" stroke-width="2"${m.dash ? ` stroke-dasharray="6 4"` : ""} marker-end="url(#ah2)"/><text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" class="dg-elabel"><tspan class="seq-n">${i + 1}</tspan> ${esc(m.label)}</text>`; }
    svg += `</g>`;
  });
  svg += `</svg>`;
  return `<figure class="dg seqbox" data-step="-1"><div class="dgwrap">${svg}</div><div class="seq-ctl"><button type="button" class="btn btn-ghost" data-seq="-1">← Back</button><button type="button" class="btn btn-primary" data-seq="1">Step through →</button><span class="seq-pos"></span></div>` +
    o.msgs.map((m, i) => `<div class="seq-note" data-i="${i}" hidden><b>${i + 1}. ${esc(m.label)}</b><div>${m.note}</div></div>`).join("") + `</figure>`;
}

/* Tooltip + stepper wiring (called once at startup) */
function wireTips() {
  const box = document.createElement("div"); box.id = "tipbox"; box.setAttribute("role", "tooltip"); box.hidden = true; document.body.appendChild(box);
  let pinned = null;
  const show = el => {
    const id = el.getAttribute("data-tip"); if (id == null) return;
    box.innerHTML = TIPS[+id]; box.hidden = false;
    const r = el.getBoundingClientRect(), bw = Math.min(380, window.innerWidth - 24);
    box.style.width = bw + "px";
    let left = Math.min(Math.max(12, r.left), window.innerWidth - bw - 12);
    box.style.left = left + "px";
    const below = r.bottom + 8, h = box.offsetHeight;
    box.style.top = (below + h > window.innerHeight - 8 && r.top - h - 8 > 8 ? r.top - h - 8 : below) + "px";
    document.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
  };
  const hide = () => { box.hidden = true; document.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on")); };
  const hoverable = window.matchMedia && matchMedia("(hover: hover)").matches;
  document.addEventListener("mouseover", e => { if (!hoverable || pinned) return; const el = e.target.closest && e.target.closest(".tk"); if (el) show(el); });
  document.addEventListener("mouseout", e => { if (!hoverable || pinned) return; const el = e.target.closest && e.target.closest(".tk"); if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest(".tk"); if (el) show(el); });
  document.addEventListener("focusout", e => { if (!pinned && e.target.closest && e.target.closest(".tk")) hide(); });
  document.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest(".tk");
    if (el) { if (pinned === el) { pinned = null; hide(); } else { pinned = el; show(el); } return; }
    if (!box.contains(e.target)) { pinned = null; hide(); }
    const b = e.target.closest && e.target.closest("[data-seq]");
    if (b) {
      const fig = b.closest(".seqbox"), msgs = fig.querySelectorAll(".seq-msg"), n = msgs.length;
      let i = Math.max(-1, Math.min(n - 1, +fig.dataset.step + +b.dataset.seq)); fig.dataset.step = i;
      msgs.forEach((m, j) => { m.classList.toggle("on", j === i); m.classList.toggle("dim", i >= 0 && j > i); });
      fig.querySelectorAll(".seq-note").forEach((d, j) => d.hidden = j !== i);
      fig.querySelector('[data-seq="1"]').textContent = i < 0 ? "Step through →" : i >= n - 1 ? "Done" : "Next →";
      fig.querySelector(".seq-pos").textContent = i < 0 ? "" : `Step ${i + 1} of ${n}`;
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = null; hide(); } });
  window.addEventListener("scroll", () => { if (!box.hidden) hide(); pinned = null; }, { passive: true });
}

       "''": `An empty string, the fallback if there's no code.` } }) + `<p>Read it inside out: <code>req.body?.code</code> safely gives undefined if there's no body; <code>|| ''</code> swaps any falsy result for an empty string; <code>String(...)</code> guarantees text even if someone sent a number or an object.</p>` },
   { t: "predict", q: `What does this print? (Two lines.)` + AC({ code: `const req = { body: undefined };
console.log('[' + String(req.body?.code || '') + ']');
console.log(req.body?.code ?? 'none');`, notes: { req: `A fake request whose body is missing.`, "'['": `Brackets so you can see an empty string.`, "']'": `Closing bracket.`, "''": `Empty-string fallback.`, "'none'": `Fallback used by ?? when the left side is null or undefined.`, code: `The property being read safely.` } }), answer: "[]\nnone" },
   { t: "read", html: `<p><b>async / await</b> is how one Node server serves many users at once. When a handler hits <code>await</code> (say, waiting on the database), Node parks it and serves other requests, then resumes it when the data arrives. Nothing blocks.</p>` + AC({ src: "backend/app.js", from: 206, to: 215, bands: [[207, 210, "data"], [211, 214, "err"]], notes: {
       "'/api/workouts'": `The URL path this handler answers.`,
       "'workouts'": `The child folder under the user's root that holds their workouts.`,
       "'value'": `The Firebase event type: "give me the value here, once".`,
       workouts: `The response's top-level key. The frontend reads <code>result.workouts</code>.`,
       "'Could not load workouts:'": `A log prefix so you can find this failure in Azure's logs.`,
       "'Workout data is not available yet.'": `What the user is told. Deliberately vague: internal error details stay in the logs, not in the response.`,
       get: `<b>app.get(path, ...handlers)</b> registers handlers for GET requests to this path. They run left to right: requireAuth first, then the async function.` } }) },
   { t: "predict", q: `In what order do the lines print? Type them one per line.` + AC({ code: `async function load() {
  console.log('2 asking');
  await null;
  console.log('4 got it');
}
console.log('1 start');
load();
console.log('3 carry on');`, notes: { load: `An async function. Calling it runs the body until the first await, then returns a Promise straight away.`, "'2 asking'": `Printed synchronously, before the await.`, "'4 got it'": `Only printed after the current code has finished, when the await resumes.`, "'1 start'": `Printed first.`, "'3 carry on'": `The caller carries on immediately after load() returns its Promise.` } }), answer: "1 start\n2 asking\n3 carry on\n4 got it",
     why: `load() runs until its first await, then hands control back. The caller prints "3 carry on", and only then does load resume. That's exactly what happens in your handlers while the database is busy, except the "carry on" part is other users' requests.` },
   { t: "read", html: `<p><b>Chained array methods</b> read left to right, with each one passing its result to the next. Your server builds its CORS allow-list this way:</p>` + AC({ src: "backend/app.js", from: 24, to: 29, bands: [[24, 29, "config"]], notes: {
       frontendOrigins: `The set of websites allowed to call your API from a browser (more in the CORS lesson).`,
       FRONTEND_ORIGINS: `An environment variable: a comma-separated list of allowed origins.`,

       origin: `Each piece of text after splitting.`,
       "(": `Groups the arrow function's parameter.` } }) },
   { t: "predict", q: `What does this print? (Two lines.)` + AC({ code: `const raw = 'http://a.test, ,http://b.test';
const origins = new Set(raw.split(',').map((o) => o.trim()).filter(Boolean));
console.log(origins.size);
console.log(origins.has('http://b.test'));`, notes: { raw: `Messy config text, with a blank entry in the middle.`, "'http://a.test, ,http://b.test'": `Three pieces once split: "http://a.test", " " and "http://b.test".`, origins: `The cleaned-up set.`, "','": `Split at commas.`, o: `Each piece.`, size: `How many items the Set holds.`, "'http://b.test'": `The value being looked up.` } }), answer: "2\ntrue",

 { sec: "The backend, line by line" },
 { id: "m-config", title: "Startup: reading configuration",
   intro: `When the container starts, Node runs <code>backend/app.js</code> from the top. The first 38 lines load libraries and read settings. They decide which Cognito pool, which frontend and which secret the server uses, and they refuse to start if something critical is missing.`,
   steps: [
   { t: "read", html: AC({ src: "backend/app.js", from: 1, to: 38, bands: [[1, 9, "build"], [11, 30, "config"], [32, 38, "err"]], notes: {
       "'dotenv/config'": `Importing this file runs dotenv immediately: it reads your local <code>.env</code> file into <code>process.env</code>. In Azure there's no .env file; the variables come from the Container App's settings, and dotenv just finds nothing to add. It has to be line 1 so every later line sees the variables.`,
       express: `<b>Express</b> is the web framework, the library that turns incoming HTTP requests into calls to your handler functions. It's the JavaScript cousin of FastAPI from the Build course.`,
       "'express'": `The npm package name. It's installed into node_modules from <code>backend/package.json</code>.`,
       "session@3": `The <b>express-session</b> middleware, which remembers logged-in users between requests using a cookie.`,
       "'express-session'": `The package that provides cookie-based sessions.`,
       generators: `From openid-client: helpers that make the random <code>state</code> and <code>nonce</code> values the login flow needs.`,
       Issuer: `From openid-client: represents Cognito as an "OpenID Connect issuer". It can discover Cognito's endpoints and build a client for your app.`,
       "'openid-client'": `A certified OpenID Connect library. It handles the fiddly, security-critical parts of logging in with Cognito, so you don't have to.`,

       "'node:url'": `A Node built-in module (the <code>node:</code> prefix means built-in, not from npm).`,
       createHmac: `Makes an <b>HMAC</b>, a keyed fingerprint of some data. Only someone with the secret can produce the right fingerprint, which is how your tokens are tamper-proof.`,
       randomBytes: `Cryptographically secure random bytes, used for the one-time login codes.`,
       timingSafeEqual: `Compares two secrets in constant time, so an attacker can't learn how many leading bytes matched by timing the responses.`,
       "'node:crypto'": `Node's built-in cryptography module.`,
       ServerValue: `From the Firebase Admin SDK. <code>ServerValue.TIMESTAMP</code> is a placeholder that the database replaces with <i>its</i> clock time when it writes, so it doesn't depend on the server's clock being right.`,
       "'firebase-admin/database'": `The Realtime Database part of the Firebase Admin SDK.`,
       ensureDemoTemplate: `Your function (firebase-admin.js) that seeds the shared demo account's data.`,
       ensureUserTemplate: `Your function that gives a brand-new user starter data the first time they're seen.`,
       getUserRootRef: `Your function that returns the database location <code>workoutApp/users/&lt;sub&gt;</code> for one user.`,
       "'./firebase-admin.js'": `A relative import: your own file next to app.js.`,
       createLocalDemoRef: `Your fake-database reference, used when running offline.`,
       initializeLocalDemoData: `Creates the local demo JSON file if it's missing.`,
       "'./local-demo-store.js'": `Your offline data store.`,
       localDemoMode: `True if the server was started with <code>--local-demo</code> (or the LOCAL_DEMO_MODE variable). Then it uses a JSON file instead of Firebase and fakes the login.`,
       "'--local-demo'": `The command-line flag used by <code>npm run dev:local</code>.`,
       LOCAL_DEMO_MODE: `Environment-variable alternative to the flag.`,
       "'true'": `Environment variables are always text, so the check compares against the string "true".`,
       port: `Which network port the server listens on. Azure's ingress forwards traffic to it.`,
       PORT: `The port variable, defaulting to 3000, which matches the Dockerfile's EXPOSE 3000.`,
       "3000": `The default port.`,
       issuerUrl: `The address of your Cognito user pool, used to discover its login endpoints.`,
       COGNITO_ISSUER: `The env var holding that address.`,
       "'https://cognito-idp.<region>.amazonaws.com/<pool-id>'": `A hard-coded fallback value (redacted here). Fallbacks mean the server "works" even when misconfigured, which can hide mistakes. Many teams prefer failing loudly at startup instead.`,
       clientId: `Your app's public id within the Cognito pool. It's not secret, because it appears in browser redirects.`,
       COGNITO_CLIENT_ID: `Env var for the client id.`,
       "'<client-id>'": `Hard-coded fallback client id (redacted).`,
       clientSecret: `The app's Cognito <b>secret</b>. It proves to Cognito that a token request really comes from your backend. It must only ever live on the server.`,
       COGNITO_CLIENT_SECRET: `Env var holding the secret, set as a secret in Azure. It's correctly given <i>no</i> fallback.`,
       redirectUri: `Where Cognito sends the browser back after login: your backend's <code>/callback</code>. It must exactly match a URL registered in Cognito, or Cognito refuses.`,
       COGNITO_REDIRECT_URI: `Env var for the callback URL.`,
       "`https://<backend-host>/callback`": `Fallback callback URL (host redacted).`,
       logoutUri: `Where Cognito sends the browser after logout.`,
       COGNITO_LOGOUT_URI: `Env var for the logout destination.`,

       cognitoDomain: `Your Cognito "hosted UI" domain, the login pages Cognito serves. It's needed to build the logout URL.`,

       FRONTEND_URL: `Env var: the production frontend address.`,
       "'http://localhost:4174'": `The Vite preview server address.`,

       FRONTEND_ORIGINS: `Env var: comma-separated allowed origins.`,
       FRONTEND_ORIGIN: `Older singular spelling, kept as a fallback.`,
       "'http://localhost:4173,http://localhost:4174'": `Default origins for local work.`,
       "','": `Split at commas.`,
       origin: `Each origin string.`,
       sessionSecret: `The key used to sign session cookies <i>and</i> your homemade tokens. Whoever knows it can forge a login as anyone. This line gives a weak default only outside production.`,

       "'COGNITO_CLIENT_SECRET is not set. The server will start, but login will not work.'": `A warning rather than a crash: the demo still works without Cognito.`,
       Error: `Creates an error object.`,
       "'SESSION_SECRET must be set in production.'": `Throwing at startup makes the container crash immediately, which Azure shows clearly, instead of running with a forgeable secret. This is the "fail fast" pattern, and it's a good one.` } }) },
   { t: "mcq", q: `The container starts in production without <code>SESSION_SECRET</code> set. What happens?`, opts: [
     [`The server starts with the development secret and logs a warning, so logins work but could be forged`, false, `That's what would happen <i>without</i> line 30's production check. In production, the fallback is null.`],
     [`The server throws at line 37 and the container crashes on startup, so the problem shows up immediately`, true, `Right. With NODE_ENV=production and no local demo, sessionSecret is null, and line 36 throws. Crashing loudly beats running insecurely. It's the "fail fast" pattern.`],
     [`Express picks a random secret automatically, so every restart quietly logs everyone out of the app`, false, `Express doesn't invent secrets; express-session requires you to pass one. Your code decides, and it decides to crash.`]] },
   { t: "sort", q: `Secret or just configuration? (Would it matter if a stranger saw it?)`, buckets: ["Secret: never public", "Config: fine to be public"], items: [
     [`COGNITO_CLIENT_SECRET`, 0, `Lets whoever holds it act as your backend towards Cognito.`],
     [`SESSION_SECRET`, 0, `Lets whoever holds it forge any user's login.`],
     [`COGNITO_CLIENT_ID`, 1, `It appears in the login redirect URL that every user's browser sees.`],
     [`FRONTEND_URL`, 1, `It's your public website's address.`],
     [`COGNITO_ISSUER`, 1, `A public discovery URL. Knowing it doesn't grant anything.`],
     [`The Firebase service-account JSON`, 0, `Full admin access to the whole database, bypassing every rule.`]] },
   { t: "read", html: FLAG("warn", "hard-coded fallbacks", `Lines 14–18 fall back to real production values (redacted here) when variables are missing. That's convenient, but it means a misconfigured environment silently talks to production Cognito, and the values are visible to anyone who can read the code. A stricter pattern is to require every production setting at startup, like SESSION_SECRET already is.`) }
 ]},

 { id: "m-pipeline", title: "Middleware: the request pipeline",
   intro: `Every request flows through a line of functions before reaching your route handler: body parsing, then working out who the user is, then CORS headers, then the route's own guards. Express calls these <i>middleware</i>. Their order matters a great deal.`,
   steps: [
   { t: "read", html: ARCH({ w: 720, h: 150, title: "Request pipeline", nodes: [
       { id: "in", x: 6, y: 50, w: 90, h: 50, label: "Request", sub: "from browser", color: "browser", tip: `A request from the LeanLog page, e.g. <code>POST /api/workouts</code> with a JSON body and maybe an Authorization header.` },
       { id: "json", x: 120, y: 50, w: 100, h: 50, label: "Body parser", sub: "express.json", color: "you", tip: `Line 136: turns a JSON body into <code>req.body</code>. Bodies over 32 KB are rejected with 413 before your code ever sees them.` },
       { id: "who", x: 244, y: 50, w: 110, h: 50, label: "Who is it?", sub: "token or cookie", color: "aws", tip: `Lines 150–160: a valid bearer token builds <code>req.session</code> from the token; otherwise express-session looks up the cookie. Either way, <code>req.session.userInfo</code> now says who's calling, or nobody.` },
       { id: "cors", x: 378, y: 50, w: 100, h: 50, label: "CORS", sub: "/api only", color: "azure", tip: `Lines 162–174: adds headers telling the browser which websites may read API responses, and answers preflight OPTIONS requests straight away.` },
       { id: "guard", x: 502, y: 50, w: 96, h: 50, label: "Guard", sub: "requireAuth…", color: "danger", tip: `Per-route middleware like requireAuth and requireWriteAuth: 401 or 403 here stops the request before the handler runs.` },
       { id: "h", x: 622, y: 50, w: 92, h: 50, label: "Handler", sub: "your route", color: "google", tip: `Your async function: reads or writes Firebase, then sends the response.` }],
     edges: [{ from: "in", to: "json" }, { from: "json", to: "who" }, { from: "who", to: "cors" }, { from: "cors", to: "guard" }, { from: "guard", to: "h" }] }) },
   { t: "read", html: AC({ src: "backend/app.js", from: 132, to: 174, hide: [135], bands: [[132, 134, "config"], [136, 147, "auth"], [149, 160, "auth"], [162, 174, "valid"]], notes: {
       "'view engine'": `Tells Express which template language renders pages: here EJS, used only by the small backend home page.`,
       "'ejs'": `EJS: HTML with <code>&lt;%= %&gt;</code> slots for values. It escapes them, which prevents HTML injection.`,
       "'views'": `Where the templates live.`,
       URL: `Builds a URL object. <code>new URL('./views', import.meta.url)</code> means "the views folder next to this file".`,
       "'./views'": `Relative path to the templates folder.`,
       "import": `<code>import.meta.url</code> is this file's own location, the ES-module replacement for __dirname.`,
       meta: `<code>import.meta</code> holds information about the current module.`,
       url: `This module file's URL.`,
       use: `<b>app.use(fn)</b> adds middleware that runs for every request (or every request under a path, like <code>app.use('/api', fn)</code>), in the order the calls appear in the file.`,
       "'trust proxy'": `Azure's ingress terminates HTTPS and forwards plain HTTP to your container, adding <code>X-Forwarded-Proto: https</code>. "Trust proxy 1" tells Express to believe one proxy hop, so <code>req.secure</code> is true and secure cookies can actually be set. Without it, logins quietly fail behind Azure.`,
       "1": `Trust exactly one proxy in front of the app (Azure's ingress), not arbitrary forwarded headers.`,
       limit: `The largest body accepted. It caps memory use and abuse.`,
       "'32kb'": `32 kilobytes, generous for a workout and tiny for an attack payload.`,
       sessionMiddleware: `The configured express-session middleware, saved in a constant so the bearer-token middleware below can choose whether to call it.`,
       secret: `The key used to sign the session-id cookie so it can't be forged.`,
       sessionSecret: `Your startup-checked secret.`,
       resave: `Don't re-save sessions that didn't change: fewer writes.`,
       saveUninitialized: `Don't create a session, or set a cookie, for visitors who haven't logged in yet. That's better for privacy and storage.`,
       cookie: `Settings for the session cookie itself.`,
       httpOnly: `JavaScript on the page can't read this cookie, so an injected script can't steal it.`,
       sameSite: `Controls whether the browser sends the cookie on requests from <i>other</i> sites. Your frontend (GitHub Pages) and backend (Azure) are different sites, so production needs 'none'.`,
       NODE_ENV: `The environment name.`,
       "'production'": `Production mode.`,
       "'none'": `Send the cookie on cross-site requests too. Required here, because the frontend lives on a different domain. Browsers only allow it together with secure: true. It also makes cross-site request forgery a live concern.`,
       "'lax'": `In development, the safer default: the cookie is only sent cross-site on top-level navigation.`,
       secure: `Only send the cookie over HTTPS.`,
       maxAge: `How long the cookie lives.`,
       SESSION_TTL_MS: `8 hours in milliseconds (defined in the tokens lesson).`,
       "// Mobile browsers block cross-site cookies, so API calls may carry a signed bearer token instead.": `Your own comment explaining the workaround.`,
       header: `The raw Authorization header, or '' if absent.`,
       "'Authorization'": `The standard HTTP header for credentials.`,
       "''": `Empty-string default.`,
       startsWith: `True if the string begins with the given text.`,
       "'Bearer '": `The conventional prefix: "Bearer &lt;token&gt;" means "whoever bears this token is authorised".`,
       payload: `The token's contents if its signature checks out, or null.`,
       verifyToken: `Your function (tokens lesson) that checks the HMAC signature and the expiry.`,
       slice: `<code>header.slice(7)</code> drops the first 7 characters, "Bearer ", leaving the token itself.`,
       "7": `The length of "Bearer ".`,
       demo: `Whether this is the read-only demo account.`,
       localDemo: `Whether this is the offline local demo.`,
       requestOrigin: `The <code>Origin</code> header: which website's JavaScript sent this request. Browsers set it, and page scripts can't fake it.`,
       "'Origin'": `The request header naming the calling site.`,
       "'/api'": `This middleware only runs for paths under /api.`,
       header: `<code>res.header(name, value)</code> sets a response header (on <code>req</code>, it's the request's Authorization header, line 151).`,
       "'Access-Control-Allow-Origin'": `Tells the browser: "JavaScript from this origin may read my response". It's only set when the caller is on the allow-list.`,
       "'Access-Control-Allow-Credentials'": `Allows cookies and credentials on cross-origin requests.`,
       "'true'": `Header values are text.`,
       "'Access-Control-Allow-Methods'": `Which HTTP methods cross-origin callers may use.`,
       "'GET, POST, PUT, PATCH, DELETE, OPTIONS'": `All the methods your API uses.`,
       "'Access-Control-Allow-Headers'": `Which request headers cross-origin callers may send. Authorization must be listed for the bearer token to work.`,
       "'Content-Type, Authorization'": `JSON content type and the bearer token.`,
       method: `The HTTP method of the request.`,
       "'OPTIONS'": `A "preflight": before a cross-origin request with custom headers, the browser asks "am I allowed?" with OPTIONS. You answer 204 straight away with the headers above.`,
       "204": `No Content: "allowed, nothing else to say".`,
       sendStatus: `Sends just a status code.`,
       set: `<code>app.set(name, value)</code> changes an Express setting.` } }) },
   { t: "order", q: `A phone sends <code>POST /api/workouts</code> with a bearer token. Put what your server does in order.`, items: [
     `express.json() parses the body into req.body (413 if over 32 KB)`,
     `The bearer middleware verifies the token's signature and expiry, then builds req.session from it`,
     `The /api CORS middleware adds the Access-Control headers`,
     `requireWriteAuth checks for a demo session (403), then requireAuth checks for a user (401)`,
     `The handler saves the workout to Firebase and responds 201`] },
   { t: "mcq", q: `Line 134, <code>app.set('trust proxy', 1)</code>, is deleted. What breaks in production?`, opts: [
     [`Express thinks every request arrived over plain HTTP, so it refuses to set the secure session cookie and cookie-based logins quietly stop working`, true, `Yes. Azure's ingress talks to your container over HTTP. Without trusting its X-Forwarded-Proto header, req.secure is false, and express-session won't send a cookie marked secure.`],
     [`Azure starts rejecting all incoming requests, because the container is no longer declaring which proxy it trusts`, false, `Azure doesn't check your Express settings at all. Traffic still arrives; it's the cookie that silently stops being set.`],
     [`Nothing noticeable changes, because the bearer tokens used by mobile browsers make cookie settings completely irrelevant`, false, `Desktop browsers still rely on the session cookie for the login redirect flow itself, so that would break.`]] },
   { t: "mcq", q: `Why is the bearer-token check placed <i>before</i> the session middleware, rather than after it?`, opts: [
     [`So that a request carrying a valid token skips the cookie lookup entirely and is identified by its token alone`, true, `Right. If the token verifies, it builds req.session from the token and calls next() without ever running express-session. Only token-less requests fall through to the cookie.`],
     [`Because Express requires all authentication-related middleware to run before any session middleware is registered`, false, `Express has no such rule. Middleware runs in whatever order you register it, and you choose that order.`],
     [`So that the session cookie can overwrite and replace the token's user, which keeps cookies as the main source of truth`, false, `It's the other way round: a valid token wins, and the cookie is never consulted for that request.`]] }
 ]},

 { sec: "Logging in" },
 { id: "m-login", title: "Your login code (OpenID Connect)",
   intro: `Logging in is a conversation between three parties: the browser, your backend and Cognito. Your code uses <b>openid-client</b> to speak the OpenID Connect protocol correctly. Here are the three pieces: building the client, starting the login, and handling the callback. (The My system course animates the whole flow step by step.)`,
   steps: [
   { t: "read", html: AC({ src: "backend/app.js", from: 40, to: 53, bands: [[42, 53, "auth"]], notes: {
       clientPromise: `Holds the Promise of a ready-to-use OpenID client. It starts undefined and is created on first use, then reused for every later login. This is called <i>lazy initialisation</i>, and caching the Promise (not the result) means two simultaneous first logins don't both run discovery.`,
       getClient: `Returns the cached client Promise, creating it the first time.`,
       discover: `<b>Issuer.discover(url)</b> fetches Cognito's <code>/.well-known/openid-configuration</code> document, which lists the login, token, userinfo and key URLs. Your code never hard-codes those endpoints; it learns them.`,
       issuerUrl: `Your Cognito pool's address (from config).`,
       issuer: `The discovered Cognito description.`,
       Client: `<code>new issuer.Client({...})</code> creates a client: your app as Cognito knows it.`,
       client_id: `Your app's id in the pool.`,
       clientId: `From config.`,
       client_secret: `Your app's secret, used when your backend swaps the login code for tokens. Never sent to the browser.`,
       clientSecret: `From config (an Azure secret).`,
       redirect_uris: `The callback URLs this client may use. They must match Cognito's settings exactly.`,
       redirectUri: `Your backend's /callback URL.`,
       response_types: `Which OAuth flow to use.`,
       "'code'": `The <b>authorization code flow</b>: Cognito sends back a short-lived code, and your server exchanges it (with the secret) for tokens. Tokens never pass through the browser's address bar. This is the recommended flow for apps with a backend.` } }) },
   { t: "read", html: AC({ src: "backend/app.js", from: 529, to: 554, bands: [[530, 532, "auth"], [534, 548, "auth"], [549, 553, "err"]], notes: {
       "'/login'": `The URL the "Log in" link points at.`,
       redirectToFrontend: `Your helper that sends an already-logged-in user straight back to the app with a one-time code (tokens lesson).`,
       client: `The OpenID client from getClient().`,
       nonce: `A random value stored in the session and sent to Cognito. Cognito puts it inside the ID token, and on return the library checks it matches. That proves the token was issued for <i>this</i> login attempt and isn't being replayed.`,
       state: `A random value stored in the session and sent to Cognito, which sends it back unchanged. The callback checks it matches, so a login response can only complete the login that this browser started. It's protection against login CSRF.`,
       generators: `openid-client's secure random value helpers.`,
       authUrl: `The full Cognito login-page URL, including your client id, redirect URI, scope, state and nonce.`,
       authorizationUrl: `Builds that URL for you, correctly encoded.`,
       scope: `What you're asking Cognito for.`,
       "'openid email'": `"openid" makes it OpenID Connect (an ID token about who the user is); "email" includes their email address.`,
       "'Could not initialize Cognito login:'": `Log prefix.`,
       authError: `A message stored on the session to show the user after the redirect.`,
       "'Cognito login is unavailable. Check the server configuration.'": `Shown if discovery failed: Cognito unreachable or misconfigured.`,
       frontendUrl: `Back to the app.` } }) },
   { t: "read", html: AC({ src: "backend/app.js", from: 556, to: 577, bands: [[558, 569, "auth"], [570, 576, "err"]], notes: {
       "'/callback'": `Where Cognito redirects back to, with <code>?code=...&amp;state=...</code> in the URL.`,
       callbackParams: `Pulls the code and state out of the incoming request.`,
       params: `The parsed callback parameters.`,
       tokenSet: `The tokens Cognito returned: an ID token (who the user is), an access token (to call Cognito APIs) and maybe a refresh token.`,
       callback: `<b>client.callback(...)</b> does the important work. It checks state matches, sends the code plus your client secret to Cognito's token endpoint, verifies the ID token's signature and claims, and checks the nonce. If anything is off, it throws.`,
       nonce: `The value saved when login started, to compare against.`,
       state: `The value saved when login started, to compare against.`,
       userinfo: `<b>client.userinfo(accessToken)</b> asks Cognito's userinfo endpoint for the user's profile (sub, email…).`,
       access_token: `The access token from the token set, presented to Cognito as proof.`,
       "'Cognito callback error:'": `Log prefix.`,
       "'Sign-in could not be completed.'": `A deliberately general user message.` } }) },
   { t: "mcq", q: `What is the <code>state</code> value for?`, opts: [
     [`It makes sure the callback is completing a login that this same browser started, so an attacker can't push their own login response into your session`, true, `Yes. Your server saves state in the session before redirecting, Cognito echoes it back, and openid-client rejects a mismatch. Without it, an attacker could log you into <i>their</i> account (login CSRF).`],
     [`It stores which page the user was on before logging in, so the app can return them to exactly the same screen afterwards`, false, `Some apps also encode a return path in state, but yours doesn't, and the security check is the essential job.`],
     [`It carries the user's password in an encrypted form from the browser to Cognito, so the password never travels in plain text`, false, `Passwords are only ever typed into Cognito's own hosted page. Your backend never sees them.`]] },
   { t: "mcq", q: `Why does the code→token exchange happen in your backend rather than in the browser?`, opts: [
     [`Because the exchange needs the client secret, and anything in browser code is readable by every visitor, so the secret has to stay on the server`, true, `Right. That's why your architecture has a backend for login at all: it's a confidential client holding a secret. Browser-only apps use a different variant (PKCE) without a secret.`],
     [`Because browsers are technically unable to send POST requests to a different domain such as Cognito's token endpoint`, false, `Browsers can (with CORS). The real issue is the secret.`],
     [`Because the token exchange is too slow and heavy for phones, so it's offloaded to a more powerful server to keep things fast`, false, `It's one small HTTPS request. Speed has nothing to do with it.`]] },
   { t: "order", q: `Put your login code's steps in order.`, items: [
     `/login creates random state and nonce values and saves them in the session`,
     `The browser is redirected to Cognito's hosted login page with those values`,
     `The user signs in at Cognito, which redirects to /callback with a code and the state`,
     `client.callback checks state, swaps code + client secret for tokens, and checks the nonce`,
     `client.userinfo fetches the profile, which is saved as req.session.userInfo`,
     `redirectToFrontend sends the browser back to LeanLog with a one-time code`] }
 ]},

 { id: "m-tokens", title: "Your homemade tokens",
   intro: `Logging in leaves the user's identity in a session cookie <i>on your backend's domain</i>. But the app runs on GitHub Pages, a different site, and mobile browsers often block cross-site cookies. So your code adds a second mechanism: a signed token the frontend sends in a header. It's clever, so let's understand every line.`,
   steps: [
   { t: "read", html: AC({ src: "backend/app.js", from: 55, to: 89, bands: [[58, 62, "auth"], [64, 76, "valid"], [78, 89, "auth"]], notes: {
       SESSION_TTL_MS: `How long a login lasts: 1000 ms × 60 × 60 × 8 = 8 hours. TTL means "time to live".`,
       "1000": `Milliseconds in a second.`, "60": `Seconds in a minute, or minutes in an hour.`, "8": `Hours.`,
       authCodes: `An in-memory Map of one-time codes → pending logins. It lives in the server process's RAM, so a restart empties it, and with two container replicas each has its own. That's a scaling trade-off (see My system).`,
       signToken: `Creates a token: the data, base64url-encoded, then a dot, then an HMAC signature of that data.`,
       payload: `The data to put in the token (or, in verifyToken, the decoded data).`,
       Buffer: `Node's type for raw bytes.`,
       from: `<code>Buffer.from(x)</code> turns text into bytes (or decodes base64url back into bytes).`,
       exp: `Expiry time: now + 8 hours. It's inside the signed data, so it can't be changed without breaking the signature.`,
       "'base64url'": `An encoding that turns bytes into URL-safe text (A–Z, a–z, 0–9, - and _). It's not encryption: anyone can decode the body and read it. The signature only stops <i>changes</i>.`,
       "toString": `Converts bytes to text in the given encoding.`,
       signature: `The HMAC: a fingerprint of the body made with sessionSecret. Change one character of the body and the correct signature is completely different.`,
       createHmac: `Starts an HMAC calculation with a hash algorithm and a secret key.`,
       "'sha256'": `The hash function inside the HMAC. It's standard and strong.`,
       sessionSecret: `The server-only key. Without it, nobody can produce valid signatures.`,
       digest: `Finishes the calculation and outputs the fingerprint.`,
       "`${body}.${signature}`": `The final token format: <code>body.signature</code>. It's the same idea as a JWT, minus the header part.`,
       verifyToken: `Checks a token and returns its payload, or null if anything at all is wrong.`,
       token: `The incoming token text.`,
       "'.'": `Split body from signature at the dot.`,
       expected: `The signature this body <i>should</i> have, recomputed with the secret.`,
       actual: `The signature the token claims, decoded to bytes.`,
       timingSafeEqual: `Constant-time comparison. A normal comparison stops at the first different byte, and attackers can measure that delay to guess signatures byte by byte.`,
       userInfo: `The Cognito profile inside the token.`,
       sub: `The user's id. A token without one is rejected.`,
       redirectToFrontend: `After login, sends the browser back to the app with a one-time code.`,
       code: `32 random characters: 24 random bytes in base64url. It's unguessable, and it's only usable once, for 60 seconds.`,
       randomBytes: `Secure randomness from the operating system.`,
       "24": `24 bytes = 192 bits of randomness.`,
       expires: `When this code stops working.`,
       "60_000": `60,000 ms = 60 seconds. (The underscore is just a digit separator for readability.)`,
       demo: `Copies the demo flag into the future token.`,
       localDemo: `Copies the local-demo flag.`,
       key: `Each code in the Map.`,
       entry: `Each pending login.`,
       "`${frontendUrl}#authCode=${code}`": `Back to the app, with the code after a <b>#</b>. The part after # is called the fragment, and browsers never send it to servers, so the code doesn't land in GitHub's server logs or Referer headers.` } }) },
   { t: "read", html: `<p>Then the frontend swaps the one-time code for a token, and from then on attaches the token to every backend request by quietly <b>replacing the browser's fetch function</b>:</p>` + AC({ src: "frontend/js/backend-config.js", from: 11, to: 45, bands: [[19, 31, "auth"], [35, 44, "ui"]], notes: {
       "(": `Opens an <b>IIFE</b> (immediately-invoked function expression): a function that runs once, straight away. Variables inside it stay private instead of leaking onto window.`,
       TOKEN_KEY: `The localStorage key under which the token is kept.`,
       "'workoutAuthToken'": `The storage key name.`,
       origin: `The backend's address. Only requests to it get the token.`,
       WORKOUT_BACKEND_ORIGIN: `Global set earlier in this file: localhost when developing, otherwise the Azure host.`,
       nativeFetch: `A saved copy of the browser's real fetch, so the wrapper can still call it.`,
       bind: `Keeps fetch attached to window when called later. Some browsers throw "Illegal invocation" otherwise.`,
       URLSearchParams: `Parses <code>a=1&amp;b=2</code>-style text into an object you can query.`,
       location: `The current page address.`,
       hash: `The fragment, the <code>#authCode=...</code> part.`,
       "/^#/": `A regex matching a leading #.`,
       "''": `Replace it with nothing.`,
       code: `The one-time code, if this page load is a return from login.`,
       "'authCode'": `The parameter name the backend used.`,
       ready: `A Promise that resolves once the code→token exchange finishes. Every wrapped fetch waits on it, so no API call goes out before the token exists.`,
       Promise: `JavaScript's "value that arrives later" type.`,
       resolve: `<code>Promise.resolve()</code> is an already-finished Promise, the default when there's no code to exchange.`,
       rest: `Any other fragment parameters, kept.`,
       history: `The browser's history API.`,
       replaceState: `Rewrites the address bar <i>without</i> reloading or adding a history entry. Here it wipes the code from the URL, so it isn't bookmarked, shared or left in history.`,
       pathname: `The URL path.`,
       search: `The <code>?query</code> part.`,
       "`#${rest}`": `Keeps the other fragment parameters.`,
       "`${origin}/api/token`": `The exchange endpoint.`,
       "'POST'": `A POST, so the code travels in the body, not the URL.`,
       headers: `Request headers.`,
       "'Content-Type'": `Header naming the body format.`,
       "'application/json'": `JSON.`,
       response: `The HTTP response.`,
       ok: `True for 2xx statuses.`,
       result: `The parsed JSON reply.`,
       token: `The signed token from the backend.`,
       localStorage: `The browser's per-site storage. It survives reloads and restarts, and <b>any script running on the page can read it</b>. That's the trade-off of storing a token here (see My system → security).`,
       setItem: `Saves a value.`,
       "'Could not complete sign-in:'": `Log prefix in the browser console.`,
       clearAuthToken: `A global function the logout link calls to forget the token.`,
       removeItem: `Deletes a stored value.`,
       input: `The first fetch argument: a URL string or a Request object.`,
       init: `The second fetch argument: options like method, headers and body.`,
       "'string'": `Checks whether input is plain text.`,
       Headers: `The browser's header-collection type.`,
       Request: `A full request object.`,
       "Authorization": `Header name.`,
       "'Authorization'": `The header the backend's bearer middleware reads.`,
       "`Bearer ${token}`": `The standard bearer format.` } }) },
   { t: "mcq", q: `Someone copies a token and edits its body so that <code>sub</code> becomes another user's id. What does <code>verifyToken</code> do?`, opts: [
     [`It returns null, because the HMAC of the edited body no longer matches the signature, and forging a new signature needs the server's secret`, true, `Exactly. The body is readable (base64url isn't encryption) but not changeable. Any edit breaks the signature, and only someone with sessionSecret could make a new one.`],
     [`It accepts the token, because base64url is a form of encryption and the edited body is simply decrypted and trusted`, false, `base64url is an encoding, readable by anyone, and the signature check catches the edit.`],
     [`It accepts the token, but only until it expires, because the expiry time is the only field the signature actually protects`, false, `The signature covers the entire body, sub and exp included.`]] },
   { t: "mcq", q: `Why does the backend send a short-lived <i>one-time code</i> in the redirect, instead of putting the token straight into the URL?`, opts: [
     [`A one-time, 60-second code is nearly worthless if it leaks, and the real token never appears in the address bar`, true, `Right. The token travels in a POST body to /api/token, and the code dies the moment it's used (line 178 deletes it) or after a minute.`],
     [`URLs have a strict length limit of 64 characters, so a full token simply wouldn't fit inside a redirect address at all`, false, `URLs can be thousands of characters long. Length isn't the reason.`],
     [`The token has to be created by the frontend rather than the backend, so the backend can only hand over a code to start it`, false, `The backend creates and signs the token; the frontend can't, because it doesn't have the secret.`]] },
   { t: "read", html: FLAG("warn", "what logging out doesn't do", `Logging out clears the token from localStorage and destroys the session, but a copy of a token taken earlier would stay valid until its 8-hour expiry, because the server keeps no list of revoked tokens. That's the classic trade-off of stateless tokens. Common fixes are shorter lifetimes with refresh, or a server-side "token version" per user.`) }
 ]},

 { id: "m-guards", title: "Guards: who may do what",
   intro: `Once the pipeline has worked out who's calling, each route decides whether to let them in. Your guards are tiny functions, but every piece of user data depends on them.`,
   steps: [
   { t: "read", html: AC({ src: "backend/app.js", from: 91, to: 121, bands: [[91, 111, "auth"], [113, 121, "data"]], notes: {
       checkAuth: `A soft check used only by the backend home page: it records whether the visitor is logged in, but never blocks.`,
       isAuthenticated: `A flag added to req for the template to read.`,
       requireAuth: `The hard check: no <code>sub</code> means 401 and the handler never runs. Otherwise it copies the user's id to <code>req.cognitoUserId</code> and calls next().`,
       "401": `Unauthorized: "I don't know who you are".`,
       "'Authentication required.'": `Message for the frontend to show.`,
       cognitoUserId: `The user's Cognito sub, the single value that picks whose data the rest of the request touches.`,
       requireWriteAuth: `The write guard: demo visitors are refused, and everyone else goes through requireAuth.`,
       demo: `True for the shared demo account.`,
       localDemo: `True for the offline local demo, which <i>is</i> allowed to write (it only touches a file on your laptop).`,
       "403": `Forbidden: "I know who you are, and the answer is no".`,
       "'Demo mode is read-only.'": `Why the demo can't save.`,
       ensureRequestTemplate: `Seeds starter data for real users on first contact, and skips the demos.`,
       getRequestUserRootRef: `Picks this user's data location. Note that it takes the id only from the session or token, <b>never from the URL or body</b>. That's the line that keeps users out of each other's data.`,
       createLocalDemoRef: `The offline store.`,
       getUserRootRef: `Firebase location <code>workoutApp/users/&lt;sub&gt;</code>.` } }) },
   { t: "mcq", q: `What stops a logged-in user reading <i>another</i> user's workouts?`, opts: [
     [`Every data route builds its database path from the sub in the verified session or token, and the request can't supply a user id anywhere else`, true, `Yes. There's no <code>?user=</code> parameter to tamper with, so the server decides whose data it is. This is the structural fix for the "broken access control" bug from the Build course.`],
     [`The Firebase security rules check each read, and they block the backend whenever it asks for a user other than the logged-in one`, false, `The backend uses the Admin SDK, which bypasses security rules entirely. Your rules matter for direct client access, not for the backend.`],
     [`The frontend hides other users' workouts from view, so they never appear on screen even though the API would happily return them`, false, `Hiding things in the UI is never security, because anyone can call the API directly. Here the API itself only ever returns the caller's own data.`]] },
   { t: "sort", q: `Which status does each request get?`, buckets: ["401", "403", "Allowed"], items: [
     [`A demo visitor tries POST /api/workouts`, 1, `requireWriteAuth: a demo session gets 403.`],
     [`No token, no cookie, GET /api/workouts`, 0, `requireAuth: no sub gets 401.`],
     [`A logged-in user, GET /api/workouts`, 2],
     [`A demo visitor, GET /api/exercises`, 2, `Reads only need requireAuth, and the demo has a sub ("demo-readonly").`],
     [`An expired token, PUT /api/data`, 0, `verifyToken returns null, there's no cookie, so there's no user.`],
     [`A local demo (offline), POST /api/workouts`, 2, `localDemo is allowed to write, because it only edits a file on your laptop.`]] }
 ]},

 { sec: "Data in, data out" },
 { id: "m-save", title: "Saving a workout without duplicates",
   intro: `Phones on gym Wi-Fi are flaky. Taps get doubled, requests time out and get retried, and drafts get re-saved. Your app handles all of this with an <b>idempotency key</b>, the saveId. Here it is on both sides.`,
   steps: [
   { t: "read", html: `<p><b>Browser side:</b> one id per workout being built, created the first time it's needed and kept in the draft:</p>` + AC({ src: "frontend/js/app.js", from: 2796, to: 2803, bands: [[2797, 2803, "ui"]], notes: {
       "// One id per workout being built, kept in the draft, so saving it again can't create a copy": `Your comment, and an accurate one.`,
       getWorkoutSaveId: `Returns the current workout's saveId, creating it if needed.`,
       currentWorkout: `The global object holding the workout being built (it's also saved as the draft).`,
       crypto: `The browser's crypto API.`,
       randomUUID: `Generates a random 128-bit id like "3b241101-e2bb-4255-8caf-4136c566a962". The <code>?.</code> calls fall back if a very old browser lacks it.`,
       "`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`": `The fallback id: the current time plus a random number, written in base 36. It's less random but fine as a fallback.` } }) +
     `<p><b>Server side:</b> remember which saveId produced which workout, atomically:</p>` + AC({ src: "backend/app.js", from: 217, to: 247, bands: [[218, 222, "valid"], [228, 240, "data"], [241, 242, "resp"], [243, 246, "err"]], notes: {
       "'/api/workouts'": `The create-workout endpoint.`,
       "'object'": `typeof gives "object" for objects (and arrays, and null). It's a first shape check.`,
       "400": `Bad Request: the body is missing required parts.`,
       "'A workout date and exercises are required.'": `Error message.`,
       "// The client sends one saveId per workout it builds. Repeat saves with the same id": `Your comment.`,
       "// (double clicks, retries, a resaved draft) all land on the same workout.": `Your comment.`,
       "'workouts'": `The workouts folder.`,
       "_workoutSaves": `A bookkeeping folder mapping saveId → workoutId.`,
       transaction: `<b>Firebase transaction</b>: read-modify-write as one atomic step. If two saves with the same saveId race, Firebase retries one of them, so only one workoutId ever wins.`,
       "`_workoutSaves/${saveId}`": `The bookkeeping entry for this saveId.`,
       current: `What's stored there now: null the first time, or the earlier workoutId.`,
       savedId: `The workoutId this saveId maps to after the transaction, either the brand-new one or an earlier one.`,
       savedWorkout: `The previously saved workout, if this saveId was used before.`,
       "// A stale id reused on another day is a new workout, not a resave of the old one": `Your comment: an edge-case guard.`,
       "201": `Created.`,
       id: `The workout's key, returned so the browser knows it.`,
       "'Could not create workout:'": `Log prefix.`,
       "'Workout could not be saved.'": `User message.` } }) },
   { t: "branch", q: `Double tap at the gym`, start: "a", nodes: {
     a: { say: `<p>You finish a workout and tap Save. The gym Wi-Fi stalls. Nothing seems to happen, so you tap Save again. Which part of your code stops the second tap from even sending a request?</p>`, opts: [
       [`The isSavingWorkout flag and the disabled button: a second tap returns early while a save is in flight`, "b", `Right, in app.js the handler starts with <code>if (isSavingWorkout) return;</code> and disables the button.`],
       [`The server's 32 KB body limit rejects the second request as a duplicate`, "bad1", `The limit is about size, not duplicates.`]] },
     bad1: { end: "bad", say: `The body limit only rejects oversized bodies. Both requests would be small and accepted.` },
     b: { say: `<p>Now a harder case: the first request <i>did</i> reach the server and saved, but the response was lost on the way back. Your app shows an error, and you tap Save again later. What happens on the server?</p>`, opts: [
       [`The same saveId arrives again; _workoutSaves already maps it to the first workoutId, so the workout is overwritten in place rather than duplicated`, "c", `Yes. Same saveId, same date, same workoutId.`],
       [`A second copy is saved, because the server can't know the first request succeeded`, "bad2", `That's what would happen without an idempotency key.`]] },
     bad2: { end: "bad", say: `That's the classic bug the saveId exists to prevent. The bookkeeping entry is how the server "remembers" the first attempt.` },
     c: { say: `<p>Last case: a draft from last Tuesday, with its old saveId, gets restored and saved today as a new session. What should happen, and what does your code do?</p>`, opts: [
       [`It should become a new workout; line 238 sees the stored workout's date differs, so it keeps the fresh workoutId and remaps the saveId`, "win", ``],
       [`It overwrites Tuesday's workout, because the saveId always wins`, "bad3", `Tuesday's workout disappears.`]] },
     bad3: { end: "bad", say: `Your code specifically guards against this. Lines 236–239 treat a matching saveId with a <i>different date</i> as a new workout.` },
     win: { end: "good", say: `Three layers: the UI blocks double taps, the idempotency key makes retries safe, and a date check handles stale drafts. That's careful, production-grade thinking, and it's worth being able to explain in an interview.` } },
     why: `The UI flag stops double taps; the saveId with a transaction makes retries land on the same record; the date check stops stale drafts overwriting old workouts.` },
   { t: "mcq", q: `Why use a Firebase <i>transaction</i> for the saveId mapping, instead of "read it, and if it's empty, write it"?`, opts: [
     [`Two requests could both read "empty" before either writes, so both create a workout; a transaction makes it one atomic step`, true, `Exactly the "last copy" race from the Build course, in your own code. A transaction retries a loser with the fresh value.`],
     [`Transactions are cheaper than separate reads and writes, so they reduce the Firebase bill for every single workout that's saved`, false, `If anything, transactions can cost more round trips. They're about correctness.`],
     [`Firebase doesn't allow writing to a location that was read in the same request unless the code uses a transaction`, false, `There's no such restriction. You can read and then write freely; it just isn't safe under concurrency.`]] }
 ]},

 { id: "m-paths", title: "The generic data API and path safety",
   intro: `Alongside specific endpoints like /api/workouts, your backend has a <b>generic</b> one: /api/data takes a path and reads or writes whatever is there. That's flexible, and it's dangerous without strict checks. Here are the checks.`,
   steps: [
   { t: "read", html: AC({ src: "backend/app.js", from: 330, to: 388, bands: [[330, 361, "valid"], [363, 368, "data"], [370, 388, "data"]], notes: {
       allowedDataRoots: `An <b>allow-list</b>: the only top-level folders the generic API may touch. Anything else, like _meta or _workoutSaves, is refused. Allow-lists ("only these") are much safer than block-lists ("anything but these").`,
       "'settings'": `User settings.`, "'workouts'": `Workouts.`, "'workoutDraft'": `The in-progress workout.`, "'exercises'": `The exercise library.`, "'focusAreas'": `Focus areas.`,
       "'focusareas'": `An old lowercase spelling, accepted and then normalised to focusAreas on line 352.`,
       "'estimoneRepMax'": `Estimated one-rep-max data (the name has a typo, kept for compatibility with existing data).`,
       "'volumeTargets'": `Volume targets.`, "'muscleMatrix'": `Muscle-group mapping.`, "'analyticsdb'": `Analytics data.`, "'calendarNotes'": `Calendar notes.`, "'bio'": `Body-weight and bio data.`,
       normalizeDataPath: `Cleans and checks a path: trims slashes, splits it into segments, and requires the first segment to be allowed and every segment to be safe. It throws otherwise.`,
       value: `The raw path from the request.`,
       normalized: `The path without leading or trailing slashes.`,
       "/^\\/+|\\/+$/g": `A regex matching slashes at the start (^\\/+) or end (\\/+$). The g flag replaces both ends.`,
       "''": `Replace with nothing.`,
       segments: `The path's parts: "workouts/abc" gives ["workouts", "abc"].`,
       "'/'": `Split or join at slashes.`,
       segment: `One part of the path.`,
       "'That data path is not available through the API.'": `Thrown for disallowed paths, and turned into a 400 by the route's catch.`,
       "/^focusareas(?=\\/|$)/": `Matches "focusareas" at the start, followed by a slash or the end.`,
       "'focusAreas'": `The canonical spelling.`,
       normalizeWritableDataPath: `The same check, plus refusing the empty path, so nobody can overwrite the user's entire root in one call.`,
       dataPath: `The cleaned path.`,
       "'The user root cannot be overwritten through the API.'": `Error for an empty write path.`,
       getDataRef: `Builds the database reference for a GET.`,
       path: `The <code>path</code> parameter: in the query string for GET and DELETE, in the body for PUT, PATCH and POST.`,
       rootRef: `This user's root.`,
       "'/api/data'": `The generic endpoint.`,
       put: `<b>app.put</b> registers a handler for PUT, meaning "replace what's at this path".`,
       "204": `No Content: done, nothing to return.`,
       "400": `Bad Request: the path was refused.`,
       updates: `For PATCH: the keys to merge.` } }) +
     AC({ src: "backend/app.js", from: 424, to: 426, bands: [[424, 426, "valid"]], notes: {
       "'string'": `It must be text at all.`,
       "/[.#$[\\]/]/": `A regex matching any one of . # $ [ ] /, the characters Firebase forbids in keys. A slash would let one "segment" secretly add more path levels.` } }) },
   { t: "sort", q: `Does <code>normalizeWritableDataPath</code> accept each path?`, buckets: ["Accepted", "Throws (400)"], items: [
     [`<code>settings/workoutBuilder</code>`, 0, `The first segment is allowed, and both segments are safe.`],
     [`<code>/workouts/abc123/</code>`, 0, `The outer slashes are trimmed, then it's fine.`],
     [`<code>_meta/templateVersion</code>`, 1, `_meta isn't on the allow-list.`],
     [`<code>(empty)</code>`, 1, `Writable paths can't be empty, so the root is protected.`],
     [`<code>focusareas/Core</code>`, 0, `Accepted, then rewritten to focusAreas/Core.`],
     [`<code>bio/weights.latest</code>`, 1, `The dot in "weights.latest" fails isValidPathSegment.`]] },
   { t: "mcq", q: `The generic <code>PUT /api/data</code> stores whatever <code>value</code> it's given at an allowed path. What's the main trade-off of this design?`, opts: [
     [`It's flexible, with no backend changes for new data, but the backend can't check the data's shape, so buggy writes are saved as-is`, true, `Right. Users can still only touch their own allowed folders (that part is safe), but there's no schema check on the contents. Specific endpoints like POST /api/workouts validate the shape; the generic one can't.`],
     [`It lets any user read and overwrite other users' folders, as long as they guess one of the allowed root names correctly`, false, `No: the path is always inside the caller's own root, set from their session. The allow-list limits <i>which</i> of their own folders they can touch.`],
     [`It makes each request slower, because Firebase has to search the whole database to find the path that was asked for`, false, `Firebase goes straight to a path. Lookups by path are fast whatever the database size.`]] }

 { id: "m-adapter", title: "The fake Firebase in the browser",
   intro: `Your frontend was first written to talk to Firebase directly. When you moved to a backend, instead of rewriting thousands of <code>database.ref(...)</code> calls, <code>api-database.js</code> provides an object that <i>looks</i> like Firebase but calls your API. This is the <b>adapter pattern</b>, and it includes a class: your clearest example of why classes exist.`,
   steps: [
   { t: "read", html: AC({ src: "frontend/js/api-database.js", from: 1, to: 21, bands: [[3, 21, "data"]], notes: {
       apiBackendOrigin: `The backend's address (redacted host).`,
       WORKOUT_BACKEND_ORIGIN: `Set by backend-config.js.`,
       "'https://<backend-host>'": `Fallback backend address (redacted).`,
       ApiSnapshot: `<b>Why a class here?</b> The old app code was written against Firebase <i>snapshot</i> objects: it calls <code>snapshot.val()</code>, <code>snapshot.exists()</code>, <code>snapshot.forEach(child =&gt; ...)</code> and <code>child.key</code>. To keep all that code working unchanged, the adapter must hand back objects with <i>exactly those methods</i>. A class is a blueprint for such objects: every <code>new ApiSnapshot(value, key)</code> produces one that holds its data and answers those calls.`,
       constructor: `Runs on <code>new ApiSnapshot(value, key)</code> and stores both on the new object.`,
       value: `The plain data that came back from your API.`,
       "key@4": `The child's name, if this snapshot is a child (set by forEach); null for the top level.`,
       "null": `Default: no key.`,
       _value: `The underscore says "internal, please use .val() instead". It's a convention, not enforced.`,
       val: `Mimics Firebase's <code>snapshot.val()</code>: returns the data.`,
       exists: `Mimics Firebase: true if anything is stored.`,
       callback: `The function the caller passed in, called once per child.`,
       "'object'": `Only objects have children to loop over.`,
       "key": `The child's name.` } }) },
   { t: "read", html: `<p>And the reference object that ties it together. Watch the last two methods closely:</p>` + AC({ src: "frontend/js/api-database.js", from: 70, to: 85, bands: [[70, 85, "data"]], notes: {
       createApiRef: `Builds a fake Firebase reference for a path. Its methods turn Firebase-style calls into HTTP requests to your API.`,
       path: `The database path this reference points at.`,
       normalizedPath: `The path without outer slashes.`,
       pathSegments: `The path's parts.`,
       "/^\\/+|\\/+$/g": `Leading or trailing slashes.`,
       "''": `Empty default or replacement.`,
       "'/'": `Separator.`,
       "key": `The last segment, like Firebase's ref.key.`,
       childPath: `The deeper path to append.`,
       "`${normalizedPath}/${childPath}`": `Joins the two paths.`,
       eventName: `Firebase's event type (like 'value'). It's accepted for compatibility, then ignored.`,
       promise: `The pending API request.`,
       apiRequest: `Your helper that calls the backend with credentials and turns errors into exceptions.`,

       result: `The JSON from the API.` } }) +
     AC({ src: "frontend/js/api-database.js", from: 137, to: 144, bands: [[137, 144, "err"]], notes: {
       orderByChild: `In real Firebase, this sorts results by a child field on the server. <b>Here it does nothing</b> and returns the same reference.`,
