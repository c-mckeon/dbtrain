 { sec: "Identity" },
 { id: "s-login", title: "Login, step by step",
   intro: `Here's the complete login flow across browser, backend and Cognito, including your one-time-code and token exchange. Press <b>Step through</b> and read each step. This one diagram covers OAuth 2.0, OpenID Connect and your mobile workaround.`,
   steps: [
   { t: "read", html: SEQ({ title: "Login flow", colW: 220, actors: [
       { id: "b", label: "Browser", color: "browser", tip: `The user's browser, at first on the LeanLog page (github.io), then visiting your backend and Cognito domains during the redirects.` },
       { id: "s", label: "Your backend", color: "azure", tip: `Express on Azure, holding the client secret and the session secret.` },
       { id: "c", label: "Cognito", color: "aws", tip: `The AWS user pool and its hosted login page.` }],
     msgs: [
       { from: "b", to: "s", label: "GET /login", note: `The user clicks "Log in". The link points at your backend's <code>/login</code>, so the browser navigates there.` },
       { from: "s", to: "s", label: "make state + nonce", note: `openid-client generates two random values and saves them in a new server session. The browser gets a session cookie for the backend's domain. That's a <i>first-party</i> cookie right now, because the browser is visiting that domain directly.` },
       { from: "s", to: "b", label: "302 → Cognito", dash: true, note: `A redirect to Cognito's authorize URL, carrying your client_id, redirect_uri, scope "openid email", state and nonce.` },
       { from: "b", to: "c", label: "hosted login page", note: `The browser shows Cognito's page. The user types their password <b>here</b>, on AWS, never on your site.` },
       { from: "c", to: "c", label: "check password", note: `Cognito verifies the password (and MFA, if enabled). Hashing, lockouts and password resets are all Cognito's job.` },
       { from: "c", to: "b", label: "302 → /callback?code&state", dash: true, note: `Cognito redirects back to your registered redirect URI with a short-lived <b>authorization code</b> and the same state value.` },
       { from: "b", to: "s", label: "GET /callback (+ cookie)", note: `The browser visits /callback, sending the session cookie (first-party again), so the backend can find the saved state and nonce.` },
       { from: "s", to: "c", label: "code + client secret", color: "aws", note: `Server to server: your backend POSTs the code <b>and the client secret</b> to Cognito's token endpoint. This is why the secret stays on the server: the browser never sees it.` },
       { from: "c", to: "s", label: "ID token + access token", dash: true, color: "aws", note: `Cognito returns tokens. openid-client verifies the ID token's signature, issuer, audience and nonce, and checks the state. Any mismatch throws.` },
       { from: "s", to: "c", label: "GET userinfo", color: "aws", note: `Using the access token, the backend asks Cognito for the user's profile.` },
       { from: "c", to: "s", label: "sub, email…", dash: true, color: "aws", note: `The profile arrives. <code>sub</code> is the permanent user id your database is keyed on.` },
       { from: "s", to: "s", label: "save user, make 1-time code", note: `userInfo goes into the session, and a random 60-second, single-use code is stored in the in-memory authCodes Map.` },
       { from: "s", to: "b", label: "302 → LeanLog #authCode", dash: true, note: `A redirect to the LeanLog page with <code>#authCode=...</code>. The fragment after # is never sent to GitHub's servers.` },
       { from: "b", to: "s", label: "POST /api/token {code}", color: "browser", note: `backend-config.js reads the code, wipes it from the address bar, and POSTs it to your backend.` },
       { from: "s", to: "b", label: "signed token (8 h)", dash: true, color: "browser", note: `The code is deleted (single use), and the backend returns an HMAC-signed token, which the page saves in localStorage.` },
       { from: "b", to: "s", label: "API calls: Bearer token", color: "browser", note: `From now on, the wrapped fetch adds <code>Authorization: Bearer &lt;token&gt;</code> to every backend call. This works even where cross-site cookies are blocked.` }] }) },
   { t: "order", q: `Without looking: put the key moments in order.`, items: [
     `The backend saves state and nonce, then redirects to Cognito`,
     `The user types their password on Cognito's page`,
     `Cognito redirects to /callback with a code`,
     `The backend swaps code + client secret for tokens and checks state and nonce`,
     `The backend redirects to LeanLog with a one-time code`,
     `The page swaps the code for a signed token and stores it`] },
   { t: "mcq", q: `At step 7, why is the session cookie sent when the browser comes back to <code>/callback</code>, even on phones that block cross-site cookies?`, opts: [
     [`Because the browser is visiting the backend's own domain directly in the address bar, so for that request the cookie is first-party and allowed`, true, `Right. Cookie blocking targets <i>third-party</i> cookies: ones attached to background requests from a different site. Full-page visits are first-party. The trouble only starts later, when the LeanLog page (github.io) makes background fetches to the backend.`],
     [`Because Cognito copies the session cookie into its redirect, which makes the phone treat it as coming from Amazon rather than your backend`, false, `Cognito can't set or forward cookies for your backend's domain.`],
     [`Because phones only block cookies on pages that use JavaScript, and the callback is a plain redirect without any scripts`, false, `Blocking depends on whether the cookie is cross-site in context, not on JavaScript.`]] },
   { t: "mcq", q: `Which of these values would be a disaster if it appeared in the browser at any point in this flow?`, opts: [
     [`The Cognito client secret, because with it anyone could exchange codes and impersonate your backend towards Cognito`, true, `Yes, and in your flow it only ever travels from backend to Cognito at step 8.`],
     [`The authorization code, because seeing it even once lets an attacker log in as that user for weeks afterwards`, false, `The code is designed to pass through the browser. It's short-lived and useless without the client secret.`],
     [`The client id, because it's the main credential Cognito uses to check whether a login attempt is real`, false, `The client id is public by design. It appears in the redirect URL at step 3.`]] }
 ]},

 { id: "s-cookies", title: "Cookies vs tokens (and why phones forced your hand)",
   intro: `Your app carries <i>two</i> ways of proving who you are: a session cookie and a bearer token. That's the result of a real-world constraint, cross-site cookie blocking, and the choice comes with trade-offs worth understanding precisely.`,
   steps: [
   { t: "read", html: ARCH({ w: 720, h: 230, title: "First-party vs third-party", nodes: [
       { id: "p", x: 20, y: 30, w: 200, h: 56, label: "LeanLog page", sub: "c-mckeon.github.io", color: "browser", tip: `The site in the address bar. To the browser, this is the "first party".` },
       { id: "b", x: 480, y: 30, w: 220, h: 56, label: "Your backend", sub: "<backend-host> (azurecontainerapps.io)", color: "azure", tip: `A different site. Cookies belonging to it are "third-party" when requested from the LeanLog page.` },
       { id: "t", x: 20, y: 150, w: 200, h: 56, label: "Same page, fetch()", sub: "background API call", color: "browser", tip: `A background request from github.io to the backend.` },
       { id: "b2", x: 480, y: 150, w: 220, h: 56, label: "Your backend", sub: "receives the call", color: "azure", tip: `Without a cookie, it doesn't know who's calling, unless a token is attached.` }],
     edges: [
       { from: "p", to: "b", label: "cookie: third-party, often blocked", color: "danger", dash: true, tip: `Safari (and so most iPhone browsers) blocks third-party cookies by default, and other browsers increasingly limit them. Your session cookie never arrives.` },
       { from: "t", to: "b2", label: "Authorization: Bearer token, always sent", color: "browser", tip: `A header your own JavaScript adds. Cookie rules don't apply, so it works everywhere.` }] }) },
   { t: "sort", q: `Session cookie or bearer token in localStorage? Which is it true of?`, buckets: ["Session cookie", "Bearer token"], items: [
     [`Page JavaScript can't read it (httpOnly)`, 0, `So an injected script can't steal it.`],
     [`It works even when cross-site cookies are blocked`, 1, `It's just a header.`],
     [`An injected script on the page could read and steal it`, 1, `localStorage is readable by any script on the page.`],
     [`The browser sends it automatically, which is why cross-site request forgery is a concern`, 0, `Automatic sending is the root of CSRF.`],
     [`Lost on every backend restart (stored in the server's memory)`, 0, `express-session's default store keeps sessions in RAM.`],
     [`Survives backend restarts and redeploys`, 1, `It's self-contained and checked with the secret, with nothing stored server-side.`]] },
   { t: "mcq", q: `express-session in your code uses its default store. What does that mean in production?`, opts: [
     [`Sessions live in container memory, so restarts log cookie users out and replicas can't share them`, true, `Right, and express-session's own docs warn against MemoryStore in production. Your tokens dodge this: they need no server memory. A shared store (Redis, a database) is the usual fix for sessions.`],
     [`Sessions are saved automatically into Firebase, alongside the user's workout data, so they survive restarts`, false, `Nothing in your code connects express-session to Firebase. You'd have to configure a store.`],
     [`Sessions are stored inside the cookie itself, fully encrypted, so the server never needs to keep anything`, false, `That's how cookie-session works, a different library. express-session stores only an id in the cookie.`]] },
   { t: "branch", q: `Choosing where the token lives`, start: "a", nodes: {
     a: { say: `<p>A colleague reviews your auth and says: "Tokens in localStorage are risky." What's the strongest response?</p>`, opts: [
       [`Agree on the risk, and explain it: any script injected into the page could read it. Then name the mitigations you'd add`, "b", `Owning the trade-off beats defending it.`],
       [`Say it's fine because the token is signed`, "bad1", `Signing stops edits, not theft.`]] },
     bad1: { end: "bad", say: `Signing prevents changing the token, but a stolen token is used as-is. The real risk is theft by injected script (XSS).` },
     b: { say: `<p>Which mitigations would actually help?</p>`, opts: [
       [`Cut XSS risk (avoid innerHTML with user data, pin third-party scripts, add a Content Security Policy) and shorten token lifetime`, "win", ``],
       [`Base64-encode the token before storing it`, "bad2", `Any script can decode it.`]] },
     bad2: { end: "bad", say: `Encoding isn't protection. Whatever your page's JavaScript can read, an injected script can read too.` },
     win: { end: "good", say: `You named the risk (XSS steals tokens), the root-cause fixes (fewer injection points, a CSP, pinned scripts) and damage limitation (shorter lifetimes). Moving the token into an httpOnly cookie on a <i>shared</i> domain would be the structural fix, for example by serving the frontend and API from subdomains of one domain you own.` } },
     why: `localStorage tokens trade cookie problems for XSS exposure. Reduce injection risk and token lifetime, or restructure to first-party cookies on a shared domain.` }
 ]},

 { id: "s-cors", title: "CORS: what the browser enforces",
   intro: `Your frontend and backend live on different <b>origins</b>, so every API call is a cross-origin request. CORS is the browser's rulebook for those. It's widely misunderstood, so let's pin down exactly what it does and doesn't protect.`,
   steps: [
   { t: "read", html: `<p>An <b>origin</b> is scheme + host + port: <code>https://c-mckeon.github.io</code> is one origin, and your Azure backend is another. By default, a page's JavaScript may <i>send</i> requests to another origin, but may not <i>read the response</i> unless that server says so with <code>Access-Control-Allow-Origin</code>. For non-simple requests (JSON bodies, an Authorization header), the browser first sends an <b>OPTIONS preflight</b> asking permission.</p>` + AC({ src: "backend/app.js", from: 162, to: 174, bands: [[163, 166, "valid"], [167, 169, "config"], [170, 172, "resp"]], notes: {
       "'/api'": `Only API routes get CORS headers.`,
       requestOrigin: `The calling page's origin, from the browser-controlled Origin header.`,
       "'Origin'": `Request header naming the calling origin.`,
       frontendOrigins: `The allow-list from config.`,
       header: `Sets a response header.`,
       "'Access-Control-Allow-Origin'": `Echoes back the caller's origin only if it's allowed. Echoing "*" isn't allowed together with credentials, which is why the code echoes the specific origin.`,
       "'Access-Control-Allow-Credentials'": `Lets the browser include cookies and expose the response to the page.`,
       "'true'": `Header value.`,
       "'Access-Control-Allow-Methods'": `Methods allowed cross-origin.`,
       "'GET, POST, PUT, PATCH, DELETE, OPTIONS'": `All of yours.`,
       "'Access-Control-Allow-Headers'": `Headers allowed cross-origin.`,
       "'Content-Type, Authorization'": `JSON and the bearer token.`,
       method: `HTTP method.`,
       "'OPTIONS'": `The preflight.`,
       "204": `"Allowed, nothing more to say".`,
       sendStatus: `Status-only response.` } }) },
   { t: "sort", q: `True or false about CORS?`, buckets: ["True", "False"], items: [
     [`CORS stops other websites' JavaScript from reading your API's responses`, 0, `That's exactly its job.`],
     [`CORS stops someone calling your API with curl or a script`, 1, `CORS is enforced by browsers only. Other tools ignore it completely. It's never authentication.`],
     [`A cross-origin request can still reach your server even when CORS would block the response`, 0, `Simple requests are sent, and only reading the reply is blocked. That's why CSRF is a separate concern.`],
     [`The preflight OPTIONS request carries the user's data`, 1, `It only asks permission: method and headers, no body.`],
     [`Adding a new frontend domain means updating FRONTEND_ORIGINS`, 0, `Otherwise the browser blocks its calls.`]] },
   { t: "mcq", q: `You move the frontend to a custom domain, <code>leanlog.app</code>, and suddenly every API call fails in the browser console with a CORS error, while curl works fine. Most likely fix?`, opts: [
     [`Add the new origin to FRONTEND_ORIGINS in the Container App settings (and update the redirect and logout URLs and Cognito's allowed URLs)`, true, `Yes. The allow-list still only has the github.io origin, so the browser refuses to expose responses to the new one. curl works because curl ignores CORS.`],
     [`Change every request in the frontend to use mode: 'no-cors', so the browser stops checking the backend's headers`, false, `no-cors makes responses unreadable ("opaque"), so the app would get nothing back. It hides the symptom and breaks the feature.`],
     [`Disable HTTPS on the backend, since the browser blocks requests between two different HTTPS domains by default`, false, `HTTPS has nothing to do with this. Removing it would also break secure cookies.`]] }
 ]},

 { sec: "Running it" },
 { id: "s-docker", title: "Your container image",
   intro: `A container image is a sealed box holding your backend plus everything it needs to run: an operating system layer, Node, your node_modules and your code. Wherever the box runs, it behaves the same. Your Dockerfile is the recipe, and it's 15 lines; let's read every word.`,
   steps: [
   { t: "read", html: AC({ src: "backend/Dockerfile", from: 1, to: 15, bands: [[1, 3, "build"], [5, 7, "build"], [9, 11, "build"], [13, 15, "config"]], notes: {
       FROM: `<b>FROM</b> picks the base image to start from. Everything else is layered on top of it.`,
       node: `The official Node.js image from Docker Hub.`,
       "22": `Node version 22, the same version the frontend workflow uses.`,
       alpine: `<b>Alpine Linux</b>: a tiny Linux distribution (about 5 MB), giving a much smaller image than the default Debian one. Smaller means faster pulls, quicker cold starts and less to patch. The trade-off: occasional compatibility quirks with native modules.`,
       WORKDIR: `<b>WORKDIR</b> creates and enters a folder inside the image. Later commands run there.`,
       app: `Your code will live in <code>/app</code> inside the container.`,
       COPY: `<b>COPY</b> copies files from the build context (the backend/ folder) into the image.`,
       package: `<code>package*.json</code> matches package.json and package-lock.json.`,
       json: `The file extension.`,
       RUN: `<b>RUN</b> executes a command while <i>building</i> the image. Its result is saved as a layer.`,
       npm: `Node's package manager.`,
       ci: `<b>npm ci</b> installs exactly the versions in package-lock.json and fails if the lockfile and package.json disagree. Builds are reproducible: the same code always gives the same dependencies.`,
       omit: `<code>--omit=dev</code> skips devDependencies, which aren't needed at runtime.`,
       dev: `Development-only dependencies.`,
       ENV: `<b>ENV</b> bakes an environment variable into the image.`,
       NODE_ENV: `Set to production here, so even if Azure's config forgets it, the server runs in production mode (secure cookies, required secret).`,
       production: `The value.`,
       EXPOSE: `<b>EXPOSE</b> documents the port the app listens on. It doesn't open anything by itself; Azure's ingress "target port" setting must match it.`,
       "3000": `Matches <code>PORT</code>'s default in app.js.`,
       CMD: `<b>CMD</b> is the command run when a container <i>starts</i> (not during the build).`,
       '"npm"': `Run npm…`,
       '"start"': `…with the "start" script, which is <code>node app.js</code> in backend/package.json.` } }) +
     `<p>And what's kept <b>out</b> of the box:</p>` + AC({ src: "backend/.dockerignore", from: 1, to: 5, bands: [[1, 5, "build"]], notes: {
       node_modules: `Your laptop's installed packages. The image installs its own with npm ci, so they match the image's OS (Alpine).`,
       git: `The .git folder (it shows as "git" after the dot): history isn't needed inside the image.`,
       env: `<b>.env: your local secrets.</b> Keeping it out means secrets never get baked into an image, where anyone who can pull the image could read them.`,
       "npm-debug.log": `npm's log file.`,
       "firebase-service-account.json": `<b>The Firebase admin key file</b>, deliberately excluded. In production the key comes from an environment variable instead.` } }) },
   { t: "mcq", q: `Why copy <code>package*.json</code> and run <code>npm ci</code> <i>before</i> copying the rest of the code?`, opts: [
     [`Docker caches each layer, so when only your code changes, the slow npm install layer is reused and builds are much faster`, true, `Exactly. Layers are rebuilt from the first changed one onwards. Dependencies change rarely and code changes constantly, so put the stable step first.`],
     [`npm ci refuses to run if any JavaScript files are already present in the folder, so the code has to be copied in afterwards`, false, `npm ci doesn't care about other files. The order is purely about the layer cache.`],
     [`The code has to be copied last so that it overwrites any outdated copies of your files that npm downloads from the registry`, false, `npm doesn't download your own code. It only installs dependencies.`]] },
   { t: "read", html: ARCH({ w: 720, h: 270, title: "Image layers", nodes: [
       { id: "l1", x: 160, y: 200, w: 400, h: 44, label: "node:22-alpine", sub: "Alpine Linux + Node 22: pulled from Docker Hub", color: "github", tip: `The base. It changes only when you bump the version or upstream ships patches.` },
       { id: "l2", x: 160, y: 148, w: 400, h: 44, label: "package*.json", sub: "tiny layer", color: "you", tip: `Changes only when dependencies change.` },
       { id: "l3", x: 160, y: 96, w: 400, h: 44, label: "node_modules (npm ci)", sub: "the big, slow layer: cached when unchanged", color: "google", tip: `Reused from cache on most builds, which saves minutes.` },
       { id: "l4", x: 160, y: 44, w: 400, h: 44, label: "your code (COPY . .)", sub: "changes every commit", color: "azure", tip: `Rebuilt every time, but it's small and fast.` }],
     edges: [] }) },
   { t: "read", html: FLAG("warn", "the container runs as root", `Your Dockerfile never switches user, so the server runs as root inside the container. If an attacker ever got code running inside it, root makes things worse. The official Node images include a <code>node</code> user: adding <code>USER node</code> before CMD is a one-line hardening step.`) },
   { t: "order", q: `Put the build in order, as Docker runs it.`, items: [
     `Start from the node:22-alpine base image`,
     `Create and enter /app`,
     `Copy package.json and package-lock.json`,
     `npm ci --omit=dev installs production dependencies`,
     `Copy the rest of backend/ (minus .dockerignore entries)`,
     `Record NODE_ENV=production and the start command`] }
 ]},

 { id: "s-azure", title: "Azure: registry, container app, scaling",
   intro: `Azure Container Apps runs your image without you managing servers. It gives you HTTPS, scaling and revisions. Knowing what it does for you, and what it doesn't, explains several lines in your code and a couple of hidden risks.`,
   steps: [
   { t: "read", html: ARCH({ w: 760, h: 300, title: "Azure Container Apps", nodes: [
       { id: "u", x: 10, y: 120, w: 120, h: 56, label: "Internet", sub: "HTTPS requests", color: "browser", tip: `Browsers calling <code>https://&lt;backend-host&gt;</code>.` },
       { id: "ing", x: 170, y: 120, w: 140, h: 56, label: "Ingress", sub: "HTTPS ends here", color: "azure", tip: `Azure's front door. It holds the TLS certificate and terminates HTTPS, then forwards plain HTTP to your container's port 3000, adding X-Forwarded-Proto. That's why your code sets <code>trust proxy</code>.` },
       { id: "r1", x: 380, y: 60, w: 160, h: 50, label: "Replica 1", sub: "your container", color: "azure", tip: `One running copy of your image. Its memory holds the express-session MemoryStore and the authCodes Map.` },
       { id: "r2", x: 380, y: 186, w: 160, h: 50, label: "Replica 2 (if scaled)", sub: "separate memory!", color: "danger", tip: `If Azure scales out under load, a second copy starts with <b>its own, empty memory</b>. A login code stored on replica 1 isn't known here.` },
       { id: "acr", x: 600, y: 20, w: 150, h: 56, label: "Registry (ACR)", sub: "images by commit SHA", color: "azure", tip: `Where images are pulled from. Each one is tagged with the commit SHA, so any revision can be traced to exact code, and rolled back.` },
       { id: "sec", x: 600, y: 220, w: 150, h: 56, label: "Secrets + env vars", sub: "Container App config", color: "aws", tip: `SESSION_SECRET, COGNITO_CLIENT_SECRET and FIREBASE_SERVICE_ACCOUNT_JSON are stored as secrets in the Container App and injected as environment variables at start.` }],
     edges: [{ from: "u", to: "ing", label: "HTTPS" }, { from: "ing", to: "r1", label: "HTTP :3000" }, { from: "ing", to: "r2", label: "HTTP :3000", dash: true }, { from: "acr", to: "r1", label: "image", dash: true }, { from: "sec", to: "r2", label: "env", dash: true }, { from: "sec", to: "r1", label: "env", dash: true, off: 0 }] }) },
   { t: "branch", q: `Scaling out`, start: "a", nodes: {
     a: { say: `<p>Your app gets popular, and you set the Container App to run 2 replicas. Shortly after, some users report that logging in "sometimes just bounces back to the app, signed out". What's going on?</p>`, opts: [
       [`The one-time login code is stored in one replica's memory, and the /api/token request sometimes lands on the other replica, which has never heard of it`, "b", `That's it: in-memory state plus multiple replicas.`],
       [`Cognito limits each app to one server`, "bad1", `Cognito doesn't care how many servers you run.`]] },
     bad1: { end: "bad", say: `Cognito has no such limit. Look at what your <i>own</i> server keeps in memory between requests.` },
     b: { say: `<p>What's the right fix?</p>`, opts: [
       [`Move the short-lived state (login codes, sessions) to a shared store, like Redis or the database, so any replica can serve any request`, "win", ``],
       [`Turn on "sticky sessions" and never think about it again`, "bad2", `It mostly works, until a replica restarts.`],
       [`Go back to 1 replica forever`, "bad3", `It works, but you've capped the app.`]] },
     bad2: { end: "bad", say: `Sticky sessions (routing a user to the same replica) can paper over it, but restarts and deploys still wipe memory, and some flows hop between requests. It's a patch, not a design.` },
     bad3: { end: "bad", say: `That's a fair short-term choice for a small app, but as a "fix" it gives up scaling and still loses everything on each deploy.` },
     win: { end: "good", say: `Stateless app servers plus shared state is the standard pattern: any replica can serve any request, and restarts lose nothing. Your signed tokens already follow it; the login codes and sessions don't yet.` } },
     why: `Anything kept in process memory (authCodes, the MemoryStore sessions) breaks with multiple replicas and is lost on restart. Shared stores fix it.` },
   { t: "mcq", q: `If the app's minimum replica count is 0, what does the first user of the morning experience?`, opts: [
     [`A cold start: Azure has to pull and start a container before answering, so the first request is noticeably slow (seconds) while later ones are fast`, true, `Right. Scale-to-zero saves money when idle, at the cost of a slow first request. Setting min replicas to 1 trades a small always-on cost for no cold starts.`],
     [`An error page, because Azure deletes the container image completely after a period without traffic and has to rebuild it`, false, `Images stay in the registry. Scale-to-zero only stops running copies.`],
     [`Nothing different at all, because Azure secretly keeps one replica running in the background regardless of the setting`, false, `With a minimum of 0, no replica runs while idle. That's the point, and the cost saving.`]] },
   { t: "mcq", q: `Each image is tagged with <code>github.sha</code> (the commit id) rather than <code>latest</code>. Why does that matter?`, opts: [
     [`Every running revision maps to an exact commit, so you can see precisely what code is live and roll back by redeploying an older tag`, true, `Yes. "latest" is a moving label that tells you nothing about what's running. SHA tags give traceability and easy rollbacks.`],
     [`Azure Container Registry rejects any image tagged "latest" for security reasons, so a unique tag is required on every push`, false, `ACR accepts "latest". It's just a poor practice for deployments.`],
     [`SHA tags make the image smaller, because Docker can compress layers better when it knows which commit they came from`, false, `A tag is just a label. It doesn't affect the image's size at all.`]] }
 ]},

 { id: "s-cicd", title: "CI/CD: your two workflows",
   intro: `Every push to main triggers two GitHub Actions workflows: one builds and deploys the backend container, the other builds the frontend and publishes it to your LeanLog repo. Here's every line of the backend one, plus the interesting part of the frontend one.`,
   steps: [
   { t: "read", html: ARCH({ w: 760, h: 200, title: "Deploy pipeline", nodes: [
       { id: "push", x: 10, y: 70, w: 110, h: 56, label: "git push", sub: "to main", color: "github", tip: `Your push starts both workflows in parallel.` },
       { id: "be", x: 170, y: 20, w: 150, h: 50, label: "Backend workflow", sub: "deploy.yml", color: "azure", tip: `Azure login (OIDC), docker build, push to ACR, update the Container App.` },
       { id: "fe", x: 170, y: 130, w: 150, h: 50, label: "Frontend workflow", sub: "deploy-frontend.yml", color: "browser", tip: `npm ci, vite build, push dist/ into LeanLog.` },
       { id: "acr", x: 380, y: 20, w: 140, h: 50, label: "ACR image", sub: "tag = commit SHA", color: "azure", tip: `The new image in the registry.` },
       { id: "ca", x: 580, y: 20, w: 170, h: 50, label: "Container App", sub: "new revision live", color: "azure", tip: `Azure starts the new revision and switches traffic to it.` },
       { id: "ll", x: 380, y: 130, w: 140, h: 50, label: "LeanLog repo", sub: "bot commit", color: "github", tip: `github-actions[bot] commits the built files.` },
       { id: "gp", x: 580, y: 130, w: 170, h: 50, label: "GitHub Pages", sub: "serves new frontend", color: "github", tip: `Pages picks up the new commit and publishes it.` }],
     edges: [{ from: "push", to: "be" }, { from: "push", to: "fe" }, { from: "be", to: "acr", label: "docker push" }, { from: "acr", to: "ca", label: "az containerapp update" }, { from: "fe", to: "ll", label: "git push (PAT)" }, { from: "ll", to: "gp", label: "Pages build" }] }) },
   { t: "read", html: AC({ src: ".github/workflows/deploy.yml", from: 1, to: 60, bands: [[3, 6, "build"], [8, 10, "auth"], [12, 16, "config"], [26, 31, "auth"], [45, 60, "build"]], notes: {
       name: `The workflow's (or step's) display name in the Actions tab.`,
       Deploy: `Part of the display name.`, backend: `Part of the name, or the image name, or the folder to build.`, to: `Part of the name.`, Azure: `Part of the name.`,
       on: `<b>on</b>: what triggers this workflow.`,
       "push@4": `Run on a git push…`,
       branches: `…but only to these branches.`,
       main: `Your main branch. Pushes to other branches don't deploy.`,
       permissions: `What the workflow's automatic GitHub token may do. It's a least-privilege setting.`,
       "id-token": `<b>id-token: write</b> lets the job request an <b>OIDC token</b> from GitHub, a signed statement saying "I am this repo's workflow on main". Azure is configured to trust such statements, so there's <b>no Azure password stored anywhere</b>. That's modern best practice.`,
       write: `Permission level.`,
       contents: `Repository contents…`,
       read: `…read-only: enough to check out code.`,
       env: `Variables available to every step.`,
       RESOURCE_GROUP: `The Azure resource group (a folder for Azure resources). Redacted here.`,
       "resource-group": `Placeholder for your resource group name.`,
       CONTAINER_APP_NAME: `Which Container App to update.`,
       "app-name": `Placeholder for your container app's name.`,
       ACR_NAME: `Your container registry's name.`,
       registry: `Placeholder for your registry name.`,
       IMAGE_NAME: `The image's name inside the registry.`,
       jobs: `A workflow is made of jobs, which run on fresh virtual machines.`,
       deploy: `This job's id.`,
       "runs-on": `Which kind of machine to use.`,
       "ubuntu-latest": `A fresh Ubuntu VM from GitHub, thrown away after the run.`,
       steps: `The job's steps, run in order. If one fails, the job stops.`,
       Checkout: `Step name.`,
       uses: `<b>uses</b> runs a reusable action someone published, pinned to a version.`,
       actions: `The publisher (GitHub's own actions).`,
       checkout: `Clones your repo onto the VM.`,
       v4: `The version tag. Pinning to a full commit SHA is stricter still, and protects against a tag being moved.`,
       Login: `Step name.`,
       azure: `Microsoft's official actions.`,
       login: `Logs into Azure using OIDC.`,
       v3: `Version tag.`,
       with: `Inputs for the action.`,
       "client-id": `Identifies the Azure app registration that trusts this repo.`,
       "${{ secrets.AZURE_CLIENT_ID }}": `Read from GitHub's encrypted secrets store and masked in logs. These IDs aren't really passwords, but keeping them in secrets keeps them out of the repo.`,
       "tenant-id": `Your Azure directory.`,
       "${{ secrets.AZURE_TENANT_ID }}": `From secrets.`,
       "subscription-id": `Which Azure subscription (billing account).`,
       "${{ secrets.AZURE_SUBSCRIPTION_ID }}": `From secrets.`,
       Check: `Step name.`, context: `Step name.`,
       run: `<b>run</b> executes shell commands on the VM.`,
       az: `The Azure command-line tool.`,
       account: `Azure account commands.`,
       show: `Print which account and subscription is active, a sanity check in the logs.`,
       output: `Output format option.`,
       table: `Human-readable table.`,
       containerapp: `Container Apps commands.`,
       list: `List the container apps…`,
       group: `…in this resource group.`,
       "resource-group@37": `The resource group option.`,
       query: `Filters the output.`,
       '"[].name"': `Just the names.`,
       Registry: `Step name.`, Container: `Step name.`,
       acr: `Registry commands.`,
       "$ACR_NAME": `Shell variable, filled from the env block above.`,
       Build: `Step name.`, Docker: `Step name.`, image: `Step name.`,
       docker: `The Docker CLI.`,
       build: `Build an image from a Dockerfile.`,
       t: `<code>-t</code> sets the image's name and tag.`,
       "azurecr.io": `The registry's address suffix: <code>&lt;name&gt;.azurecr.io/&lt;image&gt;:&lt;tag&gt;</code>.`,
       "$IMAGE_NAME": `"backend".`,
       "${{ github.sha }}": `The commit's full SHA, used as the tag: one image per commit.`,
       Push: `Step name.`, push: `Upload the image to the registry.`,
       to: `Step name.`, App: `Step name.`,
       update: `Point the Container App at a new image, which creates a new revision.`,
       "$CONTAINER_APP_NAME": `From env.`,
       "$RESOURCE_GROUP": `From env.` } }) },
   { t: "read", html: `<p>The frontend workflow's interesting part publishes into a <i>different</i> repo:</p>` + AC({ src: ".github/workflows/deploy-frontend.yml", from: 31, to: 59, bands: [[31, 36, "auth"], [38, 43, "build"], [45, 59, "build"]], notes: {
       name: `Step name.`, Checkout: `Step name.`, frontend: `Step name.`, repo: `Step name.`,
       uses: `Runs a published action.`, actions: `GitHub's actions.`, checkout: `Clone a repo.`, v4: `Version.`,
       with: `Inputs.`,
       repository: `Clone a different repo: the public LeanLog one.`,
       "c-mckeon": `Your GitHub account.`,
       LeanLog: `The frontend repo that GitHub Pages serves.`,
       token: `Credentials for pushing to that repo.`,
       "${{ secrets.FRONTEND_REPO_TOKEN }}": `A personal access token (PAT) stored as a secret. The workflow's built-in token can't push to <i>other</i> repos, hence the PAT. Keep it fine-grained: only the LeanLog repo, only contents write.`,
       path: `Where to clone it on the VM.`,
       "frontend-deploy": `The folder name.`,
       Copy: `Step name.`, dist: `Vite's output folder.`, into: `Step name.`,
       run: `Shell commands.`,
       rsync: `A file-syncing tool.`,
       av: `<code>-a</code> preserves file details, <code>-v</code> lists what's copied.`,
       "delete": `<b>--delete</b> removes files in LeanLog that aren't in dist/. Anything you add to LeanLog by hand (a README, a CNAME for a custom domain) gets <b>deleted on the next deploy</b>, unless it's excluded like .git.`,
       exclude: `Don't touch these.`,
       '".git"': `LeanLog's own git folder.`,
       Commit: `Step name.`, and: `Step name.`,
       "working-directory": `Run these commands inside the LeanLog clone.`,
       env: `Step-level environment variables.`,
       COMMIT_MESSAGE: `Your source commit's message, reused for the LeanLog commit.`,
       "${{ github.event.head_commit.message }}": `The pushed commit's message. It's passed through <code>env</code> and quoted as "$COMMIT_MESSAGE", which is <b>the safe way</b>. Pasting <code>\${{ ... }}</code> directly into a run: script would let a crafted commit message inject shell commands.`,
       git: `The git CLI.`, config: `Set git settings.`,
       "user.name": `The commit author's name.`,
       '"github-actions[bot]"': `Commits appear as the Actions bot.`,
       "user.email": `The bot's no-reply email.`,
       '"41898282+github-actions[bot]@users.noreply.github.com"': `GitHub's official bot address.`,
       add: `Stage changes.`, A: `<code>-A</code>: all changes, including deletions.`,
       if: `Shell if.`, diff: `Compare.`, cached: `<code>--cached</code>: staged changes.`, quiet: `<code>--quiet</code>: no output, just an exit code.`, then: `Shell then.`,
       echo: `Print a line.`,
       '"No frontend changes to deploy"': `Logged when the build output didn't change (e.g. a backend-only commit).`,
       else: `Shell else.`, commit: `Make the commit.`, m: `Message flag.`,
       '"$COMMIT_MESSAGE"': `Quoted variable: safe.`,
       push: `Upload to LeanLog.`, origin: `The remote.`, main: `Its main branch.`, fi: `End of the shell if.` } }) },
   { t: "mcq", q: `You change only <code>frontend/style.css</code> and push. What happens to the backend?`, opts: [
     [`It's rebuilt and redeployed anyway, because deploy.yml runs on every push to main with no path filter`, true, `Right. Neither workflow filters by path. Adding <code>paths: ['backend/**']</code> to deploy.yml (and the frontend equivalent) avoids pointless deploys, and the logouts they cause.`],
     [`Nothing at all, because GitHub automatically detects that the backend folder is unchanged and skips that workflow`, false, `GitHub only does that if you configure path filters, which these workflows don't have.`],
     [`The backend workflow fails, because Docker refuses to build when no files inside the backend folder have changed`, false, `Docker builds happily (mostly from cache). It just deploys an unchanged image.`]] },
   { t: "mcq", q: `Why is <code>id-token: write</code> plus <code>azure/login</code> with client, tenant and subscription ids better than storing an Azure password as a secret?`, opts: [
     [`No long-lived password exists to leak. GitHub issues a short-lived signed token per run, and Azure only trusts it from your repo and branch`, true, `Yes. That's OIDC federation: nothing to rotate, nothing to steal from the secrets store that grants access on its own. It's one of the best practices already in your setup.`],
     [`It makes the workflow run faster, because Azure can skip checking any credentials when the request comes from GitHub's servers`, false, `Azure still verifies every token. The benefit is security, not speed.`],
     [`Passwords aren't supported by azure/login any more, so the OIDC method is simply the only option the action allows`, false, `Service-principal secrets are still supported. OIDC is chosen because it's safer.`]] },
   { t: "read", html: FLAG("good", "the commit-message pattern", `Passing <code>github.event.head_commit.message</code> through <code>env</code> and quoting it is exactly what GitHub's security guidance recommends. It's a common hole in workflows, and yours avoids it.`) }
 ]},

     <tr style="--band:#e5534b"><td>FIREBASE_SERVICE_ACCOUNT_JSON</td><td>Yes: full database admin</td><td>Container App secret</td><td>a JSON file (gitignored + dockerignored)</td></tr>
     <tr style="--band:#e5534b"><td>FRONTEND_REPO_TOKEN</td><td>Yes: can push to LeanLog</td><td>GitHub Actions secret</td><td>n/a</td></tr>
     <tr style="--band:#e3a624"><td>AZURE_CLIENT/TENANT/SUBSCRIPTION_ID</td><td>Low: identifiers, not keys</td><td>GitHub Actions secrets</td><td>n/a</td></tr>
     <tr style="--band:#2da44e"><td>COGNITO_ISSUER, CLIENT_ID, DOMAIN</td><td>No: public by design</td><td>Container App env vars</td><td>.env</td></tr>

   { t: "mcq", q: `A Firebase web config (with an "apiKey") sits in public frontend code. Is that a leak?`, opts: [
     [`Not by itself: Firebase web API keys only identify the project, and the security rules decide what anyone can do`, true, `Right, a common confusion. Your rules deny everything outside users/$uid, and the backend uses admin access instead. The service-account JSON is the real secret, and it's correctly kept out of the code.`],
     [`Yes, it's a serious leak, because anyone holding the apiKey can read and delete the whole database without any further checks`, false, `The apiKey alone grants nothing. Requests still pass through the security rules, and yours deny almost everything.`],
     [`Yes, because Google charges the key's owner for every page load, so a leaked key can run up a large bill very quickly`, false, `It's not a billing credential in that sense. Abuse is limited by the rules and by quotas, not by hiding the key.`]] },

       { id: "sub", x: 280, y: 150, w: 200, h: 44, label: "<sub>", sub: "Cognito user id", color: "aws", tip: `The key is the Cognito sub, the link between AWS identity and Google storage. Everything below belongs to that one user.` },

       { id: "s", x: 435, y: 240, w: 110, h: 50, label: "settings", sub: "…and more", color: "google", tip: `Settings, plus the other allowed roots: bio, volumeTargets, calendarNotes, analyticsdb, workoutDraft…` },
       { id: "m", x: 560, y: 240, w: 190, h: 50, label: "_meta, _workoutSaves", sub: "bookkeeping (API can't touch)", color: "danger", tip: `Template version, createdAt, saveId → workoutId map. They're not on the allow-list, so the generic API can't read or change them.` }],
     edges: [{ from: "root", to: "users" }, { from: "users", to: "sub" }, { from: "sub", to: "w" }, { from: "sub", to: "e" }, { from: "sub", to: "f" }, { from: "sub", to: "s" }, { from: "sub", to: "m" }] }) },
   { t: "sort", q: `Firebase RTDB (JSON tree) vs a SQL database: which is it true of?`, buckets: ["Your Firebase tree", "A SQL database"], items: [
     [`"Show total volume per muscle group per month" is computed by downloading the data and looping in the browser`, 0, `Your analytics.js and volume.js do exactly this. Fine for one user's data, but it gets slower as history grows.`],
     [`A database-enforced foreign key stops a workout referring to a deleted exercise`, 1, `RTDB has no foreign keys. Consistency is up to your code.`],

 { id: "s-api", title: "Your API surface",
   intro: `Here's every endpoint your backend exposes, colour-coded by guard. An API surface map like this is one of the first things a new teammate, or a security reviewer, asks for.`,
   steps: [
   { t: "read", html: `<div class="legend"><i style="--band:#2da44e">Public</i><i style="--band:#e3a624">requireAuth (read)</i><i style="--band:#e5534b">requireWriteAuth (write, no demo)</i></div><div class="tscroll"><table class="dtable">
     <tr><th>Method + path</th><th>What it does</th></tr>
     <tr style="--band:#2da44e"><td><code>GET /</code></td><td>Small backend home page (EJS)</td></tr>
     <tr style="--band:#2da44e"><td><code>GET /login</code>, <code>/callback</code>, <code>/logout</code></td><td>The Cognito login flow</td></tr>
     <tr style="--band:#2da44e"><td><code>GET /demo</code></td><td>Starts a read-only demo session</td></tr>

     <tr style="--band:#2da44e"><td><code>GET /api/me</code></td><td>Who am I? (also seeds new users' data)</td></tr>
     <tr style="--band:#e3a624"><td><code>GET /api/workouts</code>, <code>/api/exercises</code>, <code>/api/focus-areas</code>, <code>/api/clock</code></td><td>Specific reads</td></tr>
     <tr style="--band:#e3a624"><td><code>GET /api/data?path=</code></td><td>Generic read of an allowed path</td></tr>

     </table></div>` },
   { t: "mcq", q: `<code>GET /api/me</code> may <i>write</i> to the database (it seeds a new user's template). Why do HTTP conventions frown on that?`, opts: [
     [`GET should have no side effects, because browsers, proxies and prefetchers may repeat GETs freely`, true, `Right. Here the write is idempotent (it seeds once, then does nothing), so it's harmless in practice, but it's still a convention worth knowing and explaining when you choose to bend it.`],
     [`GET requests aren't allowed to have a JSON response body, so the backend can't report back whether the write worked`, false, `GET responses can have any body. Only GET <i>request</i> bodies are unusual.`],
     [`Firebase refuses any write that happens during a GET request, so the seeding silently fails in production`, false, `Firebase has no idea which HTTP method your server received.`]] },
   { t: "sort", q: `REST style or RPC style?`, buckets: ["Resource-style (REST)", "Procedure / tunnel style"], items: [

     [`<code>PUT /api/workouts/:workoutId</code>`, 0],
     [`<code>PUT /api/data</code> with <code>{path, value}</code> in the body`, 1, `A generic tunnel: the real "resource" is hidden in the body.`],
     [`<code>POST /api/clock/start</code>`, 1, `A verb in the path. It's pragmatic and fine.`],
     [`<code>POST /api/exercises</code>`, 0]] },
   { t: "mcq", q: `The generic data endpoints mean the backend can't validate most writes. If you wanted to tighten this over time, what's the sensible path?`, opts: [
     [`Add validated endpoints for the key data one area at a time, move the frontend onto each, then shrink the allow-list`, true, `Yes. It's incremental: each step is small, testable and reversible, with no big-bang rewrite.`],
     [`Delete the generic endpoints in a single release and rewrite every frontend data call against brand-new specific endpoints`, false, `A big-bang rewrite of a 140 KB frontend is high-risk. Incremental migration gets the same result safely.`],

 { id: "s-security", title: "Security review",
   intro: `Here's a security review of your system, written for a public page: each issue names the <i>kind</i> of risk and the fix, without the exact details someone would need to abuse it. Strengths first, because there are plenty.`,
   steps: [
   { t: "read", html: FLAG("good", "what's already solid", `<ul>
       <li>Passwords never touch your code: Cognito's hosted login does it all.</li>
       <li>The OIDC code flow with state and nonce, through a certified library.</li>
       <li>The client secret, session secret and admin key exist only server-side, as secrets.</li>
       <li>The server refuses to start in production without a session secret.</li>
       <li>HMAC-signed tokens, checked with a constant-time comparison.</li>
       <li>One-time, 60-second login codes, passed in the URL fragment.</li>
       <li>A user's data path comes only from their verified identity.</li>
       <li>An allow-list plus segment checks on generic paths, and a 32 KB body limit.</li>
       <li>Database rules deny everything by default.</li>
       <li>Azure deploys use OIDC (no stored password), and the workflow passes the commit message safely.</li></ul>`) },
   { t: "read", html:
     FLAG("risk", "a cross-site request forgery gap", `Because the session cookie must be sent cross-site (<code>sameSite: 'none'</code>), combined with how some write requests are accepted, another website could, in some circumstances, make a logged-in user's browser perform writes on their account. <i>Details deliberately left out here.</i> Typical fixes: only accept JSON on API routes, require the bearer token (or a custom header) for writes rather than the cookie, and check the Origin header on state-changing requests.`) +
     FLAG("risk", "token theft via injected scripts", `The token sits in localStorage, the frontend builds HTML with <code>innerHTML</code> in many places, and some third-party scripts load from a CDN without a pinned version. Any injection point would let a script steal the token. Fixes: build elements with <code>textContent</code> for user data, pin script versions (ideally with integrity hashes), add a Content Security Policy, and shorten the token lifetime.`) +
     FLAG("warn", "no rate limiting", `Nothing limits how fast one client can call the API or start login flows. A rate limiter (an Express middleware, or Azure's ingress features) protects your Firebase bill and Cognito quotas.`) +
     FLAG("warn", "tokens can't be revoked", `Logout doesn't invalidate a copied token before its 8-hour expiry.`) +
     FLAG("warn", "container runs as root", `One line (<code>USER node</code>) fixes it.`) +
     FLAG("warn", "public identifiers and leftovers", `Real resource names in .env.example and code fallbacks, plus an old project's config in the service worker.`) },
   { t: "sort", q: `Strength or risk?`, buckets: ["Strength", "Risk"], items: [
     [`The user's database path comes only from the verified sub`, 0],
     [`The token is stored where any page script can read it`, 1],
     [`OIDC federation for Azure deploys`, 0],
     [`No limit on request rate`, 1],
     [`One-time codes that expire in 60 seconds`, 0],
     [`Unpinned third-party scripts loaded from a CDN`, 1, `If the CDN or package is compromised, malicious code runs on your page with access to the token.`]] },
   { t: "branch", q: `Prioritising the fixes`, start: "a", nodes: {
     a: { say: `<p>You have a free weekend for security work. Which goes first?</p>`, opts: [
       [`Close the cross-site write gap: it's exploitable against any logged-in user with no special access, and the fix is small`, "b", `Highest impact for the least effort.`],
       [`Rewrite the auth system from scratch with a different provider`, "bad1", `A rewrite brings brand-new bugs.`],
       [`Add USER node to the Dockerfile`, "bad2", `Good hygiene, low urgency.`]] },
     bad1: { end: "bad", say: `Your auth design is mostly sound. Rewriting it trades known, fixable gaps for unknown new ones. Fix the specific issues.` },
     bad2: { end: "bad", say: `Worth doing, but it only matters <i>after</i> someone gets code running in the container. Fix what's exploitable from the outside first.` },
     b: { say: `<p>Next?</p>`, opts: [
       [`Reduce XSS exposure: pin the CDN scripts, swap innerHTML for textContent where user data is shown, add a basic CSP`, "c", `Protects the token at its source.`],
       [`Hide the API's URL so attackers can't find it`, "bad3", `It's in the public frontend code.`]] },
     bad3: { end: "bad", say: `Security through obscurity doesn't work here: the browser has to know the URL. Defend the endpoints themselves.` },
     c: { say: `<p>With the last hour?</p>`, opts: [
       [`Add rate limiting and path filters on the workflows, write the fixes up in the README, and schedule the rest`, "win", ``],
       [`Turn off the demo mode entirely, just in case`, "bad4", `The demo is already read-only.`]] },
     bad4: { end: "bad", say: `The demo is guarded (403 on writes). Removing a working, safe feature isn't a security fix. Spend the time on real gaps.` },

const TRACKS = {
  oop: { name: "Objects", who: "Dot, shop owner", av: "D", lessons: OOP,
         ranks: [[0, "Scripter"], [35, "Class Act"], [85, "Encapsulator"], [145, "Pattern Spotter"], [205, "Object Architect"]] },
  craft: { name: "Craft", who: "Rafa, tech lead", av: "R", lessons: CRAFT,
         ranks: [[0, "New Starter"], [35, "Teammate"], [85, "Trusted Reviewer"], [145, "Problem Solver"], [205, "Tech Lead Material"]] },
  web: { name: "Build", who: "Jo, backend developer", av: "J", lessons: WEB, map: WEB_MAP, gloss: true,
         ranks: [[0, "Tinkerer"], [60, "Request Reader"], [140, "API Builder"], [230, "AI Integrator"], [310, "Shipper"]] },
  code: { name: "My code", who: "Jo, backend developer", av: "J", lessons: MYCODE,
         ranks: [[0, "Code Tourist"], [40, "Line Reader"], [85, "Code Explainer"], [130, "Code Owner"], [165, "Reviewer of My Own App"]] },
  sys: { name: "My system", who: "Priya, cloud architect", av: "P", lessons: MYSYS,
         ranks: [[0, "Passenger"], [40, "Diagram Reader"], [90, "Systems Thinker"], [135, "Architect in Training"], [170, "Can Explain It All"]] },
};

/* ---------- Step engine ---------- */
function tLessons(t) { return TRACKS[t].lessons.filter(x => x.id); }
function tLesson(t, id) { return tLessons(t).find(l => l.id === id) || tLessons(t)[0]; }
function reached(t, id) { return tstate[t].reached[id] || 0; }
function isDone(t, les) { return reached(t, les.id) >= les.steps.length; }
const isSkipped = (t, key) => !!(tstate[t].skipped && tstate[t].skipped[key]);
function allSkipped(t, les) { return les.steps.every((s, i) => s.t === "read" || isSkipped(t, les.id + ":" + i)); }
const earnsBonus = (t, les) => isDone(t, les) && !allSkipped(t, les);
function tXp(t) {
  const x = Object.values(tstate[t].xp).reduce((a, b) => a + b, 0);
  return x + tLessons(t).filter(l => earnsBonus(t, l)).length * LESSON_BONUS;
}
function lessonXp(t, les) {
  let x = 0;
  for (const k in tstate[t].xp) if (k.startsWith(les.id + ":")) x += tstate[t].xp[k];
  return x + (earnsBonus(t, les) ? LESSON_BONUS : 0);
}

function stepRenderTop(t) {
  const x = tXp(t), ranks = TRACKS[t].ranks;
  let r = ranks[0], next = null;
  for (let i = 0; i < ranks.length; i++) if (x >= ranks[i][0]) { r = ranks[i]; next = ranks[i + 1] || null; }
  $("rank-name").textContent = r[1];
  $("xp-text").textContent = next ? `${x} XP · ${next[0] - x} to ${next[1]}` : `${x} XP · top rank`;
  const pct = next ? ((x - r[0]) / (next[0] - r[0])) * 100 : 100;
  $("xp-fill").style.width = Math.max(3, pct) + "%";
}

function stepRenderNav(t) {
  const list = tLessons(t);
  const doneCount = list.filter(l => isDone(t, l)).length;
  let n = 0, html = `<h2>${doneCount} of ${list.length} done</h2><ol>`;
  for (const item of TRACKS[t].lessons) {
    if (item.sec) { html += `<li class="section-label">${esc(item.sec)}</li>`; continue; }
    n++;
    const done = isDone(t, item), skip = done && allSkipped(t, item);
    const cls = [done ? (skip ? "skipped" : "done") : "", item.boss ? "boss" : "", item.id === tstate[t].current ? "current" : ""].join(" ");
    html += `<li><button type="button" class="${cls}" data-id="${item.id}"${skip ? ` title="Skipped"` : ""}><span class="num">${skip ? "»" : done ? "✓" : n}</span><span>${esc(item.title)}</span></button></li>`;
  }
  html += "</ol>";
  if (TRACKS[t].gloss) {
    const keys = Object.keys(GLOSS).sort((a, b) => GLOSS[a][0].localeCompare(GLOSS[b][0]));
    html += `<details class="gloss"><summary>Glossary (${keys.length} terms)</summary><dl>${keys.map(k => `<dt>${esc(GLOSS[k][0])}</dt><dd>${GLOSS[k][1]}</dd>`).join("")}</dl></details>`;
  }
  $("nav").innerHTML = html;
}

function projectMap(t, les) {
  const T = TRACKS[t], lit = new Set(), now = new Set(les.lights || []);
  for (const l of tLessons(t)) if (isDone(t, l)) (l.lights || []).forEach(x => lit.add(x));
  const box = id => { const c = T.map[id]; return `<div class="pm-box ${lit.has(id) ? "lit" : ""} ${now.has(id) ? "now" : ""}"><b>${c[0]}</b><small>${c[1]}</small></div>`; };
  return `<details class="pmap" open><summary>Your project: Ferry Street online <span>${lit.size} of ${Object.keys(T.map).length} parts built</span></summary>
    <div class="pm-flow">${box("client")}<span class="pm-arrow" aria-hidden="true">→</span>${box("api")}<span class="pm-arrow" aria-hidden="true">→</span><div class="pm-stack">${box("db")}${box("prices")}${box("ai")}</div></div>
    <div class="pm-flow pm-under">${box("auth")}${box("evals")}${box("live")}</div>
    <p class="hint-line">Green parts are built. Outlined ones are what this lesson works on.</p></details>`;
}

function setTrack(t) {
  active = t;
  try { localStorage.setItem("ferry-street-active", t); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.track === t)));
  $("app").classList.remove("nav-open"); $("nav-toggle").setAttribute("aria-expanded", "false");
  if (t === "sql") renderLesson(); else stepRenderLesson(t);
  window.scrollTo({ top: 0 });
}

function stepGo(id) {
  tstate[active].current = id; tsave();
  stepRenderLesson(active);
  $("app").classList.remove("nav-open"); $("nav-toggle").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}

function stepRenderLesson(t, focus) {
  const T = TRACKS[t], list = tLessons(t);
  const les = tLesson(t, tstate[t].current);
  tstate[t].current = les.id;
  const idx = list.indexOf(les), r = reached(t, les.id), n = les.steps.length, done = r >= n;
  const dots = les.steps.map((s, i) => `<i class="${i < r ? "ok" : i === r ? "on" : ""}"></i>`).join("");
  $("main").innerHTML = `
    <div class="lesson-head">
      <div class="eyebrow">${les.boss ? "Boss level" : `Lesson ${idx + 1} of ${list.length}`}${done ? (allSkipped(t, les) ? " · skipped" : " · completed") : ""}</div>
      <h2>${esc(les.title)}</h2>
      ${done ? "" : `<div><button type="button" class="link-btn" id="skip-lesson">Skip this lesson →</button></div>`}
    </div>
    <div class="memo">
      <div class="avatar" aria-hidden="true">${T.av}</div>
      <div class="bubble"><div class="who">${esc(les.who || T.who)}</div><p>${les.intro}</p></div>
    </div>
    ${T.map ? projectMap(t, les) : ""}
    <div class="progress-dots" role="img" aria-label="Step ${Math.min(r + 1, n)} of ${n}">${dots}</div>
    <div class="steps" id="steps"></div>`;
  const box = $("steps");
  const sk = $("skip-lesson");
  if (sk) sk.onclick = () => {
    for (let j = r; j < n; j++) if (les.steps[j].t !== "read") tstate[t].skipped[les.id + ":" + j] = true;
    tstate[t].reached[les.id] = n; tsave();
    const nx = list[idx + 1];
    if (nx) stepGo(nx.id); else { stepRenderLesson(t); window.scrollTo({ top: 0 }); }
  };
  for (let i = 0; i <= Math.min(r, n - 1); i++) box.appendChild(renderStep(t, les, i, i < r));
  if (done) {
    const next = list[idx + 1];
    box.insertAdjacentHTML("beforeend", `<div class="finale" id="step-finish"><span class="eyebrow">Lesson complete</span>
      <h3>${esc(les.title)}: ${lessonXp(t, les)} XP earned</h3>
      <div class="actions">${next ? `<button class="btn btn-primary" type="button" id="next-lesson">Next: ${esc(next.title)} →</button>` : `<span><b>That's the whole ${esc(T.name)} course.</b> Well done.</span>`}
      <button class="btn btn-ghost" type="button" id="restart-lesson">Go through it again</button></div></div>`);
    if (next) $("next-lesson").onclick = () => stepGo(next.id);
    $("restart-lesson").onclick = () => {
      tstate[t].reached[les.id] = 0;
      for (const k in tstate[t].skipped) if (k.startsWith(les.id + ":")) delete tstate[t].skipped[k];
      tsave();
      for (const k in attempts) if (k.startsWith(les.id + ":")) delete attempts[k];
      stepRenderLesson(t); window.scrollTo({ top: 0 });
    };
  }
  stepRenderNav(t); stepRenderTop(t);
  if (focus !== undefined) {
    const el = document.getElementById(focus === "finish" ? "step-finish" : "step-" + focus);
    if (el) el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
  }
}

function renderStep(t, les, i, solved) {
  const s = les.steps[i], key = les.id + ":" + i;
  const el = document.createElement("section");
  el.className = "step t-" + s.t + (solved ? " solved" : "");
  el.id = "step-" + i;
  const skipped = solved && isSkipped(t, key);
  const head = s.t === "read" ? "" : `<div class="step-kind"><span class="eyebrow">${KIND[s.t]}</span>${skipped ? `<span class="skip-chip">skipped · answer shown</span>` : solved ? `<span class="done-chip">✓ done</span>` : `<button type="button" class="link-btn skip-step" data-skip>Skip</button>`}</div>`;
  el.innerHTML = head + (s.q ? `<div class="q">${s.q}</div>` : "") + (s.code && s.t !== "spot" ? C(s.code) : "") + `<div class="body"></div><div class="fb" aria-live="polite"></div>`;
  const ctx = { t, les, i, s, key, el, body: el.querySelector(".body"), fb: el.querySelector(".fb"), solved };
  BUILD[s.t](ctx);
  if (solved && s.why) ctx.fb.innerHTML = `<div class="explain">${s.why}</div>`;
  const skb = el.querySelector("[data-skip]");
  if (skb) skb.onclick = () => { tstate[t].skipped[key] = true; tsave(); advance(t, les, i); };
  return el;
}

function contButton(ctx) {
  const last = ctx.i === ctx.les.steps.length - 1;
  return `<div class="actions"><button class="btn btn-primary" type="button" data-cont>${last ? "Finish lesson" : "Continue"} →</button></div>`;
}
function bindCont(ctx) {
  const b = ctx.fb.querySelector("[data-cont]");
  b.onclick = () => advance(ctx.t, ctx.les, ctx.i);
  b.focus({ preventScroll: true });
}

function succeed(ctx, opts = {}) {
  const { t, s, key, fb } = ctx;
  let gained = "";
  if (!(key in tstate[t].xp)) {
    const full = FULL[s.t];
    const x = opts.xp != null ? opts.xp : ((attempts[key] || 0) === 0 ? full : Math.ceil(full / 2));
    tstate[t].xp[key] = x; tsave();
    gained = ` +${x} XP`;
    stepRenderTop(t);
  }
  fb.innerHTML = `<div class="feedback good"><div class="msg">${pick(PRAISE)}${gained}</div></div>${opts.extra || ""}${s.why ? `<div class="explain">${s.why}</div>` : ""}${contButton(ctx)}`;
  bindCont(ctx);
}
function miss(ctx, html) {
  attempts[ctx.key] = (attempts[ctx.key] || 0) + 1;
  ctx.fb.innerHTML = `<div class="feedback bad"><div class="msg">${html}</div></div>`;
}
function note(ctx, html) { ctx.fb.innerHTML = `<div class="feedback info"><div class="msg">${html}</div></div>`; }

function advance(t, les, i) {
  const was = isDone(t, les);
  tstate[t].reached[les.id] = Math.max(reached(t, les.id), i + 1); tsave();
  const now = isDone(t, les);
  stepRenderLesson(t, now ? "finish" : i + 1);
  if (now && !was) { const f = $("step-finish"); if (f) confetti(f); }
}

const normOut = x => String(x).replace(/\r/g, "").split("\n").map(l => l.trim().replace(/\s+/g, " ")).join("\n").trim();
const safeId = k => k.replace(/[^a-z0-9]/gi, "-");

function seededOrder(n, seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => (h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0, (h >>> 0) / 4294967296);
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}

const BUILD = {
  read(ctx) {
    ctx.body.innerHTML = ctx.s.html;
    if (!ctx.solved) { ctx.fb.innerHTML = contButton(ctx); ctx.fb.querySelector("[data-cont]").onclick = () => advance(ctx.t, ctx.les, ctx.i); }
  },

  mcq(ctx) {
    const { s, body, solved } = ctx;
    const multi = s.opts.filter(o => o[1]).length > 1;
    body.innerHTML = `${multi && !solved ? `<p class="hint-line">Pick all that apply.</p>` : ""}<div class="opts">${s.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span>${o[0]}</span></button>`).join("")}</div>${multi && !solved ? `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>` : ""}`;
    const btns = [...body.querySelectorAll(".opt")];
    const showWhy = (b, j) => { if (!b.querySelector(".why")) b.insertAdjacentHTML("beforeend", `<span class="why">${s.opts[j][2]}</span>`); };
    if (solved) { btns.forEach((b, j) => { b.disabled = true; if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); } }); return; }
    if (!multi) {
      btns.forEach((b, j) => b.onclick = () => {
        if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); btns.forEach(x => x.disabled = true); succeed(ctx); }
        else { b.classList.add("wrong"); b.disabled = true; showWhy(b, j); miss(ctx, "Not that one. Read why, then try another."); }
      });
    } else {
      btns.forEach(b => b.onclick = () => b.classList.toggle("picked"));
      body.querySelector("[data-check]").onclick = () => {
        const picked = btns.map(b => b.classList.contains("picked"));
        if (s.opts.every((o, j) => o[1] === picked[j])) {
          btns.forEach((b, j) => { b.disabled = true; b.classList.remove("picked"); if (s.opts[j][1]) { b.classList.add("right"); showWhy(b, j); } });
          body.querySelector("[data-check]").remove(); succeed(ctx);
        } else {
          const right = s.opts.filter((o, j) => o[1] && picked[j]).length, total = s.opts.filter(o => o[1]).length;
          const extra = s.opts.filter((o, j) => !o[1] && picked[j]).length;
          miss(ctx, `You have ${right} of ${total} right${extra ? `, plus ${extra} that shouldn't be picked` : ""}.`);
        }
      };
    }
  },

  predict(ctx) {
    const { s, body, solved, key } = ctx;
    const answers = [].concat(s.answer);
    const multiLine = answers[0].includes("\n");
    if (solved) { body.innerHTML = `<div class="model"><b>Output</b><pre>${esc(answers[0])}</pre></div>`; return; }
    const id = "pred-" + safeId(key);
    body.innerHTML = `<label for="${id}" class="hint-line">What does it print?${multiLine ? " One line per print()." : ""}</label>
      ${multiLine ? `<textarea id="${id}" class="answer-input" rows="${answers[0].split("\n").length}" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>` : `<input id="${id}" class="answer-input" spellcheck="false" autocapitalize="off" autocomplete="off">`}
      <div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button><span data-giveup></span></div>`;
    const inp = body.querySelector(".answer-input");
    const check = () => {
      const v = normOut(inp.value);
      if (!v) { note(ctx, "Type what you think it prints first."); return; }
      if (answers.some(a => normOut(a) === v)) {
        inp.readOnly = true; body.querySelector(".actions").remove();
        succeed(ctx, { extra: `<div class="model"><b>Output</b><pre>${esc(answers[0])}</pre></div>` });
      } else {
        miss(ctx, multiLine ? "Not quite. Check each line: one per print() call." : "Not quite. Trace it through one line at a time.");
        const g = body.querySelector("[data-giveup]");
        if (attempts[key] >= 2 && g && !g.innerHTML) {
          g.innerHTML = `<button class="btn btn-ghost" type="button">Show answer</button>`;
          g.firstChild.onclick = () => { inp.value = answers[0]; check(); };
        }
      }
    };
    body.querySelector("[data-check]").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && (!multiLine || e.ctrlKey || e.metaKey)) { e.preventDefault(); check(); } });
  },

  sort(ctx) {
    const { s, body, solved, key } = ctx;
    const choice = s.items.map(() => -1);
    body.innerHTML = s.items.map((it, j) => `<div class="sort-row" data-j="${j}"><div class="item">${it[0]}${solved && it[2] ? `<small>${it[2]}</small>` : ""}</div>${solved ? `<span class="chip">${esc(s.buckets[it[1]])}</span>` : `<div class="seg" role="group" aria-label="Choose a group">${s.buckets.map((b, k) => `<button type="button" aria-pressed="false" data-k="${k}">${esc(b)}</button>`).join("")}</div>`}</div>`).join("") + (solved ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>`);
    if (solved) return;
    const rows = [...body.querySelectorAll(".sort-row")];
    const addSmall = (row, j, prefix) => { if (s.items[j][2] && !row.querySelector(".item small")) row.querySelector(".item").insertAdjacentHTML("beforeend", `<small>${prefix}${s.items[j][2]}</small>`); };
    rows.forEach((row, j) => row.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
      choice[j] = +b.dataset.k;
      row.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      row.classList.remove("right", "wrong");
      const sm = row.querySelector(".item small"); if (sm) sm.remove();
    }));
    body.querySelector("[data-check]").onclick = () => {
      const left = choice.filter(c => c < 0).length;
      if (left) { note(ctx, `Sort every item first (${left} left).`); return; }
      let wrong = 0;
      rows.forEach((row, j) => { const ok = choice[j] === s.items[j][1]; row.classList.toggle("right", ok); row.classList.toggle("wrong", !ok); if (!ok) wrong++; });
      if (!wrong) {
        rows.forEach((row, j) => { row.querySelectorAll(".seg button").forEach(b => b.disabled = true); addSmall(row, j, ""); });
        body.querySelector("[data-check]").remove(); succeed(ctx);
      } else {
        miss(ctx, `${s.items.length - wrong} of ${s.items.length} right. Change the ones marked ✗.`);
        if (attempts[key] >= 2) rows.forEach((row, j) => { if (row.classList.contains("wrong")) addSmall(row, j, "Hint: "); });
      }
    };
  },

  spot(ctx) {
    const { s, body, solved } = ctx;
    const lines = trimCode(s.code).split("\n");
    const sel = new Set();
    body.innerHTML = `${solved ? "" : `<p class="hint-line">Tap lines to select them${s.bad.length > 1 ? ` (there are ${s.bad.length} to find)` : ""}, then press Check.</p>`}<div class="spot">${lines.map((l, j) => `<button type="button" data-j="${j}" aria-pressed="false" ${solved ? "disabled" : ""} class="${solved && s.bad.includes(j) ? "bad" : ""}"><span class="ln">${j + 1}</span><span>${hl(l) || " "}</span></button>`).join("")}</div>${solved ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check</button></div>`}`;
    if (solved) return;
    const btns = [...body.querySelectorAll(".spot button")];
    btns.forEach((b, j) => b.onclick = () => {
      if (sel.has(j)) sel.delete(j); else sel.add(j);
      b.classList.toggle("sel", sel.has(j)); b.setAttribute("aria-pressed", String(sel.has(j)));
    });
    body.querySelector("[data-check]").onclick = () => {
      if (!sel.size) { note(ctx, "Select at least one line first."); return; }
      const found = s.bad.filter(j => sel.has(j)).length, extra = sel.size - found;
      if (found === s.bad.length && !extra) {
        btns.forEach((b, j) => { b.disabled = true; b.classList.remove("sel"); if (s.bad.includes(j)) b.classList.add("bad"); });
        body.querySelector("[data-check]").remove(); succeed(ctx);
      } else {
        miss(ctx, `You found ${found} of ${s.bad.length}.${extra ? ` ${extra} of your picks ${extra === 1 ? "is" : "are"} fine as written.` : ""}`);
      }
    };
  },

  order(ctx) {
    const { s, body, solved, key } = ctx;
    let cur = solved ? s.items.map((_, j) => j) : seededOrder(s.items.length, key);
    let locked = solved;
    const render = (marks, focusSel) => {
      body.innerHTML = `<ol class="order-list">${cur.map((j, p) => `<li class="${marks && marks[p] ? "right" : ""}"><span class="pos">${p + 1}.</span><span class="txt">${s.items[j]}</span>${locked ? "" : `<span class="mv"><button type="button" data-up="${p}" aria-label="Move up" ${p === 0 ? "disabled" : ""}>↑</button><button type="button" data-down="${p}" aria-label="Move down" ${p === cur.length - 1 ? "disabled" : ""}>↓</button></span>`}</li>`).join("")}</ol>${locked ? "" : `<div class="actions"><button class="btn btn-primary" type="button" data-check>Check order</button></div>`}`;
      if (locked) return;
      const move = (p, q) => { [cur[p], cur[q]] = [cur[q], cur[p]]; render(null, q === 0 ? `[data-down="0"]` : `[data-up="${q}"]`); };
      body.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
      body.querySelectorAll("[data-down]").forEach(b => b.onclick = () => { const p = +b.dataset.down; [cur[p], cur[p + 1]] = [cur[p + 1], cur[p]]; render(null, p + 1 === cur.length - 1 ? `[data-up="${p + 1}"]` : `[data-down="${p + 1}"]`); });
      if (focusSel) { const f = body.querySelector(focusSel); if (f) f.focus(); }
      body.querySelector("[data-check]").onclick = () => {
        const marks = cur.map((j, p) => j === p);
        const right = marks.filter(Boolean).length;
        if (right === cur.length) { locked = true; render(marks); succeed(ctx); }
        else { render(marks); miss(ctx, `${right} of ${cur.length} are in the right place (marked green). Keep going.`); }
      };
    };
    render(solved ? cur.map(() => true) : null);
  },

  branch(ctx) {
    const { t, s, key, body, solved } = ctx;
    if (solved) {
      const route = tstate[t].drafts[key];
      if (Array.isArray(route) && route.length) body.innerHTML = `<div class="model"><b>Your route</b><ol>${route.map(r => `<li>${r}</li>`).join("")}</ol></div>`;
      return;
    }
    let path = [];                       // [{ node, j }]
    const nodeAt = () => path.length ? s.nodes[path[path.length - 1].node].opts[path[path.length - 1].j][1] : s.start;
    const render = () => {
      const id = nodeAt(), n = s.nodes[id];
      const past = path.map(p => { const o = s.nodes[p.node].opts[p.j]; return `<li><b>${o[0]}</b>${o[2] ? `<span>${o[2]}</span>` : ""}</li>`; }).join("");
      let html = past ? `<ol class="br-log">${past}</ol>` : "";
      if (!n.end) {
        html += `<div class="br-now">${n.say}</div><div class="opts">${n.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span>${o[0]}</span></button>`).join("")}</div>`;
        body.innerHTML = html;
        body.querySelectorAll(".opt").forEach(b => b.onclick = () => { path.push({ node: id, j: +b.dataset.j }); render(); });
      } else if (n.end === "good") {
        body.innerHTML = html + `<div class="br-end good"><b>How it turned out</b><div>${n.say}</div></div>`;
        tstate[t].drafts[key] = path.map(p => s.nodes[p.node].opts[p.j][0]); tsave();
        succeed(ctx);
      } else {
        body.innerHTML = html + `<div class="br-end bad"><b>How it turned out</b><div>${n.say}</div></div><div class="actions"><button class="btn btn-primary" type="button" data-back>Undo last decision</button><button class="btn btn-ghost" type="button" data-restart>Start again</button></div>`;
        miss(ctx, "That didn't go well. Undo your last decision, or start again.");
        body.querySelector("[data-back]").onclick = () => { path.pop(); ctx.fb.innerHTML = ""; render(); };
        body.querySelector("[data-restart]").onclick = () => { path = []; ctx.fb.innerHTML = ""; render(); };
      }
    };
    render();
  },

  code(ctx) { labStep(ctx, false); },
  tests(ctx) { labStep(ctx, true); },

  write(ctx) {
    const { t, s, key, body, solved } = ctx;
    const draft = tstate[t].drafts[key] || "";
    if (solved) {
      body.innerHTML = `${draft ? `<div class="model" style="border-left-color:var(--accent)"><b>Your answer</b><pre>${esc(draft)}</pre></div>` : ""}<details class="reveal"><summary>Model answer</summary><div class="model"><pre>${esc(s.model)}</pre></div></details>`;
      return;
    }
    const id = "write-" + safeId(key);
    body.innerHTML = `<label for="${id}" class="hint-line">Write your answer here. It's saved as you type.</label>
      <textarea id="${id}" class="write-input" placeholder="${esc(s.placeholder || "")}"${s.mono ? ` style="font-family:var(--font-mono);font-size:.9rem" spellcheck="false"` : ""}></textarea>
      <div class="actions"><button class="btn btn-primary" type="button" data-compare>Compare with a model answer</button></div><div class="compare"></div>`;
    const ta = body.querySelector(".write-input");
    ta.value = draft;
    ta.addEventListener("input", () => { tstate[t].drafts[key] = ta.value; tsave(); });
    body.querySelector("[data-compare]").onclick = () => {
      if (ta.value.trim().length < 40) { note(ctx, "Write a bit more first. Having a go before you look is what makes it stick."); return; }
      ctx.fb.innerHTML = "";
      body.querySelector("[data-compare]").closest(".actions").remove();
      const cmp = body.querySelector(".compare");
      cmp.innerHTML = `<div style="display:grid;gap:10px"><div class="model"><b>A model answer</b><pre>${esc(s.model)}</pre></div>
        <p class="hint-line">Yours doesn't need to match it. Tick what your answer covers:</p>
        <div class="checklist">${s.checklist.map((c, j) => `<label><input type="checkbox" id="${id}-c${j}"><span>${esc(c)}</span></label>`).join("")}</div>
        <div class="actions"><button class="btn btn-primary" type="button" data-done>Done</button></div></div>`;
      cmp.querySelector("[data-done]").onclick = () => {
        const boxes = [...cmp.querySelectorAll(".checklist input")];
        const missing = s.checklist.filter((c, j) => !boxes[j].checked);
        const x = Math.max(1, Math.round(FULL.write * (s.checklist.length - missing.length) / s.checklist.length));
        cmp.querySelectorAll("input").forEach(i => i.disabled = true);
        cmp.querySelector("[data-done]").closest(".actions").remove();
        succeed(ctx, { xp: x, extra: missing.length ? `<div class="explain"><b>Worth including next time:</b><ul>${missing.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : "" });
