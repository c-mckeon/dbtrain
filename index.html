  "delete": "<b>delete</b> removes a property from an object, e.g. clearing a value from the session once it's been used.",
  "=>": "<b>=&gt;</b> is an arrow function: a short way to write a small function. <code>(x) =&gt; x * 2</code> takes x and returns x × 2. Arrow functions are used constantly for callbacks, functions you hand to something else to call later.",
  "...": "<b>...</b> is spread/rest. In <code>{ ...a, b: 1 }</code> it copies all of a's properties into a new object. In <code>const { x, ...rest } = obj</code> it collects \"everything else\" into rest.",
  "?.": "<b>?.</b> is optional chaining. <code>a?.b</code> gives undefined instead of crashing if a is null or undefined. It's defensive code for data that might not be there.",
  "??": "<b>??</b> means \"use the right side only if the left is null or undefined\". Unlike ||, it keeps 0 and \"\".",
  "||": "<b>||</b> (or) gives the left side if it's truthy, otherwise the right side. It's often used for defaults: <code>x || 'fallback'</code>. Careful: 0 and \"\" count as falsy too.",
  "&&": "<b>&amp;&amp;</b> (and) is only true if both sides are. It also short-circuits: <code>a &amp;&amp; b()</code> only calls b if a is truthy.",
  "===": "<b>===</b> is strict equality: same type and same value. Always prefer it over ==, which converts types in surprising ways.",
  "!==": "<b>!==</b> is strict not-equal.",
  "!": "<b>!</b> flips truthy and falsy. <code>!x</code> is true when x is missing, empty, 0 or null.",
  "?": "<b>? :</b> is the ternary operator, a one-line if/else: <code>condition ? valueIfTrue : valueIfFalse</code>.",
};

function tokenize(code, lang) {
  const re = lang === "yaml" || lang === "docker" || lang === "sh"
    ? /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'[^'\n]*')|(\$\{\{[^}]*\}\}|\$[A-Z_]+)|([A-Za-z_][\w.-]*)|(\d+)|(\s+)|([^\sA-Za-z_\d])/g
    : /(\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|\/(?![*/\s])(?:[^/\\\n[]|\\.|\[(?:[^\]\\\n]|\\.)*\])+\/[gimsuy]*(?=[.,);\s]))|()([A-Za-z_$][\w$]*)|(\d[\d_]*(?:\.\d+)?)|(\s+)|(=>|===|!==|\?\.|\?\?|\.\.\.|\|\||&&|[^\sA-Za-z_$\d])/g;
  const out = []; let m;
  while ((m = re.exec(code))) {
    const [t, c, s, v, w, n, sp] = m;
    out.push({ t, k: c ? "c" : s ? "s" : v ? "v" : w ? "w" : n ? "n" : sp ? "sp" : "p" });
  }
  return out;
}

/* Annotated code. notes: { token: html, "token@line": html } where line is the displayed line number.
   bands: [[fromLine, toLine, "role"]], roles coloured by BAND. Every word token should have a note. */
const BAND = { auth: ["Auth / identity", "#e3a624"], valid: ["Input checks", "#2f81f7"], data: ["Database", "#2da44e"], resp: ["Response", "#a970ff"], config: ["Config", "#8b949e"], err: ["Error handling", "#e5534b"], ui: ["Browser / UI", "#db61a2"], build: ["Build / deploy", "#3fb8af"] };
const AC_MISSING = [];
function AC(o) {
  const lang = o.lang || (o.src && /\.ya?ml$/.test(o.src) ? "yaml" : o.src && /Dockerfile|ignore$/.test(o.src) ? "docker" : o.src && /\.json$/.test(o.src) ? "json" : "js");
  const start = o.src ? o.from : (o.start || 1);
  const hidden = new Set(o.hide || []);
  const lines = o.src ? Array.from({ length: o.to - o.from + 1 }, (_, i) => hidden.has(o.from + i) ? "// … line hidden on purpose (see the Security lesson)" : (SRC[o.src] && SRC[o.src][o.from + i] != null ? SRC[o.src][o.from + i] : "")) : trimCode(o.code).split("\n");
  if (o.src && !o.file) o.file = o.src + "  ·  lines " + o.from + "–" + o.to;
  const notes = Object.assign({}, lang === "js" ? APPN : {}, o.notes || {});
  const kwOK = lang === "js";
  if (lang === "json") lang === "json";
  const bandAt = l => { for (const [a, b, r] of o.bands || []) if (l >= a && l <= b) return r; return null; };
  const body = lines.map((line, i) => {
    const ln = start + i, band = bandAt(ln);
    const toks = tokenize(line, lang).map(({ t, k }) => {
      if (k === "sp") return t;
      const key = t;
      const note = notes[key + "@" + ln] || notes[key] || (kwOK && JSKW[key] && (k === "w" || k === "p") ? JSKW[key] : null) || (k === "c" ? null : null);
      const cls = k === "w" && kwOK && JSKW[key] ? "k" : k === "w" ? "i" : k;
      if (!note) {
        if ((k === "w" || k === "s" || k === "v") && !(k === "w" && kwOK && JSKW[key])) AC_MISSING.push((o.title || o.file || "?") + ":" + ln + " " + t);
        return `<span class="${cls}">${esc(t)}</span>`;
      }
      return `<span class="${cls} tk" tabindex="0" data-tip="${tip(`<code>${esc(t.length > 60 ? t.slice(0, 57) + "…" : t)}</code><div>${note}</div>`)}">${esc(t)}</span>`;
    }).join("");
    return `<span class="cl${band ? " band" : ""}"${band ? ` style="--band:${BAND[band][1]}"` : ""}><span class="ln">${ln}</span>${toks || " "}</span>`;
  }).join("");
  const used = [...new Set((o.bands || []).map(b => b[2]))];
  return `<figure class="ac">${o.file ? `<figcaption><span class="file">${esc(o.file)}</span>${used.length ? `<span class="legend">${used.map(r => `<i style="--band:${BAND[r][1]}">${BAND[r][0]}</i>`).join("")}</span>` : ""}</figcaption>` : ""}<pre class="code acode">${body}</pre><p class="hint-line ac-hint">Hover or tap any word for what it is and why it's there.</p></figure>`;
}

/* Flag callouts */
const FLAG = (kind, title, html) => `<div class="flag flag-${kind}"><b>${kind === "risk" ? "⚠ Security flag" : kind === "warn" ? "△ Worth knowing" : "✓ Done well"}: ${title}</b><div>${html}</div></div>`;

/* Provider colours for diagrams */
const PROV = { aws: "#ff9900", azure: "#2f81f7", google: "#e3a624", github: "#8b949e", browser: "#2da44e", you: "#a970ff", danger: "#e5534b" };

/* Architecture diagram: boxes + labelled arrows, all hoverable */
function ARCH(o) {
  const N = {}; o.nodes.forEach(n => N[n.id] = n);
  const ctr = n => [n.x + n.w / 2, n.y + n.h / 2];
  const clip = (n, tx, ty) => { const [cx, cy] = ctr(n), dx = tx - cx, dy = ty - cy; const s = Math.min(Math.abs((n.w / 2 + 4) / (dx || 1e-9)), Math.abs((n.h / 2 + 4) / (dy || 1e-9))); return [cx + dx * s, cy + dy * s]; };
  let svg = `<svg class="diagram" viewBox="0 0 ${o.w} ${o.h}" role="img" aria-label="${esc(o.title || "Diagram")}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
  (o.groups || []).forEach(g => { svg += `<g${g.tip ? ` class="tk" tabindex="0" data-tip="${tip(g.tip)}"` : ""}><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="12" fill="${PROV[g.color] || g.color}" fill-opacity=".07" stroke="${PROV[g.color] || g.color}" stroke-dasharray="5 4"/><text x="${g.x + 10}" y="${g.y + 18}" class="dg-group" fill="${PROV[g.color] || g.color}">${esc(g.label)}</text></g>`; });
  (o.edges || []).forEach(e => {
    const a = N[e.from], b = N[e.to];
    const [ax, ay] = ctr(a), [bx, by] = ctr(b);
    const off = e.off || 0, nx = -(by - ay), ny = bx - ax, L = Math.hypot(nx, ny) || 1;
    const ox = nx / L * off, oy = ny / L * off;
    const [x1, y1] = clip(a, bx + ox, by + oy), [x2, y2] = clip(b, ax + ox, ay + oy);
    const sx = x1 + ox, sy = y1 + oy, ex = x2 + ox, ey = y2 + oy, at = e.at == null ? .5 : e.at, mx = sx + (ex - sx) * at, my = sy + (ey - sy) * at;
    const col = PROV[e.color] || e.color || "currentColor";
    svg += `<g class="dg-edge${e.tip ? " tk" : ""}"${e.tip ? ` tabindex="0" data-tip="${tip(e.tip)}"` : ""} style="color:${col}"><line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="currentColor" stroke-width="2"${e.dash ? ` stroke-dasharray="6 4"` : ""} marker-end="url(#ah)"${e.both ? ` marker-start="url(#ah)"` : ""}/>`;
    if (e.label) { const w = e.label.length * 6.2 + 12; svg += `<rect x="${mx - w / 2}" y="${my - 10}" width="${w}" height="18" rx="9" class="dg-lbg"/><text x="${mx}" y="${my + 3}" text-anchor="middle" class="dg-elabel">${esc(e.label)}</text>`; }
    svg += `</g>`;
  });
  o.nodes.forEach(n => {
    const col = PROV[n.color] || n.color;
    svg += `<g class="dg-node${n.tip ? " tk" : ""}"${n.tip ? ` tabindex="0" data-tip="${tip(n.tip)}"` : ""}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="9" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="2"/>` +
      `<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + (n.sub ? -3 : 5)}" text-anchor="middle" class="dg-label">${esc(n.label)}</text>` +
      (n.sub ? `<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 13}" text-anchor="middle" class="dg-sub">${esc(n.sub)}</text>` : "") + `</g>`;
  });
  svg += `</svg>`;
  const legend = o.legend ? `<div class="dg-legend">${o.legend.map(([c, l]) => `<i style="--band:${PROV[c] || c}">${esc(l)}</i>`).join("")}</div>` : "";
  return `<figure class="dg"><div class="dgwrap">${svg}</div>${legend}<p class="hint-line ac-hint">Hover or tap any box or arrow.</p></figure>`;
}

/* Sequence diagram you can step through */
function SEQ(o) {
  const cw = o.colW || 150, top = 54, row = o.row || 46, W = cw * o.actors.length, H = top + row * o.msgs.length + 20;
  const X = {}; o.actors.forEach((a, i) => X[a.id] = cw * i + cw / 2);
  let svg = `<svg class="diagram seq" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "Sequence diagram")}"><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>`;
  o.actors.forEach(a => { const col = PROV[a.color] || a.color; svg += `<g${a.tip ? ` class="tk" tabindex="0" data-tip="${tip(a.tip)}"` : ""}><rect x="${X[a.id] - cw / 2 + 8}" y="6" width="${cw - 16}" height="34" rx="8" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="2"/><text x="${X[a.id]}" y="28" text-anchor="middle" class="dg-label">${esc(a.label)}</text></g><line x1="${X[a.id]}" y1="40" x2="${X[a.id]}" y2="${H - 6}" stroke="${col}" stroke-opacity=".5" stroke-dasharray="4 4"/>`; });
  o.msgs.forEach((m, i) => {
    const y = top + row * i + row / 2, x1 = X[m.from], x2 = X[m.to], self = m.from === m.to;
    const col = PROV[m.color] || "currentColor";
    svg += `<g class="seq-msg" data-i="${i}" style="color:${col}">`;
    if (self) svg += `<path d="M${x1},${y - 10} h28 v16 h-26" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ah2)"/><text x="${x1 + 34}" y="${y + 2}" class="dg-elabel" text-anchor="start"><tspan class="seq-n">${i + 1}</tspan> ${esc(m.label)}</text>`;
    else { const dir = x2 > x1 ? 1 : -1; svg += `<line x1="${x1}" y1="${y}" x2="${x2 - dir * 3}" y2="${y}" stroke="currentColor" stroke-width="2"${m.dash ? ` stroke-dasharray="6 4"` : ""} marker-end="url(#ah2)"/><text x="${(x1 + x2) / 2}" y="${y - 7}" text-anchor="middle" class="dg-elabel"><tspan class="seq-n">${i + 1}</tspan> ${esc(m.label)}</text>`; }
    svg += `</g>`;
  });
  svg += `</svg>`;
  return `<figure class="dg seqbox" data-step="-1"><div class="dgwrap">${svg}</div><div class="seq-ctl"><button type="button" class="btn btn-ghost" data-seq="-1">← Back</button><button type="button" class="btn btn-primary" data-seq="1">Step through →</button><span class="seq-pos"></span></div>` +
    o.msgs.map((m, i) => `<div class="seq-note" data-i="${i}" hidden><b>${i + 1}. ${esc(m.label)}</b><div>${m.note}</div></div>`).join("") + `</figure>`;
}

/* Tooltip + stepper wiring (called once at startup) */
function wireTips() {
  const box = document.createElement("div"); box.id = "tipbox"; box.setAttribute("role", "tooltip"); box.hidden = true; document.body.appendChild(box);
  let pinned = null;
  const show = el => {
    const id = el.getAttribute("data-tip"); if (id == null) return;
    box.innerHTML = TIPS[+id]; box.hidden = false;
    const r = el.getBoundingClientRect(), bw = Math.min(380, window.innerWidth - 24);
    box.style.width = bw + "px";
    let left = Math.min(Math.max(12, r.left), window.innerWidth - bw - 12);
    box.style.left = left + "px";
    const below = r.bottom + 8, h = box.offsetHeight;
    box.style.top = (below + h > window.innerHeight - 8 && r.top - h - 8 > 8 ? r.top - h - 8 : below) + "px";
    document.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
  };
  const hide = () => { box.hidden = true; document.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on")); };
  const hoverable = window.matchMedia && matchMedia("(hover: hover)").matches;
  document.addEventListener("mouseover", e => { if (!hoverable || pinned) return; const el = e.target.closest && e.target.closest(".tk"); if (el) show(el); });
  document.addEventListener("mouseout", e => { if (!hoverable || pinned) return; const el = e.target.closest && e.target.closest(".tk"); if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest(".tk"); if (el) show(el); });
  document.addEventListener("focusout", e => { if (!pinned && e.target.closest && e.target.closest(".tk")) hide(); });
  document.addEventListener("click", e => {
    const el = e.target.closest && e.target.closest(".tk");
    if (el) { if (pinned === el) { pinned = null; hide(); } else { pinned = el; show(el); } return; }
    if (!box.contains(e.target)) { pinned = null; hide(); }
    const b = e.target.closest && e.target.closest("[data-seq]");
    if (b) {
      const fig = b.closest(".seqbox"), msgs = fig.querySelectorAll(".seq-msg"), n = msgs.length;
      let i = Math.max(-1, Math.min(n - 1, +fig.dataset.step + +b.dataset.seq)); fig.dataset.step = i;
      msgs.forEach((m, j) => { m.classList.toggle("on", j === i); m.classList.toggle("dim", i >= 0 && j > i); });
      fig.querySelectorAll(".seq-note").forEach((d, j) => d.hidden = j !== i);
      fig.querySelector('[data-seq="1"]').textContent = i < 0 ? "Step through →" : i >= n - 1 ? "Done" : "Next →";
      fig.querySelector(".seq-pos").textContent = i < 0 ? "" : `Step ${i + 1} of ${n}`;
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = null; hide(); } });
  window.addEventListener("scroll", () => { if (!box.hidden) hide(); pinned = null; }, { passive: true });
}

/* ---------- Hover notes for names that appear all over the app ---------- */
const APPN = {
  req: `<b>req</b> (request) is the object Express builds for each incoming HTTP request. It holds the URL, headers, body, query string, and anything earlier middleware attached (like <code>req.session</code>). Every route handler receives it as its first argument.`,
  res: `<b>res</b> (response) is the object you use to answer the request: <code>res.json()</code>, <code>res.status()</code>, <code>res.redirect()</code>. Each request gets exactly one response; sending two is an error.`,
  next: `<b>next</b> is the function a middleware calls to say "I'm done, pass the request to the next thing in the chain". If a middleware neither calls next() nor sends a response, the request hangs forever.`,
  app: `<b>app</b> is your Express application object, created once by <code>express()</code>. Middleware and routes are registered on it with <code>app.use</code>, <code>app.get</code>, <code>app.post</code> and so on, and <code>app.listen</code> starts the server.`,
  error: `<b>error</b> is the error object caught by <code>catch</code>. It has <code>.message</code> (human text) and <code>.stack</code> (where it happened). Your handlers log it for you and send the user a gentler message.`,
  console: `<b>console</b> is the built-in logger. On the server, whatever you log ends up in the container's log stream, which you can read in Azure (Log stream / Log Analytics).`,
  log: `<b>console.log</b> writes an informational line to the logs.`,
  warn: `<b>console.warn</b> writes a warning line: something's off, but the server keeps going.`,
  process: `<b>process</b> is Node's object describing the running program: its arguments, environment variables and so on.`,
  env: `<b>process.env</b> holds the environment variables, settings given to the program from outside the code. Locally they come from your <code>.env</code> file (loaded by dotenv). In production they come from the Azure Container App's configuration and secrets.`,
  argv: `<b>process.argv</b> is the list of command-line arguments the program was started with, e.g. <code>node app.js --local-demo</code>.`,
  json: `<b>res.json(x)</b> sends x as a JSON response and sets <code>Content-Type: application/json</code>. On the request side, <code>express.json()</code> is the middleware that parses JSON bodies, and in the browser <code>response.json()</code> parses a JSON reply.`,
  status: `<b>res.status(code)</b> sets the HTTP status code (201 Created, 400 Bad Request, 401, 403, 500…). It returns res, which is why you can chain <code>.json(...)</code> straight after it.`,
  send: `<b>res.send()</b> sends a plain response body (text or HTML).`,
  sendStatus: `<b>res.sendStatus(204)</b> sends just a status code with its standard text, and no real body.`,
  end: `<b>res.end()</b> finishes the response with no body. It's used with 204 No Content.`,
  redirect: `<b>res.redirect(url)</b> replies with a 302 status and a <code>Location</code> header, so the browser goes to that URL instead. Your login flow is a chain of these redirects between the browser, your backend and Cognito.`,
  session: `<b>session</b>: per-visitor state the server remembers between requests. express-session stores it on the server and gives the browser a cookie holding only a session id. Your bearer-token middleware can also build <code>req.session</code> from a signed token instead.`,
  userInfo: `<b>userInfo</b> is the profile Cognito returned after login (sub, email, username…), stored on the session. If it's there, the visitor is logged in.`,
  sub: `<b>sub</b> ("subject") is Cognito's permanent, unique id for a user. It's the most important value in the app: it's how the backend picks which user's data to touch (<code>workoutApp/users/&lt;sub&gt;</code>). Emails can change; sub never does.`,
  body: `<b>req.body</b> is the parsed request body, the JSON the browser sent, after the <code>express.json()</code> middleware has parsed it. It's untrusted: anyone can send anything, which is why the code checks its shape.`,
  query: `<b>req.query</b> holds the query-string parameters, the <code>?path=...</code> part of the URL, parsed into an object.`,
  params: `<b>req.params</b> holds the path parameters: in the route <code>/api/workouts/:workoutId</code>, <code>req.params.workoutId</code> is whatever was in that slot of the URL.`,
  child: `<b>.child(path)</b> (Firebase) gives a reference one level (or several) deeper in the JSON tree, without fetching anything yet. <code>ref.child('workouts')</code> points at <code>…/workouts</code>.`,
  once: `<b>.once('value')</b> (Firebase) reads the data at this reference one time and resolves to a snapshot. (The live alternative, <code>.on()</code>, keeps listening for changes.)`,
  val: `<b>snapshot.val()</b> turns a Firebase snapshot into plain JS data (an object, string, number or null). It returns null if nothing is stored there, which is why it's often followed by <code>|| {}</code>.`,
  set: `<b>.set(value)</b> (Firebase) replaces everything at this location with value. It's a full overwrite, not a merge.`,
  update: `<b>.update(obj)</b> (Firebase) merges: it writes only the keys given, and can write several paths at once <i>atomically</i> (all or nothing), e.g. <code>{ 'a/b': 1, 'c/d': 2 }</code>.`,
  remove: `<b>.remove()</b> (Firebase) deletes the data at this location and everything under it.`,
  push: `<b>.push()</b> (Firebase) creates a new child with a unique, time-ordered key. Called with no arguments, it only generates the key and reference locally; nothing is written until you <code>.set()</code> it.`,
  key: `<b>.key</b> is the last part of a Firebase reference's path. For a pushed child, it's the new unique id.`,
  snapshot: `<b>snapshot</b>: the result of a Firebase read, a frozen copy of the data at that moment. You get the data out with <code>.val()</code>.`,
  Date: `<b>Date</b> is JavaScript's built-in date/time object.`,
  now: `<b>Date.now()</b> is the current time in milliseconds since 1 January 1970 (a "Unix timestamp"). Comparing two of these numbers is how the code checks expiry.`,
  String: `<b>String(x)</b> converts any value to text. It's used defensively so that even if someone sends a number, an array or nothing at all, later string methods won't crash.`,
  Number: `<b>Number(x)</b> converts a value to a number (and gives NaN if it can't).`,
  Boolean: `<b>Boolean(x)</b> turns any value into true or false. <code>Boolean(undefined)</code> is false, so missing flags become a clean false.`,
  Array: `<b>Array</b> is JavaScript's list type.`,
  isArray: `<b>Array.isArray(x)</b> is true only for real arrays. It's a shape check on untrusted input, because <code>typeof []</code> is just "object".`,
  Object: `<b>Object</b> is JavaScript's built-in object helper. <code>Object.entries(o)</code> gives [key, value] pairs, and <code>Object.keys(o)</code> gives just the keys.`,
  entries: `<b>Object.entries(obj)</b> turns <code>{a: 1, b: 2}</code> into <code>[['a', 1], ['b', 2]]</code>, so you can loop over keys and values together.`,
  keys: `<b>Object.keys(obj)</b> gives a list of an object's keys.`,
  JSON: `<b>JSON</b> is the built-in helper for converting between text and data.`,
  parse: `<b>JSON.parse(text)</b> turns JSON text into JS data. It throws if the text isn't valid JSON, which is why it's wrapped in try/catch when the text could be tampered with.`,
  stringify: `<b>JSON.stringify(data)</b> turns JS data into JSON text, e.g. to send it in a request body or to sign it.`,
  then: `<b>.then(fn)</b> says "when this Promise finishes, call fn with its result". It's the older, chained style of what <code>await</code> does.`,
  window: `<b>window</b> is the browser's global object. Anything attached to it (<code>window.database</code>, <code>window.fetch</code>) is visible to every script on the page. Your frontend uses it as the shared space between its script files.`,
  document: `<b>document</b> is the browser's object for the current web page (the DOM). <code>document.getElementById</code> finds an element in it.`,
  fetch: `<b>fetch(url, options)</b> is the browser's built-in function for making HTTP requests. It returns a Promise of a Response.`,
  trim: `<b>.trim()</b> removes spaces from both ends of a string, so " Legs " and "Legs" count as the same.`,
  length: `<b>.length</b> is how many characters a string has, or how many items an array has.`,
  includes: `<b>.includes(x)</b> is true if the array (or string) contains x.`,
  filter: `<b>.filter(fn)</b> makes a new array keeping only the items for which fn returns truthy.`,
  map: `<b>.map(fn)</b> makes a new array by transforming every item with fn.`,
  forEach: `<b>.forEach(fn)</b> runs fn once for each item. Unlike map, it doesn't build a new array.`,
  split: `<b>.split(sep)</b> cuts a string into an array at every sep: <code>'a,b'.split(',')</code> gives <code>['a', 'b']</code>.`,
  join: `<b>.join(sep)</b> glues an array back into a string, with sep between the items.`,
  replace: `<b>.replace(pattern, replacement)</b> returns a new string with the matches replaced. With a regex ending in /g, it replaces every match.`,
  test: `<b>regex.test(str)</b> is true if the pattern appears anywhere in str.`,
  Set: `<b>Set</b> is a collection of unique values with very fast <code>.has()</code> lookups. It's the right tool for allow-lists ("is this one of the permitted values?").`,
  has: `<b>.has(x)</b> asks a Set or Map "is x in here?". It's fast regardless of size.`,
  Map: `<b>Map</b> is a key → value store, like an object but with any type of key, plus <code>.get</code>, <code>.set</code>, <code>.delete</code> and easy iteration.`,
  get: `<b>.get(...)</b>: on a Map, look up a value by key. On a request (<code>req.get('Origin')</code>), read a request header.`,
  message: `<b>error.message</b> is the human-readable description of what went wrong.`,
  ensureRequestTemplate: `<b>ensureRequestTemplate(req)</b> is your helper (defined in app.js) that makes sure a real user's starter data exists before anything reads or writes. It skips demo sessions.`,
  getRequestUserRootRef: `<b>getRequestUserRootRef(req)</b> is your helper that returns the database location for <i>this request's user</i>: the local demo store, or <code>workoutApp/users/&lt;sub&gt;</code> in Firebase. Every data route goes through it, so a user can only ever reach their own subtree.`,
  requireAuth: `<b>requireAuth</b> is your guard middleware: no logged-in user (no <code>sub</code>) means 401, otherwise it lets the request through to the handler.`,
  requireWriteAuth: `<b>requireWriteAuth</b> is your guard for anything that changes data: the read-only demo gets 403, and everyone else must pass requireAuth.`,
  isValidPathSegment: `<b>isValidPathSegment(value)</b> is your helper that rejects strings containing characters that are special in Firebase paths (<code>. # $ [ ] /</code>). That stops anyone smuggling extra path levels into a database location.`,
  workoutData: `<b>workoutData</b>: the workout without its saveId. That's what actually gets stored.`,
  workout: `<b>workout</b>: the workout object the browser sent (date, exercises, intensity, duration…), or null if the body wasn't an object.`,
  workoutId: `<b>workoutId</b>: the database key the workout is stored under.`,
  userRootRef: `<b>userRootRef</b>: a reference to this user's top folder in the database, <code>workoutApp/users/&lt;sub&gt;</code> (or the local demo store).`,
  workoutsRef: `<b>workoutsRef</b>: a reference to this user's <code>workouts</code> folder.`,
  saveId: `<b>saveId</b>: a random id the browser creates once per workout being built. Sending the same saveId again means "this is the same workout, don't make a copy". It's an <i>idempotency key</i>.`,
  date: `<b>date</b>: the workout's date as a "YYYY-MM-DD" string.`,
  exercises: `<b>exercises</b>: the list of exercises in the workout, or the user's exercise library, depending on where it appears.`,
  fileURLToPath: `Converts a <code>file://</code> URL into a normal file path (ES modules have no __dirname).`,
  express: `<b>express</b>: the web framework. <code>express()</code> creates the app, and <code>express.json()</code> is its JSON body parser.`,
  frontendOrigins: `The Set of websites allowed to call the API from a browser, built from FRONTEND_ORIGINS.`,
  Issuer: `openid-client's class representing Cognito; <code>Issuer.discover</code> learns Cognito's endpoints.`,
  getClient: `Your helper that returns the cached OpenID client, creating it on first use.`,
  client: `The OpenID client: your app as registered with Cognito, able to build login URLs and exchange codes.`,
  redirectUri: `Your backend's /callback URL, which must match Cognito's settings exactly.`,
  redirectToFrontend: `Your helper: sends a logged-in user back to the app with a one-time code in the URL fragment.`,
  authError: `A message saved on the session to explain a failed login after the redirect.`,
  frontendUrl: `The LeanLog app's address (or localhost when developing).`,
  method: `The HTTP method (GET, POST…).`,
  url: `The request's address as a string.`,
  startsWith: `True if the string begins with the given text. Here it limits the token to requests aimed at your own backend.`,
  getItem: `Reads a value from localStorage (or null if it isn't there).`,
  ensureUserTemplate: `Your function that seeds starter data for a brand-new user, once (tracked by a version number).`,
  post: `<b>app.post</b> registers a handler for POST requests, meaning "create something".`,
  "'string'": `typeof check: is it text?`,
  "'value'": `Firebase event name: read the value once.`,
  some: `<b>.some(fn)</b> is true if fn returns truthy for at least one item. Here it asks "is any segment invalid?".`,
  Error: `<code>new Error(message)</code> creates an error object to throw.`,
  value: `The value being checked or stored.`,
  callback: `A function passed in to be called later with the result. It's the older alternative to awaiting a Promise.`,
  ApiSnapshot: `Your class that mimics a Firebase snapshot (val, exists, forEach, key).`,
  database: `The global database object: in this app, the fake Firebase from api-database.js.`,
  ref: `<code>database.ref(path)</code> gives a reference to a location in the data tree.`,
  orderByChild: `Firebase: sort by a child field. In your adapter it does nothing.`,
  limitToLast: `Firebase: keep only the last N results. In your adapter it does nothing.`,
  exists: `True if the snapshot holds any data.`,
  getUserRootRef: `Your function returning <code>workoutApp/users/&lt;sub&gt;</code> for one user.`,
  userId: `The Cognito sub of the user.`,
  ServerValue: `Firebase Admin helper. <code>ServerValue.TIMESTAMP</code> asks the database to fill in its own clock time.`,
  use: `<b>app.use</b> adds middleware that runs for every request (or every request under a path).`,
};

 { id: "m-map", title: "The map of your repo",
   intro: `This course is built from your own workout tracker's code. Every snippet is a real chunk of your files, with real line numbers. Hover or tap any word in a snippet to see what it is and why it's there. (A few IDs and hostnames are swapped for placeholders like <code>&lt;backend-host&gt;</code>, and a few risky details are deliberately left out, because this site is public.) First, a map: what lives where, and what actually runs.`,

   { t: "read", html: `<p>Your repo holds <b>two programs and a delivery system</b>. The backend is an Express server that runs in a container on Azure. The frontend is a static website that runs in each user's browser, served from your LeanLog repo on GitHub Pages. The delivery system is two GitHub Actions workflows that ship both every time you push.</p>
     <div class="tscroll"><table class="dtable">
     <tr><th>Path</th><th>What it is</th><th>Where it runs</th></tr>
     <tr style="--band:#2f81f7"><td><code>backend/app.js</code></td><td>The whole API: login, tokens, every <code>/api/...</code> endpoint</td><td>Azure container</td></tr>

     <tr style="--band:#3fb8af"><td><code>frontend/vite.config.js</code>, root <code>package.json</code></td><td>Build tooling: bundles the frontend into <code>dist/</code></td><td>Build time only</td></tr>

     <tr style="--band:#8b949e"><td><code>daily_notification.yml</code> (repo root)</td><td>A workflow in the wrong folder, with a placeholder project id</td><td>Never runs</td></tr>
     </table></div>` },
   { t: "sort", q: `Where does each file actually run?`, buckets: ["User's browser", "Azure server", "Build / deploy", "By hand, once", "Never (leftover)"], items: [
     [`<code>frontend/js/app.js</code>`, 0, `It's loaded by index.html with a script tag, so it runs in each user's browser.`],
     [`<code>backend/app.js</code>`, 1, `The Dockerfile's <code>CMD npm start</code> runs <code>node app.js</code> inside the container.`],

       clientId: `Your app's public id within the Cognito pool. It's not secret, because it appears in browser redirects.`,
       COGNITO_CLIENT_ID: `Env var for the client id.`,
       "'<client-id>'": `Hard-coded fallback client id (redacted).`,
       clientSecret: `The app's Cognito <b>secret</b>. It proves to Cognito that a token request really comes from your backend. It must only ever live on the server.`,
       COGNITO_CLIENT_SECRET: `Env var holding the secret, set as a secret in Azure. It's correctly given <i>no</i> fallback.`,
       redirectUri: `Where Cognito sends the browser back after login: your backend's <code>/callback</code>. It must exactly match a URL registered in Cognito, or Cognito refuses.`,
       COGNITO_REDIRECT_URI: `Env var for the callback URL.`,
       "`https://<backend-host>/callback`": `Fallback callback URL (host redacted).`,
       logoutUri: `Where Cognito sends the browser after logout.`,
       COGNITO_LOGOUT_URI: `Env var for the logout destination.`,
       "`https://<backend-host>`": `Fallback logout destination (redacted).`,
       cognitoDomain: `Your Cognito "hosted UI" domain, the login pages Cognito serves. It's needed to build the logout URL.`,
       COGNITO_DOMAIN: `Env var for that domain.`,
       frontendUrl: `Where to send users after login: the LeanLog site in production, or localhost when developing.`,
       LOCAL_FRONTEND_URL: `Env var override for local development.`,
       "'http://localhost:4173'": `The Vite dev server address.`,
       FRONTEND_URL: `Env var: the production frontend address.`,
       "'http://localhost:4174'": `The Vite preview server address.`,
       demoUserId: `The fixed user id shared by everyone who clicks "Demo".`,
       DEMO_USER_ID: `Env var for the demo account id.`,
       "'demo-readonly'": `The default demo id.`,
       frontendOrigins: `The CORS allow-list (see the previous lesson).`,
       FRONTEND_ORIGINS: `Env var: comma-separated allowed origins.`,
       FRONTEND_ORIGIN: `Older singular spelling, kept as a fallback.`,
       "'http://localhost:4173,http://localhost:4174'": `Default origins for local work.`,
       "','": `Split at commas.`,
       origin: `Each origin string.`,
       sessionSecret: `The key used to sign session cookies <i>and</i> your homemade tokens. Whoever knows it can forge a login as anyone. This line gives a weak default only outside production.`,
       SESSION_SECRET: `Env var holding the real secret in production.`,
       NODE_ENV: `Conventional env var saying which environment this is. The Dockerfile sets it to "production".`,
       "'production'": `The value that switches on production behaviour: secure cookies and a required secret.`,
       "'development-only-session-secret'": `A known, public default. Fine on your laptop, and catastrophic if it were ever used in production, which is exactly what the next lines prevent.`,
       "'COGNITO_CLIENT_SECRET is not set. The server will start, but login will not work.'": `A warning rather than a crash: the demo still works without Cognito.`,

       "'SESSION_SECRET must be set in production.'": `Throwing at startup makes the container crash immediately, which Azure shows clearly, instead of running with a forgeable secret. This is the "fail fast" pattern, and it's a good one.` } }) },
   { t: "mcq", q: `The container starts in production without <code>SESSION_SECRET</code> set. What happens?`, opts: [
     [`The server starts with the development secret and logs a warning, so logins work but could be forged`, false, `That's what would happen <i>without</i> line 30's production check. In production, the fallback is null.`],
     [`The server throws at line 37 and the container crashes on startup, so the problem shows up immediately`, true, `Right. With NODE_ENV=production and no local demo, sessionSecret is null, and line 36 throws. Crashing loudly beats running insecurely. It's the "fail fast" pattern.`],
     [`Express picks a random secret automatically, so every restart quietly logs everyone out of the app`, false, `Express doesn't invent secrets; express-session requires you to pass one. Your code decides, and it decides to crash.`]] },
   { t: "sort", q: `Secret or just configuration? (Would it matter if a stranger saw it?)`, buckets: ["Secret: never public", "Config: fine to be public"], items: [
     [`COGNITO_CLIENT_SECRET`, 0, `Lets whoever holds it act as your backend towards Cognito.`],
     [`SESSION_SECRET`, 0, `Lets whoever holds it forge any user's login.`],

     [`FRONTEND_URL`, 1, `It's your public website's address.`],
     [`COGNITO_ISSUER`, 1, `A public discovery URL. Knowing it doesn't grant anything.`],

   { t: "read", html: FLAG("warn", "hard-coded fallbacks", `Lines 14–18 fall back to real production values (redacted here) when variables are missing. That's convenient, but it means a misconfigured environment silently talks to production Cognito, and the values are visible to anyone who can read the code. A stricter pattern is to require every production setting at startup, like SESSION_SECRET already is.`) }
